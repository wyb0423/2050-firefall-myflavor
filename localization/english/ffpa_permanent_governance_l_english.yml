l_english:
 je_group_ffpa_tur_permanent_governance:0 "Government Without End"
 je_group_ffpa_byz_permanent_governance:0 "The Roman Polity"

 je_ffpa_tur_imperial_registers_v1:0 "The Imperial Registers and Provincial Intermediaries"
 je_ffpa_tur_imperial_registers_v1_reason:0 "The reconstructed state inherited ministerial archives and planning tables alongside provincial rolls, municipal records, and the practical knowledge kept by local intermediaries when the center failed. Neither side can simply be erased: government must continually reconcile what the chancery can standardize with what provincial institutions can actually enforce.\n\nThe balance moves monthly from local capture at 0 toward paper centralization at 100. Non-negative Bureaucracy adds 0.25; a deficit subtracts 0.50. Legitimacy of at least 60 adds 0.25, below 40 subtracts 0.25, and 40–59 makes no change. Default subtracts 0.50; remaining solvent only avoids that penalty. Capital Market Access of at least 85% adds 0.25; lower access subtracts 0.25. The total monthly change is limited to -1.00 through +0.75, and 35–65 is the durable equilibrium. Remaining at 0–9 or 90–100 for 24 months causes the corresponding failure; each month outside that extreme reduces its counter by 3."
 je_ffpa_tur_imperial_registers_v1_status_low_extreme:0 "Provincial families and intermediaries have captured the register. The low-extreme failure clock is advancing."
 je_ffpa_tur_imperial_registers_v1_status_local:0 "Local compacts dominate the register."
 je_ffpa_tur_imperial_registers_v1_status_provincial:0 "Provincial mediation remains stronger than the central chancery."
 je_ffpa_tur_imperial_registers_v1_status_equilibrium:0 "Register and intermediary are in a durable equilibrium."
 je_ffpa_tur_imperial_registers_v1_status_admin:0 "The chancery has the upper hand without displacing provincial mediation."
 je_ffpa_tur_imperial_registers_v1_status_direct:0 "Direct administration is crowding out the intermediaries."
 je_ffpa_tur_imperial_registers_v1_status_high_extreme:0 "The paper state has outrun its local reach. The high-extreme failure clock is advancing."

 je_ffpa_tur_bread_and_capital_v1:0 "Bread and the Capital"
 je_ffpa_tur_bread_and_capital_v1_reason:0 "The supply collapses that followed the Fire taught every reconstruction government to maintain strategic grain, transport, and energy reserves for the capital. The ‘Imperial Granaries’ are the inherited name for a modern system of reserve depots, purchase contracts, transport priority, and emergency distribution.\n\nThe reserve reacts monthly to four anomalies: grain in the national market above +25% base price; transportation in the capital above +25%; electricity in the capital above +25%; or the capital's Market Access below 85%. Zero to four anomalies change the reserve by +3, +1, -2, -5, or -8; famine in the capital applies another -10. A severe crisis means famine, access below 60%, grain above +50% together with capital transportation or electricity above +50%, or all four anomalies at once. At reserve 0, six severe-crisis months or three famine months cause failure; restoring any reserve resets both clocks."
 je_ffpa_tur_bread_and_capital_v1_status_secure:0 "The capital's reserve is secure and supports full public provision."
 je_ffpa_tur_bread_and_capital_v1_status_serviceable:0 "The reserve is serviceable, though prolonged disruption will consume it."
 je_ffpa_tur_bread_and_capital_v1_status_rationed:0 "The reserve is thin; supplies are being rationed without a standing benefit."
 je_ffpa_tur_bread_and_capital_v1_status_empty:0 "The reserve is empty. A severe crisis or famine now advances the failure clock."

 je_ffpa_byz_public_polity_v1:0 "The Public Polity of the Romans"
 je_ffpa_byz_public_polity_v1_reason:0 "In a society divided by the Fire and assembled again under a Roman name, proclamation cannot sustain the public polity. State offices must demonstrate public authority, incorporated provinces must share basic welfare and market networks, and citizens must continue to recognize a common state rather than merely submit to armies or local powers.\n\nPublic Authority, Nationwide Welfare, and Public Recognition are independent pillars. A pillar enters warning when two of its three tests fail and breaks after 12 such months; all three failing at once breaks it after 6 months. Public Authority tests Legitimacy of at least 55, non-negative Bureaucracy, and solvency. Welfare tests national average Standard of Living against a five-year rising baseline minus 1, at least 80% of incorporated states with 85% Market Access, and famine in no more than 5% of incorporated states. Recognition tests freedom from civil war or insurrection, no political movement at 65 Radicalism, and Turmoil of 25% or more in no more than 15% of incorporated states. All three pillars broken for 6 months, or two broken with the last in warning for 12 months, causes failure."
 je_ffpa_byz_public_polity_v1_status_intact:0 "All three pillars of the polity stand intact."
 je_ffpa_byz_public_polity_v1_status_warning:0 "At least one pillar is in warning and will break if neglect continues."
 je_ffpa_byz_public_polity_v1_status_broken:0 "One pillar has broken and requires deliberate repair."
 je_ffpa_byz_public_polity_v1_status_crisis:0 "Two or more pillars have broken; the polity is approaching failure."

 je_ffpa_byz_military_households_v1:0 "Military Households and the Dynatoi"
 je_ffpa_byz_military_households_v1_reason:0 "The restoration wars created new Military Households from incorporated militias, frontier garrisons, veterans' settlements, transport and survey service, and public-works contracts tied to land. Officers, contractors, and landholding families accumulated fiscal and recruiting power through this system; the empire named them and their new magnates with words recovered from Roman history, not because a medieval institution had survived unchanged.\n\nDynatoi pressure never declines on its own. Before reform, an unrevised service register adds 0.25 monthly; powerful Landowners add 0.50, reduced to 0.25 after the third reform; Tenant Farmers add 0.50 or Serfdom 1.00, reduced after the second reform to 0.25 or 0.50; Peasant Levies add 0.50 before the first reform; surviving tax privileges add 0.25 before the third; and a uniform cadastre offsets 0.25. Pressure at 100 for 6 months, or at least 90 for 18 months while a structural source remains, causes failure. Completed reforms and any enacted army law survive failure; only unfinished work is cancelled."
 je_ffpa_byz_military_households_v1_status_contained:0 "The military households are contained and still serve the fiscal-military order."
 je_ffpa_byz_military_households_v1_status_present:0 "Dynatoi influence is present but not yet entrenched."
 je_ffpa_byz_military_households_v1_status_entrenched:0 "The dynatoi are entrenched in land, revenue, and recruitment."
 je_ffpa_byz_military_households_v1_status_ascendant:0 "Dynatoi power is ascendant and the state is losing direct control."
 je_ffpa_byz_military_households_v1_status_dominant:0 "The dynatoi dominate the military households; the failure clock is advancing."
 je_ffpa_byz_military_households_v1_status_project:0 "An institutional reform project is under way. Default pauses its progress."

 ffpa_tur_register_balance_bar_v1:0 "Register–Intermediary Balance"
 ffpa_tur_register_balance_bar_v1_desc:0 "0 is local capture; 100 is paper centralization; 35–65 is the safest range."
 ffpa_tur_register_balance_bar_v1_second_desc:0 "The two extreme ranges advance separate 24-month failure clocks."
 ffpa_tur_capital_reserve_bar_v1:0 "Capital Supply Reserve"
 ffpa_tur_capital_reserve_bar_v1_desc:0 "A buffer against grain, transportation, electricity, and market-access anomalies."
 ffpa_tur_capital_reserve_bar_v1_second_desc:0 "Failure clocks run only while the reserve is 0 and the relevant crisis persists."
 ffpa_byz_public_law_pillar_bar_v1:0 "Public Authority"
 ffpa_byz_public_law_pillar_bar_v1_desc:0 "Legitimacy, bureaucracy, and solvency."
 ffpa_byz_public_welfare_pillar_bar_v1:0 "Nationwide Welfare"
 ffpa_byz_public_welfare_pillar_bar_v1_desc:0 "National living standards, incorporated-state access, and the share of states in famine."
 ffpa_byz_public_recognition_pillar_bar_v1:0 "Public Recognition"
 ffpa_byz_public_recognition_pillar_bar_v1_desc:0 "Civil peace, movement radicalism, and incorporated-state turmoil."
 ffpa_byz_public_pillar_bar_v1_second_desc:0 "0: intact; 1: warning; 2: broken; 3: repairing."
 ffpa_byz_dynatoi_pressure_bar_v1:0 "Dynatoi Pressure"
 ffpa_byz_dynatoi_pressure_bar_v1_desc:0 "Structural pressure from military households, landed power, and fiscal privileges."
 ffpa_byz_dynatoi_pressure_bar_v1_second_desc:0 "Pressure does not fall naturally; use controls and complete institutional reforms."

 ffpa_tur_register_audit_button_v1:0 "Audit the Imperial Registers"
 ffpa_tur_register_audit_button_v1_desc:0 "Move the balance +10 toward direct administration. Cooldown: 12 months."
 ffpa_tur_register_provincial_roll_button_v1:0 "Recognize the Provincial Rolls"
 ffpa_tur_register_provincial_roll_button_v1_desc:0 "Move the balance -10 toward provincial mediation. Cooldown: 12 months."
 ffpa_tur_register_dual_ledgers_button_v1:0 "Reconcile the Dual Ledgers"
 ffpa_tur_register_dual_ledgers_button_v1_desc:0 "Move up to 15 toward 50, or set an already balanced value to 50. Cooldown: 24 months. At either extreme it may be forced once at double cost."
 ffpa_tur_capital_purchase_button_v1:0 "Purchase Emergency Grain"
 ffpa_tur_capital_purchase_button_v1_desc:0 "Gain 15 reserve and reset failure clocks. Cooldown: 6 months."
 ffpa_tur_capital_granary_button_v1:0 "Open the Imperial Granaries"
 ffpa_tur_capital_granary_button_v1_desc:0 "Release 15 points from the modern state reserve for two years of welfare and mortality relief. Cooldown: 6 months."
 ffpa_tur_capital_ration_button_v1:0 "Impose Emergency Rationing"
 ffpa_tur_capital_ration_button_v1_desc:0 "Gain 25 reserve and reset failure clocks, at authority, living-standard, and political cost. Cooldown: 12 months; one severe-crisis override is available at extra expense."
 ffpa_byz_public_new_decree_button_v1:0 "Issue a New Decree"
 ffpa_byz_public_new_decree_button_v1_desc:0 "Clear a Public Authority warning and protect it for 6 months, or place the broken pillar into repair. Cooldown: 6 months; a broken pillar can force one double-cost use. Repair completes only after all three pillars are healthy for 6 months."
 ffpa_byz_public_benefaction_button_v1:0 "Organize a Nationwide Benefaction"
 ffpa_byz_public_benefaction_button_v1_desc:0 "Clear a Welfare warning and protect it for 6 months, or begin repair of a broken Welfare pillar. Cooldown: 6 months; one broken-pillar override costs double."
 ffpa_byz_public_representation_button_v1:0 "Convene the Representatives"
 ffpa_byz_public_representation_button_v1_desc:0 "Clear a Recognition warning and protect it for 6 months, or begin repair of a broken Recognition pillar. Cooldown: 6 months; one broken-pillar override costs double."
 ffpa_byz_dynatoi_audit_button_v1:0 "Audit Court and Command"
 ffpa_byz_dynatoi_audit_button_v1_desc:0 "Reduce Dynatoi pressure by 8. Cooldown: 18 months."
 ffpa_byz_dynatoi_redemption_button_v1:0 "Redeem Village Obligations"
 ffpa_byz_dynatoi_redemption_button_v1_desc:0 "Reduce Dynatoi pressure by 10 at fiscal and landed-political cost. Cooldown: 12 months; default blocks it."
 ffpa_byz_dynatoi_allelengyon_button_v1:0 "Impose the Allelengyon"
 ffpa_byz_dynatoi_allelengyon_button_v1_desc:0 "At 70 pressure or more, reduce pressure by 18 through an exceptional collective levy. Cooldown: 24 months. At 90 or more, one double-cost early use is available."
 ffpa_byz_military_register_reform_button_v1:0 "Recompile the Imperial Military Register"
 ffpa_byz_military_register_reform_button_v1_desc:0 "Choose Professional Army or Mass Conscription immediately, accept a five-year transition cost, and begin a 12-month project. Postponing closes this choice for 3 months."
 ffpa_byz_land_tenure_reform_button_v1:0 "Survey Tenure and Service"
 ffpa_byz_land_tenure_reform_button_v1_desc:0 "Begin the second reform, an 18-month project that halves pressure from Tenant Farmers or Serfdom and reduces pressure by 20 on completion. Default pauses progress; reform fatigue lasts 3 years."
 ffpa_byz_supply_veterans_reform_button_v1:0 "Found the Imperial Supply and Veterans Office"
 ffpa_byz_supply_veterans_reform_button_v1_desc:0 "Begin the final 24-month reform. Completion reduces pressure by 25 and permanently increases nationwide welfare payments by 10%. Default pauses progress; positive gold reserves are required to start."

 ffpa_tur_flavor.90.t:0 "The Provinces Keep Their Own Books"
 ffpa_tur_flavor.90.d:0 "The imperial register has become a seal placed upon bargains already struck by provincial families. Tax collectors, recruiters, and judges now negotiate with intermediaries the capital can neither replace nor fully supervise."
 ffpa_tur_flavor.90.f:0 "A register that records only what the notables permit is not a register of the empire."
 ffpa_tur_flavor.90.a:0 "Accept the cost of recovering effective control of provincial administration."
 ffpa_tur_flavor.91.t:0 "An Empire on Paper"
 ffpa_tur_flavor.91.d:0 "Decrees multiply faster than officials, roads, and provincial consent can carry them. The chancery has mistaken uniform forms for uniform government, leaving provincial administration brittle and unresponsive."
 ffpa_tur_flavor.91.f:0 "Every district obeyed in ink; fewer obeyed in fact."
 ffpa_tur_flavor.91.a:0 "Rebuild the chain between decree and practice."
 ffpa_tur_flavor.92.t:0 "The Empty Capital Granaries"
 ffpa_tur_flavor.92.d:0 "The capital's strategic reserve, a system built from the shared memory of post-Fire hunger, has vanished amid severe disruption. Queues, speculation, and official requisitions have turned a supply failure into a crisis of confidence that will outlive the immediate shortage."
 ffpa_tur_flavor.92.f:0 "The price of bread became the measure of the state's promises."
 ffpa_tur_flavor.92.a:0 "The capital will remember this failure."

 ffpa_flavor.50.t:0 "The Public Polity Fractures"
 ffpa_flavor.50.d:0 "Public Authority, Nationwide Welfare, and Public Recognition no longer reinforce one another. Offices still function and decrees are still read, but citizens increasingly encounter three disconnected public promises, each unable to guarantee the others."
 ffpa_flavor.50.f:0 "A commonwealth is not merely a name for power; it is the habit of expecting public things to endure."
 ffpa_flavor.50.a:0 "Begin again from surviving public authority and two broken promises."
 ffpa_flavor.51.t:0 "Recompiling the Imperial Military Register"
 ffpa_flavor.51.d:0 "The restoration wars left militia enrollments, veterans' settlements, frontier-service grants, and public-works obligations recorded in incompatible rolls. A new imperial register must immediately define who bears arms before clerks can spend the coming year reconciling people, land, and service obligations."
 ffpa_flavor.51.f:0 "First choose the army the register is meant to count."
 ffpa_flavor.51.a:0 "Record a professional standing army."
 ffpa_flavor.51.b:0 "Record the people for mass conscription."
 ffpa_flavor.51.c:0 "Postpone the recompilation for three months."
 ffpa_flavor.52.t:0 "The Dynatoi Settlement"
 ffpa_flavor.52.d:0 "The Military Households and new Dynatoi raised through restoration service have become a power the state can no longer manage through routine measures. The court must either recognize a landed compact or attempt a confiscation whose fiscal and political shock will be felt for years."
 ffpa_flavor.52.f:0 "The question was no longer whether the great households would bear public burdens, but on whose terms."
 ffpa_flavor.52.a:0 "Recognize a compact with the great households."
 ffpa_flavor.52.b:0 "Confiscate their privileges and endure the rupture."

