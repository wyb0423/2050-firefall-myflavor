 ffpa_flavor.53.t:0 "After Service"
 ffpa_flavor.53.d:0 "The Supply and Veterans Office has begun work, giving the military rolls, land surveys, and settlement duties a lasting administrative home. All three stages of reform are complete, and the agreed welfare provision is in place. Officials must still resolve disputes over land and service; the influence of the Dynatoi will not disappear with a founding decree."
 ffpa_flavor.53.f:0 "A veteran asked about an obligation on an old roll. Instead of sending him back to the barracks, the officer pointed to the desk responsible for his application."
 ffpa_flavor.53.a:0 "Let these arrangements prove themselves in daily use."
