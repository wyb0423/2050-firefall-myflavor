l_english:
 je_group_ffpa_tur_permanent_governance:0 "Government Without End"
 je_group_ffpa_byz_permanent_governance:0 "The Roman Polity"

 je_ffpa_tur_imperial_registers_v1:0 "The Imperial Registers and Provincial Intermediaries"
 je_ffpa_tur_imperial_registers_v1_reason:0 "The central ministries need common registers to allocate revenue and manpower. Provincial officers rely on local intermediaries to learn who works the land and who has moved away. Differences between their rolls may reflect late reports or a family unwilling to surrender its powers of collection. A form issued in the capital cannot by itself make local administration work.\n\nGovernment must reconcile #bold central standards#! with #bold provincial practice#!. A balance of 35–65 provides a durable equilibrium; remaining at either extreme for 24 months causes failure. Monthly changes and the two crisis counters are detailed in the progress and crisis displays."
 je_ffpa_tur_imperial_registers_v1_status_low_extreme:0 "Provincial families and intermediaries have captured the register. The low-extreme #n failure clock is advancing#!."
 je_ffpa_tur_imperial_registers_v1_status_local:0 "Local compacts dominate the register."
 je_ffpa_tur_imperial_registers_v1_status_provincial:0 "Provincial mediation remains stronger than the central chancery."
 je_ffpa_tur_imperial_registers_v1_status_equilibrium:0 "Register and intermediary are in #p a durable equilibrium#!."
 je_ffpa_tur_imperial_registers_v1_status_admin:0 "The chancery has the upper hand without displacing provincial mediation."
 je_ffpa_tur_imperial_registers_v1_status_direct:0 "Direct administration is crowding out the intermediaries."
 je_ffpa_tur_imperial_registers_v1_status_high_extreme:0 "The paper state has outrun its local reach. The high-extreme #n failure clock is advancing#!."

 je_ffpa_tur_bread_and_capital_v1:0 "Bread and the Capital"
 je_ffpa_tur_bread_and_capital_v1_reason:0 "Merchants order grain according to prices, and carriers schedule loads according to capacity. Government must also prepare for the next interruption. The modern depots, procurement contracts, and emergency distribution system bearing the old name of imperial granaries provide a reliable #bold strategic reserve#! only while supplies can reach them.\n\nReserves can absorb a temporary shortage, but persistent disruption consumes them. At zero reserve, #bold six months of severe crisis or three months of famine#! cause failure; a positive reserve resets both counters. Routine supply and emergency use require continuing decisions."
 je_ffpa_tur_bread_and_capital_v1_status_secure:0 "#p The capital's reserve is secure#! and supports full public provision."
 je_ffpa_tur_bread_and_capital_v1_status_serviceable:0 "The reserve is serviceable, though prolonged disruption will consume it."
 je_ffpa_tur_bread_and_capital_v1_status_rationed:0 "The reserve is thin; supplies are being rationed without a standing benefit."
 je_ffpa_tur_bread_and_capital_v1_status_empty:0 "#n The reserve is empty#!. A severe crisis or famine now advances the failure clock."

 je_ffpa_byz_public_polity_v1:0 "The Public Polity of the Romans"
 je_ffpa_byz_public_polity_v1_reason:0 "The Roman name connects different regions, but the state depends on enforceable laws, accessible support, and public institutions its residents can recognize. Officials want common procedures; people in the provinces want those procedures to answer their needs. #bold Public Authority, National Welfare, and Public Recognition#! must sustain one another.\n\nSustained deterioration can turn warnings into broken pillars, and broken commitments require active repair. All three pillars broken for six months, or two broken with the last in warning for twelve, cause #bold the polity to fail#!. Keeping one institution intact cannot discharge the other two obligations."
 je_ffpa_byz_public_polity_v1_status_intact:0 "#p All three pillars of the polity stand intact#!."
 je_ffpa_byz_public_polity_v1_status_warning:0 "At least one pillar is in warning and will break if neglect continues."
 je_ffpa_byz_public_polity_v1_status_broken:0 "One pillar has broken and requires deliberate repair."
 je_ffpa_byz_public_polity_v1_status_crisis:0 "Two or more pillars have broken; #n the polity is approaching failure#!."

 je_ffpa_byz_military_households_v1:0 "Military Households and the Dynatoi"
 je_ffpa_byz_military_households_v1_reason:0 "Defense, frontier service, and reconstruction work have tied public obligations to land, forming new #bold Military Households#!. Officers, contractors, and families holding land control local registers and resources, becoming a new class of #bold Dynatoi#!. These names recovered from Roman history now describe modern relations of land, revenue, and service that the state must regulate.\n\n#bold Dynatoi Pressure does not decline naturally#!; routine controls and the three stages of reform can contain it. Pressure at 100 for six months, or at least 90 for eighteen months with a structural source still present at settlement, causes failure. Failure cancels unfinished projects but preserves completed reforms and military laws already enacted."
 je_ffpa_byz_military_households_v1_status_contained:0 "The military households are contained and still serve the fiscal-military order."
 je_ffpa_byz_military_households_v1_status_present:0 "Dynatoi influence is present but not yet entrenched."
 je_ffpa_byz_military_households_v1_status_entrenched:0 "The dynatoi are entrenched in land, revenue, and recruitment."
 je_ffpa_byz_military_households_v1_status_ascendant:0 "Dynatoi power is ascendant and the state is losing direct control."
 je_ffpa_byz_military_households_v1_status_dominant:0 "The dynatoi dominate the military households; the #n failure clock is advancing#!."
 je_ffpa_byz_military_households_v1_status_project:0 "An institutional reform project is under way. Default pauses its progress."

 ffpa_tur_register_balance_bar_v1:0 "Register–Intermediary Balance"
 ffpa_tur_register_balance_bar_v1_desc:0 "0 is local capture; 100 is paper centralization; 35–65 is the safest range."
 ffpa_tur_register_balance_bar_v1_second_desc:0 "The two extreme ranges advance separate 24-month failure clocks."
 ffpa_tur_capital_reserve_bar_v1:0 "Capital Supply Reserve"
 ffpa_tur_capital_reserve_bar_v1_desc:0 "A buffer against grain, transportation, electricity, and market-access anomalies."
 ffpa_tur_capital_reserve_bar_v1_second_desc:0 "Failure clocks run only while the reserve is 0 and the relevant crisis persists."
 ffpa_byz_public_law_pillar_bar_v1:0 "Public Authority"
 ffpa_byz_public_law_pillar_bar_v1_desc:0 "Legitimacy, bureaucracy, and solvency."
 ffpa_byz_public_welfare_pillar_bar_v1:0 "Nationwide Welfare"
 ffpa_byz_public_welfare_pillar_bar_v1_desc:0 "National living standards, incorporated-state access, and the share of states in famine."
 ffpa_byz_public_recognition_pillar_bar_v1:0 "Public Recognition"
 ffpa_byz_public_recognition_pillar_bar_v1_desc:0 "Civil peace, movement radicalism, and incorporated-state turmoil."
 ffpa_byz_public_pillar_bar_v1_second_desc:0 "0: intact; 1: warning; 2: broken; 3: repairing."
 ffpa_byz_dynatoi_pressure_bar_v1:0 "Dynatoi Pressure"
 ffpa_byz_dynatoi_pressure_bar_v1_desc:0 "Structural pressure from military households, landed power, and fiscal privileges."
 ffpa_byz_dynatoi_pressure_bar_v1_second_desc:0 "Pressure does not fall naturally; use controls and complete institutional reforms."

 ffpa_tur_register_audit_button_v1:0 "Audit the Imperial Registers"
 ffpa_tur_register_audit_button_v1_desc:0 "Move the balance +10 toward direct administration.\n\nCooldown: #v 12 months#!."
 ffpa_tur_register_provincial_roll_button_v1:0 "Recognize the Provincial Rolls"
 ffpa_tur_register_provincial_roll_button_v1_desc:0 "Move the balance -10 toward provincial mediation.\n\nCooldown: #v 12 months#!."
 ffpa_tur_register_dual_ledgers_button_v1:0 "Reconcile the Dual Ledgers"
 ffpa_tur_register_dual_ledgers_button_v1_desc:0 "Move up to 15 toward 50, or set an already balanced value to 50.\n\nCooldown: #v 24 months#!. At either extreme it may be forced once at double cost."
 ffpa_tur_capital_purchase_button_v1:0 "Purchase Emergency Grain"
 ffpa_tur_capital_purchase_button_v1_desc:0 "Gain 15 reserve and reset failure clocks.\n\nCooldown: #v 6 months#!."
 ffpa_tur_capital_granary_button_v1:0 "Open the Imperial Granaries"
 ffpa_tur_capital_granary_button_v1_desc:0 "Release 15 points from the modern state reserve for two years of welfare and mortality relief.\n\nCooldown: #v 6 months#!."
 ffpa_tur_capital_ration_button_v1:0 "Impose Emergency Rationing"
 ffpa_tur_capital_ration_button_v1_desc:0 "Gain 25 reserve and reset failure clocks, at authority, living-standard, and political cost.\n\nCooldown: #v 12 months#!; one severe-crisis override is available at extra expense."
 ffpa_byz_public_new_decree_button_v1:0 "Issue a New Decree"
 ffpa_byz_public_new_decree_button_v1_desc:0 "Clear a Public Authority warning and protect it for 6 months, or place the broken pillar into repair.\n\nCooldown: #v 6 months#!; a broken pillar can force one double-cost use. Repair completes only after all three pillars are healthy for 6 months."
 ffpa_byz_public_benefaction_button_v1:0 "Organize a Nationwide Benefaction"
 ffpa_byz_public_benefaction_button_v1_desc:0 "Clear a Welfare warning and protect it for 6 months, or begin repair of a broken Welfare pillar.\n\nCooldown: #v 6 months#!; one broken-pillar override costs double."
 ffpa_byz_public_representation_button_v1:0 "Convene the Representatives"
 ffpa_byz_public_representation_button_v1_desc:0 "Clear a Recognition warning and protect it for 6 months, or begin repair of a broken Recognition pillar.\n\nCooldown: #v 6 months#!; one broken-pillar override costs double."
 ffpa_byz_dynatoi_audit_button_v1:0 "Audit the Offices and Military Rolls"
 ffpa_byz_dynatoi_audit_button_v1_desc:0 "Reduce Dynatoi pressure by 8.\n\nCooldown: #v 18 months#!."
 ffpa_byz_dynatoi_redemption_button_v1:0 "Redeem Village Obligations"
 ffpa_byz_dynatoi_redemption_button_v1_desc:0 "Reduce Dynatoi pressure by 10 at fiscal and landed-political cost.\n\nCooldown: #v 12 months#!; default blocks it."
 ffpa_byz_dynatoi_allelengyon_button_v1:0 "Impose the Allelengyon"
 ffpa_byz_dynatoi_allelengyon_button_v1_desc:0 "At 70 pressure or more, reduce pressure by 18 through an exceptional collective levy.\n\nCooldown: #v 24 months#!. At 90 or more, one double-cost early use is available."
 ffpa_byz_military_register_reform_button_v1:0 "Recompile the Imperial Military Register"
 ffpa_byz_military_register_reform_button_v1_desc:0 "Choose Professional Army or Mass Conscription immediately, accept a five-year transition cost, and begin a 12-month project. Postponing closes this choice for 3 months."
 ffpa_byz_land_tenure_reform_button_v1:0 "Survey Tenure and Service"
 ffpa_byz_land_tenure_reform_button_v1_desc:0 "Begin the second reform, an 18-month project that halves pressure from Tenant Farmers or Serfdom and reduces pressure by 20 on completion.\n\nDefault pauses progress; reform fatigue lasts 3 years."
 ffpa_byz_supply_veterans_reform_button_v1:0 "Found the Imperial Supply and Veterans Office"
 ffpa_byz_supply_veterans_reform_button_v1_desc:0 "Begin the final 24-month reform. Completion reduces pressure by 25 and permanently increases nationwide welfare payments by 10%.\n\nDefault pauses progress; positive gold reserves are required to start."

 ffpa_tur_flavor.90.t:0 "The Provinces Keep Their Own Books"
 ffpa_tur_flavor.90.d:0 "The central registers still bear provincial seals, but tax collectors and recruiting officers increasingly depend on lists supplied by local families. Intermediaries settle who must pay and who may be exempted before officials see the result. The government must bear the cost of recovering effective administrative authority."
 ffpa_tur_flavor.90.f:0 "The recruiting officer asked about a household absent from the roll. The intermediary did not open the register. “You should speak to me about that family first.”"
 ffpa_tur_flavor.90.a:0 "Accept the cost of recovering effective control of provincial administration."
 ffpa_tur_flavor.91.t:0 "An Empire on Paper"
 ffpa_tur_flavor.91.d:0 "Provincial reports now use the same forms, while work on the ground proceeds more slowly. Local officers await approval, and central ministries demand records the provinces cannot yet supply. Uniform procedure has outgrown the means to enforce it. Government must bear the consequences of this paper centralization."
 ffpa_tur_flavor.91.f:0 "The station was still waiting for permission to begin repairs. Three files held the applications sent back and forth. The latest annotation read: resubmit on the new form."
 ffpa_tur_flavor.91.a:0 "Bear the cost of restoring local capacity to act."
 ffpa_tur_flavor.92.t:0 "The Empty Capital Granaries"
 ffpa_tur_flavor.92.d:0 "The capital has exhausted its strategic reserves, and severe supply difficulties persist. Procurement offices can no longer sustain existing arrangements by releasing stored grain. Doubts about the next delivery are turning into doubts about government itself. The fiscal and social cost of this failure will outlast the immediate shortage."
 ffpa_tur_flavor.92.f:0 "The crowd at the depot waited through a change of shift. Its supervisor still could not say when the next load of grain would arrive."
 ffpa_tur_flavor.92.a:0 "The capital will remember this failure."

 ffpa_flavor.50.t:0 "The Public Polity Fractures"
 ffpa_flavor.50.d:0 "The central offices still function, but the promises of National Welfare and Public Recognition have broken down. Provincial delegates bring new requests alongside matters left unanswered. Government must bear the consequences of lost trust and use its remaining Public Authority to repair the other two pillars."
 ffpa_flavor.50.f:0 "“This application has already been approved,” the clerk said. The visitor took back the paper. “I know. I came to ask when anything will be done.”"
 ffpa_flavor.50.a:0 "Accept the consequences and begin repairing the broken commitments."
 ffpa_flavor.51.t:0 "Recompiling the Imperial Military Register"
 ffpa_flavor.51.d:0 "Militia registration, frontier duty, veteran settlement, and public works obligations rely on different rolls. Government must first establish a professional standing army or mass conscription, then spend a year reconciling population, land, and service obligations. The new register will determine who takes responsibility for these existing duties."
 ffpa_flavor.51.f:0 "The recruiting officer brought a service roll; the local officer brought a land register. Both wanted to know who would be responsible for the third book."
 ffpa_flavor.51.a:0 "Record a professional standing army."
 ffpa_flavor.51.b:0 "Record the people for mass conscription."
 ffpa_flavor.51.c:0 "Postpone the recompilation for three months."
 ffpa_flavor.52.t:0 "The Dynatoi Settlement"
 ffpa_flavor.52.d:0 "The Dynatoi who control land and service networks have become a force that routine audits cannot contain. Government can recognize a landed compact or attempt to confiscate their privileges. Either choice will carry fiscal and political consequences for years."
 ffpa_flavor.52.f:0 "The delegates agreed to continue performing public duties. Beside each duty, they insisted on recording who would assess it and to whom it must be paid."
 ffpa_flavor.52.a:0 "Recognize a compact with the great households."
 ffpa_flavor.52.b:0 "Confiscate their privileges and endure the rupture."

