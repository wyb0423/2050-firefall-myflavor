 je_ffpa_usa_federal_promise_v1: "The Federal Promise"
 je_ffpa_usa_federal_promise_v1_reason: "The reconstruction conference left rules for public grants; the factories brought new orders. Local delegates now carry these documents to the government, asking when the next payment will arrive, who will check the contracts and what support remains for those without work.\n\n#bold The federal promise#! acquires weight through obligations met. Construction can accelerate and authority can expand, but someone must answer for both the expenditure in the ledgers and the consent recorded in the meeting hall."
 ffpa_usa_gov_heading_v1: "#bold Authority, grants and delivery#!"
 ffpa_usa_gov_locked_credit_v1: "Federal confidence opens after A Federal Settlement."
 ffpa_usa_gov_locked_risk_v1: "Prosperity risk opens after The Power of Scale."
