 ffpa_usa_gov_credit_rules_v1: "#bold Benefits and thresholds#!\nAt least 35 confidence: legitimacy #p +5#!, bureaucracy output #p +8%#!. From 20 to below 35: #p +2#! and #p +4%#!. Below 20: no benefits.\nTwelve consecutive months below 20 cause an eight-year penalty: legitimacy #n −15#!, bureaucracy output #n −15%#!, enactment speed #n −25%#!. Reaching 20 resets the crisis clock. Recovery requires at least 35 for twelve consecutive months and an expired penalty."
 ffpa_usa_gov_risk_rules_v1: "#bold Benefits and thresholds#!\nBelow 65 risk: manufacturing throughput and construction efficiency #p +5%#! each. From 65 to below 85: #p +2.5%#! each. At least 85: no benefits.\nTwelve consecutive months at or above 85 cause a five-year penalty: manufacturing throughput #n −15%#!, construction efficiency #n −20%#!. Falling below 85 resets the crisis clock. Recovery requires risk below 65 for twelve consecutive months and an expired penalty."
 ffpa_usa_gov_inputs_v1: "Governance readings: legitimacy #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_legitimacy_v1')|0]#! · bureaucracy balance #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_bureaucracy_v1')|0]#!\nPopulation in troubled states #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_turmoil_v1')|1]%#!"
 ffpa_usa_gov_inputs_tt_v1: "Readings remove the direct legitimacy and bureaucracy effects of this journal’s confidence tiers and failure penalty. Turmoil counts owned mainland states with at least 30% turmoil; pressure begins at a 25% mainland population share. Other institutions and actual economic consequences still count. A nonpositive bureaucracy multiplier cannot be inverted and is conservatively treated as administrative stress."
 ffpa_usa_gov_industry_inputs_v1: "Industrial levels with low employment #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_low_employment_v1')|1]%#!\nLiving standard: current #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_current_display_v1')|0]#! / preceding three-year mean #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_history_display_v1')|0]#! · fall sustained #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_falling_display_v1')|0]#! months"
 ffpa_usa_gov_industry_inputs_tt_v1: "#bold Low employment#! means manufacturing buildings below 65% occupancy, weighted by completed levels; no manufacturing counts as 100%.\nLiving standards compare the same cohort using current population weights and each state’s preceding 36 observations. Newly acquired or created states start fresh; fewer than 36 observations exclude them, including their first twelve months. Zero means insufficient history. A fall of at least 10% for three consecutive months creates pressure."
 ffpa_usa_gov_costs_v1: "#bold Current governance grants#!  @money![JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_total_cost_v1')|0] / week"
 ffpa_usa_gov_costs_tt_v1: "Conference, credit and relief cost 0.25%, 0.5% and 0.75% of annual GDP at launch, divided by 52 and fixed for one year. Later GDP changes do not increase the bill. Country modifiers show remaining duration; delivery is confirmed at the first monthly check after expiry. Ordinary deficits do not cancel programs. Loss of eligibility cancels unfinished programs without delivery rewards."
 ffpa_usa_gov_shared_rules_v1: "#bold Scheduling actions#!\nEmergency powers and credit share one acceleration slot; the two audits share one review slot. A crisis or failed recovery in either field closes both accelerators. Conference, audit and relief remain available for repair.\nPenalties retain their original expiry dates. Completed projects, companies and institutions remain intact."
