 ffpa_usa_gov_conference_button_v1: "Convene an Interstate Conference"
 ffpa_usa_gov_conference_button_desc_v1: "Bring grant schedules and local conditions to the same table, and fulfil a year of consultation."
 ffpa_usa_gov_conference_effects_v1: "After one year of delivery: confidence #p +12#!. Weekly spending is 0.25% of annual GDP at launch ÷ 52, for one year. Cooldown: 24 months, or 18 with local organization delegates.\nCurrent projected weekly cost: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_conference_cost_v1')|0]. "
 ffpa_usa_gov_conference_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_conference_effects_v1$"
 ffpa_usa_gov_review_button_v1: "Review Grants and Credentials"
 ffpa_usa_gov_review_button_desc_v1: "Recheck signatures, credentials and grant vouchers so that obligations can be verified."
 ffpa_usa_gov_review_effects_v1: "Confidence #p +1#! for twelve monthly checks, or #p +1.25#! with individual registration. Construction efficiency #n −10%#! for one year; 24-month cooldown. Shares the audit slot. On completion, unlocked prosperity risk #p −5#!. The first hearing has additional choices, detailed below.\nFirst hearing: accountability adds 5 unlocked confidence (or removes 5 risk if only economics is open) at a cost of −5% bureaucracy output for a year; rescheduling instead removes 5 unlocked risk (or adds 3 confidence if only politics is open) at a cost of −5% construction efficiency for a year."
 ffpa_usa_gov_review_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_review_effects_v1$"
 ffpa_usa_gov_emergency_button_v1: "Exercise Emergency Powers"
 ffpa_usa_gov_emergency_button_desc_v1: "Use delegated authority to shorten construction delays, with a definite term for emergency powers."
 ffpa_usa_gov_emergency_effects_v1: "Requires the emergency authorization settlement and at least 35 confidence. Immediately confidence #n −15#!; construction efficiency #p +15%#! for one year. Cooldown: 36 months. Shares the acceleration slot; blocked by any crisis or failed recovery. At the first expiry, accept one year of −5% construction efficiency for supervision, or lose 5 more confidence; acceleration is not renewed."
 ffpa_usa_gov_emergency_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_emergency_effects_v1$"
 ffpa_usa_gov_credit_line_button_v1: "Expand Contracts and Industrial Credit"
 ffpa_usa_gov_credit_line_button_desc_v1: "Bring more orders to the production lines and enter the obligations in next year’s budget."
 ffpa_usa_gov_credit_line_effects_v1: "Requires risk below 65. Immediately risk #n +15#!; construction efficiency #p +10%#! for one year. Weekly spending is 0.5% of annual GDP at launch ÷ 52 for one year; cooldown 24 months. Shares the acceleration slot; blocked by any crisis or failed recovery.\nCurrent projected weekly cost: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_line_cost_v1')|0]. "
 ffpa_usa_gov_credit_line_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_credit_line_effects_v1$"
 ffpa_usa_gov_procurement_button_v1: "Audit Charters and Public Procurement"
 ffpa_usa_gov_procurement_button_desc_v1: "Check contracts, deliveries and charter terms so that new orders rest on obligations the country can bear."
 ffpa_usa_gov_procurement_effects_v1: "After one year: risk #p −15#! and unlocked confidence #p +5#!. Immediately manufacturing throughput #n −5%#! and Industrialist approval #n −2#! for two years. Cooldown: 36 months; shares the audit slot. The first hearing has additional choices.\nFirst hearing: accountability adds 5 unlocked confidence (or removes 5 risk if only economics is open) at a cost of −5% bureaucracy output for a year; rescheduling instead removes 5 unlocked risk (or adds 3 confidence if only politics is open) at a cost of −5% construction efficiency for a year."
 ffpa_usa_gov_procurement_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_procurement_effects_v1$"
 ffpa_usa_gov_relief_button_v1: "Expand Relief and Retraining"
 ffpa_usa_gov_relief_button_desc_v1: "Support households between jobs and preserve an opportunity to return to production."
 ffpa_usa_gov_relief_effects_v1: "For one year, halve risk gains from low industrial employment and declining living standards; debt pressure is unaffected. Weekly spending is 0.75% of annual GDP at launch ÷ 52 for one year. Cooldown: 24 months. Normal completion grants unlocked confidence #p +5#!.\nCurrent projected weekly cost: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_relief_cost_v1')|0]. "
 ffpa_usa_gov_relief_requirements_v1: "Requires the corresponding field, an expired cooldown, no ongoing instance and the applicable shared slot and indicator conditions.\n$ffpa_usa_gov_relief_effects_v1$"
 ffpa_usa_flavor.30.t: "The Grants Hearing"
 ffpa_usa_flavor.30.d: "The hearing table holds lists of accepted works alongside vouchers delivered late. Auditors ask who signed the authorizations; contractors ask for a revised delivery schedule.\n\n#bold The audit is complete#!. The next round of delivery can be supported by closer accountability or by more cautious contract scheduling."
 ffpa_usa_flavor.30.f: "The clerk places two receipts bearing the same number and different dates side by side, and waits."
 ffpa_usa_flavor.30.1: "Hold each signatory accountable."
 ffpa_usa_flavor.30.1.tt: "Hearing settlement: unlocked confidence #p +5#!; if only economic governance is open, risk #p −5#! instead. Bureaucracy output #n −5%#! for one year."
 ffpa_usa_flavor.30.2: "Reschedule contracts around delivery."
 ffpa_usa_flavor.30.2.tt: "Hearing settlement: unlocked risk #p −5#!; if only political governance is open, confidence #p +3#! instead. Construction efficiency #n −5%#! for one year."
 ffpa_usa_flavor.31.t: "The Term of Temporary Powers"
 ffpa_usa_flavor.31.d: "The expedited orders have passed through a budget year. Local delegates ask that procedures bypassed under emergency authority be restored to the record; the works office fears another round of checks will delay the next projects.\n\n#bold The emergency term has ended#!. The government can accept additional supervision or bear the loss of confidence that comes with refusing it."
 ffpa_usa_flavor.31.f: "The final line of the warrant carries an expiry date, as legible as on the day it was signed."
 ffpa_usa_flavor.31.1: "Submit the emergency term to review."
 ffpa_usa_flavor.31.1.tt: "Construction efficiency #n −5%#! for one year; no renewed emergency bonus."
 ffpa_usa_flavor.31.2: "Accept responsibility for refusing review."
 ffpa_usa_flavor.31.2.tt: "Confidence #n −5#!; no renewed emergency bonus."
 ffpa_usa_flavor.40.t: "The Federal Promise Broken"
 ffpa_usa_flavor.40.d: "Local delegates bring more than new applications: they bring lists of grants that never received an answer. Every new federal resolution now draws a demand for a guarantee of delivery.\n\n#bold A crisis of confidence has taken hold#!. The government can still convene delegates and examine credentials, but consent will be harder to secure."
 ffpa_usa_flavor.40.f: "After the meeting, the most numerous papers on the table are those marked “to be verified”."
 ffpa_usa_flavor.40.1: "Deliver the promises that can still be kept."
 ffpa_usa_flavor.40.1.tt: "The eight-year penalty already applies: legitimacy −15, bureaucracy output −15%, enactment speed −25%. Recovery needs confidence at least 35 for twelve consecutive months and an expired penalty. Acknowledgement does not apply it again."
 ffpa_usa_flavor.41.t: "Prosperity Fractured"
 ffpa_usa_flavor.41.d: "Procurement offices revise delivery schedules while local offices reconcile employment records and grant accounts. Plans once written for expansion must now be recalculated against what can actually be sustained.\n\n#bold The promise of prosperity has failed#!. Existing factories and completed works remain; recovery begins with orders that can be delivered and budgets that can be carried."
 ffpa_usa_flavor.41.f: "The old ledger has not been discarded. Its next page begins with the undelivered orders."
 ffpa_usa_flavor.41.1: "Put the existing factories on a sound footing."
 ffpa_usa_flavor.41.1.tt: "The five-year penalty already applies: manufacturing throughput −15%, construction efficiency −20%. Recovery needs risk below 65 for twelve consecutive months and an expired penalty. Existing companies and completed projects remain."
 ffpa_usa_flavor.43.t: "Promises Delivered Again"
 ffpa_usa_flavor.43.d: "Grants arrive as agreed, and audit records match the vouchers held locally. Delegates strike out their reservations one by one; the government no longer has to answer for the past before every routine decision.\n\n#bold Federal confidence has been repaired#!. The arrangements still require care, but the exceptional restrictions left by the failure have ended."
 ffpa_usa_flavor.43.f: "The clerk stamps the final receipt, then opens the next ledger."
 ffpa_usa_flavor.43.1: "Keep the promises open to scrutiny."
 ffpa_usa_flavor.43.1.tt: "Standing political benefits have resumed. No additional reward or new preparation period is granted."
 ffpa_usa_flavor.44.t: "Accounts for Work Resumed"
 ffpa_usa_flavor.44.d: "New procurement schedules follow existing orders and actual deliveries, and budgets leave room to honour them. As factories rearrange shifts, local offices can at last offer firmer answers.\n\n#bold Economic governance has recovered#!. Construction can continue, at a pace determined by the bills the country can carry."
 ffpa_usa_flavor.44.f: "The figures in the ledger have not become elegant. They have become possible to reconcile."
 ffpa_usa_flavor.44.1: "Build at a pace the country can sustain."
 ffpa_usa_flavor.44.1.tt: "Standing economic benefits have resumed. No extra grant, acceleration or debt relief is provided."
