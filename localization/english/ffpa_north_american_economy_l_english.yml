l_english:
 je_ffpa_usa_continental_market_v1: "A Continental Market"
 je_ffpa_usa_continental_market_v1_reason: "Under one flag, producers still struggle to find dependable buyers. State authorities need documents they can recognize, carriers need regular traffic, and newly registered companies want to trade across state lines.\n\nThe federation must turn its territory into a #bold functioning economic network#!.\n\n#bold Project outcomes#!\nChoose mainland corridors or wider branch lines for state-level improvements, and permanently gain #p +1 company capacity#!."
 je_ffpa_usa_continental_market_v1_goal: "Meet the requirements for twelve consecutive months and settle the project."
 je_ffpa_usa_industrial_scale_v1: "The Power of Scale"
 je_ffpa_usa_industrial_scale_v1_reason: "A wider market has opened. The next orders will shape the industry that serves it. Concentrated procurement can enlarge a few industrial centers; divided contracts can help local suppliers take on lasting business.\n\nFactory buildings must become #bold staffed industries capable of delivery#!.\n\n#bold Project outcomes#!\n[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n\nRetain the route improvements and choose #bold wider company access#! or #bold stronger established firms#!."
 je_ffpa_usa_industrial_scale_v1_goal: "Meet the requirements for eighteen consecutive months and settle industrial and company policy."
 ffpa_usa_industry_categories_help_v1: "\nCategories: food, textiles, household goods, chemicals and medicine, metals, tools and machinery, vehicles, electronics and computers, and armaments. Multiple types within one category count once. Offices, software and data centers do not count as manufacturing."
 ffpa_usa_economy_grants_summary_v1: "\n\nCurrent economic program grants: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_total_grants_v1')|0] per week. Each grant fixes its weekly cost at selection, equal to 0.5% of annual GDP divided by 52, for two years; amounts and expiration are shown in country modifiers."
 ffpa_usa_market_population_tt: "States containing at least 85% of the mainland population have 95% market access."
 ffpa_usa_market_facilities_tt: "At least four mainland states have a completed qualifying manufacturing, port or railway building at 70% employment; armaments do not count."
 ffpa_usa_industry_levels_tt: "Completed mainland manufacturing capacity meets the target fixed at project start."
 ffpa_usa_industry_categories_tt: "At least four manufacturing categories have a completed building at 75% employment."
 ffpa_usa_industry_mix_tt: "Include metals or machinery, and food, textiles or household goods."
 ffpa_usa_industry_distribution_tt: "Staffed manufacturing at 75% employment in at least three states for concentration, or five for local suppliers."
 ffpa_usa_market_settled_tt: "Complete 12 qualifying months and confirm the reward event."
 ffpa_usa_market_months_bar_v1: "Consecutive Qualifying Months"
 ffpa_usa_market_months_bar_v1_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12 months. A failed observation resets the count; reaching the target opens settlement."
 ffpa_usa_industry_settled_tt: "Complete 18 qualifying months and confirm the reward event."
 ffpa_usa_industry_months_bar_v1: "Consecutive Qualifying Months"
 ffpa_usa_industry_months_bar_v1_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/18 months. A failed observation resets the count; reaching the target opens settlement."
 ffpa_usa_economy_retry_button_v1: "Reopen the Pending Agenda"
 ffpa_usa_economy_retry_button_v1_desc: "Reopen an unresolved economic event. Earlier windows become invalid; settled choices, grants and rewards are preserved."
 ffpa_usa_economy_waiting_v1: "An economic agenda awaits a response. Use the journal button if its window is missing."
 ffpa_usa_economy_running_v1: "The project is assessed monthly; ordinary law changes preserve settled choices."
 ffpa_usa_industry_route_central_v1: "Development: concentrated orders. Three staffed industrial states required. Completion grants +15% manufacturing throughput permanently to the top three qualifying industrial states and +10% national construction efficiency for five years."
 ffpa_usa_industry_route_local_v1: "Development: local suppliers. Five staffed industrial states required. Completion grants +8% manufacturing throughput permanently to all qualifying industrial states and +10% national infrastructure throughput for five years."
 ffpa_usa_industry_route_pending_v1: "Procurement arrangements await a decision."
 ffpa_usa_contract_company_prosperous_v1: "[SCOPE.sCompany('ffpa_usa_contract_company').GetName] is prospering. Citing its established holdings and operations, it seeks a larger share of interstate orders."
 ffpa_usa_contract_company_present_v1: "[SCOPE.sCompany('ffpa_usa_contract_company').GetName] holds operating assets. Its representatives propose more dependable contracts to support expansion."
 ffpa_usa_contract_company_absent_v1: "The company originally involved is no longer available, but procurement rules still require a decision."
 ffpa_usa_flavor.10.t: "Where Freight Stops"
 ffpa_usa_flavor.10.d: "Freight reaches a state line before its paperwork is accepted on the other side. Carriers ask for common procedures; local authorities ask who will pay for them. Federal funding can help the transition, or mutual recognition can proceed more gradually.\n\nFunded option: +10% national infrastructure throughput for two years. Weekly cost is fixed at selection at 0.5% of annual GDP divided by 52. Current estimate: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_weekly_grant_v1')|0]/week."
 ffpa_usa_flavor.10.f: "The carrier lays two identical manifests with different seals on the desk and waits for a third signature."
 ffpa_usa_flavor.10.1: "Fund the transition."
 ffpa_usa_flavor.10.2: "Let the states negotiate mutual recognition."
 ffpa_usa_flavor.11.t: "A Common Freight Schedule"
 ffpa_usa_flavor.11.d: "Reliable deliveries are changing purchasing decisions. Merchants can keep stock across several states, and local workshops can accept distant orders. Company registrations receive wider recognition. Should the next improvements reinforce the busiest corridors or reach more towns?\n\nBoth choices permanently add one company slot. State improvements apply only to project states recorded at validation that remain under our ownership at settlement."
 ffpa_usa_flavor.11.f: "For the first time, the ledger lists rates that can be used again on the next delivery."
 ffpa_usa_flavor.11.1: "Prioritize trunk corridors: permanent +20% construction efficiency and infrastructure in the three most populous qualifying project states."
 ffpa_usa_flavor.11.2: "Connect more towns: permanent +10% infrastructure and taxation capacity in all qualifying project states."
 ffpa_usa_flavor.12.t: "The Largest Contract"
 ffpa_usa_flavor.12.d: "The new procurement list exceeds what one local workshop can deliver. Industrial centers seek large, lasting orders; smaller suppliers ask for contracts to be divided. Both can expand production, but they require different industrial networks."
 ffpa_usa_flavor.12.f: "The first page gives the total. The delegates turn to the list of contractors behind it."
 ffpa_usa_flavor.12.1: "Concentrate orders: three-state route, +10% construction efficiency for three years."
 ffpa_usa_flavor.12.2: "Develop local suppliers: five-state route, +5% manufacturing throughput for three years."
 ffpa_usa_flavor.13.t: "The Night Shift Payroll"
 ffpa_usa_flavor.13.d: "Industrial expansion has passed half of its planned increase. Workshop managers press for the next delivery; local delegates submit requests for training and living support. Orders can be accelerated, or funds can help those entering industry find their footing.\n\nFunded option: -10% national turmoil effects for two years. Weekly cost is fixed at selection at 0.5% of annual GDP divided by 52. Current estimate: @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_weekly_grant_v1')|0]/week."
 ffpa_usa_flavor.13.f: "There are new names on the payroll. Some have learned their machines; others are still looking for a place to live."
 ffpa_usa_flavor.13.1: "Fund training and living support."
 ffpa_usa_flavor.13.2: "Prioritize deliveries: +10% manufacturing throughput for one year; +10% turmoil effects for two years."
 ffpa_usa_flavor.14.t: "The Organizers of Industry"
 ffpa_usa_flavor.14.d: "Expanded factories have sustained production through a period of assessment. The federation can make room for more companies or help established firms make fuller use of their organization and expertise. Company policy will endure alongside the completed industrial works.\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\nChoose one company reward in addition to the route reward above. This does not create companies or transfer factories."
 ffpa_usa_flavor.14.f: "The production reports list more than new factory buildings: they name those capable of delivering on time."
 ffpa_usa_flavor.14.1: "Widen company access: permanent +2 company capacity; +10 percentage points company construction bonus for ten years."
 ffpa_usa_flavor.14.2: "Develop leading firms: permanent +10 percentage points company throughput bonus; +20 percentage points company construction bonus for ten years."
 ffpa_usa_flavor.15.t: "The Names on the Contract"
 ffpa_usa_flavor.15.d: "[ROOT.GetCountry.GetCustom('ffpa_usa_contract_company_text_v1')]\n\nProcurement officials favor contractors who can coordinate deliveries. Local chambers ask that more suppliers have access to the tender. How should the federation organize these orders?"
 ffpa_usa_flavor.15.f: "An old trademark can be printed again. This delivery must still prove the promise behind it."
 ffpa_usa_flavor.15.1: "Concentrate contracts: +10 percentage points company construction bonus for three years."
 ffpa_usa_flavor.15.2: "Open the tender: +5% national construction efficiency for three years."
