 ffpa_ig_usa_landed_families: "Landed Families"
 ffpa_ig_usa_farmers: "Farmers"
 ffpa_ig_usa_church: "The Church"
 ffpa_ig_usa_labor_congress: "Labor Congress"
 ideology_ffpa_usa_federal_defense: "Federal Defense"
 ideology_ffpa_usa_federal_defense_desc: "This group favors a professional force for federal defense, supplemented by broader conscription when necessary. Its officers regard frontier settlement and a national electrical system as foundations of security, and oppose expansion sustained by colonial exploitation."
 ideology_ffpa_usa_continental_market: "Continental Market Liberalism"
 ideology_ffpa_usa_continental_market_desc: "This group seeks a continental market open to capital, goods, and technology. Businesses accept basic regulation, public investment in reconstruction, and the training of skilled workers, while opposing isolation, state-directed production, and extensive labor protections."
 ideology_ffpa_usa_civic_republicanism: "Civic Republicanism"
 ideology_ffpa_usa_civic_republicanism_desc: "This group holds that federal authority should rest on citizens' votes. Either a president or a parliament may lead the republic, but government should not become a family's inheritance, a privileged circle's possession, or one party's monopoly."
 ideology_ffpa_usa_civic_liberalism: "Civic Liberalism"
 ideology_ffpa_usa_civic_liberalism_desc: "This current within universities, the press, and public intellectual life advocates common citizenship across cultural origins. It supports free expression, civil liberties, women's suffrage, and public universities, and opposes public order enforced through secret or militarized police."
 ideology_ffpa_usa_local_constitutionalism: "Local Constitutionalism"
 ideology_ffpa_usa_local_constitutionalism_desc: "This group supports republican institutions and elected officials through whom townspeople can influence public affairs. Local businesses and associations seek protection for their livelihoods, managed migration, and shared cultural norms. They oppose hereditary administration and fully closed borders."
