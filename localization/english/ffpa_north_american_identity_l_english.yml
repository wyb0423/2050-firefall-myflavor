l_english:
 gov_ffpa_usa_federal_government: "Federal Government"
 gov_ffpa_usa_federal_government_desc: "An American government whose elected president leads an executive separate from Congress. The states recognize federal authority and participate in national affairs through elections."
 gov_ffpa_usa_federal_cabinet: "Federal Cabinet"
 gov_ffpa_usa_federal_cabinet_desc: "An American government led by a prime minister supported by a parliamentary majority. The cabinet answers to an elected legislature, where representatives negotiate common affairs."
 gov_ffpa_usa_presidential_directorate: "Presidential Directorate"
 gov_ffpa_usa_presidential_directorate_desc: "An American government in which the president concentrates executive authority. Federal offices continue to function, but effective electoral accountability is absent and political participation depends on the ruler and their supporters."
 gov_ffpa_usa_congressional_directorate: "Congressional Directorate"
 gov_ffpa_usa_congressional_directorate_desc: "An American government controlled by a limited circle through Congress. A chair directs common affairs, while established interests determine access to seats and office."
 gov_ffpa_usa_imperial_government: "Imperial Government"
 gov_ffpa_usa_imperial_government_desc: "A hereditary American government in which the emperor directly exercises supreme authority. The institutions of reconstruction answer to the monarch, whose authority is the final basis of public commands."
 gov_ffpa_usa_imperial_cabinet: "Imperial Cabinet"
 gov_ffpa_usa_imperial_cabinet_desc: "A hereditary American government administered by ministers appointed by the emperor, together with established interests. Appointment and negotiation provide access to public affairs without electoral accountability."
 gov_ffpa_usa_constitutional_cabinet: "Constitutional Cabinet"
 gov_ffpa_usa_constitutional_cabinet_desc: "An American government in which the monarch retains a hereditary throne while elected institutions participate in and constrain government. The cabinet coordinates common affairs between the crown and the representative bodies."
 RULER_TITLE_FFPA_USA_CHAIR: "Chair"
 ffpa_ig_usa_federal_forces: "Federal Armed Forces"
 ffpa_ig_usa_business_consortia: "Business Consortia"
