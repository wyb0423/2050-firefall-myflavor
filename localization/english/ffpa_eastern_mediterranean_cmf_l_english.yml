 ffpa_cmf_crisis_heading: "Crisis counters (latest settlement)"
 ffpa_tur_register_cmf_crisis_counts: "Local capture：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_tur_register_low_months_v1_display')|0]/24\nPaper centralization：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_tur_register_high_months_v1_display')|0]/24"
 ffpa_tur_register_cmf_crisis_rules: "At balance ≤9, local capture gains 1 month; at balance ≥90, paper centralization gains 1 month. Each counter loses 3 months when its condition is absent, down to 0. Either counter reaching 24 months causes failure."
 ffpa_tur_capital_cmf_crisis_counts: "Severe supply crisis：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_tur_capital_crisis_months_v1_display')|0]/6\nCapital famine：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_tur_capital_famine_months_v1_display')|0]/3"
 ffpa_tur_capital_cmf_crisis_rules: "After the monthly reserve update, severe crisis and famine are counted separately only at zero reserve. Positive reserve clears both counters; ending a crisis clears its own counter. Failure occurs at 6 severe-crisis months or 3 famine months."
 ffpa_byz_public_cmf_crisis_counts: "All three pillars broken：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_public_all_broken_months_v1_display')|0]/6\nTwo broken pillars and one in warning：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_public_two_broken_months_v1_display')|0]/12"
 ffpa_byz_public_cmf_crisis_rules: "Failure occurs after 6 consecutive months with all pillars broken, or 12 with two broken and the third in warning. Each counter resets when its exact condition is absent. A pillar under repair still counts as broken; three broken pillars do not continue the two-broken-plus-warning counter."
 ffpa_byz_pressure_cmf_crisis_counts: "Pressure at 100：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_dynatoi_at_max_months_v1_display')|0]/6\nPressure at least 90：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_dynatoi_high_months_v1_display')|0]/18"
 ffpa_byz_pressure_cmf_crisis_rules: "Failure occurs after 6 consecutive months at 100 pressure, or 18 at 90+ while a structural problem remains. Each counter resets below its own threshold. Removing structural problems blocks the latter failure condition but does not clear its counter."
