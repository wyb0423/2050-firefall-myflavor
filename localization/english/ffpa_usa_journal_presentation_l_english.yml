 ffpa_usa_ui_union_counts: "Registered provinces acquired  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_ui_owned')|0] / [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_ui_total')|0]#!"
 ffpa_usa_ui_union_count_tip: "Counts every province registered for this agenda, not states or claims. Updated monthly."
 ffpa_usa_ui_union_cooldown: "#yellow Agenda cooldown.#! One year after success; three after other outcomes."
 ffpa_usa_ui_union_withdraw: "#yellow Withdrawal recorded.#! Cleanup waits for wars and committed diplomatic plays to end."
 ffpa_usa_ui_union_expired: "The ten-year deadline has passed; this agenda can no longer succeed. Cleanup waits for peace."
 ffpa_usa_ui_union_active: "Agenda active. Acquire all registered provinces to settle; settlement pauses during wars and committed diplomatic plays."
 ffpa_usa_ui_union_propose: "An agenda can be proposed; another neighbour can be surveyed if eligible."
 ffpa_usa_ui_union_empty: "No eligible neighbour; target buttons are disabled until circumstances change."
 ffpa_usa_ui_union_rules: "Each agenda records one target for #v 10 years#!. Monthly checks record full acquisition within the deadline; reception may then wait for peace.\nSuccess cooldown: #v 1 year#!; withdrawal, expiry or tracking failure: #v 3 years#!.\n#bold While active#!: incorporation speed #v +25%#!, including cooldowns; removed on completion or loss of eligibility.\n#bold Final completion#!: directly own every province in the 48 mainland states and the District of Columbia, with no unfinished settlement."
 ffpa_usa_ui_union_original_reason: "The ledgers on either side of the checkpoints record familiar goods, yet separate administrations levy taxes, inspect papers and interpret the old maps. Merchants seek a common market, advocates of union seek a common government, and those with established revenues and offices have reservations of their own. The government may place one neighbouring territory on its agenda, but its claim must still be supported by land actually acquired.\n\n[ROOT.GetCountry.GetCustom('ffpa_na_union_status_text_v1')]\n\nEach agenda records every province in one selected territory and lasts ten years. Monthly checks record full acquisition within the deadline, including peaceful transfers. Reception then waits during wars or committed diplomatic plays. Success allows another agenda after one year; withdrawal, expiry or unreliable tracking imposes a three-year cooldown. Receiving states receive the full five-year settlement bonus."
 ffpa_usa_ui_union_story: "The ledgers on either side of the checkpoints record familiar goods, yet separate administrations levy taxes, inspect papers and interpret the old maps. Merchants seek a common market, advocates of union seek a common government, and those with established revenues and offices have reservations of their own. \n\nThe government may place #bold one neighbouring territory#! on its agenda, but its claim must still be supported by land actually acquired.\n\n#bold Settlement outcomes#!\nChoose a common market or common government; receiving states gain the full five-year bonus."
 ffpa_usa_ui_market_outcomes: "#bold Project outcomes#!  Corridors or branch lines · hover for details"
 ffpa_usa_ui_market_outcomes_tt: "$ffpa_usa_market_core_reward_tt$\n\n$ffpa_usa_market_branches_reward_tt$"
 ffpa_usa_ui_industry_outcomes: "#bold Project outcomes#!  Route works and company policy · hover for details"
 ffpa_usa_ui_industry_outcomes_tt: "[JournalEntry.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n\n#bold Choose on completion#!\nWider access: +2 company capacity permanently, +10 percentage points company construction bonus for ten years.\nEstablished firms: +10 percentage points company throughput bonus permanently, +20 percentage points company construction bonus for ten years.\nDoes not automatically establish companies or transfer factories."
