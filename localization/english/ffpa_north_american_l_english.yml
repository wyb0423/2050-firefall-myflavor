 ffpa_usa_charter_laissez_faire_v1: "[GetLawType('law_laissez_faire').GetName]"
 ffpa_usa_charter_agrarianism_v1: "[GetLawType('law_agrarianism').GetName]"
 ffpa_usa_charter_current_economic_system_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]"
 ffpa_usa_charter_structure_detail_v1: "[ROOT.GetCountry.GetCustom('ffpa_usa_charter_structure_reason_v1')]"
 ffpa_usa_flavor.6.t: "Reading the Old Charter Again"
 ffpa_usa_flavor.6.d: "The old constitution records both checks on executive power and periods of deadlock. Delegates must decide whether the executive should stand separately or depend on the legislature.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.6.f: "Missing page numbers were written on the back cover, a reminder that these copies were not yet a complete code."
 ffpa_usa_flavor.7.t: "Citizens and Ballots"
 ffpa_usa_flavor.7.d: "The surviving election records have been sorted. Voting rights and registration rules must now fit the proposed form of government.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.7.f: "Blank ballots had been copied out. The registers still awaited the meeting’s decision."
 ffpa_usa_flavor.8.t: "An Economic Charter for Reconstruction"
 ffpa_usa_flavor.8.d: "Workshops, farming associations and officials propose different ways to finance recovery: public coordination, freer enterprise or agricultural investment.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.8.f: "Loan notes and orders lay beside the draft so delegates could trace who would bear each commitment."
 ffpa_usa_flavor.9.t: "The Charter under Review"
 ffpa_usa_flavor.9.d: "The three chapters have been assembled. Clerks check each proposed law against the current settlement before the final signature.\n\n#bold Review before signing#!\n[GetLawGroup('lawgroup_governance_principles').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_governance_principles_name_v1')]#!\n\n[GetLawGroup('lawgroup_distribution_of_power').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_distribution_of_power_name_v1')]#!\n\n[GetLawGroup('lawgroup_economic_system').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_economic_system_name_v1')]#!\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_charter_review_v1')]"
 ffpa_usa_flavor.9.f: "Before the signature page lay a final comparison, recording exactly what this charter would change."
 ffpa_usa_charter_apply_failed_tt: "The last signature attempt did not apply every selected law. The draft remains open without a new transition charge. Use Draft the Founding Charter to review and retry within the original deadline."
 ffpa_na_union_other_target_tt_v2: "Another eligible neighbour exists, or the sole eligible target has not yet been selected"
 ffpa_usa_union_mainland_owned_tt_v1: "Directly own every province in the 49 mainland regions (48 states and the District of Columbia, excluding Alaska, Hawaii and Puerto Rico; occupation and subject ownership do not count)"
 ffpa_usa_union_goal_v1: "Directly own every mainland province and finish the current agenda and reception settlement. Alaska, Hawaii and Puerto Rico are excluded. The journal then ends permanently."
 ffpa_na_union_goal_repeated_v2: "Acquire all recorded territory and choose a common market or common government settlement."
 ffpa_usa_union_integration_v1: "Commonwealth Integration"
 ffpa_na_union_reopen_button_v2: "Resume the Reception Meeting"
 ffpa_na_union_reopen_button_v2_desc: "Reopen the reception choice while at peace and owning all recorded territory. Meetings can be opened once per month. A new meeting invalidates older replies and never duplicates rewards."
 ffpa_na_flavor.4.defer: "Keep the reception pending; resume the meeting from the journal later."
 ffpa_na_union_status_proposal_v2: "A proposal awaits a reply; the target and peace conditions are checked again on confirmation."
 ffpa_na_union_status_war_v2: "The target remains eligible, but war or a committed diplomatic play prevents a proposal."
 ffpa_na_union_status_select_v2: "An eligible neighbour can be surveyed. Use Survey the Next Neighbour to select a valid target."
 ffpa_usa_conference_next_tt: "Record this institutional choice; the next conference follows after at least #v six months#!."
 ffpa_usa_conference_stability_tt: "After all four choices, maintain legitimacy of at least #v 40#! and nonnegative bureaucracy for #v twelve consecutive months#!. Instability resets continuity; there is no overall deadline."
 ffpa_usa_conference_defer_tt: "Retain settled choices. Resume with the journal button once the conference interval has elapsed; deferral itself has no cost."
 ffpa_usa_charter_draft_tt: "Record this draft chapter; #bold no law changes immediately#!. Continue after one month.\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_sign_hover_tt: "$ffpa_usa_charter_sign_tt$\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_defer_hover_tt: "Retain the draft and continue within the existing window; #yellow the signing deadline is not extended#!.\n\n$ffpa_usa_charter_window_tt$"
 ffpa_na_union_snapshot_owned_tt_v2: "Every province recorded at the start is still directly owned by this country"
 ffpa_na_local_route_rules_tt: "#bold Project requirements#!\nIn the selected state, maintain at least #v 3#! qualifying building levels, each building at #v 60%#! employment or higher, and #v 80%#! market access for #v 12 consecutive months#!. A failed observation resets the count.\nChoosing a direction fixes the target. There is no overall deadline; losing the state cancels the unfinished project."
 ffpa_na_local_food_reward_tt: "$ffpa_na_local_route_rules_tt$\n\nQualifying buildings: grain farms, livestock ranches and food industries.\nOn completion, the project state permanently gains #p +5%#! agriculture and food industry throughput."
 ffpa_na_local_industry_reward_tt: "$ffpa_na_local_route_rules_tt$\n\nQualifying buildings: tools, textiles, furniture, glass, paper and steel.\nOn completion, the project state permanently gains #p +5%#! throughput for these industries."
 ffpa_na_local_transport_reward_tt: "$ffpa_na_local_route_rules_tt$\n\nQualifying buildings: ports, railways and urban centers.\nOn completion, the project state permanently gains #p +10%#! infrastructure throughput."
 ffpa_na_union_dividend_tt: "National: #p +10%#! prestige and #p +5#! legitimacy for #v five years#!. Successful settlement starts a #v one-year#! cooldown before the next agenda."
 ffpa_na_union_market_reward_tt: "$ffpa_na_union_dividend_tt$\n\nActual receiving states: #p +25%#! construction efficiency, #p +20%#! infrastructure throughput and #p +10%#! manufacturing throughput for #v five years#!."
 ffpa_na_union_government_reward_tt: "$ffpa_na_union_dividend_tt$\n\nActual receiving states: #p +25%#! taxation capacity, #p +50%#! incorporation speed and #p −25%#! turmoil effects for #v five years#!."
 ffpa_na_union_failure_tt: "Land actually acquired is retained. Only temporary claims added by this agenda in regions where this country holds no land, with no recorded grant from another source, are cleared; pre-existing claims remain.\nThe next formal agenda has a #v three-year#! cooldown."
 ffpa_usa_flavor.16.t: "After the Agreement"
 ffpa_usa_flavor.16.d: "The four institutional arrangements have withstood a year of administration. Local demands for funding still differ, but public works, property registration, representation and scrutiny now have a common basis.\n\nThe conference can end; the government’s obligations continue. #bold Federal confidence#! must be sustained through the ordinary work of fulfilling them."
 ffpa_usa_flavor.16.f: "“And if someone ignores this next time?” a local delegate asked. The chair handed him the agreed text. “Keep this copy. Bring it with you.”"
 ffpa_usa_flavor.16.a: "Put the agreed arrangements into practice."
 ffpa_usa_flavor.16.tt: "$je_ffpa_usa_federal_settlement_v1$ is complete. Federal confidence governance will continue to test these commitments through $je_ffpa_usa_federal_promise_v1$. Agreed institutions and existing rewards are retained."
