 ffpa_usa_charter_parliamentary_republic_v1: "[GetLawType('law_parliamentary_republic').GetName]"
 ffpa_usa_charter_current_governance_principles_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]"
 ffpa_usa_charter_universal_suffrage_v1: "[GetLawType('law_universal_suffrage').GetName]"
 ffpa_usa_charter_census_voting_v1: "[GetLawType('law_census_voting').GetName]"
 ffpa_usa_charter_wealth_voting_v1: "[GetLawType('law_wealth_voting').GetName]"
 ffpa_usa_charter_current_distribution_of_power_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]"
 ffpa_usa_charter_interventionism_v1: "[GetLawType('law_interventionism').GetName]"
 ffpa_usa_charter_laissez_faire_v1: "[GetLawType('law_laissez_faire').GetName]"
 ffpa_usa_charter_agrarianism_v1: "[GetLawType('law_agrarianism').GetName]"
 ffpa_usa_charter_current_economic_system_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]"
 ffpa_usa_charter_structure_detail_v1: "[ROOT.GetCountry.GetCustom('ffpa_usa_charter_structure_reason_v1')]"
 ffpa_usa_flavor.6.t: "Reading the Old Charter Again"
 ffpa_usa_flavor.6.d: "Surviving archives preserve provisions governing executive and deliberative authority, alongside records of disputes and deadlock. Delegates consider a separately constituted executive, an executive dependent on the assembly, or retention of the present system.\n\nCurrent: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]. This choice only drafts a provision; it does not change the law.\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.6.f: "Missing page numbers were written on the back cover, a reminder that these copies were not yet a complete code."
 ffpa_usa_flavor.7.t: "Citizens and Ballots"
 ffpa_usa_flavor.7.d: "Names, qualifications and voting procedures from old election records have been sorted into separate files. The proposals differ over political participation and verification. The draft must fit the proposed government rather than merely preserve a familiar name.\n\nCurrent: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]. This choice only drafts a provision; it does not change the law.\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.7.f: "Blank ballots had been copied out. The registers still awaited the meeting’s decision."
 ffpa_usa_flavor.8.t: "An Economic Charter for Reconstruction"
 ffpa_usa_flavor.8.d: "Workshop operators, agricultural communities and officials propose different arrangements for investment: coordinated reconstruction, reduced intervention, or capital accumulation rooted in agriculture. The economic charter must function alongside existing land, labor and trade laws.\n\nCurrent: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]. This choice only drafts a provision; it does not change the law.\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.8.f: "Loan notes and orders lay beside the draft so delegates could trace who would bear each commitment."
 ffpa_usa_flavor.9.t: "The Charter’s Signing Day"
 ffpa_usa_flavor.9.d: "The three chapters have been assembled and checked against current law. Signature will bring the chosen provisions into force immediately. Conflicts with other laws must be resolved first, and ordinary enactment already under way cannot be displaced.\n[GetLawGroup('lawgroup_governance_principles').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_governance_principles_name_v1')]\n[GetLawGroup('lawgroup_distribution_of_power').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_distribution_of_power_name_v1')]\n[GetLawGroup('lawgroup_economic_system').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_economic_system_name_v1')]\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_charter_review_v1')]\n\n$ffpa_usa_charter_sign_tt$\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.9.f: "Before the signature page lay a final comparison, recording exactly what this charter would change."
