 ffpa_usa_charter_button_v1: "Prepare the Founding Charter"
 ffpa_usa_charter_button_v1_desc: "Request or resume the one-time charter draft. Within the five-year window, select governance, distribution of power and the economic system, then confirm them together. Drafts do not change laws. Each choice is followed by a one-month interval; meetings may be deferred."
 ffpa_usa_charter_decision_v1: "$ffpa_usa_charter_button_v1$"
 ffpa_usa_charter_decision_v1_desc: "$ffpa_usa_charter_button_v1_desc$"
 ffpa_usa_charter_transition_v1: "Institutional Transition"
 ffpa_usa_charter_defer_v1: "Defer until the preparations are complete."
 ffpa_usa_charter_keep_v1: "Keep the current law in this group."
 ffpa_usa_charter_keep_all_v1: "Retain all current laws and close the charter process."
 ffpa_usa_charter_edit_v1: "Revise the draft."
 ffpa_usa_charter_sign_v1: "Sign the validated charter."
 ffpa_usa_charter_sign_tt: "Directly activate only selected laws that differ from the current laws in these three groups. The eight candidates waive technology requirements without granting technology. Any actual change imposes bureaucracy output -5% once for 24 months; no changes means no activation and no cost."
 ffpa_usa_charter_no_enactment_tt: "The current ordinary enactment must end first; the charter will not cancel or replace it."
 ffpa_usa_charter_crownlands_tt: "Resolve direct crown-land subject relationships before adopting a republic, to avoid their automatic conversion into puppets."
 ffpa_usa_charter_company_tt: "An independent chartered-company government does not meet the native structural requirements for a republic."
 ffpa_usa_charter_structure_ok_v1: "No structural conflict involving the draft has been found."
 ffpa_usa_charter_unchanged_tt: "All three current laws remain unchanged; the process can close without cost."
 ffpa_usa_charter_ready_tt: "$ffpa_usa_charter_structure_ok_v1$"
 ffpa_usa_charter_window_tt: "Ordinarily, signature is required within five years of first availability. If ordinary enactment blocks a complete draft beyond that deadline, the draft is frozen and receives one three-month response period when that enactment ends. This does not reopen applications."
 ffpa_usa_charter_grace_tt: "The application period has ended. Only the existing complete draft can now be settled; the three-month response period after enactment ends cannot be extended."
 ffpa_usa_charter_presidential_republic_v1: "[GetLawType('law_presidential_republic').GetName]"
 ffpa_usa_charter_parliamentary_republic_v1: "[GetLawType('law_parliamentary_republic').GetName]"
 ffpa_usa_charter_current_governance_principles_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]"
