l_english:
 je_ffpa_na_local_recovery_v1: "Between the State Lines"
 je_ffpa_na_local_recovery_v1_reason: "Project state: [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Direction: [ROOT.GetCountry.GetCustom('ffpa_na_local_route_name_v1')].\n\nLivelihoods have returned, but harvest accounts and market stalls do not yet form a dependable trade. Farmers need processing and buyers, workshops need tools, and carriers need regular deliveries. Choose a project state and establish one reliable productive or distribution base.\n\nYou may change the project state before choosing a direction. Maintain at least 3 completed qualifying levels, each at 60% employment or higher, and 80% market access for 12 consecutive months. There is no overall deadline. Losing the state cancels the unfinished project."
 je_ffpa_na_local_recovery_v1_goal: "Maintain qualifying production and market access in the selected state for 12 consecutive months."
 ffpa_na_local_next_state_button_v1: "Inspect the Next Project State"
 ffpa_na_local_next_state_button_v1_desc: "Current project state: [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Before work begins, cycle through eligible mainland states in population order. States with a completed specialization are excluded."
 ffpa_na_local_choose_button_v1: "Agree on a Local Project"
 ffpa_na_local_choose_button_v1_desc: "Choose a direction in [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Available directions require existing facilities or the relevant basic technology."
 ffpa_na_local_months_bar_v1: "Consecutive Qualifying Months"
 ffpa_na_local_months_bar_v1_desc: "Complete after 12 consecutive months; the count resets when conditions are no longer met."
 ffpa_na_flavor.1.t: "The Map in the Town Hall"
 ffpa_na_flavor.1.d: "Delegates lay the project state’s accounts beside a map. Farmers seek outlets for their harvests, artisans ask for reliable supplies, and carriers want deliveries they can count on. Limited labor must first be directed toward a venture that can endure."
 ffpa_na_flavor.1.f: "The folds of the map have worn white. The new routes still reach only the neighboring market towns."
 ffpa_na_flavor.1.1: "Organize farming and processing: 3 combined levels of grain farms, livestock ranches or food industries; permanent +5% agriculture and food industry throughput on completion."
 ffpa_na_flavor.1.2: "Restore basic industry: 3 combined levels of tools, textiles, furniture, glass, paper or steel; permanent +5% throughput for these industries on completion."
 ffpa_na_flavor.1.3: "Organize distribution: 3 combined levels of ports, railways or urban centers; permanent +10% infrastructure throughput on completion."
 ffpa_na_flavor.1.defer: "Continue the survey first."
 ffpa_na_flavor.2.t: "The First Orders"
 ffpa_na_flavor.2.d: "Six months of steady production and deliveries have brought repeat orders to the local project. Public officials want better freight services, while local producers seek support for the next batch of goods. The delegates must decide which to prioritize for the coming year."
 ffpa_na_flavor.2.f: "The lists arriving at the town hall now repeat familiar names, followed by dates for the next delivery."
 ffpa_na_flavor.2.a: "Prioritize public facilities: project state infrastructure throughput +10% for one year."
 ffpa_na_local_food_v1: "Local Farming and Processing"
 ffpa_na_local_industry_v1: "Local Industrial Cooperation"
 ffpa_na_local_transport_v1: "Local Distribution Network"
 ffpa_na_local_target_name_present_v1: "[ROOT.GetCountry.MakeScope.Var('ffpa_na_local_target_v1').GetState.GetName]"
 ffpa_na_local_target_name_missing_v1: "Awaiting a new selection"
 ffpa_na_local_route_food_name_v1: "Farming and processing"
 ffpa_na_local_route_industry_name_v1: "Basic industry"
 ffpa_na_local_route_transport_name_v1: "Distribution"
 ffpa_na_local_route_unselected_name_v1: "Not yet started"
 ffpa_na_flavor.2.b: "Support local producers: project state agriculture and manufacturing throughput +5% for one year."
 ffpa_na_local_public_orders_v1: "Local Public Orders"
 ffpa_na_local_producer_orders_v1: "Local Producer Orders"
