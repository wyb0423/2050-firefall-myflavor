 ffpa_usa_charter_wealth_voting_v1: "[GetLawType('law_wealth_voting').GetName]"
 ffpa_usa_charter_current_distribution_of_power_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]"
 ffpa_usa_charter_interventionism_v1: "[GetLawType('law_interventionism').GetName]"
 ffpa_usa_charter_laissez_faire_v1: "[GetLawType('law_laissez_faire').GetName]"
 ffpa_usa_charter_agrarianism_v1: "[GetLawType('law_agrarianism').GetName]"
 ffpa_usa_charter_current_economic_system_v1: "[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]"
 ffpa_usa_charter_structure_detail_v1: "[ROOT.GetCountry.GetCustom('ffpa_usa_charter_structure_reason_v1')]"
 ffpa_usa_flavor.6.t: "Reading the Old Charter Again"
 ffpa_usa_flavor.6.d: "The old constitution records both checks on executive power and periods of deadlock. Delegates must decide whether the executive should stand separately or depend on the legislature.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.6.f: "Missing page numbers were written on the back cover, a reminder that these copies were not yet a complete code."
 ffpa_usa_flavor.7.t: "Citizens and Ballots"
 ffpa_usa_flavor.7.d: "The surviving election records have been sorted. Voting rights and registration rules must now fit the proposed form of government.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.7.f: "Blank ballots had been copied out. The registers still awaited the meeting’s decision."
 ffpa_usa_flavor.8.t: "An Economic Charter for Reconstruction"
 ffpa_usa_flavor.8.d: "Workshops, farming associations and officials propose different ways to finance recovery: public coordination, freer enterprise or agricultural investment.\n\n#bold Current system#!: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]\nThis choice records a #bold draft#!; laws change only at signing."
 ffpa_usa_flavor.8.f: "Loan notes and orders lay beside the draft so delegates could trace who would bear each commitment."
 ffpa_usa_flavor.9.t: "The Charter’s Signing Day"
 ffpa_usa_flavor.9.d: "The three chapters have been assembled. Clerks check each proposed law against the current settlement before the final signature.\n\n#bold Review before signing#!\n[GetLawGroup('lawgroup_governance_principles').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_governance_principles_name_v1')]#!\n\n[GetLawGroup('lawgroup_distribution_of_power').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_distribution_of_power_name_v1')]#!\n\n[GetLawGroup('lawgroup_economic_system').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_economic_system_name_v1')]#!\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_charter_review_v1')]"
 ffpa_usa_flavor.9.f: "Before the signature page lay a final comparison, recording exactly what this charter would change."
 ffpa_usa_charter_apply_failed_tt: "The last signature attempt did not apply every selected law. The draft remains open without a new transition charge. Use Draft the Founding Charter to review and retry within the original deadline."
 ffpa_usa_conference_next_tt: "Record this institutional choice; the next conference follows after at least #v six months#!."
 ffpa_usa_conference_stability_tt: "After all four choices, maintain legitimacy of at least #v 40#! and nonnegative bureaucracy for #v twelve consecutive months#!. Instability resets continuity; there is no overall deadline."
 ffpa_usa_conference_defer_tt: "Retain settled choices. Resume with the journal button once the conference interval has elapsed; deferral itself has no cost."
 ffpa_usa_charter_draft_tt: "Record this draft chapter; #bold no law changes immediately#!. Continue after one month.\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_sign_hover_tt: "$ffpa_usa_charter_sign_tt$\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_defer_hover_tt: "Retain the draft and continue within the existing window; #yellow the signing deadline is not extended#!.\n\n$ffpa_usa_charter_window_tt$"
