l_english:
 je_ffpa_na_local_recovery_v1: "Between the State Lines"
 je_ffpa_na_local_recovery_v1_reason: "Project state: [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Direction: [ROOT.GetCountry.GetCustom('ffpa_na_local_route_name_v1')].\n\nLivelihoods have returned, but harvest accounts and market stalls do not yet form a dependable trade. Farmers need processing and buyers, workshops need tools, and carriers need regular deliveries. Choose a project state and establish one reliable productive or distribution base.\n\nYou may change the project state before choosing a direction. Maintain at least 3 completed qualifying levels, each at 60% employment or higher, and 80% market access for 12 consecutive months. There is no overall deadline. Losing the state cancels the unfinished project."
 je_ffpa_na_local_recovery_v1_goal: "Maintain qualifying production and market access in the selected state for 12 consecutive months."
 ffpa_na_local_next_state_button_v1: "Inspect the Next Project State"
 ffpa_na_local_next_state_button_v1_desc: "Current project state: [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Before work begins, cycle through eligible mainland states in population order. States with a completed specialization are excluded."
 ffpa_na_local_choose_button_v1: "Agree on a Local Project"
 ffpa_na_local_choose_button_v1_desc: "Choose a direction in [ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]. Available directions require existing facilities or the relevant basic technology."
 ffpa_na_local_months_bar_v1: "Consecutive Qualifying Months"
 ffpa_na_local_months_bar_v1_desc: "Complete after 12 consecutive months; the count resets when conditions are no longer met."
 ffpa_na_flavor.1.t: "The Map in the Town Hall"
 ffpa_na_flavor.1.d: "Delegates lay the project state’s accounts beside a map. Farmers seek outlets for their harvests, artisans ask for reliable supplies, and carriers want deliveries they can count on. Limited labor must first be directed toward a venture that can endure."
 ffpa_na_flavor.1.f: "The folds of the map have worn white. The new routes still reach only the neighboring market towns."
 ffpa_na_flavor.1.1: "Organize farming and processing: 3 combined levels of grain farms, livestock ranches or food industries; permanent +5% agriculture and food industry throughput on completion."
 ffpa_na_flavor.1.2: "Restore basic industry: 3 combined levels of tools, textiles, furniture, glass, paper or steel; permanent +5% throughput for these industries on completion."
 ffpa_na_flavor.1.3: "Organize distribution: 3 combined levels of ports, railways or urban centers; permanent +10% infrastructure throughput on completion."
 ffpa_na_flavor.1.defer: "Continue the survey first."
 ffpa_na_flavor.2.t: "The First Orders"
 ffpa_na_flavor.2.d: "Six months of steady production and deliveries have brought repeat orders to the local project. Public officials want better freight services, while local producers seek support for the next batch of goods. The delegates must decide which to prioritize for the coming year."
 ffpa_na_flavor.2.f: "The lists arriving at the town hall now repeat familiar names, followed by dates for the next delivery."
 ffpa_na_flavor.2.a: "Prioritize public facilities: project state infrastructure throughput +10% for one year."
 ffpa_na_local_food_v1: "Local Farming and Processing"
 ffpa_na_local_industry_v1: "Local Industrial Cooperation"
 ffpa_na_local_transport_v1: "Local Distribution Network"
 ffpa_na_local_target_name_present_v1: "[ROOT.GetCountry.MakeScope.Var('ffpa_na_local_target_v1').GetState.GetName]"
 ffpa_na_local_target_name_missing_v1: "Awaiting a new selection"
 ffpa_na_local_route_food_name_v1: "Farming and processing"
 ffpa_na_local_route_industry_name_v1: "Basic industry"
 ffpa_na_local_route_transport_name_v1: "Distribution"
 ffpa_na_local_route_unselected_name_v1: "Not yet started"
 ffpa_na_flavor.2.b: "Support local producers: project state agriculture and manufacturing throughput +5% for one year."
 ffpa_na_local_public_orders_v1: "Local Public Orders"
 ffpa_na_local_producer_orders_v1: "Local Producer Orders"
 je_ffpa_na_union_agenda_v1: "A Larger Commonwealth"
 je_ffpa_na_union_agenda_v1_reason: "The ledgers on either side of the checkpoints record familiar goods, yet separate administrations levy taxes, inspect papers and interpret the old maps. Merchants seek a common market, advocates of union seek a common government, and those with established revenues and offices have reservations of their own. The government may place one neighbouring territory on its agenda, but its claim must still be supported by land actually acquired.\n\n[ROOT.GetCountry.GetCustom('ffpa_na_union_status_text_v1')]\n\nEach agenda records every province in one selected territory and lasts ten years. Acquiring them all permits settlement, including through peaceful transfers. Settlement waits during wars or committed diplomatic plays. Success allows another agenda after one year; withdrawal, expiry or unreliable tracking imposes a three-year cooldown. Receiving states receive the full five-year settlement bonus."
 je_ffpa_na_union_agenda_v1_goal: "Acquire all recorded territory and choose a common market or common government settlement."
 ffpa_na_union_next_button_v1: "Survey Another Neighbour"
 ffpa_na_union_next_button_v1_desc: "Prioritize territories in regions already partly held, then cycle through adjacent mainland states. Only territories of centralized governments qualify. Surveying grants no claim."
 ffpa_na_union_propose_button_v1: "Propose an Agenda of Union"
 ffpa_na_union_propose_button_v1_desc: "Convene a meeting to confirm the selected territory. Acceptance records all its provinces, starts a ten-year deadline and adds a temporary regional claim if none already exists."
 ffpa_na_union_withdraw_button_v1: "Withdraw the Agenda"
 ffpa_na_union_withdraw_button_v1_desc: "End this round with a three-year cooldown while retaining acquired territory. During a war or committed diplomatic play, withdrawal is recorded and settled after peace."
 ffpa_na_union_status_candidate_v1: "Under consideration: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_target_v1').GetState.GetName]. Propose an agenda or survey another neighbour."
 ffpa_na_union_status_empty_v1: "No territory is selected. Survey neighbouring territories again, or continue local development if none qualify. Decentralized lands remain subject to ordinary colonization rules."
 ffpa_na_union_status_active_v1: "Target region: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName].\nAgenda active. Recorded provinces acquired: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_owned_v1').GetValue|0]/[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_total_v1').GetValue|0]. Progress is checked monthly."
 ffpa_na_union_status_expired_v1: "Target region: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName].\nThe deadline has passed. Settlement awaits the end of wars and committed diplomatic plays; no new target may be started."
 ffpa_na_union_status_withdraw_v1: "Target region: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName].\nWithdrawal is recorded. This agenda will be closed after peace."
 ffpa_na_union_status_settlement_v1: "Target region: [ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName].\nThe recorded territory has been acquired. Choose a settlement; ownership will be checked again on confirmation."
 ffpa_na_union_status_cooldown_v1: "The agenda is in cooldown: one year after success, three years after other closures."
 ffpa_na_flavor.3.t: "Checkpoints on the Boundary"
 ffpa_na_flavor.3.d: "Delegates arrive with freight lists and old maps, asking that the selected neighbouring territory be brought under common arrangements. Merchants begin with the checkpoints; officials ask about tax registers, policing and appointments. An agenda of union would state the government’s claim. It would not mean that the two sides had already reached an agreement."
 ffpa_na_flavor.3.f: "A boundary takes one stroke on paper. Every checkpoint along it keeps a separate ledger."
 ffpa_na_flavor.3.a: "Place the selected territory on a ten-year agenda of union."
 ffpa_na_flavor.3.b: "Postpone the proposal and continue local development."
 ffpa_na_flavor.4.t: "Ledgers of the New Boundary"
 ffpa_na_flavor.4.d: "All territory recorded in the agenda is now held by this country. Completing the settlement grants the country +10% prestige and +5 legitimacy for five years. Its tax registers and procurement lists use different forms, and the officials overseeing reception have yet to agree on priorities. The government can begin with a common market or a common administration. Existing residents of the receiving states and their newly incorporated neighbours will both be affected."
 ffpa_na_flavor.4.f: "The maps now share a volume. The ledgers must still be joined, page by page."
 ffpa_na_flavor.4.1: "Connect the common market: receiving states gain +25% construction efficiency, +20% infrastructure throughput and +10% manufacturing throughput for five years."
 ffpa_na_flavor.4.2: "Establish a common government: receiving states gain +25% taxation capacity, +50% incorporation speed and −25% turmoil effects for five years."
 ffpa_na_flavor.5.t: "An Invitation Unfulfilled"
 ffpa_na_flavor.5.d: "This agenda of union has ended. The government will no longer proceed with its original settlement arrangements. Land actually acquired remains in the country, and prior claims or identifiable claims from other sources will not be revoked by this closure. Delegates must wait three years before proposing another formal agenda."
 ffpa_na_flavor.5.f: "The final page records unfinished business, rather than achievements that never occurred."
 ffpa_na_flavor.5.a: "Record what remains and close this agenda."
 ffpa_na_union_dividend_v1: "Dividend of a Common Boundary"
 ffpa_na_union_market_v1: "Common Market Settlement"
 ffpa_na_union_government_v1: "Common Government Settlement"
 ai_strategy_ffpa_na_union_v1: "Neighbouring Union Agenda"
 ai_strategy_ffpa_na_union_v1_desc: "Prioritize the neighbouring territory recorded in the current agenda."

 je_ffpa_usa_federal_settlement_v1: "Binding the Union Again"
 je_ffpa_usa_federal_settlement_v1_reason: "The name of the United States appears on official papers again, but local works accounts still follow different rules. Communities want a say in execution, holders of surviving deeds seek dependable titles, and post-Fire newcomers fear that registration will overlook their labor. The government must settle funding, property, representation and scrutiny before joint construction can rest on durable arrangements.\n\n#bold Current agenda#!: [ROOT.GetCountry.GetCustom('ffpa_usa_political_status_v1')]\nMeetings are at least #bold six months#! apart; use the journal button to resume after a deferral. After all four choices, maintain legitimacy of at least #bold 40#! and nonnegative bureaucracy for #bold twelve consecutive months#!. An unhealthy month resets this period; there is no overall deadline.\n\n#bold Agreed arrangements#!\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_works_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_titles_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_representation_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_oversight_name_v1')]"
 ffpa_usa_political_months_bar_v1: "Institutional Stability"
 ffpa_usa_political_months_bar_v1_cmf_value: "$ffpa_usa_political_months_bar_v1$  [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12"
 ffpa_usa_political_months_bar_v1_cmf_tooltip: "After all four choices, each month with at least 40 legitimacy and nonnegative bureaucracy counts. Missing either condition resets progress. Current: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12."
 ffpa_usa_political_convene_button_v1: "Convene the Next Meeting"
 ffpa_usa_political_convene_button_v1_desc: "Resume the next unresolved issue. Available at least six months after the preceding decision, with no meeting awaiting a response. Convening has no cost."
 ffpa_usa_political_defer_v1: "Let the delegates consult at home first."
 ffpa_usa_political_status_wait_v1: "A meeting awaits a response."
 ffpa_usa_political_status_cooldown_v1: "The preceding decision is taking effect; the next meeting follows the six-month interval."
 ffpa_usa_political_status_deferred_v1: "The meeting was deferred; use the button below to resume."
 ffpa_usa_political_status_stable_v1: "All four arrangements are settled; sustained administrative conditions are now being assessed."
 ffpa_usa_political_status_ready_v1: "The next issue is ready for discussion."
 ffpa_usa_flavor.1.t: "Using the Name Again"
 ffpa_usa_flavor.1.d: "Archivists have laid copies of old constitutions beside local charters. Officials are willing to use the name of the United States, but disagree over what authority it conveys. Works appropriations, property registration and representation will have to be settled in turn."
 ffpa_usa_flavor.1.f: "The eagle on the cover had faded. Along the margins remained the corrections of several generations of copyists."
 ffpa_usa_flavor.1.a: "Begin with the works we must undertake together."
 ffpa_usa_flavor.2.t: "The Union’s Works Budget"
 ffpa_usa_flavor.2.d: "Local lists include warehouses, workshops and transport facilities. Officials propose common specifications and funding; delegates want execution entrusted to people who know local routes and labor. The same budget would require different administrative arrangements."
 ffpa_usa_flavor.2.f: "The surveyor spread two maps drawn to different scales. Their roads failed to meet at the boundary."
 ffpa_usa_flavor.2.1: "Organize the works through national agencies."
 ffpa_usa_flavor.2.2: "Entrust funding and execution to local arrangements."
 ffpa_usa_flavor.3.t: "Two Sets of Deeds"
 ffpa_usa_flavor.3.d: "An old deed and a post-Fire works ledger refer to the same property. Claimants argue that verified titles are essential to lasting credit; current users ask that rebuilding and maintenance establish rights of their own. Registrars need a general order of precedence."
 ffpa_usa_flavor.3.f: "One document bore water stains, the other coal dust. Both sides had witnesses."
 ffpa_usa_flavor.3.1: "Give verified older titles precedence."
 ffpa_usa_flavor.3.2: "Register possession and rebuilding since the Fire."
 ffpa_usa_flavor.4.t: "Who May Take a Seat"
 ffpa_usa_flavor.4.d: "Local communities have submitted sealed lists of delegates, while newcomers’ applications lie across several offices. The former cite their record of organizing works; the latter seek individual registration and appeals in project affairs. The meeting needs an arrangement that can be administered and whose exclusions can be explained."
 ffpa_usa_flavor.4.f: "The clerk left a column blank for the grounds on which each delegate would be admitted."
 ffpa_usa_flavor.4.1: "Build on delegates from registered communities."
 ffpa_usa_flavor.4.2: "Establish individual registration and appeals."
 ffpa_usa_flavor.5.t: "Appropriations and Authority"
 ffpa_usa_flavor.5.d: "The contracts are ready for signature, but agreement is still needed on who reviews disputed appropriations. Standing scrutiny would preserve a record for each authorization; administrators want limited discretion for urgent works. Both arrangements require a clear assignment of responsibility."
 ffpa_usa_flavor.5.f: "The last page listed no quantities of work, only places for signatures and the order of review."
 ffpa_usa_flavor.5.1: "Require standing scrutiny of each appropriation."
 ffpa_usa_flavor.5.2: "Reserve authority for time-limited emergency appropriations."
