 ffpa_tur_flavor.60.t: "The Frontier Council Convenes"
 ffpa_tur_flavor.60.d: "The founding settlement has stabilized the state, but it has also defined which historical frontiers the government may responsibly pursue. Ministers, officers, and provincial delegates present a limited list. Each mandate creates claims and a deadline; none guarantees that diplomacy or war will succeed."
 ffpa_tur_flavor.60.f: "A frontier drawn in an archive becomes real only when a government accepts the cost of defending it."
 ffpa_tur_flavor.61.t: "National Pact in the West Secured"
 ffpa_tur_flavor.61.d: "Turkey now directly controls Western Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.61.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_western_pact_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Western Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.61.f: "The pact is no longer a line in an archive; it is now customs schedules, railway patrols, and responsibility for the people within that frontier."
 ffpa_tur_flavor.61.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.69.t: "National Pact in the West Expires"
 ffpa_tur_flavor.69.d: "The mandate expired before Turkey secured all of Western Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.69.f: "An expired mandate leaves lessons, borders, and arguments—but no blank cheque."
 ffpa_tur_flavor.69.a: "Close the file for now."
 ffpa_tur_flavor.77.t: "National Pact in the West Withdrawn"
 ffpa_tur_flavor.77.d: "The government has voluntarily ended the mandate for Western Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.77.f: "Retreat can be a policy when it is written before it becomes a rout."
 ffpa_tur_flavor.77.a: "The mandate is withdrawn."
