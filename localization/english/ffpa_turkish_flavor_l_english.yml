l_english:
 je_group_ffpa_turkish_reconstruction: "Turkish Reconstruction"

 ffpa_tur_confirm_reconstruction_legacy: "Confirm the Legacy of Reconstruction"
 ffpa_tur_confirm_reconstruction_legacy_desc: "Earlier records establish that Anatolia was rebuilt, but not which state project guided the new country. Open the surviving foundation files and record that legacy without guessing from the present government."

 je_ffpa_tur_charter_of_the_porte: "Charter of the Porte"
 je_ffpa_tur_charter_of_the_porte_reason: "The Ottoman Commonwealth has made a shared political identity possible, but has yet to settle #bold where sovereignty resides#!. The palace wants ministerial orders enforced across the provinces; provincial delegates demand a part in government. Pious endowments that sustained schools and clinics will not surrender their responsibilities on command. The Charter of the Porte must define the relations between these interdependent powers.\n\nComplete the three constitutional debates, retain the Monarchy, maintain at least #v 50#! [concept_legitimacy] and a non-negative Bureaucracy balance, remain at peace without an insurrectionary movement, and keep #v 6#! reconstruction core states at least #v 75%#! Market Access and below #v 18%#! Turmoil."
 je_ffpa_tur_second_foundation_of_ankara: "The Second Foundation of Ankara"
 je_ffpa_tur_second_foundation_of_ankara_reason: "Ankara’s republican tradition gives reconstruction a name, but cannot answer the new state’s everyday political questions. Supporters of the Assembly seek limits on emergency powers, teachers dispute whether scarce instructors belong in villages or cities, and officers want a continuing voice in the country’s direction. The republic must give these disputes #bold lasting institutional forms#! instead of answering each with another emergency decree.\n\nComplete the debates over the Assembly, national education, and civil-military relations; retain a non-monarchical government with a voting franchise, at least #v 50#! [concept_legitimacy], non-negative Bureaucracy, #v 25%#! Literacy, peace, and stable market access in #v 6#! reconstruction core states."
 je_ffpa_tur_reconstruction_directorate: "The Anatolian Reconstruction Directorate"
 je_ffpa_tur_reconstruction_directorate_reason: "Survey teams need a national cadastre, but local institutions hold land records absent from the central archives. Industrial reconstruction and technical services face a similar difficulty: a common plan can direct staff and supplies, while those who carry it out are scattered across the provinces. The Directorate must define #bold the responsibilities of central offices, local institutions, and firms#!. Emergency powers can start projects, but cannot settle how they will be governed.\n\nComplete the cadastral, industrial, and technical-service debates; maintain at least #v 50#! [concept_legitimacy], #v 0#! available Bureaucracy and #v 25%#! Literacy, and connect #v 4#! reconstruction core states with level #v 2#! Railways and Government Administrations."
 je_ffpa_tur_black_sea_lifeline: "The Black Sea Lifeline"
 je_ffpa_tur_black_sea_lifeline_reason: "The ports of Kastamonu and Trabzon face the Black Sea, but reconstruction inland depends on cargo moving onward into Anatolia. Harbor staff need ships unloaded, railway offices need wagons turned around, and inland producers need both services to connect. Ports, power, and rail must work together to make these coastal hubs a dependable #bold northern supply line#!.\n\nBoth states require reliable Market Access and stability;\nKastamonu needs a level #v 2#! Port and Power Plant and level #v 3#! Railway;\nTrabzon needs a level #v 4#! Port, level #v 3#! Railway, and level #v 2#! Power Plant."
 je_ffpa_tur_eastern_highlands_survey: "Survey of the Eastern Highlands"
 je_ffpa_tur_eastern_highlands_survey_reason: "The roads, settlements, and land arrangements of Erzurum and Kars cannot be recovered from the center’s old maps alone. Surveyors need local knowledge, while local institutions need #bold transport and administration that function throughout the year#! so that registration, deliveries, and public services can connect. Railways, power lines, and administrative offices must advance as parts of the same undertaking.\n\nStabilize both states with low Devastation, and construct the rail, power, and administrative network needed to govern the highlands year-round."
 je_ffpa_tur_cukurova_euphrates_works: "The Çukurova–Euphrates Works"
 je_ffpa_tur_cukurova_euphrates_works_reason: "The farms, processing plants, and cities of Adana and Diyarbakır need a connected #bold food, power, and transport system#!. Greater output matters only when goods can reach their destinations and factories can keep operating. Local administration must also keep pace with population movements and the demands of new production networks. The works must make the agricultural hinterland and urban facilities function together."
 je_ffpa_tur_new_straits_convention: "A New Straits Convention"
 je_ffpa_tur_new_straits_convention_reason: "The Gate of Two Continents has expanded the role of the Straits’ ports, but harbor authorities and the navy differ over their future. The former want facilities for cargo and travelers; the latter seek greater defensive capacity. A new convention must set #bold priorities for commercial services and security works#! and give the port network a clear administrative direction.\n\nAt peace and with at least #v 60#! Legitimacy, develop Eastern Thrace to #v 95%#! Market Access, low Turmoil and Devastation, level #v 8#! Ports and Railways, level #v 6#! Government Administration, level #v 3#! Naval Administration, and level #v 2#! Naval Fortifications. Turkey can then adopt a lasting policy for facilities serving #bold trade and security#! in the Straits."

 ffpa_tur_porte_charter_deliberations_v1: "Deliberations of the Porte"
 ffpa_tur_porte_charter_deliberations_v1_desc: "The palace, ministries, provincial delegates, and communal institutions are negotiating a durable Ottoman constitution."
 ffpa_tur_republic_foundation_convention_v1: "Ankara Foundation Convention"
 ffpa_tur_republic_foundation_convention_v1_desc: "Deputies and civic associations are turning an emergency republic into a settled constitutional order."
 ffpa_tur_directorate_reconstruction_mobilization_v1: "Directorate Reconstruction Mobilization"
 ffpa_tur_directorate_reconstruction_mobilization_v1_desc: "Scarce administrators and materials are committed to the surveys and networks of the Reconstruction Directorate."
 ffpa_tur_porte_central_charter_v1: "Central Charter of the Porte"
 ffpa_tur_porte_central_charter_v1_desc: "Uniform ministries and cadastral rules bind the empire directly to the Porte, at the cost of provincial consent."
 ffpa_tur_porte_vilayet_commonwealth_v1: "Commonwealth of Vilayets"
 ffpa_tur_porte_vilayet_commonwealth_v1_desc: "The center governs through chartered provincial councils and negotiated communal institutions."
 ffpa_tur_porte_palace_bureaucracy_v1: "Palace-Bureaucratic Order"
 ffpa_tur_porte_palace_bureaucracy_v1_desc: "The dynasty and professional ministries share sovereignty while elected institutions remain subordinate."
 ffpa_tur_republic_assembly_settlement_v1: "Sovereignty of the Assembly"
 ffpa_tur_republic_assembly_settlement_v1_desc: "The national legislature is recognized as the source of civilian authority and republican legitimacy."
 ffpa_tur_republic_developmental_settlement_v1: "Developmental Republic"
 ffpa_tur_republic_developmental_settlement_v1_desc: "Industry, technical education, and coordinated administration are treated as the republic's social contract."
 ffpa_tur_republic_guardian_settlement_v1: "Guardian Republic"
 ffpa_tur_republic_guardian_settlement_v1_desc: "The armed forces receive a constitutional duty to guard the state, strengthening order while narrowing civilian politics."
 ffpa_tur_directorate_etatist_settlement_v1: "Etatist Reconstruction Directorate"
 ffpa_tur_directorate_etatist_settlement_v1_desc: "State combines and technical ministries direct the reconstruction economy through national plans."
 ffpa_tur_directorate_mixed_planning_settlement_v1: "Mixed Planning Councils"
 ffpa_tur_directorate_mixed_planning_settlement_v1_desc: "Public planners, industrial firms, and municipal representatives negotiate investment through common councils."
 ffpa_tur_directorate_local_compacts_settlement_v1: "Local Development Compacts"
 ffpa_tur_directorate_local_compacts_settlement_v1_desc: "Provincial boards accept national targets in exchange for control over land, water, and implementation."
 ffpa_tur_black_sea_lifeline_state_v1: "Black Sea Lifeline"
 ffpa_tur_black_sea_lifeline_state_v1_desc: "Rebuilt ports, power stations, and rail depots keep the northern coast connected in war and winter."
 ffpa_tur_eastern_highlands_survey_state_v1: "Eastern Highlands Survey"
 ffpa_tur_eastern_highlands_survey_state_v1_desc: "Permanent survey offices and all-season infrastructure extend administration across the eastern plateau."
 ffpa_tur_cukurova_euphrates_works_state_v1: "Çukurova–Euphrates Works"
 ffpa_tur_cukurova_euphrates_works_state_v1_desc: "Power, food processing, transport, and irrigation are coordinated across the southern riverlands."
 ffpa_tur_anatolian_state_combines_v1: "Anatolian State Combines"
 ffpa_tur_anatolian_state_combines_v1_desc: "National industrial combines concentrate machinery, engineers, and construction contracts."
 ffpa_tur_anatolian_village_institutes_v1: "Anatolian Village Institutes"
 ffpa_tur_anatolian_village_institutes_v1_desc: "Applied rural schools train teachers, technicians, medics, and cooperative organizers close to the villages they serve."
 ffpa_tur_anatolian_development_banks_v1: "Anatolian Development Banks"
 ffpa_tur_anatolian_development_banks_v1_desc: "Regional banks channel public guarantees and private savings into transport and commerce."
 ffpa_tur_straits_open_passage_state_v1: "Open Passage of the Straits"
 ffpa_tur_straits_open_passage_state_v1_desc: "Commercial passage and migration receive priority, making the Bosporus an open exchange between seas."
 ffpa_tur_straits_balanced_stewardship_state_v1: "Stewardship of the Straits"
 ffpa_tur_straits_balanced_stewardship_state_v1_desc: "Merchant passage is protected while Turkish authorities retain inspection, security, and fortification rights."
 ffpa_tur_straits_fortified_narrows_state_v1: "Fortified Narrows"
 ffpa_tur_straits_fortified_narrows_state_v1_desc: "Layered coastal works make the Bosporus defensible, but military restrictions burden commerce."
 ffpa_tur_settlement_direct_administration_v1: "Direct Provincial Administration"
 ffpa_tur_settlement_direct_administration_v1_desc: "Uniform registers and centrally appointed officials raise administrative reach while displacing local bargains."
 ffpa_tur_settlement_representative_compact_v1: "Representative Provincial Compact"
 ffpa_tur_settlement_representative_compact_v1_desc: "Provincial representatives and communal institutions exchange cooperation for a formal voice in government."
 ffpa_tur_settlement_development_authority_v1: "Regional Development Authority"
 ffpa_tur_settlement_development_authority_v1_desc: "Engineers and investment boards organize the region around transport, construction, and productive corridors."

 ffpa_ig_tur_republican_general_staff: "Republican General Staff"
 ffpa_ig_tur_ankara_civic_society: "Ankara Civic Society"
 ffpa_ig_tur_national_reconstruction_combines: "National Reconstruction Combines"
 ffpa_ig_tur_national_technical_service_corps: "National Technical Service Corps"
 ig_trait_ffpa_tur_guardianship_intervention: "Guardianship Intervention"
 ig_trait_ffpa_tur_guardianship_intervention_desc: "When officers regard elected government as unfit to defend the settlement, constitutional guardianship becomes a standing veto over ordinary legislation."
 ig_trait_ffpa_tur_civilian_command: "Civilian Chain of Command"
 ig_trait_ffpa_tur_civilian_command_desc: "A settled civilian chain of command turns military professionalism toward disciplined mobilization and defense rather than political arbitration."
 ig_trait_ffpa_tur_republican_public_instruction: "Republican Public Instruction"
 ig_trait_ffpa_tur_republican_public_instruction_desc: "Civic schools and institutes treat education as the practical foundation of citizenship, widening access to the professions."
 ig_trait_ffpa_tur_contractual_obstruction: "Contractual Obstruction"
 ig_trait_ffpa_tur_contractual_obstruction_desc: "When reconstruction combines withhold cooperation, procurement disputes consume ministry capacity and private capital waits for better terms."
 ig_trait_ffpa_tur_reconstruction_contracts: "Coordinated Reconstruction Contracts"
 ig_trait_ffpa_tur_reconstruction_contracts_desc: "Stable public contracts let builders, manufacturers, and transport firms coordinate construction across the national network."
 ig_trait_ffpa_tur_national_technical_service: "National Technical Service"
 ig_trait_ffpa_tur_national_technical_service_desc: "A national technical service moves trained engineers, teachers, and administrators where reconstruction needs them, linking professional formation to applied research."

 ffpa_tur_flavor.1.t: "The Missing Foundation Files"
 ffpa_tur_flavor.1.d: "The archives agree that a Turkish state emerged from the reconstruction of Anatolia, but a generation of missing decrees has left its founding project uncertain. Surviving constitutions, tax rolls, and ministry seals can support three different accounts. The present government must record which legacy actually shaped the state."
 ffpa_tur_flavor.1.f: "A state without a remembered founding can obey laws, but it cannot explain why those laws command obedience."
 ffpa_tur_flavor.1.a: "The Porte and the Commonwealth were our foundation."
 ffpa_tur_flavor.1.b: "The republic of Ankara was our foundation."
 ffpa_tur_flavor.1.c: "The Reconstruction Directorate was our foundation."

 ffpa_tur_flavor.10.t: "A Fundamental Law from the Ashes"
 ffpa_tur_flavor.10.d: "The first constitutional commission meets among salvaged law books whose pages describe institutions that no longer exist. Reformers argue that a common Ottoman citizenship requires #bold an elected chamber#!. Palace jurists answer that consultation can be restored without allowing parties to fracture the state."
 ffpa_tur_flavor.10.f: "The commission kept the old code’s page numbers. The page defining the chamber’s powers was nearly illegible beneath amendments in two different hands."
 ffpa_tur_flavor.10.a: "The chamber must derive authority from the citizens."
 ffpa_tur_flavor.10.b: "Restore consultation beneath the sovereignty of the Crown."
 ffpa_tur_flavor.11.t: "The Provincial Councils Return"
 ffpa_tur_flavor.11.d: "The central ministries issue decrees faster than they can train governors. Provincial delegations offer records, tax collectors, and local support, but ask what place they will hold in the new settlement: appointed officials, chartered councils, or the intermediaries already established in each district?"
 ffpa_tur_flavor.11.f: "A delegate turned the commission over. “You may decide whom to appoint. But without someone who knows the villages, whom will your governor ask for directions when he arrives?”"
 ffpa_tur_flavor.11.a: "Appointed governors will carry one law across the empire."
 ffpa_tur_flavor.11.b: "Charter representative councils in every vilayet."
 ffpa_tur_flavor.11.c: "Recognize the notables who can make decrees real."
 ffpa_tur_flavor.12.t: "The Ledgers of the Waqfs"
 ffpa_tur_flavor.12.d: "Mosques, churches, lodges, and family foundations kept kitchens, wells, clinics, and schools alive when ministries disappeared. Their surviving trustees now control property and local loyalty on a scale the treasury cannot ignore."
 ffpa_tur_flavor.12.f: "The trustees brought their ledgers, along with bills from schools and clinics. The treasury’s examiner worked through them with one recurring question: the services could continue, but who would sign the accounts?"
 ffpa_tur_flavor.12.a: "Protect autonomous endowments under public audit."
 ffpa_tur_flavor.12.b: "Transfer their services and property to the municipalities."
 ffpa_tur_flavor.12.c: "Create mixed public-endowment charters."
 ffpa_tur_flavor.13.t: "The Charter of the Porte"
 ffpa_tur_flavor.13.d: "The articles have been debated, translated, amended, and carried to the provinces. The restored Ottoman state must now choose the constitutional settlement that future ministers, governors, and communities will be expected to honor.\n\nOnce the charter is settled, central registers will still need to be reconciled with provincial records. Deciding who may give an order settles only part of the founding question; making it work locally will be the daily business of government."
 ffpa_tur_flavor.13.f: "No charter abolishes conflict; a durable charter decides where conflict may be conducted."
 ffpa_tur_flavor.13.a: "A central Tanzimat state will finish the work."
 ffpa_tur_flavor.13.b: "Found a negotiated commonwealth of vilayets."
 ffpa_tur_flavor.13.c: "Entrust the order to the palace and its ministries."

 ffpa_tur_flavor.20.t: "An Assembly in the Stone Houses"
 ffpa_tur_flavor.20.d: "The founding delegates have returned to records of Ankara’s early National Assembly, looking for ways to turn emergency authority into ordinary institutions. Assembly advocates want the representative chamber to direct government; others seek a stronger executive mandate for an elected president. The republic must decide how these forms of authority should be arranged."
 ffpa_tur_flavor.20.f: "The emergency-powers clause was brief. When the clerk reached its end, someone asked from the floor: “And when the emergency is over, who gets to strike it out?”"
 ffpa_tur_flavor.20.a: "Sovereignty belongs to the Assembly."
 ffpa_tur_flavor.20.b: "A directly mandated president must be able to act."
 ffpa_tur_flavor.21.t: "The Village Institutes Reconsidered"
 ffpa_tur_flavor.21.d: "Teachers have recovered the old Village Institute program: boarding schools where rural students learned agriculture, medicine, construction, and teaching by doing the work themselves. They propose adapting it to the new republic; industrial planners counter that scarce instructors should be concentrated in urban technical academies."
 ffpa_tur_flavor.21.f: "A school can reproduce the country that exists, or train people to build one that does not yet exist."
 ffpa_tur_flavor.21.a: "Revive applied schools in the villages."
 ffpa_tur_flavor.21.b: "Concentrate expertise in urban technical academies."
 ffpa_tur_flavor.22.t: "The General Staff Enters the Assembly"
 ffpa_tur_flavor.22.d: "Officers involved in reconstruction and civilian delegates are still disputing the army’s place in the proposed elected order. Civilians demand a clear #bold chain of command#!. Senior commanders seek a constitutional guardianship, arguing that a future government might itself undermine the republic. The meeting must choose between civilian supremacy and a separate political duty for the military."
 ffpa_tur_flavor.22.f: "The general wrote “defend the republic” into his proposal. A civilian added beside it: “Who represents the republic?” A wide blank space remained between the two lines."
 ffpa_tur_flavor.22.a: "The uniform answers to the civilian government."
 ffpa_tur_flavor.22.b: "Give the General Staff a constitutional guardianship."
 ffpa_tur_flavor.23.t: "The Republic's Second Foundation"
 ffpa_tur_flavor.23.d: "The debates over the Assembly, education, and civil-military relations have concluded, and the republic has met the conditions needed to sustain the settlement. The remaining question is which political direction will define the new order: parliamentary citizenship, organized development, or guarded continuity.\n\nThe founding document can be finalized today. Provincial appointments, tax registers, and everyday enforcement cannot. The republic must still make central standards and local knowledge answer to one another."
 ffpa_tur_flavor.23.f: "The republic preserved in the old records survived a war of independence. The republic founded after the Fire must survive normal politics."
 ffpa_tur_flavor.23.a: "Let the Assembly remain the republic's sovereign center."
 ffpa_tur_flavor.23.b: "Make development the republic's social contract."
 ffpa_tur_flavor.23.c: "Charge the guardians with preserving the settlement."

 ffpa_tur_flavor.30.t: "One Field, Two Records"
 ffpa_tur_flavor.30.d: "Survey teams have submitted a plan for a #bold uniform national cadastre#!. Municipal delegates have brought registers reconstructed from local testimony. The first would give ministries a common standard of verification; the second preserves arrangements that survived the loss of the old archives. The Directorate must choose the basis for the new registers."
 ffpa_tur_flavor.30.f: "The clerk spread both maps across the table. One had clean boundary lines; the other was crowded with names in the margins. “This one is easier to file,” he said, touching the first. “Where shall I put the names?”"
 ffpa_tur_flavor.30.a: "Register the land under a common cadastral standard."
 ffpa_tur_flavor.30.b: "Rebuild local registers from municipal testimony."
 ffpa_tur_flavor.31.t: "The Old Plans of Sümer and Eti"
 ffpa_tur_flavor.31.d: "Old industrial records bearing the names Sümer and Eti have returned to the reconstruction conference. Engineers see a model for organizing whole supply chains; merchants favor mixed public-private firms; municipal delegates seek support for smaller workshops they can sustain locally. The Directorate must choose which form of industrial organization to support."
 ffpa_tur_flavor.31.f: "A factory is machinery, housing, food, discipline, and a promise that wages will still exist next month."
 ffpa_tur_flavor.31.a: "Back national state combines as the model for reconstruction."
 ffpa_tur_flavor.31.b: "Support mixed public-private reconstruction firms."
 ffpa_tur_flavor.31.c: "Support municipal and cooperative workshops."
 ffpa_tur_flavor.32.t: "Technical Service for the Plateau"
 ffpa_tur_flavor.32.d: "Remote districts may wait decades for permanent specialists. The Directorate can send mobile teams of engineers, teachers, and medics; build provincial technical bureaus; or contract experienced firms wherever a project is ready."
 ffpa_tur_flavor.32.f: "The urgent requests in the local petitions were different: one district needed its water supply repaired, another needed teachers. The officer arranging assignments had a single staff list and kept redrawing the routes."
 ffpa_tur_flavor.32.a: "Organize a mobile national technical corps."
 ffpa_tur_flavor.32.b: "Build permanent provincial technical bureaus."
 ffpa_tur_flavor.32.c: "Contract expertise project by project."
 ffpa_tur_flavor.33.t: "The Mandate of the Directorate"
 ffpa_tur_flavor.33.d: "The plans for land registration, industrial organization, and technical services have been settled, and the Directorate has established the administrative foundations for its work. Before temporary reconstruction becomes permanent rule by inertia, it must define #bold who controls the plan#! and who may revise it.\n\nOnce the mandate is signed, central reports must still be tested against local practice. Common standards can help government understand its provinces; they can also leave their actual circumstances outside the form."
 ffpa_tur_flavor.33.f: "Technocracy is not the absence of politics. It is politics conducted through standards, budgets, and appointment lists."
 ffpa_tur_flavor.33.a: "Give the state combines a national reconstruction mandate."
 ffpa_tur_flavor.33.b: "Seat public and private interests in mixed planning councils."
 ffpa_tur_flavor.33.c: "Govern through binding local development compacts."

 ffpa_tur_flavor.40.t: "The Anatolian Planning Congress"
 ffpa_tur_flavor.40.d: "The Anatolian projects already completed have brought engineers, local organizers, and investors to the same conference table. They propose different approaches to the next phase: coordinated industry, wider rural education and cooperation, or regional financial networks. The government must choose a national policy priority from these experiences of reconstruction."
 ffpa_tur_flavor.40.f: "The engineer spoke of machines and output, the teacher of students, the bank delegate of repayment dates. The chair had expected a dispute over how to keep building. By the end, it was clear that they had not agreed who should do the building."
 ffpa_tur_flavor.40.a: "Consolidate machinery and contracts in state combines."
 ffpa_tur_flavor.40.b: "Make village institutes and cooperatives the national model."
 ffpa_tur_flavor.40.c: "Capitalize a network of regional development banks."
 ffpa_tur_flavor.41.t: "The New Convention of the Straits"
 ffpa_tur_flavor.41.d: "The expansion of the Straits’ facilities is complete, but harbor authorities and the navy differ over their future use. Commercial representatives want easier movement of cargo and people, officers seek stronger defenses, and administrators propose an arrangement between the two. The new convention will set the lasting direction of Eastern Thrace’s ports and security works."
 ffpa_tur_flavor.41.f: "On the harbor plan, freight yards, rail lines, and defenses crowded the narrow shoreline. Each delegate pointed to the same stretch of land to explain why it should serve their responsibilities first."
 ffpa_tur_flavor.41.a: "Prioritize open commercial services in the Straits."
 ffpa_tur_flavor.41.b: "Balance commercial facilities with coastal defenses."
 ffpa_tur_flavor.41.c: "Give defense priority in the Straits’ facilities."

 ffpa_tur_flavor.50.t: "The Rumelian Settlement Conference"
 ffpa_tur_flavor.50.d: "Completed regional projects have given the government experience in connecting Rumelia and Anatolia. Officials and local delegates involved in that work now seek a lasting arrangement for the networks under their administration: #bold who appoints officials#!, how local institutions participate, and who coordinates affairs across provincial boundaries. The founding settlement frames the discussion, but the arrangement remains to be chosen."
 ffpa_tur_flavor.50.f: "The works had ended, but coordination meetings continued. A local delegate reminded an official from the center: “You can sign off a bridge. Its maintenance bills will not find the right signature by themselves.”"
 ffpa_tur_flavor.50.a: "Keep Rumelian appointments under direct central control."
 ffpa_tur_flavor.50.b: "Guarantee a role for chartered provincial councils."
 ffpa_tur_flavor.50.c: "Organize port and corridor development in the Commonwealth’s name."
 ffpa_tur_flavor.50.d_option: "Organize unitary republican provinces."
 ffpa_tur_flavor.50.e: "Guarantee a governing role for Rumelian local delegates."
 ffpa_tur_flavor.50.f_option: "Create a cross-provincial coordination zone."
 ffpa_tur_flavor.50.g: "Divide Rumelia into national survey districts."
 ffpa_tur_flavor.50.h: "Entrust it to regional technical boards."
 ffpa_tur_flavor.50.i: "Create a Rumelian Corridor Authority."
 ffpa_tur_flavor.51.t: "The Eastern Waters and Trade Conference"
 ffpa_tur_flavor.51.d: "Experience from eastern waterworks and trade projects has been assembled into new proposals for government. Institutions responsible for the existing networks want to settle #bold who coordinates river basins and trade routes#!, how provinces are represented, and which affairs belong to bodies working across regional boundaries. Direct administration, local compacts, and development agencies each have advocates; the conference must choose an approach."
 ffpa_tur_flavor.51.f: "One submission was arranged by stretches of river, another by administrative district. The clerk had to enter the same facility in two columns before each office could recognize its responsibilities."
 ffpa_tur_flavor.51.a: "Place eastern services under directly appointed vilayets."
 ffpa_tur_flavor.51.b: "Recognize basin and caravan councils."
 ffpa_tur_flavor.51.c: "Charter imperial water and trade commissions."
 ffpa_tur_flavor.51.d_option: "Appoint civilian republican prefects."
 ffpa_tur_flavor.51.e: "Elect regional basin assemblies."
 ffpa_tur_flavor.51.f_option: "Create a Euphrates–Levant Development Authority."
 ffpa_tur_flavor.51.g: "Place the east under cadastral districts."
 ffpa_tur_flavor.51.h: "Delegate operations to regional water boards."
 ffpa_tur_flavor.51.i: "Create an integrated eastern corridor authority."
 ffpa_tur_flavor.52.t: "The African Ports Conference"
 ffpa_tur_flavor.52.d: "Completed projects along the African coast have given harbor officials, merchants, municipal delegates, and treasury officers experience in working together. They have also exposed disagreements over appointments, public services, and maritime investment. The conference must now establish #bold a lasting governing arrangement#! for the existing network: direct central administration, compacts with local institutions, or a dedicated development authority."
 ffpa_tur_flavor.52.f: "“Once a ship docks, someone has to keep the water and lights working.” The municipal delegate nodded at the harbor representative’s words. When discussion turned to who would direct the work and answer for it, their agreement ended."
 ffpa_tur_flavor.52.a: "Administer the African coast through appointed vilayets."
 ffpa_tur_flavor.52.b: "Covenant with the port municipalities."
 ffpa_tur_flavor.52.c: "Charter an imperial maritime development service."
 ffpa_tur_flavor.52.d_option: "Administer the coast as republican provinces."
 ffpa_tur_flavor.52.e: "Create representative regional compacts."
 ffpa_tur_flavor.52.f_option: "Found Mediterranean port development commissions."
 ffpa_tur_flavor.52.g: "Survey the coast as national administrative districts."
 ffpa_tur_flavor.52.h: "Form regional boards of ports and waterworks."
 ffpa_tur_flavor.52.i: "Create an African Maritime Corridor Authority."

 # --- Route-limited frontier recovery ---
 je_group_ffpa_turkish_frontier_recovery: "Turkish Frontier Recovery"
 ffpa_tur_convene_frontier_council: "Convene the Frontier Council"
 ffpa_tur_convene_frontier_council_desc: "Review the territorial mandates supported by the state's founding settlement. Only #v one frontier#! may be active or awaiting a wartime resolution at a time."
 ffpa_tur_withdraw_frontier_mandate: "Withdraw the Frontier Mandate"
 ffpa_tur_withdraw_frontier_mandate_desc: "End the active mandate at peace, remove only claims introduced by the Frontier Council on states #bold still outside Turkish rule#!.\n\nWait #v five years#! before trying that frontier again."
 ffpa_tur_frontier_council_peace_tt: "Turkey must be at peace and outside a committed Diplomatic Play"
 ffpa_tur_frontier_slot_available_tt: "No frontier mandate may be active or awaiting resolution"
 ffpa_tur_frontier_available_tt: "At least one frontier supported by the founding route must be available"
 je_ffpa_tur_front_western_pact: "National Pact in the West"
 je_ffpa_tur_front_western_pact_reason: "Supporters of the National Pact on the Frontier Council see Western Thrace as part of the connections across the Straits; officers emphasize the security of the approaches. Turning those claims into a state mandate commits the government to diplomatic and administrative responsibilities. Historical papers alone cannot settle the future of the people who live there.\n\nThe Frontier Council has authorized claims over Western Thrace.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 15 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_western_pact_status: "Secure direct ownership of Western Thrace before the #v 15-year#! mandate expires."
 ffpa_tur_frontier_council_western_pact_option: "Authorize National Pact in the West."
 ffpa_tur_frontier_council_western_pact_tt: "Adds protected temporary claims to parts of Western Thrace not yet under Turkish rule and opens a 15-year mandate. It does not complete a regional construction project."
 je_ffpa_tur_front_mosul: "The Mosul Question"
 je_ffpa_tur_front_mosul_reason: "The routes through Mosul connect Anatolia and Mesopotamia. Advocates on the Frontier Council use that connection to support a territorial mandate, but acquiring land and maintaining its routes and local administration are different burdens. A limited mandate requires the government to answer for its claim.\n\nThe Frontier Council has authorized claims over Mosul.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 15 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_mosul_status: "Secure direct ownership of Mosul before the #v 15-year#! mandate expires."
 ffpa_tur_frontier_council_mosul_option: "Authorize The Mosul Question."
 ffpa_tur_frontier_council_mosul_tt: "Adds protected temporary claims only to parts of Mosul not yet under Turkish rule and opens a 15-year mandate. It does not complete the Mesopotamian Waterworks."
 je_ffpa_tur_front_rumelia: "The Rumelian Mandate"
 je_ffpa_tur_front_rumelia_reason: "Advocates of a Rumelian mandate invoke the ties of the old provinces and seek to reorganize political authority across the Balkans. The council faces diverse local societies and transport corridors, however; continuous territory on a map does not create common administration. The government must bound its historical claims with definite targets and a deadline.\n\nThe Frontier Council has authorized claims over Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_rumelia_status: "Secure direct ownership of Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_rumelia_option: "Authorize The Rumelian Mandate."
 ffpa_tur_frontier_council_rumelia_tt: "Adds protected temporary claims to parts of Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Via Egnatia and Danube–Thrace projects."
 je_ffpa_tur_front_aegean_cyprus: "The Aegean and Cyprus Mandate"
 je_ffpa_tur_front_aegean_cyprus_reason: "Naval officers and coastal delegates have placed the Aegean islands and Cyprus in one proposal, seeking a maritime presence supported by connected ports. Each island has its own supply and local administrative requirements, which no line on a sea chart can sustain. The council must therefore give this maritime agenda a bounded mandate.\n\nThe Frontier Council has authorized claims over Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_aegean_cyprus_status: "Secure direct ownership of Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_aegean_cyprus_option: "Authorize The Aegean and Cyprus Mandate."
 ffpa_tur_frontier_council_aegean_cyprus_tt: "Adds protected temporary claims to parts of Attica, Crete, the Aegean and Ionian Islands, and Cyprus not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Aegean project."
 je_ffpa_tur_front_levant: "The Levantine Mandate"
 je_ffpa_tur_front_levant_reason: "Advocates of a Levantine mandate seek closer connections between coastal ports, inland trade routes, and Anatolia. Reviving old provincial names cannot erase the distinct interests of cities and their hinterlands. In approving a territorial agenda, the government must also face the coordination problems that would remain after acquisition.\n\nThe Frontier Council has authorized claims over Aleppo, Syria, Lebanon, Palestine, and Transjordan.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_levant_status: "Secure direct ownership of Aleppo, Syria, Lebanon, Palestine, and Transjordan before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_levant_option: "Authorize The Levantine Mandate."
 ffpa_tur_frontier_council_levant_tt: "Adds protected temporary claims to parts of Aleppo, Syria, Lebanon, Palestine, and Transjordan not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Levant Trade Corridor."
 je_ffpa_tur_front_mesopotamia: "The Mesopotamian Mandate"
 je_ffpa_tur_front_mesopotamia_reason: "The Mesopotamian proposal treats the routes and productive districts from Mosul to Basra as an interconnected region. Water crosses administrative borders, but taxation, transport, and local authority still require their own arrangements. The council seeks a limited mandate for territorial claims without treating the future problems of government as already settled.\n\nThe Frontier Council has authorized claims over Mosul, Baghdad, Deir ez-Zor, and Basra.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_mesopotamia_status: "Secure direct ownership of Mosul, Baghdad, Deir ez-Zor, and Basra before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_mesopotamia_option: "Authorize The Mesopotamian Mandate."
 ffpa_tur_frontier_council_mesopotamia_tt: "Adds protected temporary claims to parts of Mosul, Baghdad, Deir ez-Zor, and Basra not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Mesopotamian Waterworks."
 je_ffpa_tur_front_egypt: "The Egyptian Mandate"
 je_ffpa_tur_front_egypt_reason: "Advocates of an Egyptian mandate stress the connections between the Nile and the Mediterranean, interpreting maps from the old archives as responsibilities for the present state. The valley, delta, and desert routes each pose different conditions for government. The council can authorize a claim, but cannot secure local acceptance by decree.\n\nThe Frontier Council has authorized claims over Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_egypt_status: "Secure direct ownership of Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_egypt_option: "Authorize The Egyptian Mandate."
 ffpa_tur_frontier_council_egypt_tt: "Adds protected temporary claims to parts of Lower, Middle, and Upper Egypt, Sinai, and Matruh not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Nile and Alexandria–Sinai projects."
 je_ffpa_tur_front_ifriqiya: "The Ifriqiyan Mandate"
 je_ffpa_tur_front_ifriqiya_reason: "Supporters of an Ifriqiyan mandate seek closer maritime connections among the North African ports. Coastal routes are easily drawn on one chart, but relations between each port and its hinterland remain distinct. If the government adopts these historical claims, it must answer for their outcome within a limited period.\n\nThe Frontier Council has authorized claims over Libya, Tripoli, and Tunisia.\n\nBring every listed state region under #bold direct Turkish ownership#! within #v 20 years#!.\n\nIf the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_ifriqiya_status: "Secure direct ownership of Libya, Tripoli, and Tunisia before the #v 20-year#! mandate expires."
 ffpa_tur_frontier_council_ifriqiya_option: "Authorize The Ifriqiyan Mandate."
 ffpa_tur_frontier_council_ifriqiya_tt: "Adds protected temporary claims to parts of Libya, Tripoli, and Tunisia not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Ifriqiyan Coastal Network."
 ffpa_tur_frontier_council_cancel_option: "Issue no mandate for now."
 ffpa_tur_flavor.60.t: "The Frontier Council Convenes"
 ffpa_tur_flavor.60.d: "Ministers, officers, and local delegates have submitted a limited frontier agenda under the founding settlement. Some invoke old archives; others emphasize routes and defenses. The council must decide which claim the state should now undertake. Each mandate creates claims and a deadline, but guarantees neither diplomatic nor military success."
 ffpa_tur_flavor.60.f: "A frontier drawn in an archive becomes real only when a government accepts the cost of defending it."
 ffpa_tur_flavor.61.t: "National Pact in the West Secured"
 ffpa_tur_flavor.61.d: "Turkey now directly controls Western Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.61.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_western_pact_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Western Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.61.f: "The pact is no longer a line in an archive; it is now customs schedules, railway patrols, and responsibility for the people within that frontier."
 ffpa_tur_flavor.61.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.69.t: "National Pact in the West Expires"
 ffpa_tur_flavor.69.d: "The mandate expired before Turkey secured all of Western Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.69.f: "The council moved the Western Thrace file to the expired column. Proposals for the future of the two shores still filled a thick folder, but none amounted to a mandate still in force."
 ffpa_tur_flavor.69.a: "Close the file for now."
 ffpa_tur_flavor.77.t: "National Pact in the West Withdrawn"
 ffpa_tur_flavor.77.d: "The government has voluntarily ended the mandate for Western Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.77.f: "“Not pursuing it for now does not mean never discussing it again,” the minister said of the withdrawal. A local delegate asked him to clarify “for now,” and the meeting fell quiet for a moment."
 ffpa_tur_flavor.77.a: "The mandate is withdrawn."
 ffpa_tur_flavor.62.t: "The Mosul Question Secured"
 ffpa_tur_flavor.62.d: "Turkey now directly controls Mosul. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.62.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_mosul_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Mosul. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.62.f: "A question once framed as a claim has become a question of budgets, appointments, and keeping the routes through Mosul open."
 ffpa_tur_flavor.62.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.70.t: "The Mosul Question Expires"
 ffpa_tur_flavor.70.d: "The mandate expired before Turkey secured all of Mosul. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.70.f: "At a fork in the road, travelers want to know whether the next stop has guides and supplies. The expiry of the council’s mandate saves no one that journey."
 ffpa_tur_flavor.70.a: "Close the file for now."
 ffpa_tur_flavor.78.t: "The Mosul Question Withdrawn"
 ffpa_tur_flavor.78.d: "The government has voluntarily ended the mandate for Mosul. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.78.f: "One line was added to the Mosul file: “This mandate is terminated.” Routes, travelers, and local affairs would still have to be dealt with on their actual terms."
 ffpa_tur_flavor.78.a: "The mandate is withdrawn."
 ffpa_tur_flavor.63.t: "The Rumelian Mandate Secured"
 ffpa_tur_flavor.63.d: "Turkey now directly controls Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.63.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_rumelia_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.63.f: "A frontier spanning many peoples and provinces can change hands faster than it can be made governable."
 ffpa_tur_flavor.63.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.71.t: "The Rumelian Mandate Expires"
 ffpa_tur_flavor.71.d: "The mandate expired before Turkey secured all of Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.71.f: "Colors and annotations still crossed the Balkan map. When the clerk closed the mandate ledger, no one called the lines on it a completed piece of business."
 ffpa_tur_flavor.71.a: "Close the file for now."
 ffpa_tur_flavor.79.t: "The Rumelian Mandate Withdrawn"
 ffpa_tur_flavor.79.d: "The government has voluntarily ended the mandate for Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.79.f: "As the meeting broke up, some still insisted on the old provincial names; others were discussing the expense of their next journey. With the grand agenda set aside, the actual distances became visible again."
 ffpa_tur_flavor.79.a: "The mandate is withdrawn."
 ffpa_tur_flavor.64.t: "The Aegean and Cyprus Mandate Secured"
 ffpa_tur_flavor.64.d: "Turkey now directly controls Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.64.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_aegean_cyprus_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.64.f: "Control of islands is measured again each day in ferries, harbor offices, garrisons, and supply schedules."
 ffpa_tur_flavor.64.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.72.t: "The Aegean and Cyprus Mandate Expires"
 ffpa_tur_flavor.72.d: "The mandate expired before Turkey secured all of Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.72.f: "From the shore, a neighboring island can seem close enough to touch. Those who know the passage recognize what that small distance on the chart contains: winds, supplies, and many journeys back."
 ffpa_tur_flavor.72.a: "Close the file for now."
 ffpa_tur_flavor.80.t: "The Aegean and Cyprus Mandate Withdrawn"
 ffpa_tur_flavor.80.d: "The government has voluntarily ended the mandate for Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.80.f: "After hearing the decision, the naval delegate asked how the retreat should be explained. The official answering him paused. “Begin with what we can actually do.”"
 ffpa_tur_flavor.80.a: "The mandate is withdrawn."
 ffpa_tur_flavor.65.t: "The Levantine Mandate Secured"
 ffpa_tur_flavor.65.d: "Turkey now directly controls Aleppo, Syria, Lebanon, Palestine, and Transjordan. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.65.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_levant_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Aleppo, Syria, Lebanon, Palestine, and Transjordan. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.65.f: "The mandate ends where administration begins: at customs houses, city councils, and the roads between inland markets and ports."
 ffpa_tur_flavor.65.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.73.t: "The Levantine Mandate Expires"
 ffpa_tur_flavor.73.d: "The mandate expired before Turkey secured all of Aleppo, Syria, Lebanon, Palestine, and Transjordan. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.73.f: "The delegates left still arguing whether ports or the interior should come first. The mandate had expired before they found an answer that served both."
 ffpa_tur_flavor.73.a: "Close the file for now."
 ffpa_tur_flavor.81.t: "The Levantine Mandate Withdrawn"
 ffpa_tur_flavor.81.d: "The government has voluntarily ended the mandate for Aleppo, Syria, Lebanon, Palestine, and Transjordan. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.81.f: "The advice on ports and trade routes was retained; the instruction to continue the territorial agenda was struck out. The two matters no longer occupied the same line."
 ffpa_tur_flavor.81.a: "The mandate is withdrawn."
 ffpa_tur_flavor.66.t: "The Mesopotamian Mandate Secured"
 ffpa_tur_flavor.66.d: "Turkey now directly controls Mosul, Baghdad, Deir ez-Zor, and Basra. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.66.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_mesopotamia_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Mosul, Baghdad, Deir ez-Zor, and Basra. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.66.f: "Possession of the rivers is only the beginning; water, harvests, and transport must now be governed across the whole basin."
 ffpa_tur_flavor.66.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.74.t: "The Mesopotamian Mandate Expires"
 ffpa_tur_flavor.74.d: "The mandate expired before Turkey secured all of Mosul, Baghdad, Deir ez-Zor, and Basra. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.74.f: "In the file, a river could be drawn in one stroke. The politics within the mandate’s term had never flowed as easily as the ink."
 ffpa_tur_flavor.74.a: "Close the file for now."
 ffpa_tur_flavor.82.t: "The Mesopotamian Mandate Withdrawn"
 ffpa_tur_flavor.82.d: "The government has voluntarily ended the mandate for Mosul, Baghdad, Deir ez-Zor, and Basra. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.82.f: "The council had heard many metaphors about rivers. When it withdrew the mandate, one member offered a plainer observation: “Upstream and downstream, these matters still have to be negotiated one at a time.”"
 ffpa_tur_flavor.82.a: "The mandate is withdrawn."
 ffpa_tur_flavor.67.t: "The Egyptian Mandate Secured"
 ffpa_tur_flavor.67.d: "Turkey now directly controls Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.67.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_egypt_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.67.f: "A map can place the Nile under one color; grain, irrigation, cities, and the delta must still be governed on their own terms."
 ffpa_tur_flavor.67.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.75.t: "The Egyptian Mandate Expires"
 ffpa_tur_flavor.75.d: "The mandate expired before Turkey secured all of Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.75.f: "One councilor observed that the Nile would not stop flowing because the mandate had expired. Another replied: “Our commitments cannot run on as endlessly as the water.”"
 ffpa_tur_flavor.75.a: "Close the file for now."
 ffpa_tur_flavor.83.t: "The Egyptian Mandate Withdrawn"
 ffpa_tur_flavor.83.d: "The government has voluntarily ended the mandate for Lower Egypt, Middle Egypt, Upper Egypt, Sinai, and Matruh. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.83.f: "The minister signed the withdrawal beside the familiar map of the Nile. The map had not changed; the government’s judgment of its own capacity had."
 ffpa_tur_flavor.83.a: "The mandate is withdrawn."
 ffpa_tur_flavor.68.t: "The Ifriqiyan Mandate Secured"
 ffpa_tur_flavor.68.d: "Turkey now directly controls Libya, Tripoli, and Tunisia. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.68.d.named: "With the last target territory passing from [ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_ifriqiya_completion_predecessor_v1').GetCountry.GetName] and coming under the rule of [ROOT.GetCountry.GetName], Turkey now directly controls Libya, Tripoli, and Tunisia. The mandate is complete, its temporary claim records have been closed, and any newly unlocked frontier or regional construction must be considered separately."
 ffpa_tur_flavor.68.f: "A chain of ports can change hands one by one; making their hinterlands answer to a common administration will take longer."
 ffpa_tur_flavor.68.a: "Record the mandate as fulfilled."
 ffpa_tur_flavor.76.t: "The Ifriqiyan Mandate Expires"
 ffpa_tur_flavor.76.d: "The mandate expired before Turkey secured all of Libya, Tripoli, and Tunisia. Claims introduced only by the Frontier Council on states still outside Turkish rule have been withdrawn. This frontier may be reconsidered after five years."
 ffpa_tur_flavor.76.f: "The names of the North African ports were read out, followed by the mandate’s closing date. Between the two lists lay the work the government had not completed."
 ffpa_tur_flavor.76.a: "Close the file for now."
 ffpa_tur_flavor.84.t: "The Ifriqiyan Mandate Withdrawn"
 ffpa_tur_flavor.84.d: "The government has voluntarily ended the mandate for Libya, Tripoli, and Tunisia. Claims introduced only by the Frontier Council on states still outside Turkish rule have been removed, and the council will wait five years before reopening this frontier."
 ffpa_tur_flavor.84.f: "The coastline continued across the archive chart; the mandate ended on its last page. A future proposal would have to explain anew why the government should undertake commitments over such distances."
 ffpa_tur_flavor.84.a: "The mandate is withdrawn."
