l_english:
 je_group_ffpa_turkish_reconstruction: "Turkish Reconstruction"

 ffpa_tur_confirm_reconstruction_legacy: "Confirm the Legacy of Reconstruction"
 ffpa_tur_confirm_reconstruction_legacy_desc: "Earlier records establish that Anatolia was rebuilt, but not which state project guided the new country. Open the surviving foundation files and record that legacy without guessing from the present government."

 je_ffpa_tur_charter_of_the_porte: "Charter of the Porte"
 je_ffpa_tur_charter_of_the_porte_reason: "The Ottoman Commonwealth has made a shared political identity possible. It must now decide where sovereignty resides, how the vilayets participate in government, and whether the surviving pious endowments answer to their communities or to the state. Complete the three constitutional debates, retain the Monarchy, maintain at least #v 60#! Legitimacy and a non-negative Bureaucracy balance, remain at peace without an insurrectionary movement, and keep #v 8#! reconstruction core states above #v 75%#! Market Access and below #v 18%#! Turmoil."
 je_ffpa_tur_second_foundation_of_ankara: "The Second Foundation of Ankara"
 je_ffpa_tur_second_foundation_of_ankara_reason: "The republic founded among the ruins cannot live forever on emergency decrees. Complete the debates over the Assembly, national education, and civil-military relations; retain a non-monarchical government with a voting franchise, at least #v 60#! Legitimacy, non-negative Bureaucracy, #v 30%#! Literacy, peace, and stable market access in #v 8#! reconstruction core states."
 je_ffpa_tur_reconstruction_directorate: "The Anatolian Reconstruction Directorate"
 je_ffpa_tur_reconstruction_directorate_reason: "Surveyors, engineers, teachers, and supply officers claim that functioning records and infrastructure must precede constitutional theory. Complete the cadastral, industrial, and technical-service debates; maintain at least #v 50#! Legitimacy, #v 100#! available Bureaucracy and #v 25%#! Literacy, and connect #v 6#! reconstruction core states with level #v 2#! Railways and Government Administrations."
 je_ffpa_tur_black_sea_lifeline: "The Black Sea Lifeline"
 je_ffpa_tur_black_sea_lifeline_reason: "Turn Kastamonu and Trabzon into the northern supply line of reconstructed Anatolia. Both states require reliable Market Access and stability; Kastamonu needs a level #v 2#! Port and Power Plant and level #v 3#! Railway, while Trabzon needs a level #v 4#! Port, level #v 3#! Railway, and level #v 2#! Power Plant."
 je_ffpa_tur_eastern_highlands_survey: "Survey of the Eastern Highlands"
 je_ffpa_tur_eastern_highlands_survey_reason: "The roads, winter depots, land registers, and power lines of Erzurum and Kars must be rebuilt together. Stabilize both states with low Devastation, and construct the rail, power, and administrative network needed to govern the highlands year-round."
 je_ffpa_tur_cukurova_euphrates_works: "The Çukurova–Euphrates Works"
 je_ffpa_tur_cukurova_euphrates_works_reason: "Bind the farms and surviving cities of Adana and Diyarbakır into a common food, power, and transport system. The works promise abundance, but only if resettlement and local administration keep pace with the dams, factories, and railways."
 je_ffpa_tur_new_straits_convention: "A New Straits Convention"
 je_ffpa_tur_new_straits_convention_reason: "The Gate of Two Continents is now a capital-scale port complex. At peace and with at least #v 60#! Legitimacy, develop Eastern Thrace to #v 95%#! Market Access, low Turmoil and Devastation, level #v 8#! Ports and Railways, level #v 6#! Government Administration, level #v 3#! Naval Administration, and level #v 2#! Naval Fortifications. Turkey can then proclaim the rules by which the Straits will serve trade and security."

 ffpa_tur_porte_charter_deliberations_v1: "Deliberations of the Porte"
 ffpa_tur_porte_charter_deliberations_v1_desc: "The palace, ministries, provincial delegates, and communal institutions are negotiating a durable Ottoman constitution."
 ffpa_tur_republic_foundation_convention_v1: "Ankara Foundation Convention"
 ffpa_tur_republic_foundation_convention_v1_desc: "Deputies and civic associations are turning an emergency republic into a settled constitutional order."
 ffpa_tur_directorate_reconstruction_mobilization_v1: "Directorate Reconstruction Mobilization"
 ffpa_tur_directorate_reconstruction_mobilization_v1_desc: "Scarce administrators and materials are committed to the surveys and networks of the Reconstruction Directorate."
 ffpa_tur_porte_central_charter_v1: "Central Charter of the Porte"
 ffpa_tur_porte_central_charter_v1_desc: "Uniform ministries and cadastral rules bind the empire directly to the Porte, at the cost of provincial consent."
 ffpa_tur_porte_vilayet_commonwealth_v1: "Commonwealth of Vilayets"
 ffpa_tur_porte_vilayet_commonwealth_v1_desc: "The center governs through chartered provincial councils and negotiated communal institutions."
 ffpa_tur_porte_palace_bureaucracy_v1: "Palace-Bureaucratic Order"
 ffpa_tur_porte_palace_bureaucracy_v1_desc: "The dynasty and professional ministries share sovereignty while elected institutions remain subordinate."
 ffpa_tur_republic_assembly_settlement_v1: "Sovereignty of the Assembly"
 ffpa_tur_republic_assembly_settlement_v1_desc: "The national legislature is recognized as the source of civilian authority and republican legitimacy."
 ffpa_tur_republic_developmental_settlement_v1: "Developmental Republic"
 ffpa_tur_republic_developmental_settlement_v1_desc: "Industry, technical education, and coordinated administration are treated as the republic's social contract."
 ffpa_tur_republic_guardian_settlement_v1: "Guardian Republic"
 ffpa_tur_republic_guardian_settlement_v1_desc: "The armed forces receive a constitutional duty to guard the state, strengthening order while narrowing civilian politics."
 ffpa_tur_directorate_etatist_settlement_v1: "Etatist Reconstruction Directorate"
 ffpa_tur_directorate_etatist_settlement_v1_desc: "State combines and technical ministries direct the reconstruction economy through national plans."
 ffpa_tur_directorate_mixed_planning_settlement_v1: "Mixed Planning Councils"
 ffpa_tur_directorate_mixed_planning_settlement_v1_desc: "Public planners, industrial firms, and municipal representatives negotiate investment through common councils."
 ffpa_tur_directorate_local_compacts_settlement_v1: "Local Development Compacts"
 ffpa_tur_directorate_local_compacts_settlement_v1_desc: "Provincial boards accept national targets in exchange for control over land, water, and implementation."
 ffpa_tur_black_sea_lifeline_state_v1: "Black Sea Lifeline"
 ffpa_tur_black_sea_lifeline_state_v1_desc: "Rebuilt ports, power stations, and rail depots keep the northern coast connected in war and winter."
 ffpa_tur_eastern_highlands_survey_state_v1: "Eastern Highlands Survey"
 ffpa_tur_eastern_highlands_survey_state_v1_desc: "Permanent survey offices and all-season infrastructure extend administration across the eastern plateau."
 ffpa_tur_cukurova_euphrates_works_state_v1: "Çukurova–Euphrates Works"
 ffpa_tur_cukurova_euphrates_works_state_v1_desc: "Power, food processing, transport, and irrigation are coordinated across the southern riverlands."
 ffpa_tur_anatolian_state_combines_v1: "Anatolian State Combines"
 ffpa_tur_anatolian_state_combines_v1_desc: "National industrial combines concentrate machinery, engineers, and construction contracts."
 ffpa_tur_anatolian_village_institutes_v1: "Anatolian Village Institutes"
 ffpa_tur_anatolian_village_institutes_v1_desc: "Applied rural schools train teachers, technicians, medics, and cooperative organizers close to the villages they serve."
 ffpa_tur_anatolian_development_banks_v1: "Anatolian Development Banks"
 ffpa_tur_anatolian_development_banks_v1_desc: "Regional banks channel public guarantees and private savings into transport and commerce."
 ffpa_tur_straits_open_passage_state_v1: "Open Passage of the Straits"
 ffpa_tur_straits_open_passage_state_v1_desc: "Commercial passage and migration receive priority, making the Bosporus an open exchange between seas."
 ffpa_tur_straits_balanced_stewardship_state_v1: "Stewardship of the Straits"
 ffpa_tur_straits_balanced_stewardship_state_v1_desc: "Merchant passage is protected while Turkish authorities retain inspection, security, and fortification rights."
 ffpa_tur_straits_fortified_narrows_state_v1: "Fortified Narrows"
 ffpa_tur_straits_fortified_narrows_state_v1_desc: "Layered coastal works make the Bosporus defensible, but military restrictions burden commerce."
 ffpa_tur_settlement_direct_administration_v1: "Direct Provincial Administration"
 ffpa_tur_settlement_direct_administration_v1_desc: "Uniform registers and centrally appointed officials raise administrative reach while displacing local bargains."
 ffpa_tur_settlement_representative_compact_v1: "Representative Provincial Compact"
 ffpa_tur_settlement_representative_compact_v1_desc: "Provincial representatives and communal institutions exchange cooperation for a formal voice in government."
 ffpa_tur_settlement_development_authority_v1: "Regional Development Authority"
 ffpa_tur_settlement_development_authority_v1_desc: "Engineers and investment boards organize the region around transport, construction, and productive corridors."

 ffpa_ig_tur_republican_general_staff: "Republican General Staff"
 ffpa_ig_tur_ankara_civic_society: "Ankara Civic Society"
 ffpa_ig_tur_national_reconstruction_combines: "National Reconstruction Combines"
 ffpa_ig_tur_national_technical_service_corps: "National Technical Service Corps"
 ig_trait_ffpa_tur_guardianship_intervention: "Guardianship Intervention"
 ig_trait_ffpa_tur_guardianship_intervention_desc: "When officers regard elected government as unfit to defend the settlement, constitutional guardianship becomes a standing veto over ordinary legislation."
 ig_trait_ffpa_tur_civilian_command: "Civilian Chain of Command"
 ig_trait_ffpa_tur_civilian_command_desc: "A settled civilian chain of command turns military professionalism toward disciplined mobilization and defense rather than political arbitration."
 ig_trait_ffpa_tur_republican_public_instruction: "Republican Public Instruction"
 ig_trait_ffpa_tur_republican_public_instruction_desc: "Civic schools and institutes treat education as the practical foundation of citizenship, widening access to the professions."
 ig_trait_ffpa_tur_contractual_obstruction: "Contractual Obstruction"
 ig_trait_ffpa_tur_contractual_obstruction_desc: "When reconstruction combines withhold cooperation, procurement disputes consume ministry capacity and private capital waits for better terms."
 ig_trait_ffpa_tur_reconstruction_contracts: "Coordinated Reconstruction Contracts"
 ig_trait_ffpa_tur_reconstruction_contracts_desc: "Stable public contracts let builders, manufacturers, and transport firms coordinate construction across the national network."
 ig_trait_ffpa_tur_national_technical_service: "National Technical Service"
 ig_trait_ffpa_tur_national_technical_service_desc: "A national technical service moves trained engineers, teachers, and administrators where reconstruction needs them, linking professional formation to applied research."

 ffpa_tur_flavor.1.t: "The Missing Foundation Files"
 ffpa_tur_flavor.1.d: "The archives agree that a Turkish state emerged from the reconstruction of Anatolia, but a generation of missing decrees has left its founding project uncertain. Surviving constitutions, tax rolls, and ministry seals can support three different accounts. The present government must record which legacy actually shaped the state."
 ffpa_tur_flavor.1.f: "A state without a remembered founding can obey laws, but it cannot explain why those laws command obedience."
 ffpa_tur_flavor.1.a: "The Porte and the Commonwealth were our foundation."
 ffpa_tur_flavor.1.b: "The republic of Ankara was our foundation."
 ffpa_tur_flavor.1.c: "The Reconstruction Directorate was our foundation."

 ffpa_tur_flavor.10.t: "A Fundamental Law from the Ashes"
 ffpa_tur_flavor.10.d: "The first constitutional commission meets among salvaged law books whose pages describe institutions that no longer exist. Reformers argue that a common Ottoman citizenship requires an elected chamber. Palace jurists answer that consultation can be restored without allowing parties to fracture the state."
 ffpa_tur_flavor.10.f: "The old constitution can be copied word for word; the old society cannot."
 ffpa_tur_flavor.10.a: "The chamber must derive authority from the citizens."
 ffpa_tur_flavor.10.b: "Restore consultation beneath the sovereignty of the Crown."
 ffpa_tur_flavor.11.t: "The Provincial Councils Return"
 ffpa_tur_flavor.11.d: "Ankara can issue decrees faster than it can train governors. Provincial delegations offer records, tax collectors, and local legitimacy, but each asks whether the new empire intends to govern with them or over them."
 ffpa_tur_flavor.11.f: "Centralization was never built by the center alone."
 ffpa_tur_flavor.11.a: "Appointed governors will carry one law across the empire."
 ffpa_tur_flavor.11.b: "Charter representative councils in every vilayet."
 ffpa_tur_flavor.11.c: "Recognize the notables who can make decrees real."
 ffpa_tur_flavor.12.t: "The Ledgers of the Waqfs"
 ffpa_tur_flavor.12.d: "Mosques, churches, lodges, and family foundations kept kitchens, wells, clinics, and schools alive when ministries disappeared. Their surviving trustees now control property and local loyalty on a scale the treasury cannot ignore."
 ffpa_tur_flavor.12.f: "The question is not whether the endowments served the public, but who may define the public now."
 ffpa_tur_flavor.12.a: "Protect autonomous endowments under public audit."
 ffpa_tur_flavor.12.b: "Transfer their services and property to the municipalities."
 ffpa_tur_flavor.12.c: "Create mixed public-endowment charters."
 ffpa_tur_flavor.13.t: "The Charter of the Porte"
 ffpa_tur_flavor.13.d: "The articles have been debated, translated, amended, and carried to the provinces. The restored Ottoman state must now choose the constitutional bargain that future ministers, governors, and communities will be expected to honor."
 ffpa_tur_flavor.13.f: "No charter abolishes conflict; a durable charter decides where conflict may be conducted."
 ffpa_tur_flavor.13.a: "A central Tanzimat state will finish the work."
 ffpa_tur_flavor.13.b: "Found a negotiated commonwealth of vilayets."
 ffpa_tur_flavor.13.c: "Entrust the order to the palace and its ministries."

 ffpa_tur_flavor.20.t: "An Assembly in the Stone Houses"
 ffpa_tur_flavor.20.d: "The first deputies met in Ankara because the old capital and its institutions could no longer protect national sovereignty. Now that the emergency has passed, the republic must decide whether the Assembly remains supreme or delegates a stronger mandate to an elected president."
 ffpa_tur_flavor.20.f: "The capital was chosen by necessity; its institutions will be chosen deliberately."
 ffpa_tur_flavor.20.a: "Sovereignty belongs to the Assembly."
 ffpa_tur_flavor.20.b: "A directly mandated president must be able to act."
 ffpa_tur_flavor.21.t: "The Village Institutes Reconsidered"
 ffpa_tur_flavor.21.d: "Teachers have recovered the old Village Institute program: boarding schools where rural students learned agriculture, medicine, construction, and teaching by doing the work themselves. They propose adapting it to the new republic; industrial planners counter that scarce instructors should be concentrated in urban technical academies."
 ffpa_tur_flavor.21.f: "A school can reproduce the country that exists, or train people to build one that does not yet exist."
 ffpa_tur_flavor.21.a: "Revive applied schools in the villages."
 ffpa_tur_flavor.21.b: "Concentrate expertise in urban technical academies."
 ffpa_tur_flavor.22.t: "The General Staff Enters the Assembly"
 ffpa_tur_flavor.22.d: "The officers who guarded the reconstruction now ask what duty remains when elected institutions are secure. Civilian deputies demand an unambiguous chain of command; senior commanders warn that a future cabinet might dismantle the republic from within."
 ffpa_tur_flavor.22.f: "An army that founded a state must still learn how to belong to it."
 ffpa_tur_flavor.22.a: "The uniform answers to the civilian government."
 ffpa_tur_flavor.22.b: "Give the General Staff a constitutional guardianship."
 ffpa_tur_flavor.23.t: "The Republic's Second Foundation"
 ffpa_tur_flavor.23.d: "The emergency republic has acquired elections, schools, ministries, and a settled relationship with its army. The remaining question is which achievement will define the political order: parliamentary citizenship, organized development, or guarded continuity."
 ffpa_tur_flavor.23.f: "The republic preserved in the old records survived a war of independence. The republic founded after the Fire must survive normal politics."
 ffpa_tur_flavor.23.a: "Let the Assembly remain the republic's sovereign center."
 ffpa_tur_flavor.23.b: "Make development the republic's social contract."
 ffpa_tur_flavor.23.c: "Charge the guardians with preserving the settlement."

 ffpa_tur_flavor.30.t: "A National Survey without Paper"
 ffpa_tur_flavor.30.d: "Burned registries and displaced villages have left the government with maps that describe fields but not owners. Survey teams can impose a new cadastral grid, or accept testimony from municipal councils and surviving communities."
 ffpa_tur_flavor.30.f: "Every straight line on the map crosses somebody's memory."
 ffpa_tur_flavor.30.a: "Survey the country anew under one cadastral standard."
 ffpa_tur_flavor.30.b: "Let municipal testimony reconstruct the registers."
 ffpa_tur_flavor.31.t: "The Empty Factories of Sümer and Eti"
 ffpa_tur_flavor.31.d: "The shells of old mills, mines, and company towns still carry the faded marks of state enterprises. Engineers propose national combines able to rebuild whole industrial chains; merchants offer mixed companies, while municipalities ask for smaller workshops they can sustain."
 ffpa_tur_flavor.31.f: "A factory is machinery, housing, food, discipline, and a promise that wages will still exist next month."
 ffpa_tur_flavor.31.a: "Reconstitute national state combines."
 ffpa_tur_flavor.31.b: "Build mixed public-private reconstruction companies."
 ffpa_tur_flavor.31.c: "Fund municipal and cooperative workshops."
 ffpa_tur_flavor.32.t: "Technical Service for the Plateau"
 ffpa_tur_flavor.32.d: "Remote districts may wait decades for permanent specialists. The Directorate can send mobile teams of engineers, teachers, and medics; build provincial technical bureaus; or contract experienced firms wherever a project is ready."
 ffpa_tur_flavor.32.f: "The old republic sent teachers into the villages. The reconstruction state must send entire professions."
 ffpa_tur_flavor.32.a: "Organize a mobile national technical corps."
 ffpa_tur_flavor.32.b: "Build permanent provincial technical bureaus."
 ffpa_tur_flavor.32.c: "Contract expertise project by project."
 ffpa_tur_flavor.33.t: "The Mandate of the Directorate"
 ffpa_tur_flavor.33.d: "The emergency offices now possess maps, factories, schools, and an administrative culture of their own. Before temporary reconstruction becomes permanent government by inertia, the Directorate must define who controls the plan and who may revise it."
 ffpa_tur_flavor.33.f: "Technocracy is not the absence of politics. It is politics conducted through standards, budgets, and appointment lists."
 ffpa_tur_flavor.33.a: "Give the state combines a national reconstruction mandate."
 ffpa_tur_flavor.33.b: "Seat public and private interests in mixed planning councils."
 ffpa_tur_flavor.33.c: "Govern through binding local development compacts."

 ffpa_tur_flavor.40.t: "The Anatolian Planning Congress"
 ffpa_tur_flavor.40.d: "Railways, highland surveys, river works, and the Black Sea lifeline have produced a generation of engineers and provincial organizers. Their competing institutions cannot all dominate the next phase of development."
 ffpa_tur_flavor.40.f: "The projects rebuilt regions. Their methods will now shape the country."
 ffpa_tur_flavor.40.a: "Consolidate machinery and contracts in state combines."
 ffpa_tur_flavor.40.b: "Make village institutes and cooperatives the national model."
 ffpa_tur_flavor.40.c: "Capitalize a network of regional development banks."
 ffpa_tur_flavor.41.t: "The New Convention of the Straits"
 ffpa_tur_flavor.41.d: "The Bosporus again carries merchants, migrants, and warships between two seas. Foreign governments ask for predictable passage; admirals demand defenses; port authorities warn that every restriction has a price. Turkey must state the doctrine by which it will keep the gate."
 ffpa_tur_flavor.41.f: "A strait is narrow water and wide politics."
 ffpa_tur_flavor.41.a: "Guarantee open commercial passage."
 ffpa_tur_flavor.41.b: "Balance passage with sovereign stewardship."
 ffpa_tur_flavor.41.c: "Fortify the Narrows and subordinate traffic to security."

 ffpa_tur_flavor.50.t: "The Rumelian Settlement Conference"
 ffpa_tur_flavor.50.d: "Rumelia is already under Turkish administration; new railways and ports now bind its cities, tax offices, and production networks more closely to Anatolia. The remaining question is how that administration should work each day: who appoints officials, who speaks for the provinces, and which law coordinates the corridors. The founding state project supplies three different answers."
 ffpa_tur_flavor.50.f: "The line across the map is complete. The argument over what travels along it has begun."
 ffpa_tur_flavor.50.a: "Keep Rumelian appointments under direct central control."
 ffpa_tur_flavor.50.b: "Guarantee a role for chartered provincial councils."
 ffpa_tur_flavor.50.c: "Coordinate the ports through common Ottoman citizenship."
 ffpa_tur_flavor.50.d_option: "Organize unitary republican provinces."
 ffpa_tur_flavor.50.e: "Seat Rumelian federal delegations in Ankara."
 ffpa_tur_flavor.50.f_option: "Create a cross-provincial coordination zone."
 ffpa_tur_flavor.50.g: "Divide Rumelia into national survey districts."
 ffpa_tur_flavor.50.h: "Entrust it to regional technical boards."
 ffpa_tur_flavor.50.i: "Create a Rumelian Corridor Authority."
 ffpa_tur_flavor.51.t: "The Eastern Waters and Trade Conference"
 ffpa_tur_flavor.51.d: "The eastern provinces are already governed from within the Turkish state, and their waterworks and trade corridors now share routes from the Euphrates through the Levant toward Egypt. The conference must decide who controls basin budgets, how provinces are represented, and which offices provide customs, irrigation, and public services across the network."
 ffpa_tur_flavor.51.f: "Rivers ignore provincial borders; treasuries and assemblies do not."
 ffpa_tur_flavor.51.a: "Place eastern services under directly appointed vilayets."
 ffpa_tur_flavor.51.b: "Recognize basin and caravan councils."
 ffpa_tur_flavor.51.c: "Charter imperial water and trade commissions."
 ffpa_tur_flavor.51.d_option: "Appoint civilian republican prefects."
 ffpa_tur_flavor.51.e: "Elect regional basin assemblies."
 ffpa_tur_flavor.51.f_option: "Create a Euphrates–Levant Development Authority."
 ffpa_tur_flavor.51.g: "Place the east under cadastral districts."
 ffpa_tur_flavor.51.h: "Delegate operations to regional water boards."
 ffpa_tur_flavor.51.i: "Create an integrated eastern corridor authority."
 ffpa_tur_flavor.52.t: "The African Ports Conference"
 ffpa_tur_flavor.52.d: "The African ports are already part of the Turkish administrative order, and the completed coastal networks have made them economically close without settling their place in national government. Dockworkers, merchants, municipal councils, fiscal officials, and military planners all demand a voice in appointments, customs revenue, public services, and maritime investment."
 ffpa_tur_flavor.52.f: "A harbor can face the capital, its hinterland, or the sea. It cannot face all three without a bargain."
 ffpa_tur_flavor.52.a: "Administer the African coast through appointed vilayets."
 ffpa_tur_flavor.52.b: "Covenant with the port municipalities."
 ffpa_tur_flavor.52.c: "Charter an imperial maritime development service."
 ffpa_tur_flavor.52.d_option: "Administer the coast as republican provinces."
 ffpa_tur_flavor.52.e: "Create representative regional compacts."
 ffpa_tur_flavor.52.f_option: "Found Mediterranean port development commissions."
 ffpa_tur_flavor.52.g: "Survey the coast as national administrative districts."
 ffpa_tur_flavor.52.h: "Form regional boards of ports and waterworks."
 ffpa_tur_flavor.52.i: "Create an African Maritime Corridor Authority."

 # --- Route-limited frontier recovery ---
 je_group_ffpa_turkish_frontier_recovery: "Turkish Frontier Recovery"
 ffpa_tur_convene_frontier_council: "Convene the Frontier Council"
 ffpa_tur_convene_frontier_council_desc: "Review the territorial mandates supported by the state's founding settlement. Only one frontier may be active or awaiting a wartime resolution at a time."
 ffpa_tur_withdraw_frontier_mandate: "Withdraw the Frontier Mandate"
 ffpa_tur_withdraw_frontier_mandate_desc: "End the active mandate at peace, remove only claims introduced by this system on states still outside Turkish rule, and wait five years before trying that frontier again."
 ffpa_tur_frontier_council_peace_tt: "Turkey must be at peace and outside a committed Diplomatic Play"
 ffpa_tur_frontier_slot_available_tt: "No frontier mandate may be active or awaiting resolution"
 ffpa_tur_frontier_available_tt: "At least one frontier supported by the founding route must be available"
 je_ffpa_tur_front_western_pact: "National Pact in the West"
 je_ffpa_tur_front_western_pact_reason: "The Frontier Council has authorized claims over Western Thrace. Bring every listed state region under direct Turkish ownership within 15 years. If the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_western_pact_status: "Secure direct ownership of Western Thrace before the 15-year mandate expires."
 ffpa_tur_frontier_council_western_pact_option: "Authorize National Pact in the West."
 ffpa_tur_frontier_council_western_pact_tt: "Adds protected temporary claims to parts of Western Thrace not yet under Turkish rule and opens a 15-year mandate. It does not complete a regional construction project."
 je_ffpa_tur_front_mosul: "The Mosul Question"
 je_ffpa_tur_front_mosul_reason: "The Frontier Council has authorized claims over Mosul. Bring every listed state region under direct Turkish ownership within 15 years. If the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_mosul_status: "Secure direct ownership of Mosul before the 15-year mandate expires."
 ffpa_tur_frontier_council_mosul_option: "Authorize The Mosul Question."
 ffpa_tur_frontier_council_mosul_tt: "Adds protected temporary claims only to parts of Mosul not yet under Turkish rule and opens a 15-year mandate. It does not complete the Mesopotamian Waterworks."
 je_ffpa_tur_front_rumelia: "The Rumelian Mandate"
 je_ffpa_tur_front_rumelia_reason: "The Frontier Council has authorized claims over Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace. Bring every listed state region under direct Turkish ownership within 20 years. If the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_rumelia_status: "Secure direct ownership of Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace before the 20-year mandate expires."
 ffpa_tur_frontier_council_rumelia_option: "Authorize The Rumelian Mandate."
 ffpa_tur_frontier_council_rumelia_tt: "Adds protected temporary claims to parts of Albania, Macedonia, Western Thrace, Bulgaria, Dobrudja, and Northern Thrace not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Via Egnatia and Danube–Thrace projects."
 je_ffpa_tur_front_aegean_cyprus: "The Aegean and Cyprus Mandate"
 je_ffpa_tur_front_aegean_cyprus_reason: "The Frontier Council has authorized claims over Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus. Bring every listed state region under direct Turkish ownership within 20 years. If the mandate expires during a war or committed Diplomatic Play, its result will wait until peace. This mandate does not complete regional construction projects."
 je_ffpa_tur_front_aegean_cyprus_status: "Secure direct ownership of Attica, Crete, the East and West Aegean Islands, the Ionian Islands, and Cyprus before the 20-year mandate expires."
 ffpa_tur_frontier_council_aegean_cyprus_option: "Authorize The Aegean and Cyprus Mandate."
 ffpa_tur_frontier_council_aegean_cyprus_tt: "Adds protected temporary claims to parts of Attica, Crete, the Aegean and Ionian Islands, and Cyprus not yet under Turkish rule and opens a 20-year mandate. Actual ownership can later enable the Aegean project."
