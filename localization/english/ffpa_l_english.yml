 gov_ffpa_byzantine_parliamentary_oligarchy_desc: "A restricted parliamentary republic governed through the $ffpa_byz_government_senate$ under a Consul."

 # Finite Byzantine western-integration events
 ffpa_flavor.30.t: "The Mediterranean Investment Congress"
 ffpa_flavor.30.d: "The completion of several great works in the restored provinces has brought industrialists, engineers, bankers, and harbor authorities to New Rome. They ask the state to choose which network shall receive the next decade of imperial credit."
 ffpa_flavor.30.f: "A railway may end at a frontier, but capital and cargo do not. The restored provinces must be made parts of one productive sea."
 ffpa_flavor.30.a: "Direct credit toward the Italian industrial belt."
 ffpa_flavor.30.b: "Create an imperial port and railway fund."
 ffpa_flavor.30.c: "Charter provincial development banks."

 ffpa_flavor.31.t: "The Western Provincial Cadastre"
 ffpa_flavor.31.d: "The restored provinces retain land deeds, municipal privileges, and tax customs inherited from several governments. Jurists now demand a settlement: either measure the western provinces by one imperial register or bargain with their established provincial authorities."
 ffpa_flavor.31.f: "Property, obligation, and public revenue must be made legible before reconstruction can become durable government."
 ffpa_flavor.31.a: "Dispatch a uniform imperial cadastral commission."
 ffpa_flavor.31.b: "Confirm provincial tax compacts."

 ffpa_flavor.32.t: "The Western Roman Citizenship Charter"
 ffpa_flavor.32.d: "The Rhomaic commonwealth now governs Italians, Spaniards, Maltese, Egyptians, and the peoples of the African coast. The Senate and the provincial councils agree that conquest alone cannot make Romans; the rights and duties of citizenship must follow."
 ffpa_flavor.32.f: "The Empire will endure only if Rome is understood as a public allegiance shared by its peoples, not as the private inheritance of one tongue."
 ffpa_flavor.32.a: "Citizenship shall follow Roman law throughout the Empire."
 ffpa_flavor.32.b: "Bind the provinces through negotiated civic compacts."

 ffpa_flavor.33.t: "Delegates of the Western Provinces"
 ffpa_flavor.33.d: "With an election campaign under way, the restored provinces demand a settled place in imperial politics. Reformers call for a common electoral roll, provincial leaders defend territorial delegations, and monarchists propose a crown-appointed western senate."
 ffpa_flavor.33.f: "Representation may bind distant shores to New Rome—or teach every province how to bargain against it."
 ffpa_flavor.33.a: "Establish one common electoral roll."
 ffpa_flavor.33.b: "Seat delegations from the restored provinces."
 ffpa_flavor.33.c: "Let the Crown appoint a western senate."

 ffpa_byz_mediterranean_industrial_credit: "Mediterranean Industrial Credit"
 ffpa_byz_mediterranean_industrial_credit_desc: "Imperial guarantees channel a decade of credit into manufacturing and skilled labor, at the cost of additional administration."
 ffpa_byz_mediterranean_port_rail_fund: "Imperial Port and Railway Fund"
 ffpa_byz_mediterranean_port_rail_fund_desc: "A coordinated fund accelerates infrastructure construction and Mediterranean commerce while raising the cost of the construction program."
 ffpa_byz_mediterranean_development_banks: "Provincial Development Banks"
 ffpa_byz_mediterranean_development_banks_desc: "Provincial banks finance construction, qualifications, and migration while requiring sustained bureaucratic oversight."
 ffpa_byz_western_uniform_cadastre_state: "Uniform Western Cadastre"
 ffpa_byz_western_uniform_cadastre_state_desc: "A comprehensive survey strengthens taxation and the professional administration of the restored provinces."
 ffpa_byz_western_uniform_cadastre_cost: "Imperial Cadastral Commission"
 ffpa_byz_western_uniform_cadastre_cost_desc: "The cadastral commission consumes administrative resources and challenges entrenched landowners."
 ffpa_byz_western_provincial_tax_state: "Provincial Tax Compacts"
 ffpa_byz_western_provincial_tax_state_desc: "Recognized local tax customs improve compliance and encourage settlement without imposing a completely uniform register."
 ffpa_byz_western_provincial_tax_compact: "Compact with the Western Notables"
 ffpa_byz_western_provincial_tax_compact_desc: "The Crown governs through provincial notables and ecclesiastical authorities."
 ffpa_byz_western_universal_citizenship: "Universal Roman Citizenship"
 ffpa_byz_western_universal_citizenship_desc: "Roman civic identity directly extends stronger cultural acceptance to the major peoples of the restored western and African provinces."
 ffpa_byz_western_provincial_civic_compact: "Western Provincial Civic Compacts"
 ffpa_byz_western_provincial_civic_compact_desc: "Negotiated compacts provide broad cultural acceptance while preserving provincial authority, mobility, and local advancement."
 ffpa_byz_western_common_electoral_roll: "Common Imperial Electoral Roll"
 ffpa_byz_western_common_electoral_roll_desc: "A common franchise strengthens civic legitimacy while confronting landed privilege."
 ffpa_byz_western_provincial_delegations: "Western Provincial Delegations"
 ffpa_byz_western_provincial_delegations_desc: "Territorial delegations give the restored provinces a structured voice in imperial politics."
 ffpa_byz_western_crown_senate: "Crown-Appointed Western Senate"
 ffpa_byz_western_crown_senate_desc: "A western senate appointed by the monarch reinforces authority and legitimacy at the expense of liberal confidence."
