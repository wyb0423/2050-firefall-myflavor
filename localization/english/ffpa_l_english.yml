 je_ffpa_byz_restore_new_rome: "Restore New Rome"
 je_ffpa_byz_restore_new_rome_reason: "Constantinople is both the seat of public offices and a city shared by harbors, workshops, and residents. Offices need staff, universities need power and transport, and cargo cannot wait forever in crowded streets. The title of capital cannot settle these everyday demands.\n\nExpand ports, railways, administration, universities, and power facilities while maintaining very high Market Access and public order. Completion allows #bold one of three permanent development directions#! for the city."

 # Capital construction and one-off political economy modifiers
 ffpa_tur_straits_construction_drive: "Straits Construction Drive"
 ffpa_tur_straits_construction_drive_desc: "Priority materials, engineers, and labor are directed to the metropolitan works of Eastern Thrace."
 ffpa_tur_straits_world_port: "World Port of the Straits"
 ffpa_tur_straits_world_port_desc: "The Bosporus has been permanently specialized as an international harbor, logistics exchange, and migration gateway."
 ffpa_tur_straits_imperial_metropolis: "Imperial Metropolis of the Straits"
 ffpa_tur_straits_imperial_metropolis_desc: "The restored political capital concentrates administration, schools, and qualified labor on the Bosporus."
 ffpa_byz_new_rome_construction_drive: "Rebuilding New Rome"
 ffpa_byz_new_rome_construction_drive_desc: "Imperial contracts accelerate metropolitan construction and draw workers toward Constantinople."
 ffpa_byz_new_rome_world_harbor: "Harbor of the Roman World"
 ffpa_byz_new_rome_world_harbor_desc: "Constantinople is permanently organized around shipping, exchange, and the movement of people."
 ffpa_byz_new_rome_industrial_metropolis: "Workshops of New Rome"
 ffpa_byz_new_rome_industrial_metropolis_desc: "Power, construction, and large-scale manufacturing define the rebuilt imperial metropolis."
 ffpa_byz_new_rome_civic_capital: "Civic Capital of the Romans"
 ffpa_byz_new_rome_civic_capital_desc: "Schools, registers, and public offices make Constantinople the administrative heart of the commonwealth."
 ffpa_tur_anatolian_railway_program: "Anatolian Railway Program"
 ffpa_tur_anatolian_railway_program_desc: "An eight-year program gives infrastructure construction priority, at a modest administrative cost."
 ffpa_tur_anatolian_industry_program: "Anatolian Industrial Districts"
 ffpa_tur_anatolian_industry_program_desc: "Regional industrial clusters receive training support and coordinated investment for eight years."
 ffpa_tur_central_tax_register: "Central Tax Register"
 ffpa_tur_central_tax_register_desc: "Uniform assessments expand effective tax capacity but demand more bureaucracy and anger landed interests."
 ffpa_tur_provincial_tax_bargain: "Provincial Tax Bargain"
 ffpa_tur_provincial_tax_bargain_desc: "Local notables deliver a smaller revenue improvement in exchange for influence and administrative discretion."
 ffpa_tur_common_electoral_roll: "Common Electoral Roll"
 ffpa_tur_common_electoral_roll_desc: "A common roll strengthens civic legitimacy and reformist participation."
 ffpa_tur_communal_electoral_colleges: "Communal Electoral Colleges"
 ffpa_tur_communal_electoral_colleges_desc: "Religious and provincial communities organize representation through separate colleges."
 ffpa_tur_appointed_upper_chamber: "Appointed Upper Chamber"
 ffpa_tur_appointed_upper_chamber_desc: "The Crown balances elected institutions with a loyal appointed chamber."
 ffpa_byz_uniform_land_register: "Uniform Imperial Land Register"
 ffpa_byz_uniform_land_register_desc: "A single cadastral standard improves taxation at the cost of bureaucratic effort and elite resistance."
 ffpa_byz_provincial_tax_privileges: "Provincial Fiscal Privileges"
 ffpa_byz_provincial_tax_privileges_desc: "The provinces deliver stable revenues while retaining exemptions negotiated with Church and landowners."
 ffpa_byz_common_civic_roll: "Common Roman Civic Roll"
 ffpa_byz_common_civic_roll_desc: "Citizens enter elections through a single imperial register."
 ffpa_byz_provincial_delegations: "Provincial Delegations"
 ffpa_byz_provincial_delegations_desc: "Provincial and ecclesiastical delegations mediate representation across the empire."
 ffpa_byz_crown_senate: "Senate of the Crown"
 ffpa_byz_crown_senate_desc: "An upper chamber appointed by the monarch reinforces the restored imperial constitution."
 ffpa_imperial_multilingual_chancery: "Multilingual Chancery"
 ffpa_imperial_multilingual_chancery_desc: "Translated forms and a multilingual civil service make imperial administration more accessible."
 ffpa_imperial_central_chancery: "Central Chancery"
 ffpa_imperial_central_chancery_desc: "Uniform procedure strengthens the center, though it gives less room to local identities."
 ffpa_imperial_provincial_representation: "Provincial Representation"
 ffpa_imperial_provincial_representation_desc: "Recognized provincial representation broadens the legitimacy of imperial institutions."
 ffpa_imperial_notables_compromise: "Compromise with the Notables"
 ffpa_imperial_notables_compromise_desc: "Local elites uphold order in exchange for a formal place in imperial government."
 ffpa_imperial_common_oath: "Common Military Oath"
 ffpa_imperial_common_oath_desc: "All regiments swear the same civic oath, strengthening cohesion and offensive spirit."
 ffpa_imperial_separate_regiments: "Provincial Regimental System"
 ffpa_imperial_separate_regiments_desc: "Provincial regiments retain local organization while serving under a common command."

 # One-off Turkish events
 ffpa_flavor.10.t: "The Anatolian Industrial Congress"
 ffpa_flavor.10.d: "Anatolia's economy has grown during reconstruction, and engineers, provincial officials, and manufacturers are debating the next round of investment. A railway program would connect the plateau to its markets; an industrial program would expand production in its towns. The government must decide which effort to support first."
 ffpa_flavor.10.f: "A manufacturer pointed at a drawing of his works. “We can begin when the machinery arrives.” The railway engineer laid a hand on the map. “First tell me where you intend to unload it.”"
 ffpa_flavor.10.a: "Give the trunk railways priority."
 ffpa_flavor.10.b: "Build regional industrial districts."
 ffpa_flavor.11.t: "A Register for the New State"
 ffpa_flavor.11.d: "The old tax rolls are incomplete, contradictory, and fiercely defended by provincial intermediaries. #bold A uniform register#! could finance a modern state, but compromise would preserve order and cost less political capital."
 ffpa_flavor.11.f: "The tax officer wanted every receipt entered under the same numbering system. A provincial intermediary opened the old book at a folded corner. “Change the numbers if you wish. Someone must still know which household this entry means.”"
 ffpa_flavor.11.a: "Impose one central register."
 ffpa_flavor.11.b: "Bargain with provincial notables."
 ffpa_flavor.12.t: "Ballots for an Imperial Country"
 ffpa_flavor.12.d: "The first national campaign after reconstruction has brought competing proposals for representation. A common electoral roll emphasizes individual citizenship; communal colleges seek to retain their organized channels; conservative voices ask for checks within the representative system. The government must decide which arrangements it will support."
 ffpa_flavor.12.f: "A printer nailed the election notice to the wall. The people gathering around it first looked for their place of registration. A community delegate asked, “Should our people find their names on this roll, or report to their own hall?”"
 ffpa_flavor.12.a: "Establish a common electoral roll."
 ffpa_flavor.12.b: "Recognize communal electoral colleges."
 ffpa_flavor.12.c: "Balance the chamber with Crown appointees."
 ffpa_flavor.13.t: "The Languages of the Chancery"
 ffpa_flavor.13.d: "The restored administration must decide whether subjects may meet the state in #bold their own languages#! or whether every office will work through one uniform imperial procedure."
 ffpa_flavor.13.f: "The prospective clerk read the same notice in two languages. The examiner put down his pen and asked whether he also understood the speech of the villages. “A document can be translated,” he said. “The people at the counter may not speak like a document.”"
 ffpa_flavor.13.a: "Recruit a multilingual civil service."
 ffpa_flavor.13.b: "Require every office to follow one central procedure."
 ffpa_flavor.14.t: "Seats for the Provinces"
 ffpa_flavor.14.d: "Provincial delegates demand regular representation, while established notables offer a quieter bargain: influence for themselves in return for order in the districts they know."
 ffpa_flavor.14.f: "A provincial notable explained that he knew whom to approach with the center's requests. A new delegate laid a petition on the table. “What we ask is that next time, we need not approach anyone through you.”"
 ffpa_flavor.14.a: "Give the provinces recognized representation."
 ffpa_flavor.14.b: "Reach a compact with the notables."
 ffpa_flavor.15.t: "The Oath of the Regiments"
 ffpa_flavor.15.d: "The army contains men from many provinces and faiths. Its commanders now debate whether every soldier should swear one civic oath or whether provincial regiments should retain their own forms and traditions."
 ffpa_flavor.15.f: "Commands sounded across the parade ground in the voices of different regiments. An officer handed two proposed oaths to a veteran. After reading them, he said, “They will stand by their own men. They must also know that the next regiment belongs beside them.”"
 ffpa_flavor.15.a: "One army, one civic oath."
 ffpa_flavor.15.b: "Preserve provincial regiments under common command."

 # One-off Byzantine events
 ffpa_flavor.20.t: "The Charter of New Rome"
 ffpa_flavor.20.d: "The great metropolitan works are complete. The city can now be chartered as the harbor of a Roman world, the workshop of an industrial empire, or the civic capital of a multinational commonwealth."
 ffpa_flavor.20.f: "The harbor delegation brought berth plans, the engineers brought power estimates, and the university brought a waiting list. The chair no longer asked what New Rome should commemorate. “What will the next generation be able to do through this city?”"
 ffpa_flavor.20.a: "Make it the harbor of the Roman world."
 ffpa_flavor.20.b: "Make it the workshops of New Rome."
 ffpa_flavor.20.c: "Make it the civic capital of the Romans."
 ffpa_flavor.21.t: "The Imperial Land Register"
 ffpa_flavor.21.d: "Old grants, ecclesiastical exemptions, and modern surveys overlap across the restored empire. #bold A uniform cadaster#! promises revenue and equal procedure; negotiated provincial privileges promise a less turbulent settlement."
 ffpa_flavor.21.f: "The surveyor placed a new map beside the deed. The provincial representative did not dispute the boundary, only whether the exemption written in its margin still counted. Measuring land was the easier task. The dispute concerned the rights attached to it."
 ffpa_flavor.21.a: "Issue one uniform imperial register."
 ffpa_flavor.21.b: "Confirm negotiated provincial privileges."
 ffpa_flavor.22.t: "Ballots in the Roman World"
 ffpa_flavor.22.d: "The first imperial election campaign has brought the question of representation to the provinces. Reformers seek a common civic roll, provincial leaders favor organized delegations, and conservatives want a more cautious institution to balance the elected chamber. The government must decide which arrangement to support."
 ffpa_flavor.22.f: "A candidate printed “Roman Citizen” at the top of his leaflet. A listener pointed to the constituency named beneath it. “In the chamber, will you speak for that heading, or for the place where we live?”"
 ffpa_flavor.22.a: "Create a common Roman civic roll."
 ffpa_flavor.22.b: "Receive provincial delegations."
 ffpa_flavor.22.c: "Restore a Senate of the Crown."
 ffpa_flavor.23.t: "The Tongues of the Imperial Chancery"
 ffpa_flavor.23.d: "Petitions from the provinces have reached the central offices, but the means of handling them remain unsettled. Some officials propose a #bold multilingual civil service#! so residents can state their affairs in familiar languages. Others insist on one administrative language and a common procedure. The government must decide how its new administration will speak with the provinces."
 ffpa_flavor.23.f: "The clerk finished reading the translation. The petitioner pointed to the original again. “The meaning is correct,” said the interpreter. “He wants to know whether he may write his next letter the same way.”"
 ffpa_flavor.23.a: "Expand the multilingual civil service."
 ffpa_flavor.23.b: "Standardize the central administrative language and procedure."
 ffpa_flavor.24.t: "The Provincial Question"
 ffpa_flavor.24.d: "Delegates seek durable seats in the restored order. Landowners and clergy instead offer their local authority as the foundation of imperial stability."
 ffpa_flavor.24.f: "A provincial notable listed the families and townships he knew. The delegate across the table pointed to those absent from his list. “They pay taxes and serve as well. Who is to speak for them?”"
 ffpa_flavor.24.a: "Recognize provincial representation."
 ffpa_flavor.24.b: "Compromise with the established notables."
 ffpa_flavor.25.t: "The Army of the Romans"
 ffpa_flavor.25.d: "The restored army must become more than a collection of regional formations. A common civic oath would create a single military identity; provincial regiments would trade uniformity for continuity and local trust."
 ffpa_flavor.25.f: "When the new oath reached camp, a captain read it to his soldiers and asked them to repeat it in familiar words. “I want to know,” he said, “whether it still means the same thing once it leaves the page.”"
 ffpa_flavor.25.a: "Every regiment will swear one Roman oath."
 ffpa_flavor.25.b: "Keep provincial regiments under imperial command."

 # Imperial regional construction journals and permanent state rewards
 je_group_ffpa_imperial_development: "Imperial Development"
 je_ffpa_via_egnatia: "Renew the Via Egnatia"
 je_ffpa_via_egnatia_reason: "The route from Albania through Macedonia and Western Thrace to Constantinople must function as a continuous corridor. Merchants need cargo to transfer reliably, while local offices handle registration and administration along each section. #bold Rail connections and administrative standards#! must work together if the states along the route are to be more than neighboring stretches of line.\n\nThe states actually covered by the program retain a specialization in infrastructure and overland commerce."
 je_ffpa_danube_thrace_corridor: "The Danube–Thrace Corridor"
 je_ffpa_danube_thrace_corridor_reason: "Traffic from the Danube basin meets the land routes of Thrace across Bulgaria, Dobrudja, and Northern Thrace. River ports concern themselves with handling cargo, railways with schedules, and tax offices with recording its passage. Bringing #bold river ports, rail junctions, and tax offices#! into compatible arrangements will let the corridor serve a common hinterland.\n\nThe covered states retain stronger infrastructure and fiscal reach."
 je_ffpa_aegean_maritime_network: "The Aegean Maritime Network"
 je_ffpa_aegean_maritime_network_reason: "The ports of Attica, Crete, the Aegean islands, and the Ionian Islands each serve their own hinterland, but residents need shipping that reaches more distant markets. Harbor arrangements, shipyard capacity, and island supplies depend on one another. A #bold connected maritime network#! requires port investment and shipping links to advance together, beyond the expansion of isolated quays.\n\nThe covered states retain greater maritime capacity, infrastructure, and attraction for migration."
 je_ffpa_southern_italian_harbors: "Harbors of the Inner Sea"
 je_ffpa_southern_italian_harbors_reason: "The ports, shipyards, and food industries of Campania, Apulia, Calabria, and Sicily need connections to a common supply system. Harbor officials seek transfer capacity, manufacturers need routes to Inner Sea markets, and local offices must coordinate rail and port expansion. #bold Connections between ports and productive hinterlands#! will shape these cities' place in imperial trade.\n\nThe covered states retain stronger manufacturing and Inner Sea trade."
 je_ffpa_nile_works: "The Nile Works"
 je_ffpa_nile_works_reason: "Agriculture along the Nile depends on more than work in the fields. Harvests must also be processed and transported before they reach a market. Irrigation, food industries, power, and railways in Lower, Middle, and Upper Egypt need to work together along the same valley. Producers and public offices depend upon this #bold network from field to market#!, while each directs only part of it.\n\nThe covered states retain stronger agriculture, infrastructure, and fiscal capacity."
 je_ffpa_ifriqiya_coastal_network: "The Ifriqiya Coastal Network"
 je_ffpa_ifriqiya_coastal_network_reason: "The coastal centers of Tunisia, Tripoli, and Libya connect different hinterlands and sea routes. Expanding ports need railway links; cargo transfers need customs offices and local administrations that can work together. #bold Compatible transport and administrative standards#! can connect the capacity of those centers into a dependable coastal network.\n\nThe covered states retain stronger coastal trade, infrastructure, and migration links."
 je_ffpa_anatolian_trunk_lines: "The Anatolian Trunk Lines"
 je_ffpa_anatolian_trunk_lines_reason: "Production links between Hüdavendigar, Ankara, Konya, and Adana cross railways and power facilities managed in different places. Manufacturers want dependable transport, engineers need common standards, and local offices must turn plans into working lines and grids. #bold A common timetable and power network#! can make the industrial spine function as a connected whole.\n\nThe covered states retain stronger manufacturing, qualifications, and infrastructure."
 je_ffpa_levant_trade_corridor: "The Levant Trade Corridor"
 je_ffpa_levant_trade_corridor_reason: "Trade across Aleppo, Syria, Lebanon, and Palestine needs connections between inland transport, coastal transfers, and public procedures. Merchants ask when cargo will reach port; local offices ask where their responsibilities begin and end. Rail and harbor expansion must be matched by administrative capacity if #bold a common trade corridor#! is to connect those stages.\n\nThe covered states retain stronger commerce, infrastructure, and revenue collection."
 je_ffpa_mesopotamian_waterworks: "The Mesopotamian Waterworks"
 je_ffpa_mesopotamian_waterworks_reason: "Mosul, Baghdad, Deir ez-Zor, and Basra share river and transport connections, but their irrigation, power, and food-processing plans cannot be made in isolation. Work upstream must connect with production downstream and shipping through the Gulf. Making #bold waterworks, energy, and transport serve the basin together#! requires local knowledge as well as national engineering capacity.\n\nThe covered states retain stronger agriculture, infrastructure, and food security."
 je_ffpa_italian_urban_axis: "The Italian Urban Axis"
 je_ffpa_italian_urban_axis_reason: "The cities of Piedmont, Lombardy, Emilia, Romagna, Tuscany, and Lazio each have their own municipal affairs and productive connections. The center seeks an industrial and administrative axis; local offices must fit common standards into existing networks. #bold Links between municipalities, railways, power grids, and industry#! should expand the cities' ability to cooperate rather than treat them as empty ground awaiting construction.\n\nThe covered states retain stronger manufacturing, infrastructure, taxation, and qualifications."
 je_ffpa_adriatic_arsenals: "The Adriatic Arsenals"
 je_ffpa_adriatic_arsenals_reason: "The shipyards of Venetia, Istria, and Dalmatia need dependable support from ports, railways, and power supplies. Procurement offices seek common specifications, yards need work and materials they can plan around, and harbor officials connect them. An #bold Adriatic arsenal and shipbuilding network#! requires both expanded facilities and compatible arrangements between naval supply and local industry.\n\nThe covered states retain stronger Adriatic shipbuilding, infrastructure, and commerce."
 je_ffpa_western_mediterranean_sea_lanes: "The Western Mediterranean Sea Lanes"
 je_ffpa_western_mediterranean_sea_lanes_reason: "The ports of Sardinia, Corsica, Malta, and the Balearic Islands can support one another only through connected sea routes. Merchant shipping needs dependable calls and transfers, naval yards need supplies, and island residents depend on links beyond their shores. #bold Continuity in transport across the sea#! requires coordination between ports rather than plans confined to individual islands.\n\nThe covered states retain stronger shipping, trade, infrastructure, and migration links."
 je_ffpa_spanian_littoral: "The Spanian Littoral"
 je_ffpa_spanian_littoral_reason: "The coastal economies of Andalusia, Valencia, and Murcia need to connect farming hinterlands, food processors, and workshops to their ports. Producers want goods shipped reliably, while railway and harbor offices must coordinate transfers between land and sea. Within the national network, #bold connections between coastal cities and their hinterlands#! still depend on infrastructure and everyday administration.\n\nThe covered states retain stronger agriculture, manufacturing, and trade."
 je_ffpa_mauretanian_coastal_road: "The Mauretanian Coastal Road"
 je_ffpa_mauretanian_coastal_road_reason: "The coastal corridor between Constantine, Algiers, and the Rif must keep ports connected to production in their hinterlands. Local offices direct each section, but transport workers and merchants need a route they can use continuously. Linking #bold railways, food industries, and administrative centers#! will let the coastal road serve its residents as well as connect names on a map.\n\nThe covered states retain stronger agriculture, infrastructure, trade, and migration along the western African coast."
 je_ffpa_alexandria_sinai_axis: "The Alexandria–Sinai Axis"
 je_ffpa_alexandria_sinai_axis_reason: "Connections from Alexandria and Lower Egypt toward Sinai and Matruh cross ports, overland transfers, and different administrative centers. Harbor officials concern themselves with cargo, public offices need staff, and railway and power facilities support both. Developing the #bold Mediterranean–Red Sea gateway#! requires these capacities to form a connected network.\n\nThe covered states retain stronger infrastructure, trade, taxation, and migration links."
