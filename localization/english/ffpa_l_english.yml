 je_ffpa_byz_restore_new_rome: "Restore New Rome"
 je_ffpa_byz_restore_new_rome_reason: "Turn Constantinople from a recovered capital into the working metropolis of a modern empire. Raise its port, railway, administration, university and power infrastructure while maintaining excellent access and public order. Completion permanently specializes the city in one of three directions."

 # Capital construction and one-off political economy modifiers
 ffpa_tur_straits_construction_drive: "Straits Construction Drive"
 ffpa_tur_straits_construction_drive_desc: "Priority materials, engineers, and labor are directed to the metropolitan works of Eastern Thrace."
 ffpa_tur_straits_world_port: "World Port of the Straits"
 ffpa_tur_straits_world_port_desc: "The Bosporus has been permanently specialized as an international harbor, logistics exchange, and migration gateway."
 ffpa_tur_straits_imperial_metropolis: "Imperial Metropolis of the Straits"
 ffpa_tur_straits_imperial_metropolis_desc: "The restored political capital concentrates administration, schools, and qualified labor on the Bosporus."
 ffpa_byz_new_rome_construction_drive: "Rebuilding New Rome"
 ffpa_byz_new_rome_construction_drive_desc: "Imperial contracts accelerate metropolitan construction and draw workers toward Constantinople."
 ffpa_byz_new_rome_world_harbor: "Harbor of the Roman World"
 ffpa_byz_new_rome_world_harbor_desc: "Constantinople is permanently organized around shipping, exchange, and the movement of people."
 ffpa_byz_new_rome_industrial_metropolis: "Workshops of New Rome"
 ffpa_byz_new_rome_industrial_metropolis_desc: "Power, construction, and large-scale manufacturing define the rebuilt imperial metropolis."
 ffpa_byz_new_rome_civic_capital: "Civic Capital of the Romans"
 ffpa_byz_new_rome_civic_capital_desc: "Schools, registers, and public offices make Constantinople the administrative heart of the commonwealth."
 ffpa_tur_anatolian_railway_program: "Anatolian Railway Program"
 ffpa_tur_anatolian_railway_program_desc: "An eight-year program gives infrastructure construction priority, at a modest administrative cost."
 ffpa_tur_anatolian_industry_program: "Anatolian Industrial Districts"
 ffpa_tur_anatolian_industry_program_desc: "Regional industrial clusters receive training support and coordinated investment for eight years."
 ffpa_tur_central_tax_register: "Central Tax Register"
 ffpa_tur_central_tax_register_desc: "Uniform assessments expand effective tax capacity but demand more bureaucracy and anger landed interests."
 ffpa_tur_provincial_tax_bargain: "Provincial Tax Bargain"
 ffpa_tur_provincial_tax_bargain_desc: "Local notables deliver a smaller revenue improvement in exchange for influence and administrative discretion."
 ffpa_tur_common_electoral_roll: "Common Electoral Roll"
 ffpa_tur_common_electoral_roll_desc: "A common roll strengthens civic legitimacy and reformist participation."
 ffpa_tur_communal_electoral_colleges: "Communal Electoral Colleges"
 ffpa_tur_communal_electoral_colleges_desc: "Religious and provincial communities organize representation through separate colleges."
 ffpa_tur_appointed_upper_chamber: "Appointed Upper Chamber"
 ffpa_tur_appointed_upper_chamber_desc: "The Crown balances elected institutions with a loyal appointed chamber."
 ffpa_byz_uniform_land_register: "Uniform Imperial Land Register"
 ffpa_byz_uniform_land_register_desc: "A single cadastral standard improves taxation at the cost of bureaucratic effort and elite resistance."
 ffpa_byz_provincial_tax_privileges: "Provincial Fiscal Privileges"
 ffpa_byz_provincial_tax_privileges_desc: "The provinces deliver stable revenues while retaining exemptions negotiated with Church and landowners."
 ffpa_byz_common_civic_roll: "Common Roman Civic Roll"
 ffpa_byz_common_civic_roll_desc: "Citizens enter elections through a single imperial register."
 ffpa_byz_provincial_delegations: "Provincial Delegations"
 ffpa_byz_provincial_delegations_desc: "Provincial and ecclesiastical delegations mediate representation across the empire."
 ffpa_byz_crown_senate: "Senate of the Crown"
 ffpa_byz_crown_senate_desc: "An upper chamber appointed by the monarch reinforces the restored imperial constitution."
 ffpa_imperial_multilingual_chancery: "Multilingual Chancery"
 ffpa_imperial_multilingual_chancery_desc: "Translated forms and a multilingual civil service make imperial administration more accessible."
 ffpa_imperial_central_chancery: "Central Chancery"
 ffpa_imperial_central_chancery_desc: "Uniform procedure strengthens the center, though it gives less room to local identities."
 ffpa_imperial_provincial_representation: "Provincial Representation"
 ffpa_imperial_provincial_representation_desc: "Recognized provincial representation broadens the legitimacy of imperial institutions."
 ffpa_imperial_notables_compromise: "Compromise with the Notables"
 ffpa_imperial_notables_compromise_desc: "Local elites uphold order in exchange for a formal place in imperial government."
 ffpa_imperial_common_oath: "Common Military Oath"
 ffpa_imperial_common_oath_desc: "All regiments swear the same civic oath, strengthening cohesion and offensive spirit."
 ffpa_imperial_separate_regiments: "Provincial Regimental System"
 ffpa_imperial_separate_regiments_desc: "Provincial regiments retain local organization while serving under a common command."

 # One-off Turkish events
 ffpa_flavor.10.t: "The Anatolian Industrial Congress"
 ffpa_flavor.10.d: "With the emergency phase of reconstruction ending, engineers, governors, and manufacturers meet to decide where the next great public effort should fall. A state railway plan promises to bind the plateau together; industrial districts promise faster gains in the cities already able to grow."
 ffpa_flavor.10.f: "A timetable and a factory ledger are two different maps of the same future."
 ffpa_flavor.10.a: "Give the trunk railways priority."
 ffpa_flavor.10.b: "Build regional industrial districts."
 ffpa_flavor.11.t: "A Register for the New State"
 ffpa_flavor.11.d: "The old tax rolls are incomplete, contradictory, and fiercely defended by provincial intermediaries. A uniform register could finance a modern state, but compromise would preserve order and cost less political capital."
 ffpa_flavor.11.f: "A state first learns its provinces by counting them."
 ffpa_flavor.11.a: "Impose one central register."
 ffpa_flavor.11.b: "Bargain with provincial notables."
 ffpa_flavor.12.t: "Ballots for an Imperial Country"
 ffpa_flavor.12.d: "The first national campaign since reconstruction forces the government to define who is represented as an individual citizen, who speaks through a community, and what reserve powers remain with the Crown."
 ffpa_flavor.12.f: "Every ballot describes the state that will count it."
 ffpa_flavor.12.a: "Establish a common electoral roll."
 ffpa_flavor.12.b: "Recognize communal electoral colleges."
 ffpa_flavor.12.c: "Balance the chamber with Crown appointees."
 ffpa_flavor.13.t: "The Languages of the Chancery"
 ffpa_flavor.13.d: "The restored administration must decide whether subjects may meet the state in their own languages or whether every office will work through one uniform imperial procedure."
 ffpa_flavor.13.f: "An empire speaks most often through forms, seals, and schoolbooks."
 ffpa_flavor.13.a: "Recruit a multilingual civil service."
 ffpa_flavor.13.b: "One chancery must use one procedure."
 ffpa_flavor.14.t: "Seats for the Provinces"
 ffpa_flavor.14.d: "Provincial delegates demand regular representation, while established notables offer a quieter bargain: influence for themselves in return for order in the districts they know."
 ffpa_flavor.14.f: "The center can hear the provinces through votes—or through patrons."
 ffpa_flavor.14.a: "Give the provinces recognized representation."
 ffpa_flavor.14.b: "Reach a compact with the notables."
 ffpa_flavor.15.t: "The Oath of the Regiments"
 ffpa_flavor.15.d: "The army contains men from many provinces and faiths. Its commanders now debate whether every soldier should swear one civic oath or whether provincial regiments should retain their own forms and traditions."
 ffpa_flavor.15.f: "Uniforms can be made alike in a day; loyalties take longer."
 ffpa_flavor.15.a: "One army, one civic oath."
 ffpa_flavor.15.b: "Preserve provincial regiments under common command."

 # One-off Byzantine events
 ffpa_flavor.20.t: "The Charter of New Rome"
 ffpa_flavor.20.d: "The great metropolitan works are complete. The city can now be chartered as the harbor of a Roman world, the workshop of an industrial empire, or the civic capital of a multinational commonwealth."
 ffpa_flavor.20.f: "Constantinople has survived as relic, prize, and memory. It must now choose how to live."
 ffpa_flavor.20.a: "Make it the harbor of the Roman world."
 ffpa_flavor.20.b: "Make it the workshops of New Rome."
 ffpa_flavor.20.c: "Make it the civic capital of the Romans."
 ffpa_flavor.21.t: "The Imperial Land Register"
 ffpa_flavor.21.d: "Old grants, ecclesiastical exemptions, and modern surveys overlap across the restored empire. A uniform cadaster promises revenue and equal procedure; negotiated provincial privileges promise a less turbulent settlement."
 ffpa_flavor.21.f: "The archive remembers every ruler, but the treasury recognizes only the latest seal."
 ffpa_flavor.21.a: "Issue one uniform imperial register."
 ffpa_flavor.21.b: "Confirm negotiated provincial privileges."
 ffpa_flavor.22.t: "Ballots in the Roman World"
 ffpa_flavor.22.d: "The first imperial campaign tests the political meaning of restoration. Citizens may vote on one common roll, provinces may send organized delegations, or the Crown may balance the elected chamber with a revived senate."
 ffpa_flavor.22.f: "Old names return easily; representative institutions must be built."
 ffpa_flavor.22.a: "Create a common Roman civic roll."
 ffpa_flavor.22.b: "Receive provincial delegations."
 ffpa_flavor.22.c: "Restore a Senate of the Crown."
 ffpa_flavor.23.t: "The Tongues of the Imperial Chancery"
 ffpa_flavor.23.d: "Petitions arrive in Greek, Turkish, Albanian, Bulgarian, Serbian, and Armenian. The palace must choose between a multilingual civil service and a rigorously uniform central chancery."
 ffpa_flavor.23.f: "The language of government decides who may answer it."
 ffpa_flavor.23.a: "Let the chancery speak to every province."
 ffpa_flavor.23.b: "Preserve one central administrative language."
 ffpa_flavor.24.t: "The Provincial Question"
 ffpa_flavor.24.d: "Delegates seek durable seats in the restored order. Landowners and clergy instead offer their local authority as the foundation of imperial stability."
 ffpa_flavor.24.f: "The provinces are governed from the capital, but never by the capital alone."
 ffpa_flavor.24.a: "Recognize provincial representation."
 ffpa_flavor.24.b: "Compromise with the established notables."
 ffpa_flavor.25.t: "The Army of the Romans"
 ffpa_flavor.25.d: "The restored army must become more than a collection of regional formations. A common civic oath would create a single military identity; provincial regiments would trade uniformity for continuity and local trust."
 ffpa_flavor.25.f: "An empire is tested where orders must cross the boundaries of language and home."
 ffpa_flavor.25.a: "Every regiment will swear one Roman oath."
 ffpa_flavor.25.b: "Keep provincial regiments under imperial command."

 # Imperial regional construction journals and permanent state rewards
 je_group_ffpa_imperial_development: "Imperial Development"
 je_ffpa_via_egnatia: "Renew the Via Egnatia"
 je_ffpa_via_egnatia_reason: "Reconnect Albania, Macedonia, and Western Thrace to Constantinople with reliable railways, administration, market access, and public order. Completion permanently improves infrastructure and trade along the route."
 je_ffpa_danube_thrace_corridor: "The Danube–Thrace Corridor"
 je_ffpa_danube_thrace_corridor_reason: "Develop Bulgaria, Dobrudja, and Northern Thrace as a governed rail-and-river corridor. Completion permanently improves their infrastructure and tax capacity."
 je_ffpa_aegean_maritime_network: "The Aegean Maritime Network"
 je_ffpa_aegean_maritime_network_reason: "Link Attica, Crete, the Aegean islands, and the Ionian Islands through modern ports and an Attic shipbuilding center. Completion permanently strengthens maritime trade, infrastructure, and migration."
 je_ffpa_southern_italian_harbors: "The Middle Sea Harbors"
 je_ffpa_southern_italian_harbors_reason: "As Byzantium, modernize the ports, railways, shipbuilding, and food industries of Campania, Apulia, Calabria, and Sicily. Completion permanently strengthens manufacturing and trade in southern Italy."
 je_ffpa_nile_works: "The Nile Works"
 je_ffpa_nile_works_reason: "Build railways, administration, food processing, and power along Lower, Middle, and Upper Egypt. Completion permanently strengthens agriculture, infrastructure, and tax capacity."
 je_ffpa_ifriqiya_coastal_network: "The Ifriqiya Coastal Network"
 je_ffpa_ifriqiya_coastal_network_reason: "Connect Tunisia, Tripoli, and Libya through ports, railways, and public administration. Completion permanently strengthens coastal trade, infrastructure, and migration."
 je_ffpa_anatolian_trunk_lines: "The Anatolian Trunk Lines"
 je_ffpa_anatolian_trunk_lines_reason: "Create an electrified industrial rail spine through Hüdavendigar, Ankara, Konya, and Adana. Completion permanently improves manufacturing, qualifications, and infrastructure."
 je_ffpa_levant_trade_corridor: "The Levant Trade Corridor"
 je_ffpa_levant_trade_corridor_reason: "Join Aleppo, Syria, Lebanon, and Palestine with rail, ports, and public offices. Completion permanently strengthens trade, infrastructure, and taxation."
 je_ffpa_mesopotamian_waterworks: "The Mesopotamian Waterworks"
 je_ffpa_mesopotamian_waterworks_reason: "As Turkey, restore the productive river system of Mosul, Baghdad, Deir ez-Zor, and Basra with rail, power, food processing, and a modern Gulf port. Completion permanently strengthens agriculture, infrastructure, and food security."
 je_ffpa_italian_urban_axis: "The Italian Urban Axis"
 je_ffpa_italian_urban_axis_reason: "As Byzantium, bind Piedmont, Lombardy, Emilia, Romagna, Tuscany, and Lazio into an electrified industrial and administrative corridor. Completion permanently strengthens manufacturing, infrastructure, taxation, and qualifications."
 je_ffpa_adriatic_arsenals: "The Adriatic Arsenals"
 je_ffpa_adriatic_arsenals_reason: "As Byzantium, modernize the ports, railways, power, and shipyards of Venetia, Istria, and Dalmatia. Completion permanently strengthens Adriatic shipbuilding, infrastructure, and trade."
 je_ffpa_western_mediterranean_sea_lanes: "The Western Mediterranean Sea Lanes"
 je_ffpa_western_mediterranean_sea_lanes_reason: "As Byzantium, link Sardinia, Corsica, Malta, and the Balearic Islands through fortified commercial harbors and naval yards. Completion permanently improves shipbuilding, trade, infrastructure, and migration."
 je_ffpa_spanian_littoral: "The Spanian Littoral"
 je_ffpa_spanian_littoral_reason: "As Byzantium, develop Andalusia, Valencia, and Murcia as productive coastal provinces with ports, railways, food processing, and industry. Completion permanently strengthens agriculture, manufacturing, and trade."
 je_ffpa_mauretanian_coastal_road: "The Mauretanian Coastal Road"
 je_ffpa_mauretanian_coastal_road_reason: "Connect Constantine, Algiers, and the Rif with ports, railways, administration, and food industries. Completion permanently strengthens agriculture, infrastructure, trade, and migration along the western African coast."
 je_ffpa_alexandria_sinai_axis: "The Alexandria–Sinai Axis"
 je_ffpa_alexandria_sinai_axis_reason: "Develop Lower Egypt, Sinai, and Matruh into an electrified maritime corridor supported by Alexandria's docks and public administration. Completion permanently strengthens infrastructure, trade, taxation, and migration."
