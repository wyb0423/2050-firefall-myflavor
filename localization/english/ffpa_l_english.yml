 # Finite Byzantine western-integration events
 ffpa_flavor.30.t: "The Mediterranean Investment Congress"
 ffpa_flavor.30.d: "The completion of several great works in the restored provinces has brought industrialists, engineers, bankers, and harbor authorities to New Rome. They ask the state to establish a #bold permanent investment framework#! to guide the capital of the restored Mediterranean."
 ffpa_flavor.30.review_d: "The earlier congress's temporary credit arrangements are no longer enough to serve as a lasting investment policy. Delegates have returned to New Rome to turn that experience into permanent institutions. They still disagree over whether capital should be directed centrally, flow through transport networks, or rely more heavily on provincial bodies."
 ffpa_flavor.30.f: "The banker first asked who would guarantee the credit; the harbor delegate asked whether it could connect the hinterland. An engineer listened for a while. “Each of us has brought one part of the works. This meeting must decide who joins them together.”"
 ffpa_flavor.30.a: "Establish the New Roman Industrial Credit Directorate."
 ffpa_flavor.30.b: "Bind the sea with rails, ports, and free harbors."
 ffpa_flavor.30.c: "Charter a league of provincial development banks."

 ffpa_flavor.31.t: "The Western Provincial Cadastre"
 ffpa_flavor.31.d: "The restored provinces retain land deeds, municipal privileges, and tax customs inherited from several governments. Jurists demand #bold one imperial register#!, municipal leaders defend negotiated tax compacts, and the general staff proposes a military survey of the outer provinces."
 ffpa_flavor.31.review_d: "The first western survey was a temporary administrative expedient. With its commissions dispersing and provincial records diverging once more, the Empire must ratify a permanent cadastral settlement."
 ffpa_flavor.31.f: "A municipal delegate pointed to the signatures on a tax compact; the surveyor pointed to a boundary on the new map. The documents did not wholly conflict, but they answered different questions. One showed where the land lay; the other recorded who had promised to bear its obligations."
 ffpa_flavor.31.a: "One measure, one register, one imperial cadastre."
 ffpa_flavor.31.b: "Recognize the tax compacts of the western municipalities."
 ffpa_flavor.31.c: "Place the outer provinces under the Imperial Military Survey."

 ffpa_flavor.32.t: "The Western Roman Citizenship Charter"
 ffpa_flavor.32.d: "Regional works and the development of the Rhomaic commonwealth have brought the status of newly acquired provinces and their residents before the center. Delegates debate whether #bold Roman citizenship#! should extend as a shared identity, rest upon compacts with cities and provinces, or depend more closely on service to the state. The government must establish the basis of a lasting settlement."
 ffpa_flavor.32.review_d: "The earlier citizenship charter still sets out a principle of shared identity, but its arrangements need a form that can endure in practice. Delegates are reconsidering the relationship between cities, provinces, and the state to establish a lasting basis for the charter."
 ffpa_flavor.32.f: "A delegate placed a local identity paper beside the draft charter. “I know this is recognized at home,” he said. “Today we must decide what the state recognizes when we leave home.”"
 ffpa_flavor.32.a: "There shall be no provinces among Romans."
 ffpa_flavor.32.b: "Bind cities and provinces through civic compacts."
 ffpa_flavor.32.c: "Let service to the Empire confer citizenship."

 ffpa_flavor.33.t: "Delegates of the Western Provinces"
 ffpa_flavor.33.d: "With an election campaign under way, the restored provinces demand #bold a settled place#! in imperial politics. Reformers call for one electoral roll, provincial leaders defend territorial delegations, and conservative notables demand an upper chamber to filter the western voice."
 ffpa_flavor.33.review_d: "The first western representation settlement was written as an electoral compromise, not a lasting constitution. Delegates have returned to demand that their place in imperial politics be confirmed permanently."
 ffpa_flavor.33.f: "A delegate from the West submitted his address, then asked about the next session. “We have arrived this time,” he said. “The arrangement of seats must tell people how they are to return.”"
 ffpa_flavor.33.a: "Enter every citizen upon one imperial electoral roll."
 ffpa_flavor.33.b: "Seat permanent delegations from the western provinces."
 ffpa_flavor.33.c: "Let the Crown appoint an imperial senate."
 ffpa_flavor.33.c_republic: "Entrust a senate to the notables of the West."

