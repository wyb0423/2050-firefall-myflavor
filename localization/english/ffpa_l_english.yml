 ffpa_byz_italia_postwar_expenses_v1_desc: "For five years, the treasury continuously funds land surveys, relief, road repairs, and the transfer to civil administration."
 ffpa_byz_spania_postwar_expenses_v1: "Spanian Provincial Settlement Funding"
 ffpa_byz_spania_postwar_expenses_v1_desc: "For five years, the treasury continuously funds land surveys, relief, road repairs, and the transfer to civil administration."
 ffpa_byz_balkans_restored_v1: "The Danubian Provinces Restored"
 ffpa_byz_balkans_restored_v1_desc: "Direct rule across the Balkans gives lasting weight to New Rome's imperial claims."
 ffpa_byz_anatolia_restored_v1: "Anatolia Restored"
 ffpa_byz_anatolia_restored_v1_desc: "Direct rule across the Anatolian interior gives imperial legitimacy a lasting territorial foundation."
 ffpa_byz_oriens_restored_v1: "The Oriens Restored"
 ffpa_byz_oriens_restored_v1_desc: "The return of the eastern provinces makes the restored empire a fact beyond the Aegean."
 ffpa_byz_aegyptus_restored_v1: "Aegyptus Restored"
 ffpa_byz_aegyptus_restored_v1_desc: "Control of Alexandria, the Nile, and Sinai lends enduring authority to New Rome."
 ffpa_byz_africa_restored_v1: "Roman Africa Restored"
 ffpa_byz_africa_restored_v1_desc: "The imperial standard on the African coast gives lasting prestige to the restoration."
 ffpa_byz_italia_restored_v1: "Italia Restored"
 ffpa_byz_italia_restored_v1_desc: "Direct rule over Italy and its islands gives lasting force to the empire's Roman claim."
 ffpa_byz_spania_restored_v1: "Spania Restored"
 ffpa_byz_spania_restored_v1_desc: "The westernmost restoration completes an imperial project spanning the Mediterranean."

 ffpa_flavor.39.t: "An Imperial Restoration Agenda"
 ffpa_flavor.39.d: "Generals, jurists, diplomats, and provincial delegates debate the recovered imperial maps. Restoration advocates ask the government to inherit historical frontiers; administrative and diplomatic officials demand defined objectives and limits. The next agenda must name its frontier, accept a deadline, and leave the government answerable if it fails."
 ffpa_flavor.39.f: "A general drew several routes across the map. The treasury official erased none of them, but placed a calendar beside it. “Please add the dates.”"
 ffpa_byz_restoration_council_balkans_option: "Proclaim the Danube and Balkan restoration."
 ffpa_byz_restoration_council_anatolia_option: "Recover the Anatolian heartland."
 ffpa_byz_restoration_council_oriens_option: "Reconstitute the eastern provinces."
 ffpa_byz_restoration_council_aegyptus_option: "Open the road to Alexandria and the Nile."
 ffpa_byz_restoration_council_africa_option: "Carry the standards along the African coast."
 ffpa_byz_restoration_council_italia_option: "Turn the restoration toward Italy."
 ffpa_byz_restoration_council_spania_option: "Order the final western expedition to Spania."
 ffpa_byz_restoration_council_cancel_option: "The empire is not yet ready for another proclamation."

 ffpa_flavor.40.t: "The Danube Returns to New Rome"
 ffpa_flavor.40.d: "The territories listed in this restoration agenda, from the Adriatic coast to the mouths of the Danube, have come under direct rule. The government must decide how to present that result abroad: seek a diplomatic settlement to ease concern, or celebrate a triumph that emphasizes its claims. Administrative connections and provincial settlement remain work ahead."
 ffpa_flavor.40.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_balkans_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. The government must decide how to present that result abroad: seek a diplomatic settlement to ease concern, or celebrate a triumph that emphasizes its claims. Administrative connections and provincial settlement remain work ahead."
 ffpa_flavor.40.f: "At the river port, an official placed the new seal beside the old forms. He looked up at the arriving administrator. “Which register do we use for tomorrow's cargo?”"
 ffpa_flavor.41.t: "Anatolia Restored"
 ffpa_flavor.41.d: "The Anatolian territories named in the agenda have come under direct rule. Ports, plateau districts, and eastern marches now appear on the same jurisdictional list. Diplomats propose explaining the limits of that achievement to neighboring states; advocates of a triumph want its significance proclaimed. The government must still prepare the administrative connections that follow."
 ffpa_flavor.41.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_anatolia_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. Ports, plateau districts, and eastern marches now appear on the same jurisdictional list. Diplomats propose explaining the limits of that achievement to neighboring states; advocates of a triumph want its significance proclaimed. The government must still prepare the administrative connections that follow."
 ffpa_flavor.41.f: "A provincial official unfolded a route map across the plateau and marked several stations. “The boundaries have been reported. These places will need regular answers from now on.”"
 ffpa_flavor.42.t: "Receiving the Eastern Provinces"
 ffpa_flavor.42.d: "The territories of Cyprus, Syria, Palestine, and the Euphrates frontier named in this agenda have come under New Rome's direct rule. The territorial promise has been fulfilled, but changing seals will not by itself connect local offices to the center. The government must first decide whether to answer this achievement with a diplomatic settlement or a triumph."
 ffpa_flavor.42.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_oriens_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. The territorial promise has been fulfilled, but changing seals will not by itself connect local offices to the center. The government must first decide whether to answer this achievement with a diplomatic settlement or a triumph."
 ffpa_flavor.42.f: "Port correspondence and inland reports reached the receiving officers together. Their supervisor placed them in two rows. “One government does not make a sea route and a land route the same problem.”"
 ffpa_flavor.43.t: "The Nile Under the Roman Standard"
 ffpa_flavor.43.d: "The territories around Alexandria, the Nile valley, and Sinai named in the agenda have come under direct rule. The government has gained a new domain and must indicate how it intends to use that position. A diplomatic settlement may ease concern abroad; a triumph would emphasize restoration's symbolism. Neither can replace the work of governing valley and harbor."
 ffpa_flavor.43.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_aegyptus_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. The government has gained a new domain and must indicate how it intends to use that position. A diplomatic settlement may ease concern abroad; a triumph would emphasize restoration's symbolism. Neither can replace the work of governing valley and harbor."
 ffpa_flavor.43.f: "After hearing the transfer proclamation, a river-transport official left the cargo schedule on the table. “Where will the new orders come from?” he asked. “The boats will not wait for us to finish deciding.”"
 ffpa_flavor.44.t: "The Eagles Return to Africa"
 ffpa_flavor.44.d: "The designated territories extending from Libya toward the Rif have come under direct rule. The long coast makes the restoration conspicuous while leaving the government with the work of connecting different ports and local offices. The center must first choose between a diplomatic settlement to ease outside concern and a triumph publicly reaffirming its claims."
 ffpa_flavor.44.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_africa_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. The long coast makes the restoration conspicuous while leaving the government with the work of connecting different ports and local offices. The center must first choose between a diplomatic settlement to ease outside concern and a triumph publicly reaffirming its claims."
 ffpa_flavor.44.f: "A harbor official received the new letterhead and first copied down the return address. Asked whether he had read the proclamation, he pointed toward the quay. “I have. Now I need to know whom to write to about this place.”"
 ffpa_flavor.45.t: "The Return to Italia"
 ffpa_flavor.45.d: "The territories of the Italian peninsula, surrounding islands, and Adriatic approaches named in the agenda have come under direct rule. Restoration advocates seek a triumph worthy of the symbol; diplomats call for a settlement to contain concern abroad. The government must decide how to present its achievement while local administration and urban life continue."
 ffpa_flavor.45.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_italia_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. Restoration advocates seek a triumph worthy of the symbol; diplomats call for a settlement to contain concern abroad. The government must decide how to present its achievement while local administration and urban life continue."
 ffpa_flavor.45.f: "After the transfer ceremony, a municipal officer handed over the day's business. The delegation was still discussing ancient names when he turned to the next page. “Please take responsibility for these as well.”"
 ffpa_flavor.46.t: "The Western Shore Restored"
 ffpa_flavor.46.d: "The final coastal territories listed in the Spanian agenda have come under direct rule. The government may use this achievement as the basis for a diplomatic settlement or mark the conclusion of its western restoration agenda with a triumph. The proclaimed objective has been fulfilled; maintaining the new jurisdiction will remain an ongoing task."
 ffpa_flavor.46.d.named: "The last target territory has passed from [ROOT.GetCountry.MakeScope.Var('ffpa_byz_spania_completion_predecessor_v1').GetCountry.GetName] to the rule of [ROOT.GetCountry.GetName], fulfilling this agenda’s territorial objective. The government may use this achievement as the basis for a diplomatic settlement or mark the conclusion of its western restoration agenda with a triumph. The proclaimed objective has been fulfilled; maintaining the new jurisdiction will remain an ongoing task."
 ffpa_flavor.46.f: "A mariner marked the last receiving port on the chart, then traced the return route. “Getting here is one passage,” he said. “There will be many passages back and forth after it.”"
 ffpa_byz_restoration_success_settlement_option: "Submit the victory to an international settlement."
 ffpa_byz_restoration_success_settlement_tt: "For #v 8 years#!: #p +20%#! Infamy Decay, #n -35%#! Diplomatic Maneuvers, #n -10%#! Influence, #n -10%#! Prestige, and #n -2#! Armed Forces approval.\n\nProclaiming another restoration campaign ends these effects early."
 ffpa_byz_restoration_success_triumph_option: "Let New Rome celebrate a triumph."
 ffpa_byz_restoration_postwar_event_t: "Turn Victory into Government"
 ffpa_byz_restoration_postwar_event_d: "The territories transferred during this restoration agenda need to align land records, taxation, and public offices with their new jurisdiction. The government can draw on the treasury and assign central officials to accelerate incorporation, or leave the work to ordinary administration. Greater investment strengthens incorporation and migration conditions and reduces the pressure for political movements to generate further radicals; it does not directly remove existing radicals."
 ffpa_byz_restoration_postwar_event_f: "Registers from different offices lay on the transfer table. A local employee asked who would stay to reconcile them and which questions should go to the center. The receiving official opened the work list. “First decide how many people we can assign. Then the promises will have some substance.”"
 ffpa_byz_restoration_postwar_weak_option: "Dispatch itinerant registrars and fund limited relief."
 ffpa_byz_restoration_postwar_medium_option: "Establish provincial integration commissions."
 ffpa_byz_restoration_postwar_strong_option: "Build a full imperial reconstruction directorate."
 ffpa_byz_restoration_postwar_decline_option: "Let the ordinary administration take over gradually."
 ffpa_byz_restoration_postwar_weak_tt: "For five years, incur weekly expenses equal to #v 0.025%#! of GDP at the time of selection and reduce Bureaucracy output by #v 10%#!.\n\nSettled states gain #p +20%#! State Incorporation Speed and #p +10%#! Migration Attraction for ten years; they also generate #p 20% fewer#! Radicals and #p 20% more#! Loyalists from political movements."
 ffpa_byz_restoration_postwar_medium_tt: "For five years, incur weekly expenses equal to #v 0.05%#! of GDP at the time of selection and reduce Bureaucracy output by #v 15%#!.\n\nSettled states gain #p +35%#! State Incorporation Speed and #p +20%#! Migration Attraction for ten years; they also generate #p 35% fewer#! Radicals and #p 35% more#! Loyalists from political movements."
 ffpa_byz_restoration_postwar_strong_tt: "For five years, incur weekly expenses equal to #v 0.1%#! of GDP at the time of selection and reduce Bureaucracy output by #v 20%#!.\n\nSettled states gain #p +50%#! State Incorporation Speed and #p +30%#! Migration Attraction for ten years; they also generate #p 50% fewer#! Radicals and #p 50% more#! Loyalists from political movements."

 ffpa_flavor.47.t: "The Restoration Falters"
 ffpa_flavor.47.d: "The deadline proclaimed by the government has passed while parts of the chosen frontier remain beyond direct rule. The promise cannot simply be repeated: the government and high command must first endure the political consequences of failure."
 ffpa_flavor.47.f: "When the meeting ended, the map remained in place, but the deadline had been struck out. A provincial delegate took his copy of the resolution. “Before asking us to tell the people again, explain this attempt.”"
 ffpa_flavor.47.a: "The frontier will have to wait."

 ffpa_byz_foundation_territory_tt: "Fully own at least 10 of the 12 designated formation regions, including Eastern Thrace and Attica"
