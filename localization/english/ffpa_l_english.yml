 # Eastern Mediterranean interest-group ideologies
 ideology_ffpa_anatolian_reconstructionism: "Anatolian Reconstructionism"
 ideology_ffpa_anatolian_reconstructionism_desc: "#lore The armed forces regard disciplined national reconstruction, frontier settlement, and an integrated power grid as the foundations of Anatolia's renewed security.#!"
 ideology_ffpa_tur_state_developmentalism: "State Developmentalism"
 ideology_ffpa_tur_state_developmentalism_desc: "#lore Industrial capital should work with a capable state to rebuild transport, power, and manufacturing while preserving private enterprise.#!"
 ideology_ffpa_anatolian_civic_statism: "Anatolian Civic Statism"
 ideology_ffpa_anatolian_civic_statism_desc: "#lore Urban shopkeepers, officials, and small proprietors favor an orderly civic nation, protected domestic commerce, managed migration, and public infrastructure.#!"
 ideology_ffpa_provincial_compact: "Provincial Compact"
 ideology_ffpa_provincial_compact_desc: "#lore Landed and provincial notables accept modern administration and limited representation when their local authority is secured by a negotiated imperial compact.#!"
 ideology_ffpa_ottoman_constitutionalism: "Ottoman Constitutionalism"
 ideology_ffpa_ottoman_constitutionalism_desc: "#lore A multinational Ottoman civic identity should be protected by constitutional monarchy, representative institutions, professional administration, and public education.#!"
 ideology_ffpa_roman_restorationism: "Roman Restorationism"
 ideology_ffpa_roman_restorationism_desc: "#lore The restored Roman army exists to reunite and rebuild the old imperial space, binding recovered provinces through a common oath and modern infrastructure.#!"
 ideology_ffpa_mediterranean_developmentalism: "Mediterranean Developmentalism"
 ideology_ffpa_mediterranean_developmentalism_desc: "#lore Ports, industry, credit, and an integrated electricity system must turn the restored Mediterranean provinces into one productive economic network.#!"
 ideology_ffpa_new_rome_civicism: "New Rome Civicism"
 ideology_ffpa_new_rome_civicism_desc: "#lore Municipal officials, merchants, clerks, and small proprietors see New Rome as the center of an orderly civic commonwealth joined by commerce and public works.#!"
 ideology_ffpa_imperial_symphonia: "Imperial Symphonia"
 ideology_ffpa_imperial_symphonia_desc: "#lore Church and Crown should cooperate as distinct guardians of the restored Roman order, combining public faith, education, and imperial authority.#!"
 ideology_ffpa_rhomaic_civic_universalism: "Rhomaic Civic Universalism"
 ideology_ffpa_rhomaic_civic_universalism_desc: "#lore To be Roman is a public allegiance rather than an inheritance of blood or language; citizenship, education, and representation must bind the restored provinces together.#!"

