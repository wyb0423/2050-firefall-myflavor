 # Byzantine restoration campaigns
 je_group_ffpa_byzantine_restoration: "Imperial Restoration"
 ffpa_byz_convene_restoration_council: "Call an Imperial Restoration Council"
 ffpa_byz_convene_restoration_council_desc: "Ask the imperial restoration council to select a defined frontier for direct rule. No more than #v two campaigns#! may run at once, and the 10–15 year deadline begins only when a frontier is accepted.\n\nThe Balkan branch opens Italia; the Anatolian branch proceeds through Oriens, Aegyptus, and Africa; completing Italia and Africa opens Spania.\n\nBeginning a new campaign #bold ends any active Restoration Settlement#!."
 ffpa_byz_restoration_campaign_slot_available_tt: "Fewer than #v 2#! restoration campaigns are currently active"

 je_ffpa_byz_restore_balkans: "Restore the Danube and the Balkans"
 je_ffpa_byz_restore_balkans_reason: "The government has placed the lands south of the Danube and along the Adriatic within a restoration agenda. Its supporters seek a territory whose roads and ports can be governed directly from New Rome, but old maps alone cannot give provincial society a common interest with the center. Proclaiming #bold a Balkan restoration frontier#! turns a historical claim into a commitment with a deadline.\n\nSecure direct rule over every state listed in the completion conditions within #v 15 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_anatolia: "Recover Anatolia"
 je_ffpa_byz_restore_anatolia_reason: "Aegean ports, plateau cities, and the eastern marches form a connected objective in imperial policy. Restoration advocates want those links across Anatolia placed under direct rule; the government must weigh what such an extensive frontier asks of the state. #bold The Anatolian agenda#! will be tested by actual jurisdiction rather than the number of claims added to a map.\n\nSecure direct rule over every state listed in the completion conditions within #v 12 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_oriens: "Reconstitute the Oriens"
 je_ffpa_byz_restore_oriens_reason: "The political commitments of the Anatolian agenda have drawn attention toward Cyprus, Syria, and the Euphrates frontier. Restoration advocates gather islands, coasts, and inland territory under the name of the old eastern provinces; administrators must consider their different connections and jurisdictions. #bold Restoration in the East#! is first an objective of direct rule. The work of governing it will still follow.\n\nSecure direct rule over every state listed in the completion conditions within #v 12 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_aegyptus: "Return to Aegyptus"
 je_ffpa_byz_restore_aegyptus_reason: "Restoration advocates treat Alexandria, the Nile valley, and Sinai as one objective: the ports connect to the valley, which in turn needs routes to wider markets. By adopting that frontier, the government accepts responsibility for bringing distant districts under direct jurisdiction. #bold Egypt's strategic importance#! may explain the ambition, but it cannot supply the state capacity needed to fulfill it.\n\nSecure direct rule over every state listed in the completion conditions within #v 10 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_africa: "Restore Roman Africa"
 je_ffpa_byz_restore_africa_reason: "From Libya to the Rif, a long coastline joins ports with distinct hinterlands. Restoration advocates have recovered the name of Roman Africa from history; the government has made it a territorial agenda. Supporters argue for #bold a connected coastal frontier#!. Linking its local administrations and sea routes will remain a separate task after direct control is secured.\n\nSecure direct rule over every state listed in the completion conditions within #v 12 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_italia: "Recover Italia"
 je_ffpa_byz_restore_italia_reason: "Italian place names give restoration unusual symbolic force, but the peninsula, islands, and Adriatic approaches each bring practical demands of jurisdiction. Advocates look to those names as evidence of national ambition; diplomats ask how that ambition will be read abroad. #bold The Italian agenda#! must bind a symbolic promise to a defined frontier and deadline.\n\nSecure direct rule over every state listed in the completion conditions within #v 15 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restore_spania: "Return to Spania"
 je_ffpa_byz_restore_spania_reason: "The restoration records of Italy and Africa have encouraged advocates to turn toward the Iberian coast. Using the old name of Spania, they gather several coastal territories into a single agenda; shipping and diplomatic officials must consider the weight of that distant commitment. The government will subject #bold its final western coastal objective#! to the same test of a deadline as the earlier agendas.\n\nSecure direct rule over every state listed in the completion conditions within #v 10 years#!. Missing the deadline brings an eight-year failure penalty and prevents this agenda from being proposed again for five years."
 je_ffpa_byz_restoration_campaign_status: "Directly control every state listed in the completion conditions before the deadline; at most #v 2#! restoration agendas may run together. Claims permit use of the cheaper Return State war goal, but do not guarantee diplomatic success."

