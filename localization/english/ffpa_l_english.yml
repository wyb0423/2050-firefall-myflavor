 # Finite Byzantine western-integration events
 ffpa_flavor.30.t: "The Mediterranean Investment Congress"
 ffpa_flavor.30.d: "The completion of several great works in the restored provinces has brought industrialists, engineers, bankers, and harbor authorities to New Rome. They ask the state to decide which institutions will permanently direct the capital of the restored Mediterranean."
 ffpa_flavor.30.review_d: "The temporary credit settlements of an earlier congress can no longer govern a mature western economy. The old delegates have returned to New Rome to confirm a permanent investment constitution for the restored provinces."
 ffpa_flavor.30.f: "A railway may end at a frontier, but capital and cargo do not. The restored provinces must be made parts of one productive sea."
 ffpa_flavor.30.a: "Establish the New Roman Industrial Credit Directorate."
 ffpa_flavor.30.b: "Bind the sea with rails, ports, and free harbors."
 ffpa_flavor.30.c: "Charter a league of provincial development banks."

 ffpa_flavor.31.t: "The Western Provincial Cadastre"
 ffpa_flavor.31.d: "The restored provinces retain land deeds, municipal privileges, and tax customs inherited from several governments. Jurists demand one imperial register, municipal leaders defend negotiated tax compacts, and the general staff proposes a military survey of the outer provinces."
 ffpa_flavor.31.review_d: "The first western survey was a temporary administrative expedient. With its commissions dispersing and provincial records diverging once more, the Empire must ratify a permanent cadastral settlement."
 ffpa_flavor.31.f: "Property, obligation, and public revenue must be made legible before reconstruction can become durable government."
 ffpa_flavor.31.a: "One measure, one register, one imperial cadastre."
 ffpa_flavor.31.b: "Recognize the tax compacts of the western municipalities."
 ffpa_flavor.31.c: "Place the outer provinces under the Imperial Military Survey."

 ffpa_flavor.32.t: "The Western Roman Citizenship Charter"
 ffpa_flavor.32.d: "The Rhomaic commonwealth now governs Italians, Spaniards, Maltese, Egyptians, and the peoples of the African coast. The Senate debates whether Roman citizenship is a universal identity, a covenant of cities and provinces, or a right earned through service to the Empire."
 ffpa_flavor.32.review_d: "The old citizenship charter survives, but its legal machinery has not kept pace with the restored provinces. The Senate reconvenes to translate its former principle into a permanent imperial settlement."
 ffpa_flavor.32.f: "The Empire will endure only if Rome is understood as a public allegiance shared by its peoples, not as the private inheritance of one tongue."
 ffpa_flavor.32.a: "There shall be no provinces among Romans."
 ffpa_flavor.32.b: "Bind cities and provinces through civic compacts."
 ffpa_flavor.32.c: "Let service to the Empire confer citizenship."

 ffpa_flavor.33.t: "Delegates of the Western Provinces"
 ffpa_flavor.33.d: "With an election campaign under way, the restored provinces demand a settled place in imperial politics. Reformers call for one electoral roll, provincial leaders defend territorial delegations, and conservative notables demand an upper chamber to filter the western voice."
 ffpa_flavor.33.review_d: "The first western representation settlement was written as an electoral compromise, not a lasting constitution. Delegates have returned to demand that their place in imperial politics be confirmed permanently."
 ffpa_flavor.33.f: "Representation may bind distant shores to New Rome—or teach every province how to bargain against it."
 ffpa_flavor.33.a: "Enter every citizen upon one imperial electoral roll."
 ffpa_flavor.33.b: "Seat permanent delegations from the western provinces."
 ffpa_flavor.33.c: "Let the Crown appoint an imperial senate."
 ffpa_flavor.33.c_republic: "Entrust a senate to the notables of the West."

