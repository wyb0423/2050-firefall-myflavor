 # Eastern Mediterranean formation chain and flavor
 ffpa_ottoman: "Ottoman"
 ffpa_rhomaic: "Rhomaic"
 ffpa_byzantium_only_greece_tt: "Only a formed Greece may pursue the restoration of the Byzantine Empire under a monarchy"
 ffpa_request_eastern_roman_title: "Consider the Eastern Roman Title"
 ffpa_request_eastern_roman_title_desc: "Bring the nationalist proposal to restore the Eastern Roman title formally before the Crown and government. This decision remains a route to the proposal even if the Greek Nationalism Journal Entry has already concluded."
 ffpa_eastern_roman_title_ionian_tt: "Owns territory in $STATE_IONIAN_ISLANDS$"
 ffpa_flavor.8.recovery.d: "The Greek nationalist program has formally run its course, but control of the Ionian Islands and the restored authority of the Crown have revived an unresolved proposal: to claim the mantle of Eastern Rome and restore the Byzantine Empire."
 ffpa_embrace_ambitious_agenda_recovery_tt: "#r #b Selecting this option accepts the Eastern Roman proposal and unlocks the restoration of $BYZ$ through [concept_nation_formation].#!#!"

 je_ffpa_tur_rebuild_anatolia: "Rebuild Anatolia"
 je_ffpa_tur_rebuild_anatolia_reason: "A united Turkey must reconnect war-torn Anatolia into a functioning state. Control at least ten core regions, expand the economy, and restore administrative and market order."
 je_ffpa_tur_ottoman_commonwealth: "The Ottoman Commonwealth"
 je_ffpa_tur_ottoman_commonwealth_reason: "Build an imperial commonwealth along three recoverable tracks: administration, civic inclusion, and internal stability. A track advances while its own conditions are met and gradually recedes when they are not; it does not reset outright.\n\nAdministration requires Monarchy, at least #v 55#! Legitimacy, a non-negative Bureaucracy balance, and #v 8#! of the eleven designated core states at #v 75%#! Market Access. Civic inclusion requires Monarchy, Cultural Exclusion or Multiculturalism, Freedom of Conscience or Total Separation, and base acceptance of at least #v 40#! for #v 4#! of five cultural groupings: Greek/Bulgarian/Serbian/Romanian, Albanian/Bosniak, Armenian, Kurdish, and Arab/Egyptian. Internal stability requires Monarchy, peace, no insurrectionary political movement, and #v 6#! designated core states below #v 18%#! Turmoil.\n\nCompletion adds Ottoman as a new primary culture while retaining Turkish."
 je_ffpa_tur_gate_of_two_continents: "Gate of Two Continents"
 je_ffpa_tur_gate_of_two_continents_reason: "Develop Eastern Thrace into the port and railway nexus linking the Balkans, Anatolia, and the world market."
 je_ffpa_gre_islands_and_mainland: "Islands and Mainland"
 je_ffpa_gre_islands_and_mainland_reason: "Bind the Greek mainland, Macedonia, and the Aegean islands into one state through administration, education, and a common market."
 je_ffpa_byz_new_rome: "The Re-Coronation of New Rome"
 je_ffpa_byz_new_rome_reason: "Proclamation alone does not make an empire. Control the Byzantine heartlands, rule from Constantinople, and prove New Rome can sustain legitimate, solvent, and stable government."
 je_ffpa_byz_rhomaic_commonwealth: "Commonwealth of the Romans"
 je_ffpa_byz_rhomaic_commonwealth_reason: "Build a Roman commonwealth along three recoverable tracks: administration, civic inclusion, and internal stability. A track advances while its own conditions are met and gradually recedes when they are not; it does not reset outright.\n\nAdministration requires at least #v 55#! Legitimacy, a non-negative Bureaucracy balance, and #v 9#! of the twelve designated core states at #v 80%#! Market Access. Civic inclusion requires Cultural Exclusion or Multiculturalism, Freedom of Conscience or Total Separation, and base acceptance of at least #v 40#! for #v 4#! of Turkish, Albanian, Bulgarian, Serbian, and Armenian culture. Internal stability requires peace, no insurrectionary political movement, and #v 7#! designated core states below #v 18%#! Turmoil.\n\nCompletion adds Rhomaic as a new primary culture while retaining Greek, and permanently increases eligible cultural assimilation by #p 20%#!."
 je_ffpa_byz_rhomaic_commonwealth_v2: "$je_ffpa_byz_rhomaic_commonwealth$"
 je_ffpa_byz_rhomaic_commonwealth_v2_reason: "$je_ffpa_byz_rhomaic_commonwealth_reason$"

 ffpa_tur_reconstruction_monarchical_compromise: "Monarchical Reconstruction Compromise"
 ffpa_tur_reconstruction_monarchical_compromise_desc: "Dynasty, bureaucracy, and provincial elites have temporarily united around rebuilding the state."
 ffpa_tur_anatolian_citizenship: "Anatolian Citizenship"
 ffpa_tur_anatolian_citizenship_desc: "The republic places common citizenship above imperial identity, offering the former imperial peoples limited but lasting acceptance."
 ffpa_tur_reconstruction_pragmatism: "Anatolian Reconstruction Pragmatism"
 ffpa_tur_reconstruction_pragmatism_desc: "The government concentrates its resources on administration, education, and infrastructure."
 ffpa_ottoman_civic_compact: "Ottoman Civic Compact"
 ffpa_ottoman_civic_compact_desc: "Ottoman identity has been recast as a shared political bond among many peoples rather than a replacement for their existing cultures."
 ffpa_tur_straits_gateway: "Gate of Two Continents"
 ffpa_tur_straits_gateway_desc: "Railways, ports, and public offices on the Straits serve a single global hub."
 ffpa_gre_islands_and_mainland: "Union of Islands and Mainland"
 ffpa_gre_islands_and_mainland_desc: "Common administration, education, and transport networks closely bind the Greek lands."
 ffpa_byz_civic_settlement: "Settlement of the Imperial Peoples"
 ffpa_byz_civic_settlement_desc: "New Rome accepts that an old name cannot govern alone; its subjects must see themselves represented in a civic order."
 ffpa_byz_church_and_crown: "Church and Crown"
 ffpa_byz_church_and_crown_desc: "The imperial house and the Orthodox Church together confer sacred legitimacy upon the restored empire."
 ffpa_byz_living_new_rome: "A Living New Rome"
 ffpa_byz_living_new_rome_desc: "Constantinople is no longer merely remembered: population, learning, and trade again converge upon a modern imperial capital."
 ffpa_rhomaic_civic_compact: "Rhomaic Civic Commonwealth"
 ffpa_rhomaic_civic_compact_desc: "Rhomaic becomes an inclusive political identity for the imperial peoples while preserving their existing cultural foundations."
 ffpa_rhomaic_civic_compact_v2: "Rhomaic Civic Commonwealth"
 ffpa_rhomaic_civic_compact_v2_desc: "Rhomaic becomes an inclusive political identity for the imperial peoples, preserving their cultural foundations while accelerating eligible cultural assimilation by 20%."

 ffpa_flavor.2.t: "The State After Reconstruction"
 ffpa_flavor.2.d: "Railways again cross the plateau, and tax collectors and postmen reach distant towns. As order returns to Anatolia, a deeper question emerges: should Turkey merely rebuild its machinery, or reinterpret the Ottoman inheritance?"
 ffpa_flavor.2.f: "Ruins may be rebuilt from old plans; a state must decide what it will become."
 ffpa_flavor.2.a: "Let the dynasty preside over a new imperial compact."
 ffpa_flavor.2.b: "The republic belongs to every citizen of Anatolia."
 ffpa_flavor.2.c: "Build schools, roads, and public offices first."

 ffpa_flavor.3.t: "The Ottoman Commonwealth"
 ffpa_flavor.3.d: "After sustained peace, inclusion, and institution-building, the Ottoman name has acquired a new meaning. No longer merely a dynasty or an age of conquest, it is becoming a state identity shared by Turks, Balkan peoples, Armenians, Kurds, and Arab subjects."
 ffpa_flavor.3.f: "One empire need not demand one ancestry."
 ffpa_flavor.3.a: "Establish the Ottoman Civic Compact."

 ffpa_flavor.4.t: "Gate of Two Continents"
 ffpa_flavor.4.d: "Trains pull into the terminus on the Straits while cargo ships queue beyond the harbor. Eastern Thrace is now a true nexus between Europe and Asia; the government must decide whether it should again become the political center of the country."
 ffpa_flavor.4.f: "Every timetable shortens the distance between two continents."
 ffpa_flavor.4.a: "Move the capital to Constantinople."
 ffpa_flavor.4.b: "Ankara remains the capital; the Straits face the world."

 ffpa_flavor.5.t: "Islands and Mainland"
 ffpa_flavor.5.d: "From the Peloponnese to Macedonia and from the Ionian to the Aegean, common schools, offices, and shipping routes are overcoming old isolation. Greece is becoming not merely one color on a map, but a shared daily reality."
 ffpa_flavor.5.f: "The sea no longer divides Greece; it joins Greece together."
 ffpa_flavor.5.a: "One country, joined by one sea."

 ffpa_flavor.6.t: "The Second Foundation of New Rome"
 ffpa_flavor.6.d: "The empire controls its historic heartlands, and Constantinople is again a capital capable of governing them. Court, Church, citizens, and delegates of the imperial peoples all demand an answer to the same question: by what principle will New Rome endure?"
 ffpa_flavor.6.f: "The walls remember the past, but the streets belong to the living."
 ffpa_flavor.6.a: "The empire must be a common state of its peoples."
 ffpa_flavor.6.b: "Let Church and Crown guard orthodoxy."
 ffpa_flavor.6.c: "Build Constantinople into a living New Rome."

 ffpa_flavor.7.t: "Commonwealth of the Romans"
 ffpa_flavor.7.d: "Years of stability and inclusion have carried a new identity from legal texts into schools, barracks, and civic life. Rhomaic no longer means erasing Greek, Turk, Albanian, Bulgar, Serb, or Armenian; it means that all may possess this empire together."
 ffpa_flavor.7.f: "If a state is to outlive memory, it must contain the living."
 ffpa_flavor.7.a: "We are all citizens of this New Rome."

