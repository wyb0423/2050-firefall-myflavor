 ig_trait_ffpa_tur_tanzimat_legacy: "Tanzimat Legacy"
 ig_trait_ffpa_tur_tanzimat_legacy_desc: "At their most influential, the Ottoman reformers turn the Tanzimat legacy into capable ministries and a steady program of legislation."
