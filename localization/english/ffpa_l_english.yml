l_english:
 # Eastern Mediterranean formation chain and flavor
 TUR_ADJ: "Turkish"
 GRE_ADJ: "Greek"
 ffpa_ottoman: "Ottoman"
 ffpa_rhomaic: "Rhomaic"
 ffpa_byzantium_only_greece_tt: "Only a formed Greece may pursue the restoration of the Byzantine Empire under a monarchy"
 ffpa_request_eastern_roman_title: "Consider the Eastern Roman Title"
 ffpa_request_eastern_roman_title_desc: "Bring the nationalist proposal to restore the Eastern Roman title formally before the Crown and government. This decision remains a route to the proposal even if the Greek Nationalism Journal Entry has already concluded."
 ffpa_eastern_roman_title_ionian_tt: "Owns territory in $STATE_IONIAN_ISLANDS$"
 je_greek_nationalism_reason: "Surviving maps and copies of speeches describe a Greek world beyond the present borders. Supporters see ties of kinship, worship, and trade across [GetGeographicRegion('geographic_region_megali_greece').GetName] and ask the new state to inherit an older program. Cautious officials first want to know what administration, revenue, and political support those claims will require.\n\nThe Fire broke the continuity of the old institutions, but their records still shape present choices. #bold Protecting a cultural community and extending a state's borders#! may reinforce one another; they can also place different obligations upon the government.[SCOPE.GetRootScope.GetCountry.GetCustom('byzantium_reason_text')]"
 je_greek_nationalism_lobby: "An old-world program, recovered with the state archives, is again being debated in public. Its supporters demand that the rebuilt Greek state turn historical memory into a coherent policy for the Greek communities beyond its present borders."
 greece.1.t: "Greece Reassembled"
 greece.1.d: "The regrouping of successor governments has brought a Greek state into being again. With institutions restored and the old archives reopened, the place of the wider [SCOPE.sCulture('greek_culture_scope').GetName] world in national policy can no longer be left undefined."
 greece.1.f: "Recovered maps cover the committee table. Some delegates see routes of kinship, worship, and trade; others see borders that the new state lacks the strength to administer. All agree on one point: the Fire broke political continuity, but it did not erase political memory."
 greece.1.a: "Make the old map a program of state."
 greece.1.b: "First consolidate the country we have rebuilt."
 ffpa_flavor.8.t: "The Eastern Roman Title"
 ffpa_flavor.8.d: "Royal advisers, Orthodox prelates, jurists, officers, and nationalist deputies have joined around a proposal drawn from the surviving Roman archives. With [SCOPE.sState('thrace_scope').GetStateRegion.GetName] and [SCOPE.sState('aydin_scope').GetStateRegion.GetName] again within reach of Greek policy, they ask the Crown to accept the Eastern Roman title and make New Rome a living project of state."
 ffpa_flavor.8.recovery.d: "The Greek nationalist program has formally run its course, but control of the Ionian Islands and the restored authority of the Crown have reopened an unresolved dossier. Royal advisers, Orthodox prelates, jurists, and officers again ask whether Greece should accept the Eastern Roman title and undertake the restoration of New Rome."
 ffpa_flavor.8.f: "A jurist lays a smoke-stained codex beside a newly printed state map. “We are not restoring a vanished century,” he tells the council. “We are deciding whether this state can make an old Roman name answer to the living.”"
 ffpa_flavor.8.a: "Make New Rome a task of state."
 ffpa_flavor.8.b: "The Greek state has work enough."
 ffpa_formation_byzantium.t: "Purple Phoenix"
 ffpa_formation_byzantium.d: "In rebuilt Constantinople, the Crown, the Orthodox Church, the armed forces, jurists, and delegates from the provinces have jointly proclaimed the Roman imperial title. [ROOT.GetCountry.GetName] now claims not an unbroken medieval administration, but a restored state founded upon the capital, laws, faith, and political memory that survived the Fire."
 ffpa_formation_byzantium.f: "The proclamation is read beneath repaired vaults while bells answer across the city. The old seals have been brought from the archives; the new ones bear the date of restoration. Outside, veterans, dockworkers, clerks, clergy, and provincial delegations crowd the streets. An ancient name has returned, but every living institution behind it must still be built."
 ffpa_formation_byzantium.a: "Let the Roman state prove its name."
 greece.4.t: "A Program Fulfilled"
 greece.4.d1: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_success_desc')]"
 greece.4.d2: "$ffpa_greek_nationalism_success_desc_limited$"
 greece.4.f: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_success_flavor')]"
 greece.4.a: "Turn the settlement into national confidence."
 greece.4.b: "Give the settlement the full authority of the state."
 greece.4.c: "Renew the governing coalition's mandate."
 ffpa_greek_nationalism_success_desc_byzantine: "The Greek national program has outgrown its original frame. Under [ROOT.GetCountry.GetNameNoFormatting], the recovered Eastern Roman title now belongs to a functioning state rather than an archival claim; the work of governing New Rome has begun."
 ffpa_greek_nationalism_success_desc_megali: "The state has politically joined the principal Greek lands of the Aegean and Macedonia. Different provinces and communities remain, but the Megali Idea has passed from a recovered map into an administrative reality."
 ffpa_greek_nationalism_success_desc_limited: "The rebuilt Greek state has secured the territorial and institutional foundations it needs to endure. Its national program can now be closed without making every line on an old map a permanent war aim."
 ffpa_greek_nationalism_success_flavor_byzantine: "The archives supplied a name; territory, budgets, and provincial administration supplied it with a government. The Roman state has returned to history, though it has yet to prove what kind of commonwealth it will become."
 ffpa_greek_nationalism_success_flavor_megali: "Port records, school registers, railway timetables, and military districts now describe a political space that the old documents only imagined. The victory belongs as much to clerks and engineers as to flags and armies."
 ffpa_greek_nationalism_success_flavor_limited: "For the first time since the Fire, the state's borders, institutions, and ambitions can be spoken of in the same sentence. Consolidation is not surrender; it is the decision to make what has been recovered governable and lasting."
 greece.5.t: "An Agenda Withdrawn"
 greece.5.d: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_failure_desc')]"
 greece.5.f: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_failure_flavor')]"
 greece.5.a: "The government must answer for this."
 greece.5.b: "[ROOT.GetCountry.GetRuler.GetFullName] must answer for this."
 ffpa_greek_nationalism_failure_desc_byzantine: "The Eastern Roman project can no longer be sustained. In those parts of $STATE_AYDIN$, $STATE_EASTERN_THRACE$, $STATE_HUDAVENDIGAR$, and $STATE_TRABZON$ still beyond our rule, Greek communities are being ordered to evacuate to the [ROOT.GetCountry.GetAdjectiveNoFormatting] capital, and their former homelands are being struck from the state's national map."
 ffpa_greek_nationalism_failure_desc_megali: "The conditions for pursuing the Megali Idea as an independent national policy no longer hold. The government is withdrawing the program, while different voices demand an account of how its promises will be closed and its existing gains maintained."
 ffpa_greek_nationalism_failure_desc_limited: "Even this limited national program can no longer be pursued in the state's present circumstances. The agenda is being withdrawn while government and opposition argue over responsibility. Closing the document will not answer the promises left unfulfilled."
 ffpa_greek_nationalism_failure_flavor_byzantine: "Evacuation lists replace maps of the proposed frontier on the cabinet table. Trains and ships carry families toward the capital while officials close schools, parishes, and property registers that the state can no longer protect. The Roman title has become, for this generation, a record of retreat."
 ffpa_greek_nationalism_failure_flavor_megali: "Ministers accuse the army of overreach, officers accuse the treasury of hesitation, and provincial deputies accuse the capital of promising what it could not administer. The old map remains on the wall; no one will sign the next order beneath it."
 ffpa_greek_nationalism_failure_flavor_limited: "The committee that reopened the old archives now meets to close its own program. The argument is no longer over where Greece ought to extend, but over which institution spent the country's scarce authority first."
 ffpa_embrace_ambitious_agenda_recovery_tt: "Selecting this option #bold accepts the Eastern Roman proposal#! and unlocks the restoration of $BYZ$ through [concept_nation_formation]."

 je_ffpa_tur_rebuild_anatolia: "Rebuild Anatolia"
 je_ffpa_tur_rebuild_anatolia_reason: "A common national name links Anatolia again, but local production and public offices do not necessarily work together. Manufacturers need transport to market, tax offices need records they can act upon, and provincial residents need evidence that public order extends beyond the capital.\n\n#bold A functioning Anatolia#! requires territory, growth, and everyday government to support one another. Control at least eight core regions, expand the economy, and restore administrative and market order."
 je_ffpa_tur_ottoman_commonwealth: "The Ottoman Commonwealth"
 je_ffpa_tur_ottoman_commonwealth_reason: "The Ottoman name can carry hopes for a shared political order, but it cannot replace specific rights and responsibilities. Central officials want decrees to take effect; provincial communities seek recognition for their languages, faiths, and daily life. Both need peace long enough for those promises to be tested.\n\n#bold Administration, civic inclusion, and internal stability#! advance separately. All three tracks must be at #v 60#! for completion. Each changes by #p +1#! per month when its conditions are met and by #n −1#! otherwise, down to 0; it never resets outright. Hover over a bar for its conditions and their current status.\n\nCompletion adds Ottoman as a new primary culture while retaining Turkish."
 je_ffpa_tur_gate_of_two_continents: "Gate of Two Continents"
 je_ffpa_tur_gate_of_two_continents_reason: "Eastern Thrace brings together the land routes of the Balkans and Anatolia and the shipping of the straits. Harbor officials want trains and vessels to connect, merchants need reliable transfers, and central offices must provide enough administrative capacity for the metropolis.\n\n#bold Ports, railways, and public offices#! must grow together if the straits are to become an enduring gateway to the world market. Once the works are complete, the government will also decide the city's metropolitan role and its place in the capital's arrangements."
 je_ffpa_gre_islands_and_mainland: "Islands and Mainland"
 je_ffpa_gre_islands_and_mainland_reason: "Greece's national program links the mainland, Macedonia, and the Aegean islands, but jurisdiction and public services still have to be made effective. Islanders need shipping to mainland markets, schools and local offices need staff and funds, and the government must bring these scattered needs into a network it can sustain.\n\nThe connection between #bold islands and mainland#! must be established both on the map and in the daily workings of education, administration, and trade."
 je_ffpa_byz_new_rome: "The Re-Coronation of New Rome"
 je_ffpa_byz_new_rome_reason: "The proclamation restoring the Roman name has been issued. Whether the capital's orders can become the ordinary government of the provinces remains to be proved. Central offices need dependable revenue and connections; residents need a state capable of handling public affairs as well as commemorating the past.\n\nFully control at least ten of the twelve designated heartland regions, including Eastern Thrace and Attica, rule from Constantinople, and sustain #bold legitimate, solvent, and stable government#!."
 je_ffpa_byz_rhomaic_commonwealth: "Commonwealth of the Romans"
 je_ffpa_byz_rhomaic_commonwealth_reason: "The decrees of New Rome pass through provincial offices before they reach the people they govern. Central officials seek common procedures for taxation and petitions; different communities need documents they can understand and a recognized place in public life. A shared name alone cannot close that distance.\n\n#bold Administration, civic inclusion, and internal stability#! advance separately. All three tracks must be at #v 60#! for completion. Each changes by #p +1#! per month when its conditions are met and by #n −1#! otherwise, down to 0; it never resets outright. Hover over a bar for its conditions and their current status.\n\nCompletion adds Rhomaic as a new primary culture while retaining Greek, and permanently increases eligible cultural assimilation by #p 20%#!."
 je_ffpa_byz_rhomaic_commonwealth_v2: "$je_ffpa_byz_rhomaic_commonwealth$"
 je_ffpa_byz_rhomaic_commonwealth_v2_reason: "$je_ffpa_byz_rhomaic_commonwealth_reason$"

 ffpa_tur_reconstruction_monarchical_compromise: "Monarchical Reconstruction Compromise"
 ffpa_tur_reconstruction_monarchical_compromise_desc: "Dynasty, bureaucracy, and provincial elites have temporarily united around rebuilding the state."
 ffpa_tur_anatolian_citizenship: "Anatolian Citizenship"
 ffpa_tur_anatolian_citizenship_desc: "The republic places common citizenship above imperial identity, offering the former imperial peoples limited but lasting acceptance."
 ffpa_tur_reconstruction_pragmatism: "Anatolian Reconstruction Pragmatism"
 ffpa_tur_reconstruction_pragmatism_desc: "The government concentrates its resources on administration, education, and infrastructure."
 ffpa_ottoman_civic_compact: "Ottoman Civic Compact"
 ffpa_ottoman_civic_compact_desc: "Ottoman identity has been recast as a shared political bond among many peoples rather than a replacement for their existing cultures."
 ffpa_tur_straits_gateway: "Gate of Two Continents"
 ffpa_tur_straits_gateway_desc: "Railways, ports, and public offices on the Straits serve a single global hub."
 ffpa_gre_islands_and_mainland: "Union of Islands and Mainland"
 ffpa_gre_islands_and_mainland_desc: "Common administration, education, and transport networks closely bind the Greek lands."
 ffpa_byz_civic_settlement: "Settlement of the Imperial Peoples"
 ffpa_byz_civic_settlement_desc: "New Rome accepts that an old name cannot govern alone; its subjects must see themselves represented in a civic order."
 ffpa_byz_church_and_crown: "Imperial Authority and Church"
 ffpa_byz_church_and_crown_desc: "State authority and the Orthodox Church provide religious legitimacy for the restored order."
 ffpa_byz_living_new_rome: "A Living New Rome"
 ffpa_byz_living_new_rome_desc: "Constantinople is no longer merely remembered: population, learning, and trade again converge upon a modern imperial capital."
 ffpa_rhomaic_civic_compact: "Rhomaic Civic Commonwealth"
 ffpa_rhomaic_civic_compact_desc: "Rhomaic becomes an inclusive political identity for the imperial peoples while preserving their existing cultural foundations."
 ffpa_rhomaic_civic_compact_v2: "Rhomaic Civic Commonwealth"
 ffpa_rhomaic_civic_compact_v2_desc: "Rhomaic becomes an inclusive political identity for the imperial peoples, preserving their cultural foundations while accelerating eligible cultural assimilation by 20%."

 ffpa_flavor.2.t: "The State After Reconstruction"
 ffpa_flavor.2.d: "Anatolia's economy and public offices now rest on firmer foundations, and more provincial affairs reach the center. Officials and local delegates ask what sort of state reconstruction is meant to leave behind. The place of the #bold Ottoman inheritance#!, the participation of citizens, and the responsibilities of the engineering offices will each shape the next direction."
 ffpa_flavor.2.f: "One side of the conference table held draft statutes; the other held lists of unfinished works. “We can keep laying roads,” a provincial delegate said. “We should know what kind of state they are joining us to.”"
 ffpa_flavor.2.a: "Let the dynasty preside over a new imperial compact."
 ffpa_flavor.2.b: "The republic belongs to every citizen of Anatolia."
 ffpa_flavor.2.c: "Build schools, roads, and public offices first."

 ffpa_flavor.3.t: "The Ottoman Commonwealth"
 ffpa_flavor.3.d: "Sustained peace, acceptance, and administrative work have given the Ottoman commonwealth an institutional foundation. The government is ready to recognize a shared identity through which people of different cultures can participate in the state without surrendering their existing roots. That compact will still need to be maintained in the daily affairs of public offices and provincial society."
 ffpa_flavor.3.f: "After hearing the compact, a delegate closed the register of his community. “This book will not become invalid,” he said. “But those who carry it should be able to enter more doors.”"
 ffpa_flavor.3.a: "Establish the Ottoman Civic Compact."

 ffpa_flavor.4.t: "Gate of Two Continents"
 ffpa_flavor.4.d: "The ports, railways, and public offices have met the metropolitan program's requirements. Eastern Thrace now has a stronger base for transport and administration. The government can establish Constantinople as the political capital, or retain the present capital and give the straits metropolis the role of a world port."
 ffpa_flavor.4.f: "Officials carried document cases along the platform while porters waited beside cargo bound for the ships. The harbor master studied the two plans. “More ministries or more warehouses, tomorrow's trains will still have to arrive on time.”"
 ffpa_flavor.4.a: "Move the capital to Constantinople."
 ffpa_flavor.4.b: "Retain the present capital and develop a world port."

 ffpa_flavor.5.t: "Islands and Mainland"
 ffpa_flavor.5.d: "From the Peloponnese to Macedonia, and from the Ionian Sea to the Aegean, the state has met its territorial, economic, and administrative goals. Education, local government, and market connections now have firmer foundations. The task ahead is to maintain those gains as dependable links between islands and mainland."
 ffpa_flavor.5.f: "As the ferry left port, a newly appointed teacher moved his chest of books beside the cargo sacks. The owner asked whether he would be back. “Yes,” he replied. “Once term begins, I will need the next shipment.”"
 ffpa_flavor.5.a: "One country, joined by one sea."

 ffpa_flavor.6.t: "The Second Foundation of New Rome"
 ffpa_flavor.6.d: "Constantinople now sustains a state with a territorial, fiscal, and administrative foundation. Officials, churchmen, citizens, and provincial delegates read those achievements differently. Some seek a political order shared by the peoples of the state, others emphasize religious and imperial authority, and others call for further development of the metropolis that carries its public business. The government must choose its next priority."
 ffpa_flavor.6.f: "When the ceremony ended, petitioners were still waiting at the edge of the square. A municipal officer handed the platform over to the reception staff. “The title has been proclaimed. Now there are these matters.”"
 ffpa_flavor.6.a: "The empire must be a common state of its peoples."
 ffpa_flavor.6.b: "Uphold orthodoxy through imperial authority and the Church."
 ffpa_flavor.6.c: "Build Constantinople into a living New Rome."

 ffpa_flavor.7.t: "Commonwealth of the Romans"
 ffpa_flavor.7.d: "Work on administration, inclusion, and stability has met the commonwealth's requirements. The government is ready to recognize Rhomaic as a new shared identity alongside Greek culture, strengthening the institutional basis for people of different cultures to participate in the state. A common identity has been established; maintaining it remains a responsibility of everyday government."
 ffpa_flavor.7.f: "After the lesson, a student asked whether the new name was meant to replace the one used at home. The teacher wrote the two side by side on the board. “You need not forget where you come from to say that you belong here.”"
 ffpa_flavor.7.a: "We are all citizens of this New Rome."

