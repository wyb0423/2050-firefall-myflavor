 ffpa_outer_western_integration_state_snapshot_tt: "The permanent provincial reward is granted only to currently owned states covered by the western sea-lane, Spanian, Mauretanian, and Alexandria-Sinai projects. Later conquests do not inherit it."
 ffpa_byz_western_universal_incorporation_tt: "Every currently owned or later acquired unincorporated state within the Western Integration territories gains +75% state incorporation speed until it is incorporated or lost."
 ffpa_byz_western_provincial_incorporation_tt: "Every currently owned or later acquired unincorporated state within the Western Integration territories gains +50% state incorporation speed until it is incorporated or lost."
 ffpa_byz_western_service_incorporation_tt: "Every currently owned or later acquired unincorporated state within the Western Integration territories gains +25% state incorporation speed until it is incorporated or lost."

 ffpa_byz_mediterranean_industrial_credit: "Mediterranean Industrial Credit"
 ffpa_byz_mediterranean_industrial_credit_desc: "Imperial guarantees channel a decade of credit into manufacturing and skilled labor, at the cost of additional administration."
 ffpa_byz_mediterranean_port_rail_fund: "Imperial Port and Railway Fund"
 ffpa_byz_mediterranean_port_rail_fund_desc: "A coordinated fund accelerates infrastructure construction and Mediterranean commerce while raising the cost of the construction program."
 ffpa_byz_mediterranean_development_banks: "Provincial Development Banks"
 ffpa_byz_mediterranean_development_banks_desc: "Provincial banks finance construction, qualifications, and migration while requiring sustained bureaucratic oversight."
 ffpa_byz_western_uniform_cadastre_state: "Uniform Western Cadastre"
 ffpa_byz_western_uniform_cadastre_state_desc: "A comprehensive survey strengthens taxation and the professional administration of the restored provinces."
 ffpa_byz_western_uniform_cadastre_cost: "Imperial Cadastral Commission"
 ffpa_byz_western_uniform_cadastre_cost_desc: "The cadastral commission consumes administrative resources and challenges entrenched landowners."
 ffpa_byz_western_provincial_tax_state: "Provincial Tax Compacts"
 ffpa_byz_western_provincial_tax_state_desc: "Recognized local tax customs improve compliance and encourage settlement without imposing a completely uniform register."
 ffpa_byz_western_provincial_tax_compact: "Compact with the Western Notables"
 ffpa_byz_western_provincial_tax_compact_desc: "The Crown governs through provincial notables and ecclesiastical authorities."
 ffpa_byz_western_universal_citizenship: "Universal Roman Citizenship"
 ffpa_byz_western_universal_citizenship_desc: "Roman civic identity directly extends stronger cultural acceptance to the major peoples of the restored western and African provinces."
 ffpa_byz_western_provincial_civic_compact: "Western Provincial Civic Compacts"
 ffpa_byz_western_provincial_civic_compact_desc: "Negotiated compacts provide broad cultural acceptance while preserving provincial authority, mobility, and local advancement."
 ffpa_byz_western_common_electoral_roll: "Common Imperial Electoral Roll"
 ffpa_byz_western_common_electoral_roll_desc: "A common franchise strengthens civic legitimacy while confronting landed privilege."
 ffpa_byz_western_provincial_delegations: "Western Provincial Delegations"
 ffpa_byz_western_provincial_delegations_desc: "Territorial delegations give the restored provinces a structured voice in imperial politics."
 ffpa_byz_western_crown_senate: "Crown-Appointed Western Senate"
 ffpa_byz_western_crown_senate_desc: "A western senate appointed by the monarch reinforces authority and legitimacy at the expense of liberal confidence."

 ffpa_byz_mediterranean_industrial_credit_v2: "New Roman Industrial Credit Directorate"
 ffpa_byz_mediterranean_industrial_credit_v2_desc: "Imperial guarantees permanently favor large manufacturing combines and capitalist investment, alienating the landed elite."
 ffpa_byz_mediterranean_port_rail_network_state_v2: "Mediterranean Port and Rail Concessions"
 ffpa_byz_mediterranean_port_rail_network_state_v2_desc: "Long concessions bind this restored province into a permanent network of free harbors, railways, and warehouses."
 ffpa_byz_mediterranean_concessions_v2: "Mediterranean Commercial Concessions"
 ffpa_byz_mediterranean_concessions_v2_desc: "The Empire has surrendered part of its direct authority in exchange for private investment in the western transport network."
 ffpa_byz_mediterranean_development_banks_state_v2: "Provincial Development Banking"
 ffpa_byz_mediterranean_development_banks_state_v2_desc: "Local banks and civic funds support qualifications, settlement, and commercial opportunity in this restored province."
 ffpa_byz_mediterranean_banking_compact_v2: "League of Provincial Development Banks"
 ffpa_byz_mediterranean_banking_compact_v2_desc: "A distributed banking league broadens investment while limiting the influence of the largest national combines."

 ffpa_byz_western_uniform_cadastre_state_v2: "Uniform Imperial Cadastre"
 ffpa_byz_western_uniform_cadastre_state_v2_desc: "One system of measurement, property records, and professional administration permanently strengthens the imperial tax base."
 ffpa_byz_western_uniform_cadastre_burden_v2: "Permanent Cadastral Commission"
 ffpa_byz_western_uniform_cadastre_burden_v2_desc: "Maintaining a uniform register consumes central administrative capacity and challenges entrenched landowners."
 ffpa_byz_western_municipal_tax_compact_state_v2: "Western Municipal Tax Compacts"
 ffpa_byz_western_municipal_tax_compact_state_v2_desc: "Recognized local tax customs improve compliance and make this province more attractive to settlers."
 ffpa_byz_western_municipal_vetoes_v2: "Municipal Fiscal Privileges"
 ffpa_byz_western_municipal_vetoes_v2_desc: "Provincial notables lend their authority to the Empire, but their privileges slow the enactment of national law."
 ffpa_byz_western_military_survey_state_v2: "Imperial Military Survey"
 ffpa_byz_western_military_survey_state_v2_desc: "Military engineers have joined roads, tax registers, and supply maps into one frontier infrastructure."
 ffpa_byz_western_military_survey_corps_v2: "Western Survey Corps"
 ffpa_byz_western_military_survey_corps_v2_desc: "Permanent survey and engineer formations improve defensive planning while increasing the military supply bill."

 ffpa_byz_western_universal_citizenship_v2: "Romans Without Provinces"
 ffpa_byz_western_universal_citizenship_v2_desc: "A universal Roman civic identity grants the strongest acceptance and loyalty at the expense of traditional imperial authority."
 ffpa_byz_western_provincial_civic_compact_v2: "Civic Covenant of Cities and Provinces"
 ffpa_byz_western_provincial_civic_compact_v2_desc: "Negotiated citizenship recognizes the western peoples while making universal legislation more difficult."
 ffpa_byz_western_provincial_civic_compact_state_v2: "Provincial Civic Compact"
 ffpa_byz_western_provincial_civic_compact_state_v2_desc: "Recognized communities provide durable routes for migration, education, and local advancement."
 ffpa_byz_western_service_citizenship_v2: "Citizenship Through Imperial Service"
 ffpa_byz_western_service_citizenship_v2_desc: "Military and public service open a narrower road to citizenship, producing experienced formations at a higher material cost."
 ffpa_byz_western_veteran_settlement_state_v2: "Veteran Service Colonies"
 ffpa_byz_western_veteran_settlement_state_v2_desc: "Veterans and public servants receive land and civic status in this outer western province."
 ffpa_byz_western_universal_incorporation_state_v1: "Universal Roman Civic Integration"
 ffpa_byz_western_universal_incorporation_state_v1_desc: "Uniform Roman citizenship accelerates the legal and administrative integration of this western province."
 ffpa_byz_western_provincial_incorporation_state_v1: "Provincial Civic Integration"
 ffpa_byz_western_provincial_incorporation_state_v1_desc: "Civic compacts let local communities help integrate this western province into the imperial administration."
 ffpa_byz_western_service_incorporation_state_v1: "Service-Based Civic Integration"
 ffpa_byz_western_service_incorporation_state_v1_desc: "Military and public service establish a limited administrative bridge between this western province and the Empire."

 ffpa_byz_western_common_electoral_roll_v2: "One Imperial Electoral Roll"
 ffpa_byz_western_common_electoral_roll_v2_desc: "A common franchise improves legislative legitimacy while reducing executive authority and confronting landed privilege."
 ffpa_byz_western_provincial_delegations_state_v2: "Protected Provincial Representation"
 ffpa_byz_western_provincial_delegations_state_v2_desc: "Permanent territorial representation limits the political damage caused by unrest in this restored province."
 ffpa_byz_western_provincial_delegations_v2: "Conference of Western Delegations"
 ffpa_byz_western_provincial_delegations_v2_desc: "Provincial voices reinforce the legitimacy of the state but lengthen the legislative process."
 ffpa_byz_western_crown_senate_v2: "Crown Senate of the Western Provinces"
 ffpa_byz_western_crown_senate_v2_desc: "A monarch-appointed upper chamber reinforces authority and legitimacy while obstructing reform and alienating liberals."
 ffpa_byz_western_notables_senate_v2: "Senate of the Western Notables"
 ffpa_byz_western_notables_senate_v2_desc: "An elite republican upper chamber supplies administrative continuity and authority while slowing legislation and disappointing liberals."

 # Byzantine restoration campaigns
 je_group_ffpa_byzantine_restoration: "Imperial Restoration"
 ffpa_byz_convene_restoration_council: "Convene the Restoration Council"
 ffpa_byz_convene_restoration_council_desc: "Ask the imperial council to select a frontier for deliberate restoration. No more than two campaigns may run at once, and the 45–55 year deadline begins only when a frontier is accepted. The Balkan branch opens Italia; the Anatolian branch proceeds through Oriens, Aegyptus, and Africa; completing Italia and Africa opens Spania. Beginning a new campaign ends any active Restoration Settlement."
 ffpa_byz_restoration_campaign_slot_available_tt: "Fewer than #v 2#! restoration campaigns are currently active"

 je_ffpa_byz_restore_balkans: "Restore the Danube and the Balkans"
 je_ffpa_byz_restore_balkans_reason: "New Rome has proclaimed the lands south of the Danube and the old Illyrian coast to be the empire's first western frontier. Secure direct rule over every listed state within #v 45 years#!."
 je_ffpa_byz_restore_anatolia: "Recover Anatolia"
 je_ffpa_byz_restore_anatolia_reason: "The imperial council has charged the army with restoring direct Roman rule from the Aegean coast to the eastern Anatolian marches within #v 45 years#!."
 je_ffpa_byz_restore_oriens: "Reconstitute the Oriens"
 je_ffpa_byz_restore_oriens_reason: "With Anatolia secured, the old eastern provinces—from Cyprus and Syria to the Euphrates frontier—must be brought under direct imperial rule within #v 50 years#!."
 je_ffpa_byz_restore_aegyptus: "Return to Aegyptus"
 je_ffpa_byz_restore_aegyptus_reason: "The roads to Alexandria, the Nile valley, and Sinai stand open. Restore direct imperial rule over the listed Egyptian states within #v 50 years#!."
 je_ffpa_byz_restore_africa: "Restore Roman Africa"
 je_ffpa_byz_restore_africa_reason: "The African prefecture once fed and financed an empire. Recover the Mediterranean coast from Libya to the Rif within #v 55 years#!."
 je_ffpa_byz_restore_italia: "Recover Italia"
 je_ffpa_byz_restore_italia_reason: "The restoration now turns toward the peninsula, its islands, and the Adriatic approaches. Bring every listed Italian state under direct imperial rule within #v 55 years#!."
 je_ffpa_byz_restore_spania: "Return to Spania"
 je_ffpa_byz_restore_spania_reason: "With Italy and Africa secured, the final western expedition seeks the old coastal holdings of Spania. Recover every listed state within #v 50 years#!."
 je_ffpa_byz_restoration_campaign_status: "Directly control every state listed in the completion conditions before the campaign deadline. Claims permit use of the cheaper Return State war goal, but do not guarantee diplomatic success."

 ffpa_byz_restoration_campaign_mobilization_v1: "The Imperial Standards Unfurled"
 ffpa_byz_restoration_campaign_mobilization_v1_desc: "For eight years after a frontier is proclaimed, recruitment, procurement, and offensive planning receive concentrated imperial support."
 ffpa_byz_restoration_settlement_v1: "Restoration Settlement"
 ffpa_byz_restoration_settlement_v1_desc: "New Rome accepts diplomatic guarantees and a narrower freedom of action in return for eight years of faster Infamy decay. Proclaiming another restoration campaign ends the settlement."
 ffpa_byz_restoration_triumph_v1: "A Roman Triumph"
 ffpa_byz_restoration_triumph_v1_desc: "A five-year triumph magnifies the victory's prestige, legitimacy, and support among the armed forces, but offers no relief from Infamy."
 ffpa_byz_restoration_failure_v1: "A Broken Imperial Promise"
 ffpa_byz_restoration_failure_v1_desc: "Failure to fulfill a proclaimed restoration discredits the government and high command for eight years. The failed frontier cannot be proclaimed again for five years."
 ffpa_byz_balkans_restored_v1: "The Danubian Provinces Restored"
 ffpa_byz_balkans_restored_v1_desc: "Direct rule across the Balkans gives lasting weight to New Rome's imperial claims."
 ffpa_byz_anatolia_restored_v1: "Anatolia Restored"
 ffpa_byz_anatolia_restored_v1_desc: "The recovery of the Anatolian heartland permanently strengthens imperial legitimacy."
 ffpa_byz_oriens_restored_v1: "The Oriens Restored"
 ffpa_byz_oriens_restored_v1_desc: "The return of the eastern provinces makes the restored empire a fact beyond the Aegean."
 ffpa_byz_aegyptus_restored_v1: "Aegyptus Restored"
 ffpa_byz_aegyptus_restored_v1_desc: "Control of Alexandria, the Nile, and Sinai lends enduring authority to New Rome."
 ffpa_byz_africa_restored_v1: "Roman Africa Restored"
 ffpa_byz_africa_restored_v1_desc: "The imperial standard on the African coast gives lasting prestige to the restoration."
 ffpa_byz_italia_restored_v1: "Italia Restored"
 ffpa_byz_italia_restored_v1_desc: "Rule over Italy and its islands permanently reinforces the claim to Roman continuity."
 ffpa_byz_spania_restored_v1: "Spania Restored"
 ffpa_byz_spania_restored_v1_desc: "The westernmost restoration completes an imperial project spanning the Mediterranean."

 ffpa_flavor.39.t: "The Council of Imperial Restoration"
 ffpa_flavor.39.d: "Generals, jurists, diplomats, and provincial delegates gather beneath maps of the old empire. They agree that claims alone are not policy: the government must name a frontier, accept a deadline, and bear the consequences before it can call the next provinces restored."
 ffpa_flavor.39.f: "An empire cannot march in every direction at once. Even Rome must choose which road to open first."
 ffpa_byz_restoration_council_balkans_option: "Proclaim the Danube and Balkan restoration."
 ffpa_byz_restoration_council_anatolia_option: "Recover the Anatolian heartland."
 ffpa_byz_restoration_council_oriens_option: "Reconstitute the eastern provinces."
 ffpa_byz_restoration_council_aegyptus_option: "Open the road to Alexandria and the Nile."
 ffpa_byz_restoration_council_africa_option: "Carry the standards along the African coast."
 ffpa_byz_restoration_council_italia_option: "Turn the restoration toward Italy."
 ffpa_byz_restoration_council_spania_option: "Order the final western expedition to Spania."
 ffpa_byz_restoration_council_cancel_option: "The empire is not yet ready for another proclamation."

 ffpa_flavor.40.t: "The Danube Returns to New Rome"
 ffpa_flavor.40.d: "From the Adriatic coast to the mouths of the Danube, imperial officials now exercise direct authority. The council must decide whether this victory will be converted into international recognition or celebrated without compromise."
 ffpa_flavor.40.f: "Roads, garrisons, and tax rolls have given substance to a frontier that proclamations alone could never restore."
 ffpa_flavor.41.t: "Anatolia Restored"
 ffpa_flavor.41.d: "Imperial administration again reaches across Anatolia, joining its ports, plateau cities, and eastern marches to New Rome. Diplomats now ask what assurances the empire will offer its alarmed neighbors."
 ffpa_flavor.41.f: "The old heartland was not recovered in a single battle, but by holding every road after the armies had passed."
 ffpa_flavor.42.t: "The Eastern Provinces Reconstituted"
 ffpa_flavor.42.d: "Cyprus, Syria, Palestine, and the Euphrates frontier answer directly to New Rome. The restoration has crossed from memory into a new eastern political order."
 ffpa_flavor.42.f: "The milestones bear new numbers, but the roads once again point toward the same imperial capital."
 ffpa_flavor.43.t: "The Nile Under the Roman Standard"
 ffpa_flavor.43.d: "Alexandria, the Nile valley, and Sinai have been gathered into the restored empire. Control of Egypt brings wealth and strategic reach—and the close attention of every Mediterranean power."
 ffpa_flavor.43.f: "Whoever governs the river must also answer for the sea beyond its mouths."
 ffpa_flavor.44.t: "The Eagles Return to Africa"
 ffpa_flavor.44.d: "The imperial standard now follows the African coast from Libya toward the western Maghreb. New Rome must decide whether to reassure the powers or make the recovery a spectacle of Roman endurance."
 ffpa_flavor.44.f: "The harbors remember many masters; the customs houses now stamp the seal of New Rome."
 ffpa_flavor.45.t: "The Return to Italia"
 ffpa_flavor.45.d: "Italy and its islands stand under direct imperial administration. The restoration's most potent symbol is also its most provocative victory, demanding either a diplomatic settlement or an unmistakable triumph."
 ffpa_flavor.45.f: "For centuries Rome was an argument. Now it is again a question of government."
 ffpa_flavor.46.t: "The Western Shore Restored"
 ffpa_flavor.46.d: "The expedition to Spania has secured the last proclaimed western states. From the Euphrates to the Iberian coast, the restoration now spans the Mediterranean world."
 ffpa_flavor.46.f: "Beyond the old pillars lies the ocean; behind them, an empire must still learn how to govern its victories."
 ffpa_byz_restoration_success_settlement_option: "Submit the victory to an international settlement."
 ffpa_byz_restoration_success_triumph_option: "Let New Rome celebrate a triumph."

 ffpa_flavor.47.t: "The Restoration Falters"
 ffpa_flavor.47.d: "The deadline proclaimed by the imperial council has passed while parts of the chosen frontier remain beyond direct rule. The promise cannot simply be repeated: the government and high command must first endure the political consequences of failure."
 ffpa_flavor.47.f: "Maps are patient. Soldiers, taxpayers, and foreign governments are not."
 ffpa_flavor.47.a: "The frontier will have to wait."
