l_english:
 ideology_ffpa_global_ig_property_conservatism: "Propertied Conservatism"
 ideology_ffpa_global_ig_property_conservatism_desc: "#lore This group regards secure landed income and the political influence of property holders as foundations of social order. Monarchs, presidents and commercial development can all serve that order, provided property and rents remain secure; mass political power and land redistribution threaten it.#!"
 ideology_ffpa_global_ig_hierarchic: "$ideology_hierarchic$"
 ideology_ffpa_global_ig_hierarchic_desc: "#lore This group defends a social hierarchy sustained by landed wealth and local influence. Tenancy and commercial farming can preserve the position of large landholders without relying on serfdom. Redistributive land reform, progressive taxation and extensive welfare remain unwelcome.#!"
 ideology_ffpa_global_ig_developmentalism: "Developmentalism"
 ideology_ffpa_global_ig_developmentalism_desc: "#lore This group places private enterprise, free trade and expanding production at the heart of prosperity. It accepts government intervention and limited labor regulation, without treating protective tariffs or compulsory schooling as essential commitments. State or worker control of enterprise remains unacceptable.#!"
 ideology_ffpa_global_ig_republican_conservatism: "Conservative Republicanism"
 ideology_ffpa_global_ig_republican_conservatism_desc: "#lore This group believes a republic can protect property, social order and opportunities for personal advancement. Its support for republican government coexists with restrictive citizenship and migration policies, and suspicion of radical labor organization.#!"
 ideology_ffpa_global_ig_civil_patriotism: "$ideology_patriotic$"
 ideology_ffpa_global_ig_civil_patriotism_desc: "#lore This group values national authority, public order and strong security institutions. It prefers dedicated police for everyday law enforcement, while accepting militarized measures and restrictions on political freedom in the name of national security.#!"
 ideology_ffpa_global_ig_rural_autonomy: "Rural Autonomism"
 ideology_ffpa_global_ig_rural_autonomy_desc: "#lore This group wants rural communities to participate in wider markets while protecting local livelihoods through tariffs and migration controls. Administrators should answer to local voters rather than hereditary privilege; contact with the wider world need not silence local communities.#!"
 ideology_ffpa_global_ig_moralist: "$ideology_moralist$"
 ideology_ffpa_global_ig_moralist_desc: "#lore This group holds that religion should retain authority in public life and state institutions. Whether a ruler wears a crown is secondary to whether the state respects faith and upholds its public position.#!"
 ideology_ffpa_global_ig_proletarian: "$ideology_proletarian$"
 ideology_ffpa_global_ig_proletarian_desc: "#lore This group demands freedom to organize, public provision and a real voice for workers in production. It supports cooperative ownership and factory councils, but does not equate state ownership with control by workers.#!"
