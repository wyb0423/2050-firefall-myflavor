 ffpa_usa_ui_union_rules: "每轮登记一处目标，期限 #v 10年#!；和平接收同样有效。\n成功冷却 #v 1年#!；撤回、超时或追踪失效冷却 #v 3年#!。"
 ffpa_usa_ui_union_original_reason: "关卡两边的账簿仍记录着相近的货物，地方官署却分别征税、检查证件、解释旧地图。商人希望形成共同市场，主张统一的代表要求共同政府；拥有现成税源和权力的人则有自己的保留。政府可以把其中一处近邻领土列为有限议程，但地图上的主张仍须由实际取得的领土支持。\n\n[ROOT.GetCountry.GetCustom('ffpa_na_union_status_text_v1')]\n\n每次登记一处目标的全部现有省份，期限十年。全部取得后结算，和平接收同样有效；战争或已参与的外交博弈中暂停结算。成功后一年可再议，撤回、超时或无法可靠追踪后冷却三年。接收方案给予实际接收州完整五年奖励。"
 ffpa_usa_ui_union_story: "关卡两边的账簿仍记录着相近的货物，地方官署却分别征税、检查证件、解释旧地图。商人希望形成共同市场，主张统一的代表要求共同政府；拥有现成税源和权力的人则有自己的保留。\n\n政府可以把其中一处#bold 近邻领土#!列为有限议程，但地图上的主张仍须由实际取得的领土支持。\n\n#bold 接收成果#!\n完成后选择共同市场或共同政府；实际接收州获得完整五年奖励。"
