l_simp_chinese:
 gov_ffpa_usa_federal_government: "联邦政府"
 gov_ffpa_usa_federal_government_desc: "由民选总统领导行政机关、与国会分立的美国政府。各州共同承认联邦权威，并通过选举参与国家事务。"
 gov_ffpa_usa_federal_cabinet: "联邦内阁"
 gov_ffpa_usa_federal_cabinet_desc: "由议会多数支持的总理领导美国政府。内阁向民选议会负责，共同事务通过议席与协商决定。"
 gov_ffpa_usa_presidential_directorate: "总统执政府"
 gov_ffpa_usa_presidential_directorate_desc: "总统集中掌握美国的行政权力。联邦机关继续运作，但缺乏有效的选举约束，政治参与取决于统治者与支持者的安排。"
 gov_ffpa_usa_congressional_directorate: "国会执政团"
 gov_ffpa_usa_congressional_directorate_desc: "由有限政治集团通过国会掌握美国政府。主席主持共同事务，议席与任职资格由既有权势维系。"
 gov_ffpa_usa_imperial_government: "帝国政府"
 gov_ffpa_usa_imperial_government_desc: "由皇帝直接行使最高权力的美国世袭政府。重建形成的行政机关向君主负责，公共命令以皇权为最终依据。"
 gov_ffpa_usa_imperial_cabinet: "帝国内阁"
 gov_ffpa_usa_imperial_cabinet_desc: "由皇帝任命大臣、依靠内阁及既有权势集团治理的美国世袭政府。各方通过任命与协商参与国政，尚未建立选举问责。"
 gov_ffpa_usa_constitutional_cabinet: "立宪内阁"
 gov_ffpa_usa_constitutional_cabinet_desc: "君主保留世袭王位，民选机构参与并约束美国政府。内阁在皇室与代表机构之间协调共同事务。"
 RULER_TITLE_FFPA_USA_CHAIR: "主席"
 ffpa_ig_usa_federal_forces: "联邦军"
 ffpa_ig_usa_business_consortia: "工商财团"
 ffpa_ig_usa_academics: "学院派"
 ffpa_ig_usa_town_guilds: "城镇公会"
 ffpa_ig_usa_landed_families: "地产家族"
 ffpa_ig_usa_farmers: "农场主"
 ffpa_ig_usa_church: "教会"
 ffpa_ig_usa_labor_congress: "劳工大会"
 ideology_ffpa_usa_federal_defense: "联邦国防主义"
 ideology_ffpa_usa_federal_defense_desc: "这一集团主张以职业军队承担联邦防务，并在必要时扩大征兵。军官们把边疆定居和全国电力建设视为稳固防务的条件，对以殖民剥削维持扩张持反对态度。"
 ideology_ffpa_usa_continental_market: "大陆市场主义"
 ideology_ffpa_usa_continental_market_desc: "这一集团希望让资本、货物与技术在大陆市场中流动。企业愿意接受基础监管和协助重建的公共投资，也支持培养技术人才；它们同时反对孤立政策、国家统制生产及严格的劳工保护。"
 ideology_ffpa_usa_civic_republicanism: "公民共和主义"
 ideology_ffpa_usa_civic_republicanism_desc: "这一集团认为联邦权威应来自公民的选票。总统与议会都可以组织共和国，但统治权不应成为家族的遗产、少数人的特权或一个政党的独占。"
 ideology_ffpa_usa_civic_liberalism: "公民自由主义"
 ideology_ffpa_usa_civic_liberalism_desc: "大学、报刊与公共知识界中的这一派别主张，让不同出身者享有共同的公民资格。它们支持言论与人身自由、女性参政和公立大学，反对依靠秘密警察或军事化治安维持公共秩序。"
 ideology_ffpa_usa_local_constitutionalism: "地方宪政主义"
 ideology_ffpa_usa_local_constitutionalism_desc: "这一集团支持共和制度与民选官员，希望城镇居民能够影响公共事务。商户和地方组织要求保护本地经营、管理人口迁入并维持共同文化规范；它们不愿把地方生活交给世袭官署，也不赞成完全封闭边境。"
