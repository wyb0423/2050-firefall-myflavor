l_simp_chinese:
 je_ffpa_usa_continental_market_v1: "大陆市场"
 je_ffpa_usa_continental_market_v1_reason: "同一面国旗下，货物仍可能找不到稳定的销路。各州的生产者需要可靠的运输，地方官员需要可以互认的单据，新登记的公司则希望把生意做到州界之外。联邦必须让已经取得的领土形成#bold 能够运转的经济网络#!。\n\n让至少#v 85%#!本土人口所在州达到#v 95%#!市场接入，并在至少#v 4#!个本土州拥有就业率不低于#v 70%#!的合格工业或运输设施，连续维持#v 12个月#!。没有总期限，未达标时连续月份归零。\n\n当前覆盖人口：[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_market_coverage_v1')|1]%；设施达标州：[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_market_states_v1')|0]/4。\n[ROOT.GetCountry.GetCustom('ffpa_usa_economy_status_v1')]\n\n完成后选择大陆干线或广泛支线的州级工程奖励，并永久获得#p 公司上限 +1#!。$ffpa_usa_economy_grants_summary_v1$"
 je_ffpa_usa_continental_market_v1_goal: "连续达标十二个月，并确认工程结算。"
 je_ffpa_usa_industrial_scale_v1: "规模的力量"
 je_ffpa_usa_industrial_scale_v1_reason: "跨州市场已经打开，下一批订单将决定工业如何成长。集中采购可以扩大少数工业中心；拆分合同则让更多地方供应商学会承接长期业务。账面上的厂房数量必须变成#bold 有人工作、能够交货的产业#!。\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n本土制造业等级：[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_industry_levels_v1')|0]/[ROOT.GetCountry.MakeScope.Var('ffpa_usa_industry_target_v1').GetValue|0]；开工基数：[ROOT.GetCountry.MakeScope.Var('ffpa_usa_industry_baseline_v1').GetValue|0]。\n就业达标行业：[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_industry_categories_v1')|0]/4；就业达标州：[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_industry_states_v1')|0]/[ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_industry_required_states_v1')|0]。\n\n至少四类行业达到#v 75%#!就业，包含材料或机械，以及食品、纺织或日用消费品。满足固定规模目标与路线要求，连续维持#v 18个月#!。未达标月份归零；已建工厂可随领土计入，目标不随扩张提高。$ffpa_usa_industry_categories_help_v1$\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_economy_status_v1')]\n完成时保留路线工程奖励，并选择扩大企业准入或培育骨干企业。$ffpa_usa_economy_grants_summary_v1$"
 je_ffpa_usa_industrial_scale_v1_goal: "连续达标十八个月，并确认工业与公司政策结算。"
 ffpa_usa_industry_categories_help_v1: "\n行业分为食品、纺织、日用品、化工医药、金属、工具机械、交通装备、电子计算设备和军工九类。同类建筑不重复计为新行业；办公室、软件和数据中心不计入制造业规模。"
 ffpa_usa_economy_grants_summary_v1: "\n\n经济工程当前拨款：每周 @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_total_grants_v1')|0]。每笔拨款在选择时按年GDP的0.5%折算为固定周支出，持续两年；金额与期限见国家修正。"
 ffpa_usa_market_population_tt: "至少85%本土人口所在州的市场接入达到95%。"
 ffpa_usa_market_facilities_tt: "至少四个本土州各有一级及以上合格制造业、港口或铁路，就业率至少70%；军工不计入。"
 ffpa_usa_industry_levels_tt: "已建成本土制造业总等级达到开工时确定的固定目标。"
 ffpa_usa_industry_categories_tt: "至少四类制造行业拥有一级及以上、就业率至少75%的建筑。"
 ffpa_usa_industry_mix_tt: "同时包含金属或工具机械，以及食品、纺织或日用品行业。"
 ffpa_usa_industry_distribution_tt: "集中发展至少三州、地方供应商至少五州拥有就业率至少75%的制造业建筑。"
 ffpa_usa_market_settled_tt: "市场条件连续达标12个月，并已在完成事件中确认奖励。"
 ffpa_usa_market_months_bar_v1: "连续达标月份"
 ffpa_usa_market_months_bar_v1_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12个月。低于条件时归零；达到目标后等待结算。"
 ffpa_usa_industry_settled_tt: "工业条件连续达标18个月，并已在完成事件中确认奖励。"
 ffpa_usa_industry_months_bar_v1: "连续达标月份"
 ffpa_usa_industry_months_bar_v1_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/18个月。低于条件时归零；达到目标后等待结算。"
 ffpa_usa_economy_retry_button_v1: "重开待处理议程"
 ffpa_usa_economy_retry_button_v1_desc: "重新打开尚未结算的经济事件。旧窗口失效，已有选择、拨款和奖励不会重发。"
 ffpa_usa_economy_waiting_v1: "有一项经济议程等待答复；如窗口遗失，可用日志按钮重开。"
 ffpa_usa_economy_running_v1: "工程按月核验；已完成的制度选择不会因普通改法重置。"
 ffpa_usa_industry_route_central_v1: "发展方式：集中订单。至少三个工业州达标；完成后前三个合格工业州永久制造业吞吐量 +15%，全国建造效率 +10%，五年。"
 ffpa_usa_industry_route_local_v1: "发展方式：地方供应商。至少五个工业州达标；完成后所有达标工业州永久制造业吞吐量 +8%，全国基础设施吞吐量 +10%，五年。"
 ffpa_usa_industry_route_pending_v1: "采购组织方式尚待议定。"
 ffpa_usa_contract_company_prosperous_v1: "[SCOPE.sCompany('ffpa_usa_contract_company').GetName]的业务已达到繁荣状态。它以既有生产与持股能力为凭据，希望承担更大份额的跨州订单。"
 ffpa_usa_contract_company_present_v1: "[SCOPE.sCompany('ffpa_usa_contract_company').GetName]已持有实际产业。它的代表提出，以更稳定的合同安排支持企业扩张。"
 ffpa_usa_contract_company_absent_v1: "原先参与讨论的公司已无法确认，但采购规则仍需作出选择。"
 ffpa_usa_flavor.10.t: "货物在州界停下"
 ffpa_usa_flavor.10.d: "货物抵达州界，随行单据却未必能直接通用。承运人请求统一手续，地方当局担心新标准的费用最后仍落在自己账上。联邦可以出资帮助各地接轨，也可以给互认协议留下更长的过渡期。\n\n拨款方案：全国基础设施吞吐量 +10%，两年；同期每周支出为选择时年GDP的0.5% ÷ 52。当前估算：@money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_weekly_grant_v1')|0]/周。"
 ffpa_usa_flavor.10.f: "车夫把两份内容相同、印章不同的货单叠在一起，等着第三个人签字。"
 ffpa_usa_flavor.10.1: "联邦承担接轨费用。"
 ffpa_usa_flavor.10.2: "让各州逐步签订互认协议。"
 ffpa_usa_flavor.11.t: "同一张运价表"
 ffpa_usa_flavor.11.d: "稳定的交货开始改变采购人的打算。商号可以在几个州安排库存，地方工场也敢接下远处的订单。新的企业登记得到更广泛承认；接下来的工程，应当优先巩固最繁忙的干线，还是让支线通向更多城镇？\n\n两项方案均永久增加公司上限1。州奖励只授予验收时登记、结算时仍属本国的工程州。"
 ffpa_usa_flavor.11.f: "账簿上第一次出现了可以反复使用的运价，不必每一趟重新议定。"
 ffpa_usa_flavor.11.1: "优先建设大陆干线：人口最多的三个达标工程州，永久建造效率与基础设施各 +20%。"
 ffpa_usa_flavor.11.2: "让支线连接更多城镇：全部达标工程州，永久基础设施与税收能力各 +10%。"
 ffpa_usa_flavor.12.t: "最大的一份合同"
 ffpa_usa_flavor.12.d: "新的采购清单已经超过一家地方工场能够承担的规模。工业中心希望获得成批的长期订单，小供应商则请求把合同分开，让更多地方参与。两种办法都能扩大生产，却需要不同的产业布局。"
 ffpa_usa_flavor.12.f: "合同第一页写着总额。代表们更关心后面那张承包者名单。"
 ffpa_usa_flavor.12.1: "集中订单，扩大工业中心：三州路线，建造效率 +10%，三年。"
 ffpa_usa_flavor.12.2: "拆分采购，培育地方供应商：五州路线，制造业吞吐量 +5%，三年。"
 ffpa_usa_flavor.13.t: "夜班的工资单"
 ffpa_usa_flavor.13.d: "工业扩张已越过预定增量的一半。工场主管在催下一批货，地方代表则递上培训和生活补助的申请。订单可以继续加速，也可以拿出一部分财力，让新进入产业的人站稳脚跟。\n\n拨款方案：全国动乱影响 -10%，两年；同期每周支出为选择时年GDP的0.5% ÷ 52。当前估算：@money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_weekly_grant_v1')|0]/周。"
 ffpa_usa_flavor.13.f: "工资单上有不少新名字。有人已经学会操作机器，有人还在找住处。"
 ffpa_usa_flavor.13.1: "拨款支持培训和生活补助。"
 ffpa_usa_flavor.13.2: "优先交付订单：制造业吞吐量 +10%，一年；动乱影响 +10%，两年。"
 ffpa_usa_flavor.14.t: "工业的组织者"
 ffpa_usa_flavor.14.d: "扩张的工厂已经经受了一段持续生产的检验。联邦可以给更多企业留下经营空间，也可以让现有骨干公司把组织和生产经验用得更深。新的公司政策，将与已经落成的工业工程一同留下。\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n下列公司奖励独立于上述路线奖励，二选一；不会自动成立公司或转移工厂。"
 ffpa_usa_flavor.14.f: "生产报表不再只写新建了多少厂房，也写出了能够按期交货的名字。"
 ffpa_usa_flavor.14.1: "扩大企业准入：永久公司上限 +2；公司建造增益 +10 个百分点，十年。"
 ffpa_usa_flavor.14.2: "培育骨干企业：永久公司吞吐量增益 +10 个百分点；公司建造增益 +20 个百分点，十年。"
 ffpa_usa_flavor.15.t: "合同上的名字"
 ffpa_usa_flavor.15.d: "[ROOT.GetCountry.GetCustom('ffpa_usa_contract_company_text_v1')]\n\n采购机关看重能统一交货的承包者，地方商会则要求让更多供应商看到招标条件。联邦应当如何安排这些订单？"
 ffpa_usa_flavor.15.f: "旧商标可以印回纸上，能否履约还要由这一批货来证明。"
 ffpa_usa_flavor.15.1: "集中承包：公司建造增益 +10 个百分点，三年。"
 ffpa_usa_flavor.15.2: "开放竞标：全国建造效率 +5%，三年。"
