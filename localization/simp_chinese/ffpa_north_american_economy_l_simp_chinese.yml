 ffpa_usa_market_grant_v1: "市场接轨拨款支出"
 ffpa_usa_industry_grant_v1: "产业培训拨款支出"
 ffpa_usa_grant_cost_hover_tt: "#bold 拨款支出#!\n每周 #n @money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_economy_weekly_grant_v1')|0]#!，持续 #v 两年#!。\n按选择时年GDP的0.5% ÷ 52固定金额；悬浮数值按当前GDP估算。"
 ffpa_usa_market_core_reward_tt: "#bold 大陆干线#!\n验收时登记的最多三个核心工程州，且结算时仍属本国：\n#p 建造效率 +20%\n基础设施 +20%#!\n持续时间：#v 永久#!。核心州按验收时人口选定。\n\n全国：#p 公司上限 +1#!，永久。"
 ffpa_usa_market_branches_reward_tt: "#bold 地方支线#!\n所有验收时登记、结算时仍属本国的工程州：\n#p 基础设施 +10%\n税收能力 +10%#!\n持续时间：#v 永久#!。\n\n全国：#p 公司上限 +1#!，永久。"
 ffpa_usa_company_entry_hover_tt: "[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n\n#bold 扩大企业准入#!\n全国：#p 公司上限 +2#!，永久；#p 公司建造增益 +10个百分点#!，持续 #v 十年#!。\n不会自动成立公司或转移工厂。"
 ffpa_usa_company_champions_hover_tt: "[ROOT.GetCountry.GetCustom('ffpa_usa_industry_route_text_v1')]\n\n#bold 培育骨干企业#!\n全国：#p 公司吞吐量增益 +10个百分点#!，永久；#p 公司建造增益 +20个百分点#!，持续 #v 十年#!。\n不会自动成立公司或转移工厂。"
