 ffpa_byz_public_cmf_crisis_counts: "三支柱破裂：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_public_all_broken_months_v1_display')|0]/6\n两支柱破裂且另一支柱警告：[JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_byz_public_two_broken_months_v1_display')|0]/12"
