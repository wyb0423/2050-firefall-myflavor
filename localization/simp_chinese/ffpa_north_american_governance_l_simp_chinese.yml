l_simp_chinese:
 je_ffpa_usa_federal_promise_v1: "联邦的承诺"
 je_ffpa_usa_federal_promise_v1_reason: "重建会议留下了拨款规则，工厂送来了新的订单。地方代表现在拿着这些文件，询问下一笔工程款何时到账、合同由谁核验、失去工作的人还能得到什么。\n\n#bold 联邦的承诺#!要在一次次实际履约中取得分量。建设可以加快，授权可以扩大，但账簿上的支出与会场里的同意，最终都要有人承担。"
 ffpa_usa_gov_heading_v1: "#bold 授权、拨款与履约#!"
 ffpa_usa_gov_locked_credit_v1: "联邦信用：完成《重新缔结联邦》后开启。"
 ffpa_usa_gov_locked_risk_v1: "繁荣风险：完成《规模的力量》后开启。"
 ffpa_usa_gov_credit_label_v1: "#bold 联邦信用#!  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_display_v1')|0] / 100#!"
 ffpa_usa_gov_credit_grace_text_v1: "#yellow 整备期#!：余 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_grace_display_v1')|0]#! 次月度核验；指标照常变化，暂不累计失败。"
 ffpa_usa_gov_credit_normal_v1: "#p 治理正常#! · 常驻收益生效"
 ffpa_usa_gov_credit_warning_text_v1: "#yellow 治理预警#! · 常驻收益降档"
 ffpa_usa_gov_credit_crisis_text_v1: "#n 危机#!：已连续 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_crisis_display_v1')|0] / 12#! 个月；本领域收益暂停。"
 ffpa_usa_gov_credit_failed_text_v1: "#n 失败恢复#!：安全条件连续 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_repair_display_v1')|0] / 12#! 个月。重罚到期且修复达标后恢复收益。"
 ffpa_usa_gov_credit_penalty_clock_v1: "#bold 重罚剩余#!  [JournalEntry.GetCountry.GetTimedModifier('ffpa_usa_gov_credit_penalty_v1').GetRemainingDuration]"
 ffpa_usa_gov_credit_delta_v1: "月度变化  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_change_v1')|2]#! · 悬浮查看来源"
 ffpa_usa_gov_credit_delta_tt_v1: "[JournalEntry.GetCountry.MakeScope.GetScriptValueDesc('ffpa_usa_gov_credit_change_v1')]"
 ffpa_usa_gov_risk_label_v1: "#bold 繁荣风险#!  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_risk_display_v1')|0] / 100#!"
 ffpa_usa_gov_risk_grace_text_v1: "#yellow 整备期#!：余 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_risk_grace_display_v1')|0]#! 次月度核验；指标照常变化，暂不累计失败。"
 ffpa_usa_gov_risk_normal_v1: "#p 治理正常#! · 常驻收益生效"
 ffpa_usa_gov_risk_warning_text_v1: "#yellow 治理预警#! · 常驻收益降档"
 ffpa_usa_gov_risk_crisis_text_v1: "#n 危机#!：已连续 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_risk_crisis_display_v1')|0] / 12#! 个月；本领域收益暂停。"
 ffpa_usa_gov_risk_failed_text_v1: "#n 失败恢复#!：安全条件连续 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_risk_repair_display_v1')|0] / 12#! 个月。重罚到期且修复达标后恢复收益。"
 ffpa_usa_gov_risk_penalty_clock_v1: "#bold 重罚剩余#!  [JournalEntry.GetCountry.GetTimedModifier('ffpa_usa_gov_risk_penalty_v1').GetRemainingDuration]"
 ffpa_usa_gov_risk_delta_v1: "月度变化  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_risk_change_v1')|2]#! · 悬浮查看来源"
 ffpa_usa_gov_risk_delta_tt_v1: "[JournalEntry.GetCountry.MakeScope.GetScriptValueDesc('ffpa_usa_gov_risk_change_v1')]"
 ffpa_usa_gov_credit_rules_v1: "#bold 收益与边界#!\n信用至少35：合法性 #p +5#!、官僚产出 #p +8%#!；20—不足35：分别 #p +2#!、#p +4%#!；低于20暂停收益。\n低于20连续12个月触发八年重罚：合法性 #n −15#!、官僚产出 #n −15%#!、法律颁布速度 #n −25%#!。回到20清空危机计时；失败后需信用至少35连续12个月，且重罚到期。"
 ffpa_usa_gov_risk_rules_v1: "#bold 收益与边界#!\n风险低于65：制造业吞吐量、建造效率各 #p +5%#!；65—不足85：各 #p +2.5%#!；至少85暂停收益。\n至少85连续12个月触发五年重罚：制造业吞吐量 #n −15%#!、建造效率 #n −20%#!。低于85清空危机计时；失败后需风险低于65连续12个月，且重罚到期。"
 ffpa_usa_gov_inputs_v1: "治理读数：合法性 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_legitimacy_v1')|0]#! · 官僚余额 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_bureaucracy_v1')|0]#!\n动乱达标人口 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_turmoil_v1')|1]%#!"
 ffpa_usa_gov_inputs_tt_v1: "读数扣除本日志信用档位与失信重罚的直接合法性、官僚产出影响。动乱人口仅计算本土、动乱至少30%的州；全国占比至少25%才形成压力。其他制度和实际经济后果仍正常计入。 官僚总倍率非正、无法反算时保守判为行政压力。"
 ffpa_usa_gov_industry_inputs_v1: "低就业工业等级占比 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_low_employment_v1')|1]%#!\n生活水平：当前 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_current_display_v1')|0]#! / 前三年均值 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_history_display_v1')|0]#! · 下降连续 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_sol_falling_display_v1')|0]#! 个月"
 ffpa_usa_gov_industry_inputs_tt_v1: "低就业为就业率低于65%的制造建筑，以已建等级加权；没有制造业时按100%处理。\n生活水平使用相同州群的当前人口权重，比较当前值与各州此前36个月均值。新持有或新建州重新观察；未满36次记录不计入比较，因而也不会在取得后的首12个月制造下降压力。显示0表示尚无足够历史；下降至少10%连续三个月才产生压力。"
 ffpa_usa_gov_costs_v1: "#bold 当前治理拨款#!  @money![JournalEntry.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_total_cost_v1')|0] / 周"
 ffpa_usa_gov_costs_tt_v1: "协商、产业信贷、救济分别按启动时年GDP的0.25%、0.5%、0.75%除以52，冻结为一年周支出。金额不随之后的GDP追涨；国家修正显示剩余时间，项目到期后的首次月度核验确认履约。普通赤字不取消项目；身份失效取消未完成项目且不发履约收益。"
 ffpa_usa_gov_shared_rules_v1: "#bold 行动安排#!\n紧急授权与产业信贷共用加速名额；两种审查共用审查名额。任一领域处于危机或失败恢复时，两个加速行动均不可用；协商、审查和救济仍可修复。\n惩罚按原期限结束；既有工程、公司和制度成果保留。"
 ffpa_usa_gov_factor_stable_v1: "合法性与行政稳定"
 ffpa_usa_gov_factor_legitimacy_v1: "合法性低于30"
 ffpa_usa_gov_factor_bureaucracy_v1: "官僚余额为负"
 ffpa_usa_gov_factor_turmoil_v1: "本土动乱压力"
 ffpa_usa_gov_factor_oversight_v1: "常设审议"
 ffpa_usa_gov_factor_review_v1: "拨款与资格审查"
 ffpa_usa_gov_factor_debt_high_v1: "债务至少90%或违约"
 ffpa_usa_gov_factor_debt_v1: "债务至少60%"
 ffpa_usa_gov_factor_jobs_v1: "低就业工业压力"
 ffpa_usa_gov_factor_jobs_relief_v1: "低就业工业压力：救济减半"
 ffpa_usa_gov_factor_sol_v1: "生活水平持续下降"
 ffpa_usa_gov_factor_sol_relief_v1: "生活水平下降：救济减半"
 ffpa_usa_gov_factor_recovery_v1: "债务、就业与生活水平稳定"
 ffpa_usa_gov_conference_button_v1: "召开州际协商会议"
 ffpa_usa_gov_conference_button_desc_v1: "把拨款进度与地方提出的条件放到同一张桌上，按约完成这一年的协商。"
 ffpa_usa_gov_conference_effects_v1: "一年履约后信用 #p +12#!。周支出为启动时年GDP的0.25% ÷ 52，持续一年。冷却24个月；地方组织代表缩短为18个月。\n当前预计周支出：@money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_conference_cost_v1')|0]。"
 ffpa_usa_gov_conference_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_conference_effects_v1$"
 ffpa_usa_gov_review_button_v1: "启动拨款与资格审查"
 ffpa_usa_gov_review_button_desc_v1: "重新核对签名、资格和拨款凭据，让承诺有据可查。"
 ffpa_usa_gov_review_effects_v1: "十二次月度核验各恢复信用 #p +1#!；个人登记提高为 #p +1.25#!。一年内建造效率 #n −10%#!，冷却24个月；与采购审查互斥。完成后，已解锁的繁荣风险 #p −5#!。首次听证另有选项代价，见下方说明。\n首次听证：追责可提高已解锁信用5（仅经济开启时风险降低5），代价为一年官僚产出 −5%；也可重排合同，降低已解锁风险5（仅政治开启时信用提高3），代价为一年建造效率 −5%。"
 ffpa_usa_gov_review_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_review_effects_v1$"
 ffpa_usa_gov_emergency_button_v1: "行使紧急授权"
 ffpa_usa_gov_emergency_button_desc_v1: "用已经取得的授权缩短工程的等待时间，并为临时权力留下明确期限。"
 ffpa_usa_gov_emergency_effects_v1: "需要应急授权制度、信用至少35。立即信用 #n −15#!，建造效率 #p +15%#!一年；冷却36个月。与产业信贷互斥，任一领域危机或失败恢复时禁用。首次到期须接受一年建造效率 −5%的监督，或再损失5信用；不续发加速。"
 ffpa_usa_gov_emergency_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_emergency_effects_v1$"
 ffpa_usa_gov_credit_line_button_v1: "扩大发包与产业信贷"
 ffpa_usa_gov_credit_line_button_desc_v1: "让更多订单进入生产线，也把偿付义务写进下一年的预算。"
 ffpa_usa_gov_credit_line_effects_v1: "风险须低于65。立即风险 #n +15#!；建造效率 #p +10%#!一年。周支出为启动时年GDP的0.5% ÷ 52，持续一年；冷却24个月。与紧急授权互斥，任一领域危机或失败恢复时禁用。\n当前预计周支出：@money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_credit_line_cost_v1')|0]。"
 ffpa_usa_gov_credit_line_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_credit_line_effects_v1$"
 ffpa_usa_gov_procurement_button_v1: "审查特许与公共采购"
 ffpa_usa_gov_procurement_button_desc_v1: "逐项核对合同、交付与特许条件，让新的订单建立在可承担的承诺上。"
 ffpa_usa_gov_procurement_effects_v1: "一年履约后风险 #p −15#!，已解锁的信用 #p +5#!。启动即承担制造业吞吐量 #n −5%#!、工业家支持度 #n −2#!，持续两年；冷却36个月，与资格审查互斥。首次听证另有选项代价。\n首次听证：追责可提高已解锁信用5（仅经济开启时风险降低5），代价为一年官僚产出 −5%；也可重排合同，降低已解锁风险5（仅政治开启时信用提高3），代价为一年建造效率 −5%。"
 ffpa_usa_gov_procurement_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_procurement_effects_v1$"
 ffpa_usa_gov_relief_button_v1: "扩充失业救济与再培训"
 ffpa_usa_gov_relief_button_desc_v1: "让暂时失去工作的家庭得到支持，并为重返生产留下机会。"
 ffpa_usa_gov_relief_effects_v1: "一年内，低就业工业与生活水平下降的风险增量减半，不抵消债务压力。周支出为启动时年GDP的0.75% ÷ 52，持续一年；冷却24个月。正常履约后，已解锁的信用 #p +5#!。\n当前预计周支出：@money![ROOT.GetCountry.MakeScope.ScriptValue('ffpa_usa_gov_relief_cost_v1')|0]。"
 ffpa_usa_gov_relief_requirements_v1: "须已解锁对应治理领域，且本行动冷却结束、没有同类在途项目；共享名额与指标条件也须满足。\n$ffpa_usa_gov_relief_effects_v1$"
 ffpa_usa_flavor.30.t: "拨款听证"
 ffpa_usa_flavor.30.d: "听证桌上摆着已验收的工程清单，也摆着迟交的凭据。审查人员希望追究签字人的责任，承包方则要求重新安排交付顺序。\n\n#bold 审查已经完成#!；现在要决定，下一轮履约应由更严密的追责，还是更谨慎的合同安排来支持。"
 ffpa_usa_flavor.30.f: "书记员把两份日期不同、编号相同的收据并排放下，等候双方解释。"
 ffpa_usa_flavor.30.1: "逐项追究签字责任。"
 ffpa_usa_flavor.30.1.tt: "听证确认：已解锁的信用 #p +5#!；若仅经济治理开启，则风险 #p −5#!。官僚产出 #n −5%#!一年。"
 ffpa_usa_flavor.30.2: "按能够交付的顺序重排合同。"
 ffpa_usa_flavor.30.2.tt: "听证确认：已解锁的风险 #p −5#!；若仅政治治理开启，则信用 #p +3#!。建造效率 #n −5%#!一年。"
 ffpa_usa_flavor.31.t: "临时权力的期限"
 ffpa_usa_flavor.31.d: "提前下达的订单已经走过一个拨款年度。地方代表要求把授权期间略去的手续补进档案，工程部门担心补审会拖慢下一批工作。\n\n#bold 临时授权已经到期#!。政府可以接受额外监督，也可以承担拒绝补审带来的信用损失。"
 ffpa_usa_flavor.31.f: "授权书最后一行写着终止日期，墨迹和第一天一样清楚。"
 ffpa_usa_flavor.31.1: "把临时授权交回审查。"
 ffpa_usa_flavor.31.1.tt: "建造效率 #n −5%#!一年；不续发紧急授权收益。"
 ffpa_usa_flavor.31.2: "由政府承担拒绝补审的后果。"
 ffpa_usa_flavor.31.2.tt: "信用 #n −5#!；不续发紧急授权收益。"
 ffpa_usa_flavor.40.t: "联邦失信"
 ffpa_usa_flavor.40.d: "地方代表带来的不再只是新的申请，还有过去未获答复的拨款清单。每项新的联邦决议，都被要求附上一份履约保证。\n\n#bold 信用危机已经形成#!。政府仍能召开协商、核验资格，但重新取得同意将比过去更加困难。"
 ffpa_usa_flavor.40.f: "会场散去后，桌上留下最多的是写着“待核实”的纸条。"
 ffpa_usa_flavor.40.1: "先兑现仍然能够兑现的承诺。"
 ffpa_usa_flavor.40.1.tt: "八年重罚已经生效：合法性 −15、官僚产出 −15%、法律颁布速度 −25%。信用至少35连续12个月且重罚到期后恢复。确认不会重复处罚。"
 ffpa_usa_flavor.41.t: "繁荣破裂"
 ffpa_usa_flavor.41.d: "采购部门开始修改交货计划，地方办事处重新核对就业与拨款账目。过去按扩张编列的安排，如今必须按实际承受能力重算。\n\n#bold 繁荣的承诺已经落空#!。现有工厂和工程仍在，恢复要从可履行的订单与可承担的预算开始。"
 ffpa_usa_flavor.41.f: "旧账簿没有被丢弃。新的一页从尚未交付的清单开始。"
 ffpa_usa_flavor.41.1: "让现有的工厂重新站稳。"
 ffpa_usa_flavor.41.1.tt: "五年重罚已经生效：制造业吞吐量 −15%、建造效率 −20%。风险低于65连续12个月且重罚到期后恢复。既有公司与工程成果保留。"
 ffpa_usa_flavor.43.t: "再次兑现的承诺"
 ffpa_usa_flavor.43.d: "拨款按约到达，审查记录也能同地方的凭据对应。代表们逐项划去附在议案后的保留意见，政府终于不必为每项日常决议重新解释过去。\n\n#bold 联邦信用已经修复#!。这些安排仍需维持，但失信留下的特别限制已经结束。"
 ffpa_usa_flavor.43.f: "书记员在最后一张回执上盖章，然后翻开下一册。"
 ffpa_usa_flavor.43.1: "让承诺继续有据可查。"
 ffpa_usa_flavor.43.1.tt: "政治侧常驻收益已恢复。没有额外奖励，也不会重新获得整备期。"
 ffpa_usa_flavor.44.t: "重新开工的账单"
 ffpa_usa_flavor.44.d: "新的采购安排以现有订单和实际交付为依据，预算也给履约留下了余地。工厂重新安排班次时，地方办事处终于能给出较为确定的答复。\n\n#bold 经济治理已经恢复#!。下一轮建设可以继续，但速度仍须由能够承担的账单决定。"
 ffpa_usa_flavor.44.f: "账簿上的数字没有变得漂亮，只是终于能够一项项对上。"
 ffpa_usa_flavor.44.1: "按能够承担的速度继续建设。"
