l_simp_chinese:
 ideology_ffpa_global_ig_property_conservatism: "地产保守主义"
 ideology_ffpa_global_ig_property_conservatism_desc: "#lore 这个集团认为，稳定的土地收益与有产者的政治影响是社会秩序的基础。只要产权和地租得到保障，王室、总统与商业发展都可以成为可靠的伙伴；扩大大众权力和重新分配土地则会动摇这种秩序。#!"
 ideology_ffpa_global_ig_hierarchic: "$ideology_hierarchic$"
 ideology_ffpa_global_ig_hierarchic_desc: "#lore 这个集团主张由拥有土地和地方影响力的人维持社会等级。佃租与商业经营可以延续地主的地位，无须把农奴依附视为唯一基础；削弱大地产的改革、累进税与广泛福利仍受到它的反对。#!"
 ideology_ffpa_global_ig_developmentalism: "发展主义"
 ideology_ffpa_global_ig_developmentalism_desc: "#lore 这个集团把私人经营、自由贸易与生产扩张视为繁荣的基础。它接受政府干预和有节制的劳动监管，但不把保护关税或义务教育当作必要纲领，更反对由国家或劳动者接管企业。#!"
 ideology_ffpa_global_ig_republican_conservatism: "共和保守主义"
 ideology_ffpa_global_ig_republican_conservatism_desc: "#lore 这个集团相信，共和制度可以保护财产、社会秩序与个人的晋升机会。它支持共和政治，却仍坚持严格的国民资格与移民限制，并警惕激进劳工组织改变既有的社会关系。#!"
 ideology_ffpa_global_ig_civil_patriotism: "$ideology_patriotic$"
 ideology_ffpa_global_ig_civil_patriotism_desc: "#lore 这个集团重视国家权威、公共秩序与强有力的安全机构。它优先依靠专职警察维持日常治安，但仍接受军事化的强力措施，并愿意为国家安全限制政治自由。#!"
 ideology_ffpa_global_ig_rural_autonomy: "乡村自治主义"
 ideology_ffpa_global_ig_rural_autonomy_desc: "#lore 这个集团希望乡村参与更大的市场，同时通过关税与移民管理保护本地生计。行政人员应回应地方选民，而非凭世袭权位统治；与外界往来不意味着放弃地方社会的发言权。#!"
 ideology_ffpa_global_ig_moralist: "$ideology_moralist$"
 ideology_ffpa_global_ig_moralist_desc: "#lore 这个集团认为，宗教应在公共生活与国家制度中保持权威。统治者是否戴着王冠并非首要问题；国家是否尊重信仰、维护宗教地位，才是它判断政治秩序的根本依据。#!"
 ideology_ffpa_global_ig_proletarian: "$ideology_proletarian$"
 ideology_ffpa_global_ig_proletarian_desc: "#lore 这个集团要求劳动者拥有组织权、公共保障和对生产的实际发言权。它支持合作所有制与工厂委员会，但不认为国家接管企业就必然意味着劳动者取得了控制。#!"
