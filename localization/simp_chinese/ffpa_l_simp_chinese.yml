 ffpa_region_danube_thrace_corridor_desc: "铁路、河运与协调行政扩展了国家联通和征税能力。"
 ffpa_region_aegean_maritime_network: "爱琴海航运网络"
 ffpa_region_aegean_maritime_network_desc: "协同运作的港口、船厂与航运班次提高海运能力并吸引人口迁入。"
 ffpa_region_southern_italian_harbors: "内海港群"
