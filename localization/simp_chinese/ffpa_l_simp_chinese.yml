 ffpa_byz_oriens_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_aegyptus_postwar_expenses_v1: "埃及行省安置经费"
 ffpa_byz_aegyptus_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_africa_postwar_expenses_v1: "阿非利加行省安置经费"
 ffpa_byz_africa_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_italia_postwar_expenses_v1: "意大利行省安置经费"
 ffpa_byz_italia_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_spania_postwar_expenses_v1: "西班尼亚行省安置经费"
 ffpa_byz_spania_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_balkans_restored_v1: "多瑙河诸省复归"
 ffpa_byz_balkans_restored_v1_desc: "对巴尔干的直接统治使新罗马的帝国主张获得长久分量。"
 ffpa_byz_anatolia_restored_v1: "安纳托利亚复归"
 ffpa_byz_anatolia_restored_v1_desc: "对安纳托利亚腹地的直接统治，为帝国正统性提供了长久的领土根基。"
 ffpa_byz_oriens_restored_v1: "东方大区复归"
 ffpa_byz_oriens_restored_v1_desc: "东方诸省的回归使复兴帝国在爱琴海以外成为政治事实。"
 ffpa_byz_aegyptus_restored_v1: "埃及行省复归"
 ffpa_byz_aegyptus_restored_v1_desc: "对亚历山大、尼罗河与西奈的控制给予新罗马持久权威。"
 ffpa_byz_africa_restored_v1: "罗马阿非利加复归"
 ffpa_byz_africa_restored_v1_desc: "非洲海岸上的帝国军旗为复归事业带来长久威望。"
 ffpa_byz_italia_restored_v1: "意大利复归"
 ffpa_byz_italia_restored_v1_desc: "对意大利及其岛屿的直接统治，使帝国以罗马之名提出的主张更具长久分量。"
 ffpa_byz_spania_restored_v1: "西班尼亚复归"
 ffpa_byz_spania_restored_v1_desc: "最西端的复归完成了横跨地中海的帝国事业。"

 ffpa_flavor.39.t: "帝国的复归议程"
 ffpa_flavor.39.d: "将领、法学家、外交官和地方代表围绕复原的帝国地图展开讨论。复归派要求政府承接历史疆界，行政与外交人员则要它说明具体目标和限度。下一份议程必须列出疆界、接受期限，并让政府承担未能兑现的后果。"
 ffpa_flavor.39.f: "一位将领在地图上连画了几条路线。财政官员没有擦掉任何一条，只把日历放在地图旁：“请把日期也写上。”"
 ffpa_byz_restoration_council_balkans_option: "宣布多瑙河与巴尔干复归。"
 ffpa_byz_restoration_council_anatolia_option: "收复安纳托利亚腹地。"
 ffpa_byz_restoration_council_oriens_option: "重建帝国东方诸省。"
 ffpa_byz_restoration_council_aegyptus_option: "打开通往亚历山大与尼罗河的道路。"
 ffpa_byz_restoration_council_africa_option: "让帝国军旗沿阿非利加海岸前进。"
 ffpa_byz_restoration_council_italia_option: "把复归事业转向意大利。"
 ffpa_byz_restoration_council_spania_option: "命令最后的西方远征前往西班尼亚。"
 ffpa_byz_restoration_council_cancel_option: "帝国尚未准备好作出另一项宣告。"

 ffpa_flavor.40.t: "多瑙河重归新罗马"
 ffpa_flavor.40.d: "从亚得里亚海岸到多瑙河口，本次复归议程列出的地区已经纳入直接统治。政府必须决定如何向外界说明这一成果：以外交和议缓和疑虑，或以凯旋庆典强调自己的主张。行政接续与地方安置仍是接下来的工作。"
 ffpa_flavor.40.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_balkans_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。政府必须决定如何向外界说明这一成果：以外交和议缓和疑虑，或以凯旋庆典强调自己的主张。行政接续与地方安置仍是接下来的工作。"
 ffpa_flavor.40.f: "河港的职员把新印章摆在旧表格旁，抬头问来交接的官员：“明天进港的货物，先按哪一套登记？”"
 ffpa_flavor.41.t: "安纳托利亚复归"
 ffpa_flavor.41.d: "本次议程列出的安纳托利亚地区已经纳入直接统治，港口、高原与东部边疆如今出现在同一份管辖清单上。外交官建议向周边说明这一成果的边界；主张凯旋的人则希望公开强调复归的分量。政府仍须为日后的行政接续作准备。"
 ffpa_flavor.41.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_anatolia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。外交官建议向周边说明这一成果的边界；主张凯旋的人则希望公开强调复归的分量。政府仍须为日后的行政接续作准备。"
 ffpa_flavor.41.f: "一名地方官员展开跨越高原的路线图，在几处驿站旁做了记号：“疆界已经报上去了。这些地方，以后都要按期收到回信。”"
 ffpa_flavor.42.t: "东方诸省的接收"
 ffpa_flavor.42.d: "塞浦路斯、叙利亚、巴勒斯坦与幼发拉底边疆中列入本次议程的地区，已经纳入新罗马的直接统治。复归目标已兑现，地方机关与中央之间的衔接却不能只靠改换印章。政府先要决定以外交和议还是凯旋庆典回应这份成果。"
 ffpa_flavor.42.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_oriens_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。复归目标已兑现，地方机关与中央之间的衔接却不能只靠改换印章。政府先要决定以外交和议还是凯旋庆典回应这份成果。"
 ffpa_flavor.42.f: "港口来函与内陆呈文一同送到接收人员手中。负责分派的人把它们排成两列：“同一个政府，不会让海路和陆路的问题变成同一种问题。”"
 ffpa_flavor.43.t: "尼罗河飘扬罗马军旗"
 ffpa_flavor.43.d: "亚历山大、尼罗河谷与西奈中列入议程的地区已经纳入直接统治。政府获得了新的疆域，也需要说明接下来将怎样使用这份地位。外交和议可以缓和外界疑虑，凯旋庆典则会强调复归的象征；两者都不能代替河谷与海港的后续治理。"
 ffpa_flavor.43.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_aegyptus_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。政府获得了新的疆域，也需要说明接下来将怎样使用这份地位。外交和议可以缓和外界疑虑，凯旋庆典则会强调复归的象征；两者都不能代替河谷与海港的后续治理。"
 ffpa_flavor.43.f: "一位负责河运的官员听完接收公告，仍把货运表留在桌上。“新的命令会从哪里来？”他问，“船却不会等到我们把这个问题谈完。”"
 ffpa_flavor.44.t: "鹰旗重返阿非利加"
 ffpa_flavor.44.d: "从利比亚向里夫延伸的指定地区已经纳入直接统治。漫长海岸让复归成果格外显眼，也使政府面对不同港口与地方机关的接续任务。中央须先决定，是通过外交和议缓和外界疑虑，还是举行凯旋，公开重申自己的疆界主张。"
 ffpa_flavor.44.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_africa_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。漫长海岸让复归成果格外显眼，也使政府面对不同港口与地方机关的接续任务。中央须先决定，是通过外交和议缓和外界疑虑，还是举行凯旋，公开重申自己的疆界主张。"
 ffpa_flavor.44.f: "港务人员收到新的公文抬头，先抄下回信地址。来人问他是否看过公告，他指向码头：“看过了。现在我要知道，这里的事该写给谁。”"
 ffpa_flavor.45.t: "重返意大利"
 ffpa_flavor.45.d: "意大利半岛、周边岛屿与亚得里亚入口中列入议程的地区，已经纳入直接统治。复归派希望举行与这一象征相称的凯旋，外交官则要求用和议约束外界的疑虑。政府需要决定怎样呈现成果；地方行政与城市生活仍须继续运转。"
 ffpa_flavor.45.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_italia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。复归派希望举行与这一象征相称的凯旋，外交官则要求用和议约束外界的疑虑。政府需要决定怎样呈现成果；地方行政与城市生活仍须继续运转。"
 ffpa_flavor.45.f: "市政官员在接收仪式后递上当天的公务清单。代表团还在谈论古老的名号，他已经翻到了下一页：“这些事情，也请一并接过去。”"
 ffpa_flavor.46.t: "西方海岸复归"
 ffpa_flavor.46.d: "西班尼亚议程列出的最后一批沿海地区已经纳入直接统治。政府可以把这份成果作为外交和议的依据，也可以用凯旋庆典为西方复归议程作结。宣布过的目标已经兑现，维护新管辖关系的工作仍将继续。"
 ffpa_flavor.46.d.named: "最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_spania_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，完成了本次议程的领土目标。政府可以把这份成果作为外交和议的依据，也可以用凯旋庆典为西方复归议程作结。宣布过的目标已经兑现，维护新管辖关系的工作仍将继续。"
 ffpa_flavor.46.f: "航海人员在图上标出最后一处接收港口，又沿着回程路线划了一遍。“到这里是一程，”他说，“此后还要一程一程地往返。”"
 ffpa_byz_restoration_success_settlement_option: "把胜利提交给国际和议。"
 ffpa_byz_restoration_success_settlement_tt: "持续#v 8年#!：恶名衰减#p +20%#!，外交博弈机动#n -35%#!，影响力#n -10%#!，威望#n -10%#!，军队利益集团支持#n -2#!。\n\n宣布新的复归目标会提前终止这些效果。"
 ffpa_byz_restoration_success_triumph_option: "让新罗马举行凯旋式。"
 ffpa_byz_restoration_postwar_event_t: "把胜利变成治理"
 ffpa_byz_restoration_postwar_event_d: "本次复归议程中转入的地区，需要让地籍、税务与公共机关衔接新的管辖关系。政府可以从国库拨款并抽调中央官员，加快这些地区的整合；也可以交由常规行政逐步接续。较大投入将加强整合与迁入条件，并缓和政治运动进一步产生激进派的压力，但不会直接消除已有的激进派。"
 ffpa_byz_restoration_postwar_event_f: "交接桌上放着几本来自不同机关的簿册。地方办事员问，哪些人留在这里核对，哪些问题送交中央。负责接收的官员翻开工作清单：“先决定能派多少人来，许诺才有着落。”"
 ffpa_byz_restoration_postwar_weak_option: "派出巡回登记团，实施有限安置。"
 ffpa_byz_restoration_postwar_medium_option: "设立行省整合委员会。"
 ffpa_byz_restoration_postwar_strong_option: "建立全套帝国重建总署。"
 ffpa_byz_restoration_postwar_decline_option: "让常规行政机关逐步接管。"
 ffpa_byz_restoration_postwar_weak_tt: "五年内每周承担相当于选择时国内生产总值#v 0.025%#!的额外支出，并使官僚机构产出降低#v 10%#!。\n\n本次安置州十年内获得#p +20%#!整合速度与#p +10%#!移民吸引力，并使政治运动产生的激进派#p 减少20%#!、忠诚派#p 增加20%#!。"
 ffpa_byz_restoration_postwar_medium_tt: "五年内每周承担相当于选择时国内生产总值#v 0.05%#!的额外支出，并使官僚机构产出降低#v 15%#!。\n\n本次安置州十年内获得#p +35%#!整合速度与#p +20%#!移民吸引力，并使政治运动产生的激进派#p 减少35%#!、忠诚派#p 增加35%#!。"
 ffpa_byz_restoration_postwar_strong_tt: "五年内每周承担相当于选择时国内生产总值#v 0.1%#!的额外支出，并使官僚机构产出降低#v 20%#!。\n\n本次安置州十年内获得#p +50%#!整合速度与#p +30%#!移民吸引力，并使政治运动产生的激进派#p 减少50%#!、忠诚派#p 增加50%#!。"

 ffpa_flavor.47.t: "复归事业受挫"
 ffpa_flavor.47.d: "政府宣布的期限已经过去，选定疆界的部分地区仍不受直接统治。这项许诺不能立刻重提；政府和最高统帅部必须先承受失败的政治后果。"
 ffpa_flavor.47.f: "会议结束时，地图仍留在原处，期限却被划去。地方代表拿起自己那份决议：“下次再让我们转告居民，请先解释这一次。”"
 ffpa_flavor.47.a: "这条疆界只能等待下一次机会。"

 ffpa_byz_foundation_territory_tt: "完整控制十二个指定成立地区中的至少十个，且必须包含东色雷斯和阿提卡"
