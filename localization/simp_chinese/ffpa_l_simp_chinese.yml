 # 拜占庭西方整合单次事件
 ffpa_flavor.30.t: "地中海投资大会"
 ffpa_flavor.30.d: "复归诸省的数项大型工程已经竣工，实业家、工程师、银行家与港务官员齐聚新罗马。他们要求国家确定一套#bold 永久投资体制#!，引导复归地中海的资本。"
 ffpa_flavor.30.review_d: "先前大会形成的临时信贷安排，已不足以作为长期的投资政策。各方代表再次来到新罗马，要求把这些经验整理为永久制度；争论仍在于资本应由中央集中引导、沿交通网络流动，还是更多依靠行省机构。"
 ffpa_flavor.30.f: "银行家先问谁来担保，港务代表先问资金能否用于连接腹地。一位工程师听了许久：“我们带来的都是一段工程，会议要定的却是谁把它们接起来。”"
 ffpa_flavor.30.a: "成立新罗马产业信贷总局。"
 ffpa_flavor.30.b: "以海路、铁轨和自由港联结诸省。"
 ffpa_flavor.30.c: "特许行省开发银行同盟。"

 ffpa_flavor.31.t: "西方行省总清丈"
 ffpa_flavor.31.d: "复归诸省保留着多个政权遗留下来的地契、市镇特权和税收惯例。法学家要求#bold 统一帝国簿册#!，市镇领袖维护协商税契，而参谋部则提议对外西方诸省进行军事测绘。"
 ffpa_flavor.31.review_d: "第一次西方清丈只是临时行政措施。随着委员会解散、行省记录再次分歧，帝国必须确认一套永久地籍制度。"
 ffpa_flavor.31.f: "市镇代表指着税契上的签名，测绘人员指着新图上的界线。两者并不完全冲突，却也不是同一个问题：一份说明土地在哪里，另一份说明谁曾答应为它承担什么。"
 ffpa_flavor.31.a: "一套尺，一本册，一部帝国地籍。"
 ffpa_flavor.31.b: "承认西方自治市的税务协定。"
 ffpa_flavor.31.c: "将外西方诸省交由帝国军事测绘局。"

 ffpa_flavor.32.t: "西方罗马公民权章程"
 ffpa_flavor.32.d: "地区工程与罗马人共同体的建设，把新纳入诸省及其居民的身份问题带到了中央。代表们争论，#bold 罗马公民权#!应作为共同身份扩展，依照城市与行省的契约落实，还是更多与为国家服役相联系。政府需要确定这项长期安排的依据。"
 ffpa_flavor.32.review_d: "旧有公民权章程仍然提出共同身份的原则，相关安排却需要成为能够长期执行的制度。各方代表再次审议城市、行省与国家之间的关系，要为这份章程确定持续适用的依据。"
 ffpa_flavor.32.f: "代表把一张地方身份凭据与章程草案并排摆好。“我知道家乡认得这张纸，”他说，“我们今天要决定的，是离开家乡以后，国家认得什么。”"
 ffpa_flavor.32.a: "罗马人之间不应再有行省之别。"
 ffpa_flavor.32.b: "以公民协定联结城市与行省。"
 ffpa_flavor.32.c: "以服务帝国换取公民权。"

 ffpa_flavor.33.t: "西方诸省代表"
 ffpa_flavor.33.d: "随着选举活动展开，复归诸省要求在帝国政治中获得#bold 稳定席位#!。改革派主张统一选民名册，行省领袖维护地域代表团，而保守显贵则要求由上院过滤西方的政治声音。"
 ffpa_flavor.33.review_d: "第一次西方代表制度只是选举妥协，并非长久宪制。诸省代表再次抵达新罗马，要求永久确认他们在帝国政治中的位置。"
 ffpa_flavor.33.f: "来自西方的代表把发言稿递上去，又询问下一次会期。“这次我们已经到了，”他说，“席位的安排要让人知道，下次还应当怎样来。”"
 ffpa_flavor.33.a: "把所有公民登记在同一部帝国选民册中。"
 ffpa_flavor.33.b: "为西方诸省设置常驻代表团。"
 ffpa_flavor.33.c: "由皇室任命帝国元老院。"
 ffpa_flavor.33.c_republic: "把元老院交给西方名望家。"

 ffpa_western_integration_state_snapshot_tt: "永久行省奖励仅授予[GetPlayer.GetName]目前拥有的合格西方州；以后征服的州不会继承。"
 ffpa_outer_western_integration_state_snapshot_tt: "永久行省奖励仅授予目前拥有、且属于西部海路、西班尼亚、古毛里塔尼亚和亚历山大—西奈工程范围的州；以后征服的州不会继承。"
 ffpa_byz_western_universal_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+75%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_provincial_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+50%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_service_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+25%地区整合速度，直至完成整合或失去该州。"

 ffpa_byz_mediterranean_industrial_credit: "地中海工业信贷"
 ffpa_byz_mediterranean_industrial_credit_desc: "帝国担保在十年内把信贷引入制造业与熟练劳动力培养，但也增加行政负担。"
 ffpa_byz_mediterranean_port_rail_fund: "帝国港铁基金"
 ffpa_byz_mediterranean_port_rail_fund_desc: "统一基金加快基础设施建设与地中海贸易，同时推高建设计划的物资成本。"
 ffpa_byz_mediterranean_development_banks: "行省开发银行"
 ffpa_byz_mediterranean_development_banks_desc: "行省银行为建设、人口资质和迁徙提供资金，同时需要持续的官僚监督。"
 ffpa_byz_western_uniform_cadastre_state: "西方统一地籍"
 ffpa_byz_western_uniform_cadastre_state_desc: "全面清丈加强复归诸省的税收能力与专业行政。"
 ffpa_byz_western_uniform_cadastre_cost: "帝国清丈委员会"
 ffpa_byz_western_uniform_cadastre_cost_desc: "清丈委员会消耗行政资源，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_provincial_tax_state: "行省税务协定"
 ffpa_byz_western_provincial_tax_state_desc: "获承认的地方税收惯例在不强制统一簿册的情况下改善守法度并鼓励定居。"
 ffpa_byz_western_provincial_tax_compact: "与西方显贵的协定"
 ffpa_byz_western_provincial_tax_compact_desc: "政府借助行省显贵与教会权威实施治理。"
 ffpa_byz_western_universal_citizenship: "普遍罗马公民权"
 ffpa_byz_western_universal_citizenship_desc: "罗马公民身份直接提高复归西方与非洲诸省主要民族的文化接纳度。"
 ffpa_byz_western_provincial_civic_compact: "西方行省公民协定"
 ffpa_byz_western_provincial_civic_compact_desc: "协商达成的章程提供广泛文化接纳，同时保留行省权威、人口流动与地方晋升渠道。"
 ffpa_byz_western_common_electoral_roll: "帝国统一选民名册"
 ffpa_byz_western_common_electoral_roll_desc: "统一选举权加强公民政治的正统性，同时触动地主特权。"
 ffpa_byz_western_provincial_delegations: "西方行省代表团"
 ffpa_byz_western_provincial_delegations_desc: "地域代表团让复归诸省在帝国政治中获得制度化发言权。"
 ffpa_byz_western_crown_senate: "皇室任命的西方元老院"
 ffpa_byz_western_crown_senate_desc: "由君主任命的西方元老院以自由派信心为代价，加强权威与正统性。"

 ffpa_byz_mediterranean_industrial_credit_v2: "新罗马产业信贷总局"
 ffpa_byz_mediterranean_industrial_credit_v2_desc: "帝国担保永久偏向大型制造业财团和资本家投资，也因此疏远土地精英。"
 ffpa_byz_mediterranean_port_rail_network_state_v2: "地中海港铁特许网"
 ffpa_byz_mediterranean_port_rail_network_state_v2_desc: "长期特许权把本复归行省纳入自由港、铁路和仓储设施组成的永久网络。"
 ffpa_byz_mediterranean_concessions_v2: "地中海商业特许权"
 ffpa_byz_mediterranean_concessions_v2_desc: "帝国让渡一部分直接权威，以换取私人资本建设西方交通网络。"
 ffpa_byz_mediterranean_development_banks_state_v2: "行省开发银行体系"
 ffpa_byz_mediterranean_development_banks_state_v2_desc: "地方银行和城市基金为本复归行省的资质培养、移民和商业机会提供支持。"
 ffpa_byz_mediterranean_banking_compact_v2: "行省开发银行同盟"
 ffpa_byz_mediterranean_banking_compact_v2_desc: "分散的银行同盟扩大了投资来源，也限制了大型全国财团的影响力。"

 ffpa_byz_western_uniform_cadastre_state_v2: "帝国统一地籍"
 ffpa_byz_western_uniform_cadastre_state_v2_desc: "统一的计量、产权记录和专业行政体系永久加强了帝国税基。"
 ffpa_byz_western_uniform_cadastre_burden_v2: "常设清丈委员会"
 ffpa_byz_western_uniform_cadastre_burden_v2_desc: "维护统一簿册持续消耗中央行政能力，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_municipal_tax_compact_state_v2: "西方自治市税契"
 ffpa_byz_western_municipal_tax_compact_state_v2_desc: "得到承认的地方税收惯例改善守法度，也提高本行省对移民的吸引力。"
 ffpa_byz_western_municipal_vetoes_v2: "自治市财政特权"
 ffpa_byz_western_municipal_vetoes_v2_desc: "行省显贵以自身权威支持帝国，但他们的特权会拖慢全国立法。"
 ffpa_byz_western_military_survey_state_v2: "帝国军事测绘"
 ffpa_byz_western_military_survey_state_v2_desc: "军事工程师把道路、税册和补给地图整合为一套边疆基础设施。"
 ffpa_byz_western_military_survey_corps_v2: "西方测绘军团"
 ffpa_byz_western_military_survey_corps_v2_desc: "常设测绘与工程部队改善防御规划，同时增加军事补给开支。"

 ffpa_byz_western_universal_citizenship_v2: "罗马人不分行省"
 ffpa_byz_western_universal_citizenship_v2_desc: "普遍罗马公民身份带来最强的文化接纳与忠诚，同时削弱传统帝国权威。"
 ffpa_byz_western_provincial_civic_compact_v2: "城市与行省公民契约"
 ffpa_byz_western_provincial_civic_compact_v2_desc: "协商公民权承认西方诸族，却也使统一立法更加困难。"
 ffpa_byz_western_provincial_civic_compact_state_v2: "行省公民协定"
 ffpa_byz_western_provincial_civic_compact_state_v2_desc: "得到承认的共同体为迁移、教育和地方晋升提供长久渠道。"
 ffpa_byz_western_service_citizenship_v2: "服役即公民权"
 ffpa_byz_western_service_citizenship_v2_desc: "军事和公共服务打开了一条较窄的公民权道路，以更高物资成本换取经验丰富的部队。"
 ffpa_byz_western_veteran_settlement_state_v2: "退伍军人与公职人员安置区"
 ffpa_byz_western_veteran_settlement_state_v2_desc: "退伍军人与公务人员在这处西方外缘行省获得土地和公民身份。"
 ffpa_byz_western_universal_incorporation_state_v1: "普遍罗马公民整合"
 ffpa_byz_western_universal_incorporation_state_v1_desc: "统一的罗马公民权正在加快本西方行省的法律与行政整合。"
 ffpa_byz_western_provincial_incorporation_state_v1: "行省公民契约整合"
 ffpa_byz_western_provincial_incorporation_state_v1_desc: "公民契约使地方共同体能够协助本西方行省融入帝国行政体系。"
 ffpa_byz_western_service_incorporation_state_v1: "服役公民整合"
 ffpa_byz_western_service_incorporation_state_v1_desc: "军事与公共服务在本西方行省和帝国之间建立了有限的行政纽带。"

 ffpa_byz_western_common_electoral_roll_v2: "一部帝国选民册"
 ffpa_byz_western_common_electoral_roll_v2_desc: "统一选举权提升立法正当性，却会削弱行政权威并触动地主特权。"
 ffpa_byz_western_provincial_delegations_state_v2: "受保障的行省代表权"
 ffpa_byz_western_provincial_delegations_state_v2_desc: "常设地域代表制度降低了动乱对本复归行省造成的政治损害。"
 ffpa_byz_western_provincial_delegations_v2: "西方行省代表会议"
 ffpa_byz_western_provincial_delegations_v2_desc: "行省声音增强国家元首的正当性，却也延长立法过程。"
 ffpa_byz_western_crown_senate_v2: "西方诸省王冠元老院"
 ffpa_byz_western_crown_senate_v2_desc: "由君主任命的上院加强权威与正统性，同时阻碍改革并疏远自由派。"
 ffpa_byz_western_notables_senate_v2: "西方名望家元老院"
 ffpa_byz_western_notables_senate_v2_desc: "精英共和国上院提供行政延续性与权威，却会拖慢立法并令自由派失望。"

 # 拜占庭复归战争
 je_group_ffpa_byzantine_restoration: "帝国复归"
 ffpa_byz_convene_restoration_council: "召集帝国复归会议"
 ffpa_byz_convene_restoration_council_desc: "由帝国复归会议选择一处明确的目标疆界。最多只能同时推进#v 两项#!复归议程，10—15年的期限仅在正式接受目标后开始。\n\n巴尔干路线将解锁意大利；安纳托利亚路线将依次通往东方、埃及和阿非利加；完成意大利与阿非利加后解锁西班尼亚。\n\n宣布新目标会#bold 终止仍在生效的“复归和议”#!。"
 ffpa_byz_restoration_campaign_slot_available_tt: "当前运行中的复归战争少于#v 2#!项"

 je_ffpa_byz_restore_balkans: "复归多瑙河与巴尔干"
 je_ffpa_byz_restore_balkans_reason: "政府把多瑙河以南与亚得里亚沿岸列为一项复归议程。支持者希望这些陆路、港口与新罗马之间形成可直接管理的疆域；地方社会却不会仅凭旧地图就与中央产生共同利益。宣布#bold 巴尔干复归疆界#!，意味着把历史主张变成一项有期限的国家承诺。\n\n在#v 15年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_anatolia: "收复安纳托利亚"
 je_ffpa_byz_restore_anatolia_reason: "爱琴海港口、高原城市与东部边疆在帝国的国策中彼此相连。复归派要求把这条横贯安纳托利亚的联系置于直接统治之下，政府则必须衡量如此广阔的疆界对国家能力的要求。#bold 安纳托利亚议程#!将以实际管辖检验这份主张，而不只计算地图上添了多少宣称。\n\n在#v 12年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_oriens: "重建东方大区"
 je_ffpa_byz_restore_oriens_reason: "安纳托利亚议程留下的政治承诺，把政府的目光引向塞浦路斯、叙利亚与幼发拉底边疆。复归派以旧东方诸省的名义连接岛屿、海岸和内陆，行政人员则要面对这些地区不同的交通与管辖条件。#bold 东方复归#!首先是一项取得直接统治的目标，后续治理仍需另行落实。\n\n在#v 12年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_aegyptus: "重返埃及行省"
 je_ffpa_byz_restore_aegyptus_reason: "复归派把亚历山大、尼罗河谷与西奈视为同一项国策：海港连接河谷，河谷又需要通向更广阔市场的道路。政府接受这套疆界，也就接受了把相距甚远的地区纳入直接管辖的责任。#bold 埃及的战略价值#!可以解释这份抱负，却不能代替完成它所需的国家能力。\n\n在#v 10年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_africa: "复归罗马阿非利加"
 je_ffpa_byz_restore_africa_reason: "从利比亚到里夫，漫长海岸连接着各有腹地的港口。复归派从罗马史中寻出阿非利加的名号，政府则把它写成一项现实的领土议程。#bold 沿海疆界的连续性#!是支持者的理由；取得这些地区之后，如何接续地方行政与海路，还会是另一项工作。\n\n在#v 12年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_italia: "收复意大利"
 je_ffpa_byz_restore_italia_reason: "意大利的地名使复归议程获得了格外强烈的象征意义，半岛、岛屿与亚得里亚入口却各有现实的管辖要求。复归派期待旧名号证明国家的抱负，外交官则担心这种抱负将怎样被外界理解。#bold 意大利议程#!需要以明确疆界和期限约束象征性的许诺。\n\n在#v 15年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restore_spania: "远征西班尼亚"
 je_ffpa_byz_restore_spania_reason: "意大利与阿非利加的复归记录，使支持者开始谈论伊比利亚沿岸。他们以西班尼亚的旧称把几片海岸写入同一份议程，航运与外交人员却必须考虑这项遥远承诺的现实分量。政府现在要让#bold 西方沿海的最后一项复归目标#!接受与先前议程相同的期限检验。\n\n在#v 10年#!内直接统治完成条件列出的全部地区。未能按期完成会施加8年失败惩罚，该议程5年内不可重提。"
 je_ffpa_byz_restoration_campaign_status: "在期限结束前直接控制完成条件列出的每个地区；最多同时运行#v 2#!项复归议程。现有宣称允许使用更便宜的“归还州”战争目标，但不会保证外交行动必然成功。"

 ffpa_byz_restoration_campaign_mobilization_v1: "帝国军旗展开"
 ffpa_byz_restoration_campaign_mobilization_v1_desc: "复归疆界宣布后的八年内，征募、军需和进攻筹划将获得集中的帝国支持。"
 ffpa_byz_restoration_settlement_v1: "复归和议"
 ffpa_byz_restoration_settlement_v1_desc: "八年内，新罗马获得20%恶名衰减速度，但损失35%外交博弈机动、10%影响力、10%威望和2点军队利益集团支持；宣布另一项复归战争会终止和议。"
 ffpa_byz_restoration_triumph_v1: "罗马凯旋式"
 ffpa_byz_restoration_triumph_v1_desc: "五年的凯旋庆典放大胜利带来的威望、合法性和军队支持，但不能缓解恶名。"
 ffpa_byz_restoration_failure_v1: "破灭的帝国许诺"
 ffpa_byz_restoration_failure_v1_desc: "未能履行公开宣布的复归目标，使政府与最高统帅部蒙羞八年；失败疆界在五年内不得再次宣布。"
 ffpa_byz_restoration_postwar_weak_state_v1: "巡回登记与赈济"
 ffpa_byz_restoration_postwar_weak_state_v1_desc: "十年内提高20%地区整合速度和10%移民吸引力，并使政治运动产生的激进派减少20%、忠诚派增加20%。"
 ffpa_byz_restoration_postwar_medium_state_v1: "行省整合委员会"
 ffpa_byz_restoration_postwar_medium_state_v1_desc: "十年内提高35%地区整合速度和20%移民吸引力，并使政治运动产生的激进派减少35%、忠诚派增加35%。"
 ffpa_byz_restoration_postwar_strong_state_v1: "帝国重建总署"
 ffpa_byz_restoration_postwar_strong_state_v1_desc: "十年内提高50%地区整合速度和30%移民吸引力，并使政治运动产生的激进派减少50%、忠诚派增加50%。"
 ffpa_byz_balkans_postwar_administration_v1: "巴尔干行省安置署"
 ffpa_byz_balkans_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_anatolia_postwar_administration_v1: "安纳托利亚行省安置署"
 ffpa_byz_anatolia_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_oriens_postwar_administration_v1: "东方大区行省安置署"
 ffpa_byz_oriens_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_aegyptus_postwar_administration_v1: "埃及行省安置署"
 ffpa_byz_aegyptus_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_africa_postwar_administration_v1: "阿非利加行省安置署"
 ffpa_byz_africa_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_italia_postwar_administration_v1: "意大利行省安置署"
 ffpa_byz_italia_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_spania_postwar_administration_v1: "西班尼亚行省安置署"
 ffpa_byz_spania_postwar_administration_v1_desc: "中央部会在五年内抽调官员、测绘员与登记员落实战后行省方案。"
 ffpa_byz_balkans_postwar_expenses_v1: "巴尔干行省安置经费"
 ffpa_byz_balkans_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
 ffpa_byz_anatolia_postwar_expenses_v1: "安纳托利亚行省安置经费"
 ffpa_byz_anatolia_postwar_expenses_v1_desc: "五年内持续拨付地籍测绘、赈济、道路修复与地方行政接管经费。"
