 gov_ffpa_byzantine_parliamentary_consulate: "罗马议会共和国"
 gov_ffpa_byzantine_parliamentary_consulate_desc: "由执政官领导$ffpa_byz_government_parliamentary$的议会制共和国。"
 gov_ffpa_byzantine_parliamentary_oligarchy: "受限罗马共和国"
 gov_ffpa_byzantine_parliamentary_oligarchy_desc: "由执政官和$ffpa_byz_government_senate$治理、选举权受限的议会制共和国。"

 # 拜占庭西方整合单次事件
 ffpa_flavor.30.t: "地中海投资大会"
 ffpa_flavor.30.d: "复归诸省的数项大型工程已经竣工，实业家、工程师、银行家与港务官员齐聚新罗马。他们要求国家决定，哪一套制度将永久引导复归地中海的资本。"
 ffpa_flavor.30.review_d: "早先投资大会订立的临时信贷安排已经无法治理成熟的西方经济。旧日代表再次齐聚新罗马，为复归诸省确认一套永久投资体制。"
 ffpa_flavor.30.f: "铁路或许会在边界止步，资本与货物却不会。复归诸省必须成为同一片生产之海的一部分。"
 ffpa_flavor.30.a: "成立新罗马产业信贷总局。"
 ffpa_flavor.30.b: "以海路、铁轨和自由港联结诸省。"
 ffpa_flavor.30.c: "特许行省开发银行同盟。"

 ffpa_flavor.31.t: "西方行省总清丈"
 ffpa_flavor.31.d: "复归诸省保留着多个政权遗留下来的地契、市镇特权和税收惯例。法学家要求统一帝国簿册，市镇领袖维护协商税契，而参谋部则提议对外西方诸省进行军事测绘。"
 ffpa_flavor.31.review_d: "第一次西方清丈只是临时行政措施。随着委员会解散、行省记录再次分歧，帝国必须确认一套永久地籍制度。"
 ffpa_flavor.31.f: "只有产权、义务与公共收入都变得清晰可查，重建才能成为持久的治理。"
 ffpa_flavor.31.a: "一套尺，一本册，一部帝国地籍。"
 ffpa_flavor.31.b: "承认西方自治市的税务协定。"
 ffpa_flavor.31.c: "将外西方诸省交由帝国军事测绘局。"

 ffpa_flavor.32.t: "西方罗马公民权章程"
 ffpa_flavor.32.d: "罗马人共同体如今统治着意大利人、西班牙人、马耳他人、埃及人以及非洲沿岸诸族。元老院争论不休：罗马公民权究竟是普遍身份、城市与行省的契约，还是通过服务帝国取得的权利。"
 ffpa_flavor.32.review_d: "旧公民权章程仍然存在，但它的法律制度已经跟不上复归诸省。元老院重新开会，要把过去的原则落实为永久帝国安排。"
 ffpa_flavor.32.f: "只有当罗马被理解为诸民族共享的公共忠诚，而非某一种语言的私有遗产时，帝国才能长久。"
 ffpa_flavor.32.a: "罗马人之间不应再有行省之别。"
 ffpa_flavor.32.b: "以公民协定联结城市与行省。"
 ffpa_flavor.32.c: "以服务帝国换取公民权。"

 ffpa_flavor.33.t: "西方诸省代表"
 ffpa_flavor.33.d: "随着选举活动展开，复归诸省要求在帝国政治中获得稳定席位。改革派主张统一选民名册，行省领袖维护地域代表团，而保守显贵则要求由上院过滤西方的政治声音。"
 ffpa_flavor.33.review_d: "第一次西方代表制度只是选举妥协，并非长久宪制。诸省代表再次抵达新罗马，要求永久确认他们在帝国政治中的位置。"
 ffpa_flavor.33.f: "代表制度可以把遥远海岸系于新罗马，也可能教会每个行省如何与它讨价还价。"
 ffpa_flavor.33.a: "把所有公民登记在同一部帝国选民册中。"
 ffpa_flavor.33.b: "为西方诸省设置常驻代表团。"
 ffpa_flavor.33.c: "由皇室任命帝国元老院。"
 ffpa_flavor.33.c_republic: "把元老院交给西方名望家。"

 ffpa_western_integration_state_snapshot_tt: "永久行省奖励仅授予[GetPlayer.GetName]目前拥有的合格西方州；以后征服的州不会继承。"
 ffpa_outer_western_integration_state_snapshot_tt: "永久行省奖励仅授予目前拥有、且属于西部海路、西班尼亚、古毛里塔尼亚和亚历山大—西奈工程范围的州；以后征服的州不会继承。"
 ffpa_byz_western_universal_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+75%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_provincial_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+50%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_service_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+25%地区整合速度，直至完成整合或失去该州。"

 ffpa_byz_mediterranean_industrial_credit: "地中海工业信贷"
 ffpa_byz_mediterranean_industrial_credit_desc: "帝国担保在十年内把信贷引入制造业与熟练劳动力培养，但也增加行政负担。"
 ffpa_byz_mediterranean_port_rail_fund: "帝国港铁基金"
 ffpa_byz_mediterranean_port_rail_fund_desc: "统一基金加快基础设施建设与地中海贸易，同时推高建设计划的物资成本。"
 ffpa_byz_mediterranean_development_banks: "行省开发银行"
 ffpa_byz_mediterranean_development_banks_desc: "行省银行为建设、人口资质和迁徙提供资金，同时需要持续的官僚监督。"
 ffpa_byz_western_uniform_cadastre_state: "西方统一地籍"
 ffpa_byz_western_uniform_cadastre_state_desc: "全面清丈加强复归诸省的税收能力与专业行政。"
 ffpa_byz_western_uniform_cadastre_cost: "帝国清丈委员会"
 ffpa_byz_western_uniform_cadastre_cost_desc: "清丈委员会消耗行政资源，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_provincial_tax_state: "行省税务协定"
 ffpa_byz_western_provincial_tax_state_desc: "获承认的地方税收惯例在不强制统一簿册的情况下改善守法度并鼓励定居。"
 ffpa_byz_western_provincial_tax_compact: "与西方显贵的协定"
 ffpa_byz_western_provincial_tax_compact_desc: "皇室借助行省显贵与教会权威实施治理。"
 ffpa_byz_western_universal_citizenship: "普遍罗马公民权"
 ffpa_byz_western_universal_citizenship_desc: "罗马公民身份直接提高复归西方与非洲诸省主要民族的文化接纳度。"
 ffpa_byz_western_provincial_civic_compact: "西方行省公民协定"
 ffpa_byz_western_provincial_civic_compact_desc: "协商达成的章程提供广泛文化接纳，同时保留行省权威、人口流动与地方晋升渠道。"
 ffpa_byz_western_common_electoral_roll: "帝国统一选民名册"
 ffpa_byz_western_common_electoral_roll_desc: "统一选举权加强公民政治的正统性，同时触动地主特权。"
 ffpa_byz_western_provincial_delegations: "西方行省代表团"
 ffpa_byz_western_provincial_delegations_desc: "地域代表团让复归诸省在帝国政治中获得制度化发言权。"
 ffpa_byz_western_crown_senate: "皇室任命的西方元老院"
 ffpa_byz_western_crown_senate_desc: "由君主任命的西方元老院以自由派信心为代价，加强权威与正统性。"

 ffpa_byz_mediterranean_industrial_credit_v2: "新罗马产业信贷总局"
 ffpa_byz_mediterranean_industrial_credit_v2_desc: "帝国担保永久偏向大型制造业财团和资本家投资，也因此疏远土地精英。"
 ffpa_byz_mediterranean_port_rail_network_state_v2: "地中海港铁特许网"
 ffpa_byz_mediterranean_port_rail_network_state_v2_desc: "长期特许权把本复归行省纳入自由港、铁路和仓储设施组成的永久网络。"
 ffpa_byz_mediterranean_concessions_v2: "地中海商业特许权"
 ffpa_byz_mediterranean_concessions_v2_desc: "帝国让渡一部分直接权威，以换取私人资本建设西方交通网络。"
 ffpa_byz_mediterranean_development_banks_state_v2: "行省开发银行体系"
 ffpa_byz_mediterranean_development_banks_state_v2_desc: "地方银行和城市基金为本复归行省的资质培养、移民和商业机会提供支持。"
 ffpa_byz_mediterranean_banking_compact_v2: "行省开发银行同盟"
 ffpa_byz_mediterranean_banking_compact_v2_desc: "分散的银行同盟扩大了投资来源，也限制了大型全国财团的影响力。"

 ffpa_byz_western_uniform_cadastre_state_v2: "帝国统一地籍"
 ffpa_byz_western_uniform_cadastre_state_v2_desc: "统一的计量、产权记录和专业行政体系永久加强了帝国税基。"
 ffpa_byz_western_uniform_cadastre_burden_v2: "常设清丈委员会"
 ffpa_byz_western_uniform_cadastre_burden_v2_desc: "维护统一簿册持续消耗中央行政能力，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_municipal_tax_compact_state_v2: "西方自治市税契"
 ffpa_byz_western_municipal_tax_compact_state_v2_desc: "得到承认的地方税收惯例改善守法度，也提高本行省对移民的吸引力。"
 ffpa_byz_western_municipal_vetoes_v2: "自治市财政特权"
 ffpa_byz_western_municipal_vetoes_v2_desc: "行省显贵以自身权威支持帝国，但他们的特权会拖慢全国立法。"
 ffpa_byz_western_military_survey_state_v2: "帝国军事测绘"
 ffpa_byz_western_military_survey_state_v2_desc: "军事工程师把道路、税册和补给地图整合为一套边疆基础设施。"
 ffpa_byz_western_military_survey_corps_v2: "西方测绘军团"
 ffpa_byz_western_military_survey_corps_v2_desc: "常设测绘与工程部队改善防御规划，同时增加军事补给开支。"

 ffpa_byz_western_universal_citizenship_v2: "罗马人不分行省"
 ffpa_byz_western_universal_citizenship_v2_desc: "普遍罗马公民身份带来最强的文化接纳与忠诚，同时削弱传统帝国权威。"
 ffpa_byz_western_provincial_civic_compact_v2: "城市与行省公民契约"
 ffpa_byz_western_provincial_civic_compact_v2_desc: "协商公民权承认西方诸族，却也使统一立法更加困难。"
 ffpa_byz_western_provincial_civic_compact_state_v2: "行省公民协定"
 ffpa_byz_western_provincial_civic_compact_state_v2_desc: "得到承认的共同体为迁移、教育和地方晋升提供长久渠道。"
 ffpa_byz_western_service_citizenship_v2: "服役即公民权"
 ffpa_byz_western_service_citizenship_v2_desc: "军事和公共服务打开了一条较窄的公民权道路，以更高物资成本换取经验丰富的部队。"
 ffpa_byz_western_veteran_settlement_state_v2: "退伍军人服役殖民地"
 ffpa_byz_western_veteran_settlement_state_v2_desc: "退伍军人与公共服务人员在本外西方行省获得土地和公民身份。"
 ffpa_byz_western_universal_incorporation_state_v1: "普遍罗马公民整合"
 ffpa_byz_western_universal_incorporation_state_v1_desc: "统一的罗马公民权正在加快本西方行省的法律与行政整合。"
 ffpa_byz_western_provincial_incorporation_state_v1: "行省公民契约整合"
 ffpa_byz_western_provincial_incorporation_state_v1_desc: "公民契约使地方共同体能够协助本西方行省融入帝国行政体系。"
 ffpa_byz_western_service_incorporation_state_v1: "服役公民整合"
 ffpa_byz_western_service_incorporation_state_v1_desc: "军事与公共服务在本西方行省和帝国之间建立了有限的行政纽带。"

 ffpa_byz_western_common_electoral_roll_v2: "一部帝国选民册"
 ffpa_byz_western_common_electoral_roll_v2_desc: "统一选举权提升立法正当性，却会削弱行政权威并触动地主特权。"
 ffpa_byz_western_provincial_delegations_state_v2: "受保障的行省代表权"
 ffpa_byz_western_provincial_delegations_state_v2_desc: "常设地域代表制度降低了动乱对本复归行省造成的政治损害。"
 ffpa_byz_western_provincial_delegations_v2: "西方行省代表会议"
 ffpa_byz_western_provincial_delegations_v2_desc: "行省声音增强国家元首的正当性，却也延长立法过程。"
 ffpa_byz_western_crown_senate_v2: "西方诸省王冠元老院"
 ffpa_byz_western_crown_senate_v2_desc: "由君主任命的上院加强权威与正统性，同时阻碍改革并疏远自由派。"
 ffpa_byz_western_notables_senate_v2: "西方名望家元老院"
 ffpa_byz_western_notables_senate_v2_desc: "精英共和国上院提供行政延续性与权威，却会拖慢立法并令自由派失望。"

 # 拜占庭复归战争
 je_group_ffpa_byzantine_restoration: "帝国复归"
 ffpa_byz_convene_restoration_council: "召集复归御前会议"
 ffpa_byz_convene_restoration_council_desc: "由御前会议选择一处明确的复归疆界。最多只能同时推进两项战争日志，45—55年的期限仅在正式接受目标后开始。巴尔干路线将解锁意大利；安纳托利亚路线将依次通往东方、埃及和阿非利加；完成意大利与阿非利加后解锁西班尼亚。宣布新目标会终止仍在生效的“复归和议”。"
 ffpa_byz_restoration_campaign_slot_available_tt: "当前运行中的复归战争少于#v 2#!项"

 je_ffpa_byz_restore_balkans: "复归多瑙河与巴尔干"
 je_ffpa_byz_restore_balkans_reason: "新罗马已经把多瑙河以南与旧伊利里亚海岸宣布为帝国首个西方复归疆界。在#v 45年#!内直接统治完成条件列出的全部地区。"
 je_ffpa_byz_restore_anatolia: "收复安纳托利亚"
 je_ffpa_byz_restore_anatolia_reason: "御前会议命令军队从爱琴海岸一路恢复至安纳托利亚东部边疆的罗马直接统治，期限为#v 45年#!。"
 je_ffpa_byz_restore_oriens: "重建东方大区"
 je_ffpa_byz_restore_oriens_reason: "安纳托利亚稳固后，从塞浦路斯、叙利亚到幼发拉底边疆的旧东方诸省必须在#v 50年#!内重归帝国直接统治。"
 je_ffpa_byz_restore_aegyptus: "重返埃及行省"
 je_ffpa_byz_restore_aegyptus_reason: "通往亚历山大、尼罗河谷与西奈的道路已经敞开。在#v 50年#!内恢复对所列埃及地区的直接统治。"
 je_ffpa_byz_restore_africa: "复归罗马阿非利加"
 je_ffpa_byz_restore_africa_reason: "阿非利加大区曾经供养帝国并充实国库。在#v 55年#!内收复从利比亚到里夫的地中海沿岸。"
 je_ffpa_byz_restore_italia: "收复意大利"
 je_ffpa_byz_restore_italia_reason: "复归事业转向亚平宁半岛、周边岛屿与亚得里亚入口。在#v 55年#!内直接统治完成条件列出的全部意大利地区。"
 je_ffpa_byz_restore_spania: "远征西班尼亚"
 je_ffpa_byz_restore_spania_reason: "意大利与阿非利加稳固之后，最后一次西方远征将寻回西班尼亚旧日沿海领地。在#v 50年#!内收复全部所列地区。"
 je_ffpa_byz_restoration_campaign_status: "在期限结束前直接控制完成条件列出的每个地区。现有宣称允许使用更便宜的“归还州”战争目标，但不会保证外交行动必然成功。"

 ffpa_byz_restoration_campaign_mobilization_v1: "帝国军旗展开"
 ffpa_byz_restoration_campaign_mobilization_v1_desc: "复归疆界宣布后的八年内，征募、军需和进攻筹划将获得集中的帝国支持。"
 ffpa_byz_restoration_settlement_v1: "复归和议"
 ffpa_byz_restoration_settlement_v1_desc: "新罗马接受外交保证并收窄行动自由，以换取八年内更快的恶名衰减；宣布另一项复归战争会终止和议。"
 ffpa_byz_restoration_triumph_v1: "罗马凯旋式"
 ffpa_byz_restoration_triumph_v1_desc: "五年的凯旋庆典放大胜利带来的威望、合法性和军队支持，但不能缓解恶名。"
 ffpa_byz_restoration_failure_v1: "破灭的帝国许诺"
 ffpa_byz_restoration_failure_v1_desc: "未能履行公开宣布的复归目标，使政府与最高统帅部蒙羞八年；失败疆界在五年内不得再次宣布。"
 ffpa_byz_balkans_restored_v1: "多瑙河诸省复归"
 ffpa_byz_balkans_restored_v1_desc: "对巴尔干的直接统治使新罗马的帝国主张获得长久分量。"
 ffpa_byz_anatolia_restored_v1: "安纳托利亚复归"
 ffpa_byz_anatolia_restored_v1_desc: "安纳托利亚腹地的恢复永久加强了帝国正统性。"
 ffpa_byz_oriens_restored_v1: "东方大区复归"
 ffpa_byz_oriens_restored_v1_desc: "东方诸省的回归使复兴帝国在爱琴海以外成为政治事实。"
 ffpa_byz_aegyptus_restored_v1: "埃及行省复归"
 ffpa_byz_aegyptus_restored_v1_desc: "对亚历山大、尼罗河与西奈的控制给予新罗马持久权威。"
 ffpa_byz_africa_restored_v1: "罗马阿非利加复归"
 ffpa_byz_africa_restored_v1_desc: "非洲海岸上的帝国军旗为复归事业带来长久威望。"
 ffpa_byz_italia_restored_v1: "意大利复归"
 ffpa_byz_italia_restored_v1_desc: "对意大利及其岛屿的统治永久加强了罗马延续性的主张。"
 ffpa_byz_spania_restored_v1: "西班尼亚复归"
 ffpa_byz_spania_restored_v1_desc: "最西端的复归完成了横跨地中海的帝国事业。"

 ffpa_flavor.39.t: "帝国复归御前会议"
 ffpa_flavor.39.d: "将领、法学家、外交官和行省代表聚集在旧帝国地图之下。他们一致认为，宣称本身并非国策：政府必须指明疆界、接受期限并承担后果，才能把下一批诸省称为复归之地。"
 ffpa_flavor.39.f: "帝国不能同时向所有方向进军；即使罗马也必须先选择一条道路。"
 ffpa_byz_restoration_council_balkans_option: "宣布多瑙河与巴尔干复归。"
 ffpa_byz_restoration_council_anatolia_option: "收复安纳托利亚腹地。"
 ffpa_byz_restoration_council_oriens_option: "重建帝国东方诸省。"
 ffpa_byz_restoration_council_aegyptus_option: "打开通往亚历山大与尼罗河的道路。"
 ffpa_byz_restoration_council_africa_option: "让帝国军旗沿阿非利加海岸前进。"
 ffpa_byz_restoration_council_italia_option: "把复归事业转向意大利。"
 ffpa_byz_restoration_council_spania_option: "命令最后的西方远征前往西班尼亚。"
 ffpa_byz_restoration_council_cancel_option: "帝国尚未准备好作出另一项宣告。"

 ffpa_flavor.40.t: "多瑙河重归新罗马"
 ffpa_flavor.40.d: "从亚得里亚海岸到多瑙河河口，帝国官员如今都能行使直接权力。御前会议必须决定，是把胜利转化为国际承认，还是毫不妥协地举行庆典。"
 ffpa_flavor.40.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_balkans_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，帝国官署如今已经从亚得里亚海岸延伸到多瑙河河口。御前会议必须决定，是把复归成果转化为国际承认，还是毫不妥协地举行庆典。"
 ffpa_flavor.40.f: "道路、驻军和税册让疆界有了实体，仅靠宣言永远无法做到这一点。"
 ffpa_flavor.41.t: "安纳托利亚复归"
 ffpa_flavor.41.d: "帝国行政再次横贯安纳托利亚，把港口、高原城市与东部边疆连接到新罗马。外交官正在追问，帝国将向不安的邻国作出何种保证。"
 ffpa_flavor.41.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_anatolia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，帝国行政再次横贯安纳托利亚，把港口、高原城市与东部边疆连接到新罗马。外交官正在追问，帝国将向不安的邻国作出何种保证。"
 ffpa_flavor.41.f: "故土并非在一场战役中恢复，而是在军队通过之后守住每一条道路。"
 ffpa_flavor.42.t: "东方诸省重建"
 ffpa_flavor.42.d: "塞浦路斯、叙利亚、巴勒斯坦与幼发拉底边疆如今直接听命于新罗马。复归已经从记忆变成新的东方政治秩序。"
 ffpa_flavor.42.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_oriens_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，塞浦路斯、叙利亚、巴勒斯坦与幼发拉底边疆如今直接听命于新罗马。复归已经从记忆变成新的东方政治秩序。"
 ffpa_flavor.42.f: "里程碑刻上了新的数字，但道路再次指向同一座帝都。"
 ffpa_flavor.43.t: "尼罗河飘扬罗马军旗"
 ffpa_flavor.43.d: "亚历山大、尼罗河谷和西奈已经纳入复兴帝国。控制埃及带来财富与战略纵深，也招来所有地中海强权的密切注视。"
 ffpa_flavor.43.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_aegyptus_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，亚历山大、尼罗河谷和西奈已经纳入复兴帝国。埃及带来财富与战略纵深，也招来所有地中海强权的密切注视。"
 ffpa_flavor.43.f: "统治河流的人，也必须对河口之外的海洋负责。"
 ffpa_flavor.44.t: "鹰旗重返阿非利加"
 ffpa_flavor.44.d: "帝国军旗如今从利比亚沿非洲海岸伸向马格里布西部。新罗马必须决定，是安抚列强，还是把收复变成一场展示罗马坚忍的盛典。"
 ffpa_flavor.44.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_africa_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，帝国军旗如今从利比亚沿非洲海岸伸向马格里布西部。新罗马必须决定，是安抚列强，还是把收复变成一场展示罗马坚忍的盛典。"
 ffpa_flavor.44.f: "港口记得许多主人，海关如今盖上新罗马的印玺。"
 ffpa_flavor.45.t: "重返意大利"
 ffpa_flavor.45.d: "意大利及其岛屿都处于帝国直接行政之下。复归事业最有力量的象征，也是最具挑衅性的胜利，只能由外交和议或盛大凯旋来作结。"
 ffpa_flavor.45.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_italia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，意大利及其岛屿如今都处于帝国直接行政之下。复归事业最有力量的象征，也是最具挑衅性的胜利，只能由外交和议或盛大凯旋来作结。"
 ffpa_flavor.45.f: "几个世纪以来，罗马只是一个论题；现在，它再次成为治理的问题。"
 ffpa_flavor.46.t: "西方海岸复归"
 ffpa_flavor.46.d: "西班尼亚远征已经控制最后一批宣布复归的西方地区。从幼发拉底河到伊比利亚海岸，复归事业如今横跨地中海世界。"
 ffpa_flavor.46.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_byz_spania_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，西班尼亚远征已经控制最后一批宣布复归的西方地区。从幼发拉底河到伊比利亚海岸，复归事业如今横跨地中海世界。"
 ffpa_flavor.46.f: "古老海柱之外是大洋；在它们身后，帝国仍须学会如何治理自己的胜利。"
 ffpa_byz_restoration_success_settlement_option: "把胜利提交给国际和议。"
 ffpa_byz_restoration_success_triumph_option: "让新罗马举行凯旋式。"

 ffpa_flavor.47.t: "复归事业受挫"
 ffpa_flavor.47.d: "御前会议宣布的期限已经过去，选定疆界的部分地区仍不受帝国直接统治。这项许诺不能立刻重提；政府和最高统帅部必须先承受失败的政治后果。"
 ffpa_flavor.47.f: "地图很有耐心，士兵、纳税人与外国政府却没有。"
 ffpa_flavor.47.a: "这条疆界只能等待下一次机会。"
