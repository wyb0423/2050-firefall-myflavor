l_simp_chinese:
 # 东地中海成立链与风味内容
 TUR_ADJ: "土耳其"
 GRE_ADJ: "希腊"
 ffpa_ottoman: "奥斯曼"
 ffpa_rhomaic: "罗马人"
 ffpa_byzantium_only_greece_tt: "只有已经成立的希腊才能在君主制下推进拜占庭帝国的重建"
 ffpa_request_eastern_roman_title: "审议东罗马头衔"
 ffpa_request_eastern_roman_title_desc: "将恢复东罗马头衔的民族主义提议正式提交王室与政府审议。即使“希腊民族主义”日志已经结束，这项决议仍会保留通往该提议的入口。"
 ffpa_eastern_roman_title_ionian_tt: "在$STATE_IONIAN_ISLANDS$拥有领土"
 je_greek_nationalism_reason: "幸存的地图和演说抄本记录着一个超出现有边界的希腊世界。支持者从[GetGeographicRegion('geographic_region_megali_greece').GetName]看见亲族、信仰与贸易的联系，也希望新国家承接旧日纲领；谨慎的官员则要先弄清，这些主张需要多少行政、财政与政治支持。\n\n大火打断了旧制度的延续，档案却仍在影响今天的选择。#bold 保护文化共同体与扩大国家疆界#!可以彼此呼应，也可能使政府承担不同的义务。[SCOPE.GetRootScope.GetCountry.GetCustom('byzantium_reason_text')]"
 je_greek_nationalism_lobby: "一项随国家档案重见天日的旧世界纲领，正在公共政治中重新引起争论。支持者要求重建后的希腊为现有边界之外的希腊共同体制定一套连贯政策，把历史记忆转化为国家行动。"
 greece.1.t: "重新拼合的希腊"
 greece.1.d: "继承政权之间的重组，已经使希腊重新成为一个国家。随着制度恢复、旧档案重开，更广阔的[SCOPE.sCulture('greek_culture_scope').GetName]世界应在国策中占据什么位置，再也无法含糊带过。"
 greece.1.f: "复原的地图铺满委员会长桌。有人从中看见亲族、信仰和贸易的联结，也有人看见新国家尚无力治理的边界。所有人只同意一点：大火打断了政治延续，却没有抹去政治记忆。"
 greece.1.a: "把旧地图变成国家纲领。"
 greece.1.b: "先巩固我们已经重建的国家。"
 ffpa_flavor.8.t: "东罗马头衔"
 ffpa_flavor.8.d: "王室顾问、正教会教士、法学家、军官和民族主义议员围绕一项取自幸存罗马档案的提议结成了联盟。随着[SCOPE.sState('thrace_scope').GetStateRegion.GetName]与[SCOPE.sState('aydin_scope').GetStateRegion.GetName]重新进入希腊国策的现实视野，他们请求王室接受东罗马头衔，把新罗马确立为一项仍在生长的国家工程。"
 ffpa_flavor.8.recovery.d: "希腊民族主义纲领在名义上已经告一段落，但对爱奥尼亚群岛的控制与王权威望的恢复，使一份尚未结案的卷宗再次开启。王室顾问、正教会教士、法学家和军官重新提出同一个问题：希腊是否应接受东罗马头衔，并着手复兴新罗马？"
 ffpa_flavor.8.f: "一名法学家把烟熏发黑的法典放在新印制的国家地图旁。“我们不是要复原某个消失的世纪，”他对御前会议说道，“我们是在决定，这个国家能否让一个古老的罗马名号为活着的人负责。”"
 ffpa_flavor.8.a: "把新罗马确立为国家使命。"
 ffpa_flavor.8.b: "希腊国家已有足够多的事业。"
 ffpa_formation_byzantium.t: "紫凤凰"
 ffpa_formation_byzantium.d: "在重建中的君士坦丁堡，王室、正教会、军队、法学家和各行省代表共同宣布恢复罗马帝号。[ROOT.GetCountry.GetName]所宣称的并非一套从中世纪从未中断的官僚机构，而是一个以大火后幸存的首都、法律、信仰和政治记忆为根基重新建立的国家。"
 ffpa_formation_byzantium.f: "宣言在修复后的穹顶下宣读，全城钟声随之应和。旧印玺从档案库中取出，新印玺则刻上复兴之年的纪年。宫外的街道挤满老兵、码头工人、公务员、教士和各省代表。一个古老名号已经归来，但支撑它的每一种鲜活制度仍有待建设。"
 ffpa_formation_byzantium.a: "让罗马国家证明自己配得上这个名字。"
 greece.4.t: "纲领告成"
 greece.4.d1: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_success_desc')]"
 greece.4.d2: "$ffpa_greek_nationalism_success_desc_limited$"
 greece.4.f: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_success_flavor')]"
 greece.4.a: "让这份成果化为举国信心。"
 greece.4.b: "赋予这份成果完整的国家权威。"
 greece.4.c: "重申执政联盟的政治授权。"
 ffpa_greek_nationalism_success_desc_byzantine: "希腊民族纲领已经超越了原有边界。在[ROOT.GetCountry.GetNameNoFormatting]治下，重见天日的东罗马头衔不再只是档案中的宣称，而是属于一个真正运转的国家；治理新罗马的工作已经开始。"
 ffpa_greek_nationalism_success_desc_megali: "国家已经在政治上整合了爱琴海与马其顿的主要希腊地区。各省与各共同体的差异依然存在，但“伟大理想”已经从一张复原地图变成行政现实。"
 ffpa_greek_nationalism_success_desc_limited: "重建后的希腊已经取得足以长久维持国家的领土与制度根基。民族纲领如今可以告一段落，不必把旧地图上的每一条线都变成永无止境的战争目标。"
 ffpa_greek_nationalism_success_flavor_byzantine: "档案提供了名号，领土、预算与行省行政则为它提供了政府。罗马国家已经重返历史，但它仍须证明自己究竟会成为怎样的共同体。"
 ffpa_greek_nationalism_success_flavor_megali: "港务记录、学校名册、铁路时刻表与军区划分，如今共同描述着旧文献只能设想的政治空间。这场胜利既属于旗帜和军队，也属于公务员与工程师。"
 ffpa_greek_nationalism_success_flavor_limited: "大火以来，国家第一次能够把边界、制度与抱负放进同一句话里。巩固并非退让，而是决心让已经收回的成果真正可治理、可长久。"
 greece.5.t: "撤回的纲领"
 greece.5.d: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_failure_desc')]"
 greece.5.f: "[ROOT.GetCountry.GetCustom('ffpa_greek_nationalism_failure_flavor')]"
 greece.5.a: "政府必须为此负责。"
 greece.5.b: "[ROOT.GetCountry.GetRuler.GetFullName]必须为此负责。"
 ffpa_greek_nationalism_failure_desc_byzantine: "东罗马工程已经难以为继。在$STATE_AYDIN$、$STATE_EASTERN_THRACE$、$STATE_HUDAVENDIGAR$和$STATE_TRABZON$中仍不受我国统治的地区，希腊共同体正奉命撤往[ROOT.GetCountry.GetAdjectiveNoFormatting]首都；这些地方的希腊故土地位也将从国家地图上被抹去。"
 ffpa_greek_nationalism_failure_desc_megali: "支撑“伟大理想”继续作为独立国策推进的条件已经不复具备。政府正在撤回这项纲领，各方则要求说明，先前的承诺应当如何收束，已有的成果又该怎样维持。"
 ffpa_greek_nationalism_failure_desc_limited: "即使这项有限的民族纲领，也已无法在当前的国家处境下继续推进。议程正在撤回，政府与反对派为责任归属争执不休；结束这份文件，并不能替他们回答未能兑现的许诺。"
 ffpa_greek_nationalism_failure_flavor_byzantine: "内阁桌上的疆界图已经换成撤离名册。列车和船只把一户户人家送往首都，官员则关闭国家再也无力保护的学校、教区与产权档案。对这一代人而言，罗马头衔已经变成一份退却记录。"
 ffpa_greek_nationalism_failure_flavor_megali: "大臣指责军方冒进，军官指责财政畏缩，各省代表则指责首都许下了自己无力治理的诺言。旧地图仍挂在墙上，却再也没有人愿意在它下面签署下一道命令。"
 ffpa_greek_nationalism_failure_flavor_limited: "当初重开旧档案的委员会，如今却要开会结束自己的纲领。争论的焦点已经不再是希腊应当延伸到哪里，而是哪一个国家机构最先耗尽了本就稀缺的公共权威。"
 ffpa_embrace_ambitious_agenda_recovery_tt: "选择此项将#bold 接受东罗马头衔提议#!，并解锁通过[concept_nation_formation]成立$BYZ$。"

 je_ffpa_tur_rebuild_anatolia: "重建安纳托利亚"
 je_ffpa_tur_rebuild_anatolia_reason: "共同国名把安纳托利亚重新联系起来，地方生产与国家机关却未必能随之协同。制造商需要通往市场的运输，税务机关需要能够执行的登记，地方居民则要看到公共秩序确实延伸到了首都以外。\n\n让#bold 安纳托利亚重新运转#!，需要把领土、增长与日常治理连在一起。控制至少八个核心地区、扩大经济，并恢复行政与市场秩序。"
 je_ffpa_tur_ottoman_commonwealth: "奥斯曼共同体"
 je_ffpa_tur_ottoman_commonwealth_reason: "奥斯曼名号可以承载各省对共同政治秩序的期待，却不能代替具体的权利与责任。中央官员希望法令得到执行，地方社群需要自己的语言、信仰与日常生活得到承认；双方都需要一段能让承诺经受检验的和平。\n\n#bold 行政整合、公民包容与内部稳定#!分别推进。三轴须同时达到#v 60#!才会完成；每轴满足条件时每月#p +1#!，否则#n −1#!，最低为0，不会直接清零。将鼠标悬停在对应进度条上，可查各项条件与当前达成情况。\n\n完成后将获得新的主流文化“奥斯曼”，同时保留土耳其文化。"
 je_ffpa_tur_gate_of_two_continents: "两洲之门"
 je_ffpa_tur_gate_of_two_continents_reason: "东色雷斯汇集巴尔干与安纳托利亚的陆路，也面对往来海峡的船只。港务人员希望列车与货船接得上，商人需要稳定的转运，中央机关则要为这座都会提供足够的行政能力。\n\n#bold 港口、铁路与公共机关#!必须一同扩展，海峡才能成为持久的世界市场门户。工程完成后，政府还要决定这里的都会发展方向与首都安排。"
 je_ffpa_gre_islands_and_mainland: "群岛与大陆"
 je_ffpa_gre_islands_and_mainland_reason: "希腊的国家纲领把本土、马其顿与爱琴海群岛联系在一起，实际的管辖与公共服务却仍需落实。岛民需要通往大陆市场的航运，学校与地方机关需要人员和经费，政府则要把这些分散的需求纳入能够维持的国家网络。\n\n#bold 群岛与大陆#!的联系，既要在边界上得到确认，也要进入教育、行政和货物往来的日常生活。"
 je_ffpa_byz_new_rome: "新罗马再加冕"
 je_ffpa_byz_new_rome_reason: "恢复罗马名号的宣言已经发布，首都的命令能否成为各省的日常秩序，仍有待证明。中央官署需要稳定的收入与通路，地方居民则需要一个能够处理公共事务、而不只纪念过去的政府。\n\n完整控制十二个指定核心地区中的至少十个（包括东色雷斯和阿提卡），以君士坦丁堡为首都，并维持#bold 合法、财政健全且稳定的政府#!。"
 je_ffpa_byz_rhomaic_commonwealth: "罗马人的共同体"
 je_ffpa_byz_rhomaic_commonwealth_reason: "新罗马颁布的法令要经过地方官署，才能抵达各省居民。中央官员希望用同一套程序处理税收与请愿，不同社群则需要能够理解的文书，以及获得承认的身份。一个共同国名，还不足以消除这些距离。\n\n#bold 行政整合、公民包容与内部稳定#!分别推进。三轴须同时达到#v 60#!才会完成；每轴满足条件时每月#p +1#!，否则#n −1#!，最低为0，不会直接清零。将鼠标悬停在对应进度条上，可查各项条件与当前达成情况。\n\n完成后将获得新的主流文化“罗马人”，同时保留希腊文化，并永久提高#p 20%#!符合条件的文化同化速度。"
 je_ffpa_byz_rhomaic_commonwealth_v2: "$je_ffpa_byz_rhomaic_commonwealth$"
 je_ffpa_byz_rhomaic_commonwealth_v2_reason: "$je_ffpa_byz_rhomaic_commonwealth_reason$"

 ffpa_tur_reconstruction_monarchical_compromise: "重建时代的君主妥协"
 ffpa_tur_reconstruction_monarchical_compromise_desc: "王朝、官僚和地方精英暂时围绕重建国家达成了妥协。"
 ffpa_tur_anatolian_citizenship: "安纳托利亚公民权"
 ffpa_tur_anatolian_citizenship_desc: "共和国将共同公民权置于帝国身份之上，为原帝国各族提供有限但持久的接纳。"
 ffpa_tur_reconstruction_pragmatism: "安纳托利亚重建实用主义"
 ffpa_tur_reconstruction_pragmatism_desc: "政府把资源集中在行政、教育和基础设施上。"
 ffpa_ottoman_civic_compact: "奥斯曼公民契约"
 ffpa_ottoman_civic_compact_desc: "奥斯曼身份被重新解释为维系诸民族的共同政治身份，而非替代其原有文化。"
 ffpa_tur_straits_gateway: "两洲之门"
 ffpa_tur_straits_gateway_desc: "海峡两岸的铁路、港口和行政机构共同服务于一个世界性枢纽。"
 ffpa_gre_islands_and_mainland: "群岛与大陆的统一"
 ffpa_gre_islands_and_mainland_desc: "统一的行政、教育与交通网络把希腊各地紧密连接起来。"
 ffpa_byz_civic_settlement: "帝国诸族和解"
 ffpa_byz_civic_settlement_desc: "新罗马承认帝国不能只靠旧日名号维系统治，必须为臣民建立可见的公民秩序。"
 ffpa_byz_church_and_crown: "帝国权威与教会"
 ffpa_byz_church_and_crown_desc: "国家权威与正教会共同为复兴秩序提供宗教上的正当性。"
 ffpa_byz_living_new_rome: "活着的新罗马"
 ffpa_byz_living_new_rome_desc: "君士坦丁堡不再只是被追忆的都城，而是人口、学术和贸易重新汇聚的现代帝都。"
 ffpa_rhomaic_civic_compact: "罗马公民共同体"
 ffpa_rhomaic_civic_compact_desc: "“罗马人”成为一种包容帝国诸族的新政治身份，同时保留各民族既有的文化根基。"
 ffpa_rhomaic_civic_compact_v2: "罗马公民共同体"
 ffpa_rhomaic_civic_compact_v2_desc: "“罗马人”成为一种包容帝国诸族的新政治身份，在保留各民族文化根基的同时，使符合条件的文化同化速度提高20%。"

 ffpa_flavor.2.t: "重建后的国家"
 ffpa_flavor.2.d: "安纳托利亚的经济与公共机关已经有了较稳固的基础，地方事务开始更多地汇入中央。官员和各地代表现在要求政府说明，这一轮重建要留下怎样的国家。#bold 奥斯曼遗产#!应保留多少位置，公民怎样参与，工程机关承担多大责任，都会影响下一步的方向。"
 ffpa_flavor.2.f: "会议桌上，一边是待修订的组织章程，一边是尚未完工的工程清单。“道路还可以继续铺，”一位地方代表说，“但我们总得知道，它们把各地接进怎样的国家。”"
 ffpa_flavor.2.a: "让王朝主持一份新的帝国契约。"
 ffpa_flavor.2.b: "共和国属于安纳托利亚的所有公民。"
 ffpa_flavor.2.c: "先建设学校、道路和行政机关。"

 ffpa_flavor.3.t: "奥斯曼共同体"
 ffpa_flavor.3.d: "持续的和平、接纳与行政建设，为奥斯曼共同体提供了制度基础。政府准备正式确认这一共同身份，使它成为不同文化居民参与国家的一种联系，同时保留他们原有的文化根基。这样的契约还需要在官署和地方社会的日常事务中维持。"
 ffpa_flavor.3.f: "一位代表听完契约，合上了手中的地方名册。“这本册子不会因此作废，”他说，“但从今往后，拿着它的人应当能走进更多扇门。”"
 ffpa_flavor.3.a: "确立奥斯曼公民契约。"

 ffpa_flavor.4.t: "两洲之门"
 ffpa_flavor.4.d: "港口、铁路与公共机关已经达到都会工程的要求。东色雷斯现在拥有更强的转运与行政基础，政府可以把君士坦丁堡确立为政治首都，也可以保留现有首都，让海峡都会以世界港为发展重心。"
 ffpa_flavor.4.f: "站台上，公务人员提着公文箱，搬运工守着等候装船的货物。港务长看着两份规划：“无论城里多几座部会还是多几排仓库，明天的列车都得准点进站。”"
 ffpa_flavor.4.a: "迁都君士坦丁堡。"
 ffpa_flavor.4.b: "保留现有首都，发展海峡世界港。"

 ffpa_flavor.5.t: "群岛与大陆"
 ffpa_flavor.5.d: "从伯罗奔尼撒到马其顿，从爱奥尼亚海到爱琴海，国家已经完成既定的领土、经济与公共机关目标。学校、地方行政和市场联系因而有了更稳固的基础；接下来，需要把这份成果维持为群岛与大陆之间可靠的日常往来。"
 ffpa_flavor.5.f: "渡船离港时，一名新任教员把书箱挪到货袋旁。船主问他是否还会回来。“会的，”他回答，“开学以后，还要来领下一批书。”"
 ffpa_flavor.5.a: "一个国家，一片相连的海。"

 ffpa_flavor.6.t: "新罗马的第二次奠基"
 ffpa_flavor.6.d: "君士坦丁堡已经支撑起一个具备领土、财政与公共秩序基础的国家。中央官员、教会人士、市民和各省代表对这些成果有不同解释：有人期待诸族共同参与的政治秩序，有人推重宗教与帝国权威，也有人要求继续建设这座承担国家事务的都会。政府需要确定下一步的重点。"
 ffpa_flavor.6.f: "纪念仪式散去后，广场边仍有人等候递交请愿。市政官员把庆典用的讲台让给了接待人员：“名号已经宣布过了。现在轮到这些事情。”"
 ffpa_flavor.6.a: "帝国必须成为诸族共同的国家。"
 ffpa_flavor.6.b: "以帝国权威与教会共同守护正统。"
 ffpa_flavor.6.c: "把君士坦丁堡建设成活着的新罗马。"

 ffpa_flavor.7.t: "罗马人的共同体"
 ffpa_flavor.7.d: "行政、包容与稳定的建设已经达到共同体的要求，政府准备把“罗马人”正式确立为新的共同身份。它将与原有的希腊文化并存，并为不同文化居民参与国家提供更稳固的制度基础。共同的身份得到了确认，怎样维持它仍是日常治理的责任。"
 ffpa_flavor.7.f: "授课结束后，一名学生问，新的称呼是不是要代替家里使用的那个。教师把两行字并排写在黑板上：“你不必忘记自己从哪里来，才能说自己属于这里。”"
 ffpa_flavor.7.a: "我们都是这座新罗马的公民。"

