l_simp_chinese:
 # 东地中海成立链与风味内容
 ffpa_ottoman: "奥斯曼"
 ffpa_rhomaic: "罗马人"
 ffpa_byzantium_only_greece_tt: "只有已经成立的希腊才能在君主制下推进拜占庭帝国的重建"
 ffpa_request_eastern_roman_title: "审议东罗马头衔"
 ffpa_request_eastern_roman_title_desc: "将恢复东罗马头衔的民族主义提议正式提交王室与政府审议。即使“希腊民族主义”日志已经结束，这项决议仍会保留通往该提议的入口。"
 ffpa_eastern_roman_title_ionian_tt: "在$STATE_IONIAN_ISLANDS$拥有领土"
 ffpa_flavor.8.recovery.d: "希腊民族主义纲领在名义上已经告一段落，但对爱奥尼亚群岛的控制与王权威望的恢复，使一项尚未解决的提议重新浮上台面：继承东罗马的衣钵，并重建拜占庭帝国。"
 ffpa_embrace_ambitious_agenda_recovery_tt: "#r #b 选择此项将接受东罗马头衔提议，并解锁通过[concept_nation_formation]成立$BYZ$。#!#!"

 je_ffpa_tur_rebuild_anatolia: "重建安纳托利亚"
 je_ffpa_tur_rebuild_anatolia_reason: "统一的土耳其必须把战乱割裂的安纳托利亚重新连成一个能够运转的国家。控制至少十个核心地区、扩大经济，并恢复行政与市场秩序。"
 je_ffpa_tur_ottoman_commonwealth: "奥斯曼共同体"
 je_ffpa_tur_ottoman_commonwealth_reason: "沿三条可恢复的路线建设帝国共同体：行政整合、公民包容与内部稳定。每条路线在满足各自条件时推进，条件不再满足时逐渐倒退，但不会直接清零。\n\n行政整合要求实行君主制、政府合法性至少#v 55#!、官僚余量不为负，并且十一个指定核心州中至少#v 8#!个市场准入达到#v 75%#!。公民包容要求实行君主制、文化排斥或多元文化、信仰自由或政教分离，并使五个文化组——希腊/保加利亚/塞尔维亚/罗马尼亚、阿尔巴尼亚/波斯尼亚、亚美尼亚、库尔德、阿拉伯/埃及——中至少#v 4#!个的基础接纳度达到#v 40%#!。内部稳定要求实行君主制、保持和平、没有叛乱性政治运动，并且至少#v 6#!个指定核心州的动乱低于#v 18%#!。\n\n完成后将获得新的主流文化“奥斯曼”，同时保留土耳其文化。"
 je_ffpa_tur_gate_of_two_continents: "两洲之门"
 je_ffpa_tur_gate_of_two_continents_reason: "把东色雷斯建设为连接巴尔干、安纳托利亚与世界市场的港口和铁路枢纽。"
 je_ffpa_gre_islands_and_mainland: "群岛与大陆"
 je_ffpa_gre_islands_and_mainland_reason: "让希腊本土、马其顿与爱琴海群岛在行政、教育和统一市场中真正成为一个国家。"
 je_ffpa_byz_new_rome: "新罗马再加冕"
 je_ffpa_byz_new_rome_reason: "成立帝国只是宣言。控制拜占庭核心领土，以君士坦丁堡为首都，并证明新罗马能够维持合法、富足而稳定的统治。"
 je_ffpa_byz_rhomaic_commonwealth: "罗马人的共同体"
 je_ffpa_byz_rhomaic_commonwealth_reason: "沿三条可恢复的路线建设罗马共同体：行政整合、公民包容与内部稳定。每条路线在满足各自条件时推进，条件不再满足时逐渐倒退，但不会直接清零。\n\n行政整合要求政府合法性至少#v 55#!、官僚余量不为负，并且十二个指定核心州中至少#v 9#!个市场准入达到#v 80%#!。公民包容要求实行文化排斥或多元文化、信仰自由或政教分离，并使土耳其、阿尔巴尼亚、保加利亚、塞尔维亚、亚美尼亚文化中至少#v 4#!个的基础接纳度达到#v 40%#!。内部稳定要求保持和平、没有叛乱性政治运动，并且至少#v 7#!个指定核心州的动乱低于#v 18%#!。\n\n完成后将获得新的主流文化“罗马人”，同时保留希腊文化。"

 ffpa_tur_reconstruction_monarchical_compromise: "重建时代的君主妥协"
 ffpa_tur_reconstruction_monarchical_compromise_desc: "王朝、官僚和地方精英暂时围绕重建国家达成了妥协。"
 ffpa_tur_anatolian_citizenship: "安纳托利亚公民权"
 ffpa_tur_anatolian_citizenship_desc: "共和国将共同公民权置于帝国身份之上，为原帝国各族提供有限但持久的接纳。"
 ffpa_tur_reconstruction_pragmatism: "安纳托利亚重建实用主义"
 ffpa_tur_reconstruction_pragmatism_desc: "政府把资源集中在行政、教育和基础设施上。"
 ffpa_ottoman_civic_compact: "奥斯曼公民契约"
 ffpa_ottoman_civic_compact_desc: "奥斯曼身份被重新解释为维系诸民族的共同政治身份，而非替代其原有文化。"
 ffpa_tur_straits_gateway: "两洲之门"
 ffpa_tur_straits_gateway_desc: "海峡两岸的铁路、港口和行政机构共同服务于一个世界性枢纽。"
 ffpa_gre_islands_and_mainland: "群岛与大陆的统一"
 ffpa_gre_islands_and_mainland_desc: "统一的行政、教育与交通网络把希腊各地紧密连接起来。"
 ffpa_byz_civic_settlement: "帝国诸族和解"
 ffpa_byz_civic_settlement_desc: "新罗马承认帝国不能只靠旧日名号维系统治，必须为臣民建立可见的公民秩序。"
 ffpa_byz_church_and_crown: "皇权与教会"
 ffpa_byz_church_and_crown_desc: "皇室与正教会共同为复兴的帝国赋予神圣合法性。"
 ffpa_byz_living_new_rome: "活着的新罗马"
 ffpa_byz_living_new_rome_desc: "君士坦丁堡不再只是被追忆的都城，而是人口、学术和贸易重新汇聚的现代帝都。"
 ffpa_rhomaic_civic_compact: "罗马公民共同体"
 ffpa_rhomaic_civic_compact_desc: "“罗马人”成为一种包容帝国诸族的新政治身份，同时保留各民族既有的文化根基。"

 ffpa_flavor.2.t: "重建后的国家"
 ffpa_flavor.2.d: "铁路重新贯通高原，税吏和邮差再次抵达边远城镇。随着安纳托利亚恢复秩序，一个更深的问题浮出水面：新土耳其应当只重建国家机器，还是重新解释奥斯曼遗产？"
 ffpa_flavor.2.f: "废墟可以按旧图重建，国家却必须决定自己将成为什么。"
 ffpa_flavor.2.a: "让王朝主持一份新的帝国契约。"
 ffpa_flavor.2.b: "共和国属于安纳托利亚的所有公民。"
 ffpa_flavor.2.c: "先建设学校、道路和行政机关。"

 ffpa_flavor.3.t: "奥斯曼共同体"
 ffpa_flavor.3.d: "经过持续的和平、包容与制度建设，奥斯曼之名开始获得新的含义。它不再仅指王朝或征服时代，而成为土耳其人、巴尔干诸族、亚美尼亚人、库尔德人和阿拉伯臣民可以共同参与的国家身份。"
 ffpa_flavor.3.f: "同一个帝国，不必要求所有人拥有同一种祖先。"
 ffpa_flavor.3.a: "确立奥斯曼公民契约。"

 ffpa_flavor.4.t: "两洲之门"
 ffpa_flavor.4.d: "列车驶入海峡终点站，货船在港外排成长龙。东色雷斯已成为连接欧洲与亚洲的真正枢纽，如今政府必须决定，这里是否也应重新成为国家的政治中心。"
 ffpa_flavor.4.f: "每一张时刻表，都在缩短两洲之间的距离。"
 ffpa_flavor.4.a: "迁都君士坦丁堡。"
 ffpa_flavor.4.b: "安卡拉仍是首都，海峡则向世界开放。"

 ffpa_flavor.5.t: "群岛与大陆"
 ffpa_flavor.5.d: "从伯罗奔尼撒到马其顿，从爱奥尼亚海到爱琴海，统一的学校、机关与航运网络正在消除旧日的隔绝。希腊不再只是地图上的共同颜色，而开始成为共享的日常现实。"
 ffpa_flavor.5.f: "海不再分隔希腊，它把希腊连接起来。"
 ffpa_flavor.5.a: "一个国家，一片相连的海。"

 ffpa_flavor.6.t: "新罗马的第二次奠基"
 ffpa_flavor.6.d: "帝国已控制旧日心脏地带，君士坦丁堡再次成为有能力统治它们的首都。宫廷、教会、市民和各族代表都要求回答同一个问题：新罗马将凭借什么延续？"
 ffpa_flavor.6.f: "城墙记得过去，街道却属于活着的人。"
 ffpa_flavor.6.a: "帝国必须成为诸族共同的国家。"
 ffpa_flavor.6.b: "让皇权与教会守护正统。"
 ffpa_flavor.6.c: "把君士坦丁堡建设成活着的新罗马。"

 ffpa_flavor.7.t: "罗马人的共同体"
 ffpa_flavor.7.d: "多年的稳定与包容使一种新的身份从法律文本进入学校、军队和市民生活。“罗马人”不再意味着抹去希腊人、土耳其人、阿尔巴尼亚人、保加利亚人、塞尔维亚人或亚美尼亚人的名字，而意味着他们可以共同拥有这个帝国。"
 ffpa_flavor.7.f: "国家若要比记忆长久，就必须容纳活着的人。"
 ffpa_flavor.7.a: "我们都是这座新罗马的公民。"

