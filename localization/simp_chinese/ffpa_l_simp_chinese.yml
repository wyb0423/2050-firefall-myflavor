 je_ffpa_byz_restore_new_rome: "复兴新罗马"
 je_ffpa_byz_restore_new_rome_reason: "君士坦丁堡既是国家机关的所在地，也是港口、工场与居民共同使用的城市。官署需要人员，大学需要电力与交通，码头的货物则不能永远在拥挤的街道上等候。首都的名号并不能替这些日常需求排定次序。\n\n提升港口、铁路、行政、大学和电力设施，并维持极高的市场准入与公共秩序。完成后可为该城#bold 永久选择三种发展方向之一#!。"

 # 首都建设与一次性政治经济事件修正
 ffpa_tur_straits_construction_drive: "海峡建设动员"
 ffpa_tur_straits_construction_drive_desc: "优先把物资、工程师与劳动力投入东色雷斯都会工程。"
 ffpa_tur_straits_world_port: "海峡世界港"
 ffpa_tur_straits_world_port_desc: "博斯普鲁斯被永久建设为国际港口、物流交换地与人口迁入门户。"
 ffpa_tur_straits_imperial_metropolis: "海峡帝国都会"
 ffpa_tur_straits_imperial_metropolis_desc: "复兴的政治首都在博斯普鲁斯集中行政、教育与高素质劳动力。"
 ffpa_byz_new_rome_construction_drive: "重建新罗马"
 ffpa_byz_new_rome_construction_drive_desc: "帝国合同加速都会建设，并吸引工人前往君士坦丁堡。"
 ffpa_byz_new_rome_world_harbor: "罗马世界之港"
 ffpa_byz_new_rome_world_harbor_desc: "君士坦丁堡永久以航运、贸易与人口流动为发展核心。"
 ffpa_byz_new_rome_industrial_metropolis: "新罗马工场"
 ffpa_byz_new_rome_industrial_metropolis_desc: "电力、建设与大规模制造业定义了重建后的帝国都会。"
 ffpa_byz_new_rome_civic_capital: "罗马人的公民首都"
 ffpa_byz_new_rome_civic_capital_desc: "学校、户籍与公共机关使君士坦丁堡成为共同体的行政心脏。"
 ffpa_tur_anatolian_railway_program: "安纳托利亚铁路计划"
 ffpa_tur_anatolian_railway_program_desc: "为期八年的计划优先建设基础设施，但需要额外行政资源。"
 ffpa_tur_anatolian_industry_program: "安纳托利亚工业区"
 ffpa_tur_anatolian_industry_program_desc: "地区产业集群将在八年内获得职业培训与协调投资支持。"
 ffpa_tur_central_tax_register: "中央税籍"
 ffpa_tur_central_tax_register_desc: "统一核税扩大了有效征税能力，却增加官僚负担并激怒地主。"
 ffpa_tur_provincial_tax_bargain: "行省税务妥协"
 ffpa_tur_provincial_tax_bargain_desc: "地方显贵以影响力和行政裁量权换取较温和但稳定的税收改善。"
 ffpa_tur_common_electoral_roll: "统一选民名册"
 ffpa_tur_common_electoral_roll_desc: "统一名册加强公民合法性与改革派的政治参与。"
 ffpa_tur_communal_electoral_colleges: "社群选举团"
 ffpa_tur_communal_electoral_colleges_desc: "宗教与地方社群通过各自的选举团组织代表权。"
 ffpa_tur_appointed_upper_chamber: "钦定上院"
 ffpa_tur_appointed_upper_chamber_desc: "王室用忠诚的钦定议员制衡民选机构。"
 ffpa_byz_uniform_land_register: "统一帝国地籍"
 ffpa_byz_uniform_land_register_desc: "统一地籍标准改善税收，却需要更多行政投入并招致精英抵制。"
 ffpa_byz_provincial_tax_privileges: "行省财政特权"
 ffpa_byz_provincial_tax_privileges_desc: "各省提供稳定税收，同时保留与教会和地主谈判取得的豁免。"
 ffpa_byz_common_civic_roll: "罗马共同公民名册"
 ffpa_byz_common_civic_roll_desc: "全体公民通过统一的帝国名册参加选举。"
 ffpa_byz_provincial_delegations: "行省代表团"
 ffpa_byz_provincial_delegations_desc: "行省与教会代表团为帝国各地提供制度化的代表渠道。"
 ffpa_byz_crown_senate: "王冠元老院"
 ffpa_byz_crown_senate_desc: "由君主任命的上院巩固了复兴后的帝国宪制。"
 ffpa_imperial_multilingual_chancery: "多语文官署"
 ffpa_imperial_multilingual_chancery_desc: "翻译公文与多语公务员让各族更容易接触并使用帝国行政体系。"
 ffpa_imperial_central_chancery: "中央官署"
 ffpa_imperial_central_chancery_desc: "统一程序加强中央权威，但留给地方身份的空间更少。"
 ffpa_imperial_provincial_representation: "行省代表权"
 ffpa_imperial_provincial_representation_desc: "制度化的行省代表权扩大了帝国机构的合法性。"
 ffpa_imperial_notables_compromise: "显贵妥协"
 ffpa_imperial_notables_compromise_desc: "地方精英以维持秩序换取帝国政府中的正式地位。"
 ffpa_imperial_common_oath: "共同军誓"
 ffpa_imperial_common_oath_desc: "所有团都宣誓遵守同一公民誓言，加强凝聚力与进攻精神。"
 ffpa_imperial_separate_regiments: "行省团制"
 ffpa_imperial_separate_regiments_desc: "行省部队保留地方组织形式，同时服从共同指挥。"

 # 土耳其一次性事件
 ffpa_flavor.10.t: "安纳托利亚工业大会"
 ffpa_flavor.10.d: "安纳托利亚的经济已在重建中取得增长，工程师、地方官员和制造商开始争论下一轮投入。铁路计划着眼于连接高原与市场，工业区方案则希望扩大城镇的生产能力。政府需要确定当前应优先支持哪一种工程。"
 ffpa_flavor.10.f: "制造商指着一张厂房图：“机器到了，就能开工。”铁路工程师把手按在地图上：“先告诉我，机器从哪一站卸车。”"
 ffpa_flavor.10.a: "优先建设干线铁路。"
 ffpa_flavor.10.b: "建设地区工业区。"
 ffpa_flavor.11.t: "新国家的税籍"
 ffpa_flavor.11.d: "旧税册残缺、矛盾，又被各地中间人严密维护。#bold 统一税籍#!能为现代国家筹集收入，妥协则能以更低政治代价维持秩序。"
 ffpa_flavor.11.f: "税务官要求每一笔收入都有相同的编号。地方中间人把旧册翻到折角处：“您换了编号，还得有人认得这里写的是哪一家。”"
 ffpa_flavor.11.a: "推行统一中央税籍。"
 ffpa_flavor.11.b: "与地方显贵谈判。"
 ffpa_flavor.12.t: "帝国国家的选票"
 ffpa_flavor.12.d: "重建后的首次全国竞选带来了不同的代表方案。共同选民名册强调个人公民资格，社群选举团希望保留各自的组织渠道，保守人士则要求在代议体系中留下制衡。政府必须说明，哪些安排将得到国家的支持。"
 ffpa_flavor.12.f: "印刷工人把选举告示钉上墙，围观者首先寻找的却是自己的登记地点。一位社群代表问：“我们的人该在这张名单上找名字，还是先到自己的会所？”"
 ffpa_flavor.12.a: "建立统一选民名册。"
 ffpa_flavor.12.b: "承认社群选举团。"
 ffpa_flavor.12.c: "用王室钦定议员制衡议院。"
 ffpa_flavor.13.t: "官署的语言"
 ffpa_flavor.13.d: "复兴后的行政机关必须决定：臣民能否用#bold 自己的语言#!面对国家，还是所有官署都必须执行统一的帝国程序。"
 ffpa_flavor.13.f: "候选文员把同一份通知用两种语言读完。考官停下笔，问他是否也听得懂乡间的说法。“公文能译出来，”他说，“来办事的人却未必照公文说话。”"
 ffpa_flavor.13.a: "招募多语公务员。"
 ffpa_flavor.13.b: "要求所有官署遵循统一的中央程序。"
 ffpa_flavor.14.t: "行省的席位"
 ffpa_flavor.14.d: "行省代表要求固定席位；既有显贵则提出更安静的交易——以自身影响力换取他们熟悉地区的秩序。"
 ffpa_flavor.14.f: "地方显贵说，自己知道该把中央的要求转告给谁。新来的代表把请愿书放在桌上：“我们要求的，正是下次不必再托人转告。”"
 ffpa_flavor.14.a: "给予行省制度化代表权。"
 ffpa_flavor.14.b: "与地方显贵达成契约。"
 ffpa_flavor.15.t: "军团的誓言"
 ffpa_flavor.15.d: "军队来自许多行省与信仰。指挥官们争论：每名士兵应宣读同一份公民誓言，还是让行省团保留自己的形式和传统。"
 ffpa_flavor.15.f: "操场上，各团的口令先后响起。军官把两份誓词递给老兵，老兵看完说：“他们都肯守住自己的队伍。还得让他们知道，旁边那一队也是自己人。”"
 ffpa_flavor.15.a: "一支军队，一份公民誓言。"
 ffpa_flavor.15.b: "在共同指挥下保留行省团。"

 # 拜占庭一次性事件
 ffpa_flavor.20.t: "新罗马宪章"
 ffpa_flavor.20.d: "宏大的都会工程已经完成。如今可以把这座城市确立为罗马世界之港、工业帝国的工场，或多民族共同体的公民首都。"
 ffpa_flavor.20.f: "港务代表带来泊位图，工程师带来用电规划，大学代表则带来候补名册。主持人没有再问新罗马应当纪念什么，而是问：“下一代人将靠这座城做成什么？”"
 ffpa_flavor.20.a: "让它成为罗马世界之港。"
 ffpa_flavor.20.b: "让它成为新罗马工场。"
 ffpa_flavor.20.c: "让它成为罗马人的公民首都。"
 ffpa_flavor.21.t: "帝国地籍"
 ffpa_flavor.21.d: "旧日封地、教会豁免与现代测绘在复兴帝国各地彼此重叠。#bold 统一地籍#!承诺收入和平等程序；谈判取得的行省特权则能换来更平稳的和解。"
 ffpa_flavor.21.f: "测绘员把新图铺在田契旁。地方代表并不质疑界线的位置，只问纸上的免税批注还算不算数。丈量土地容易些；丈量附着其上的权利，才是这次争论的核心。"
 ffpa_flavor.21.a: "颁行统一帝国地籍。"
 ffpa_flavor.21.b: "确认谈判取得的行省特权。"
 ffpa_flavor.22.t: "罗马世界的选票"
 ffpa_flavor.22.d: "首次帝国竞选把代表制度的问题带到了各省。改革者要求让公民进入共同名册，地方领袖主张通过组织化的代表团发声，保守人士则希望以更审慎的机构制衡民选议院。政府需要决定支持何种代表安排。"
 ffpa_flavor.22.f: "一位候选人把“罗马公民”印在传单最上方。听众指着下面的选区名问：“到了议院，你是替这行字发言，还是替我们住的地方发言？”"
 ffpa_flavor.22.a: "建立罗马共同公民名册。"
 ffpa_flavor.22.b: "接纳行省代表团。"
 ffpa_flavor.22.c: "复兴王冠元老院。"
 ffpa_flavor.23.t: "帝国官署的语言"
 ffpa_flavor.23.d: "各省送来的请愿书已经汇入中央官署，处理它们的办法却尚未统一。一些官员主张扩充#bold 多语公务员体系#!，使居民可以用熟悉的语言陈述事务；另一些人则要求所有文书服从同一套中央语言与程序。政府需要确定，新的行政秩序将怎样与各省交谈。"
 ffpa_flavor.23.f: "书记员读完译文，请愿人又指了指原件。“意思没有错，”译员说，“但他要问的是，下一封信还能不能这样写。”"
 ffpa_flavor.23.a: "扩充多语公务员体系。"
 ffpa_flavor.23.b: "统一中央行政语言与程序。"
 ffpa_flavor.24.t: "行省问题"
 ffpa_flavor.24.d: "代表们要求在新秩序中获得长久席位；地主和教士则愿以自己的地方权威作为帝国稳定的根基。"
 ffpa_flavor.24.f: "地方名望家向会议列举自己熟悉的家族和乡镇。对面的代表指着名单中没有名字的人：“他们也缴税、服役。谁来替他们说话？”"
 ffpa_flavor.24.a: "承认行省代表权。"
 ffpa_flavor.24.b: "与既有显贵妥协。"
 ffpa_flavor.25.t: "罗马人的军队"
 ffpa_flavor.25.d: "复兴的军队不能只是地区部队的集合。共同公民誓言可以创造统一军事身份；行省团则以牺牲一致性换取延续性与地方信任。"
 ffpa_flavor.25.f: "新誓词传到营地时，一名连长先念给士兵听，又请他们用惯常的说法复述。“我要知道，”他说，“这份誓言离开纸张以后，他们听见的还是不是同一件事。”"
 ffpa_flavor.25.a: "所有团都宣读同一份罗马誓言。"
 ffpa_flavor.25.b: "在帝国指挥下保留行省团。"

 # 帝国地区建设日志与永久地区奖励
 je_group_ffpa_imperial_development: "帝国开发"
 je_ffpa_via_egnatia: "重修埃格纳提亚大道"
 je_ffpa_via_egnatia_reason: "从阿尔巴尼亚经马其顿、西色雷斯通往君士坦丁堡的路线，需要成为一条连续运转的通道。商人希望货物能够顺畅转运，地方机关则各自负责沿线的登记与日常管理。#bold 铁路接续与行政标准#!若能相互配合，沿线各州才不只是地图上相邻的几段道路。\n\n实际纳入工程的州将保有基础设施与陆路商业专精。"
 je_ffpa_danube_thrace_corridor: "多瑙河—色雷斯走廊"
 je_ffpa_danube_thrace_corridor_reason: "多瑙河流域的来货与色雷斯的陆路运输，在保加利亚、多布罗加和北色雷斯之间衔接。河港关心装卸，铁路关心班次，税务机关则要让货物往来有据可查。把#bold 河港、铁路枢纽与税务机关#!纳入相容的安排，才能让走廊的运力服务于同一片腹地。\n\n实际纳入工程的州将保有更强的基础设施与财政触角。"
 je_ffpa_aegean_maritime_network: "爱琴海航运网络"
 je_ffpa_aegean_maritime_network_reason: "阿提卡、克里特、爱琴海诸岛与爱奥尼亚群岛的港口各有自己的腹地，居民却需要能与更远市场相接的航运。港务机关的安排、船厂的能力与岛屿的补给彼此牵连。建设#bold 连续的海运网络#!，要让港口投资与航运接续一同推进，而不只是增加几个孤立的码头。\n\n实际纳入工程的州将保有更强的海运能力、基础设施与人口吸引力。"
 je_ffpa_southern_italian_harbors: "内海港群"
 je_ffpa_southern_italian_harbors_reason: "坎帕尼亚、普利亚、卡拉布里亚与西西里的港口、船厂和食品工业，需要与共同的供应体系接轨。港务人员关心转运能力，制造商需要通往内海市场的线路，地方机关则要协调铁路与码头的扩展。#bold 港口和生产腹地的接续#!将决定这些城市在帝国贸易中能够承担什么角色。\n\n实际纳入工程的州将保有更强的制造业与内海贸易能力。"
 je_ffpa_nile_works: "尼罗河工程"
 je_ffpa_nile_works_reason: "尼罗河沿岸的农业不能只靠田间工程维持；收成还要经过加工与运输，才能抵达市场。下埃及、中埃及和上埃及的灌溉、食品工业、电力及铁路，需要在同一条河谷中相互配合。地方生产者与行政机关都依赖这套#bold 从农田延伸到市场的网络#!，却各自掌握着其中的一部分。\n\n实际纳入工程的州将保有更强的农业、基础设施与财政能力。"
 je_ffpa_ifriqiya_coastal_network: "伊弗里基亚滨海网络"
 je_ffpa_ifriqiya_coastal_network_reason: "突尼斯、的黎波里与利比亚的沿岸节点，连接着不同的腹地与海路。港口的扩展需要铁路接应，货物转运需要海关与地方机关能够配合。让#bold 沿岸运输与公共行政采用相容标准#!，可以把各节点的能力连成一条持续运转的滨海网络。\n\n实际纳入工程的州将保有更强的滨海贸易、基础设施与迁移联系。"
 je_ffpa_anatolian_trunk_lines: "安纳托利亚干线"
 je_ffpa_anatolian_trunk_lines_reason: "许达文迪加尔、安卡拉、科尼亚与阿达纳之间的生产联系，需要跨越各地分别管理的铁路和供电设施。制造商要求稳定运输，工程人员需要统一标准，地方机关则负责把规划落实到线路与电网。#bold 共同的时刻表与电力网络#!，将使工业主轴成为能够协同运转的整体。\n\n实际纳入工程的州将保有更强的制造业、资质与基础设施。"
 je_ffpa_levant_trade_corridor: "黎凡特贸易走廊"
 je_ffpa_levant_trade_corridor_reason: "阿勒颇、叙利亚、黎巴嫩与巴勒斯坦的贸易，需要把内陆运送、沿海转运和公共手续接续起来。商人关心货物何时到港，地方机关关心责任如何交接；铁路与码头扩建只有配合行政能力，才能减少各段之间的脱节。#bold 一条共同的贸易走廊#!应当贯通这些环节。\n\n实际纳入工程的州将保有更强的商业、基础设施与征税能力。"
 je_ffpa_mesopotamian_waterworks: "美索不达米亚水利工程"
 je_ffpa_mesopotamian_waterworks_reason: "摩苏尔、巴格达、代尔祖尔与巴士拉面对着同一套河流和运输联系，各地的灌溉、发电与粮食加工却不能各自规划到底。上游工程的安排，需要与下游生产和海湾外运衔接。让#bold 水利、能源与运输共同服务于流域#!，需要地方知识与国家工程能力一起发挥作用。\n\n实际纳入工程的州将保有更强的农业、基础设施与粮食安全。"
 je_ffpa_italian_urban_axis: "意大利城市轴线"
 je_ffpa_italian_urban_axis_reason: "皮埃蒙特、伦巴第、艾米利亚、罗马涅、托斯卡纳与拉齐奥的城市，各有自己的市政事务与生产联系。中央需要一条贯通的工业和行政轴线，地方机关则必须把共同标准落实到已有网络之中。#bold 市政、铁路、电网与工业的接续#!，应当扩大各城市相互协作的能力，而不是把它们当作等待重新开建的空地。\n\n实际纳入工程的州将保有更强的制造业、基础设施、税收与人口资质。"
 je_ffpa_adriatic_arsenals: "亚得里亚军港群"
 je_ffpa_adriatic_arsenals_reason: "威尼西亚、伊斯特里亚与达尔马提亚的船厂，需要港口、铁路和电力稳定地提供支撑。采购机关希望统一规格，船厂需要可以安排的订单与物资，港务人员则负责把两者接起来。建设#bold 亚得里亚军港与造船网络#!，既是扩充设施，也是让军需与地方工业能够依照相容的安排运转。\n\n实际纳入工程的州将保有更强的亚得里亚造船业、基础设施与商业。"
 je_ffpa_western_mediterranean_sea_lanes: "西地中海航路"
 je_ffpa_western_mediterranean_sea_lanes_reason: "撒丁、科西嘉、马耳他与巴利阿里群岛的港口，只有接入连续航路，才能彼此补充。商船需要可靠的停泊与转运，海军船坞需要补给，岛上居民也依赖与外界的联系。#bold 跨海运输的连续性#!有赖于各港协调，而不能只按单个岛屿的需要规划。\n\n实际纳入工程的州将保有更强的航运、贸易、基础设施与迁移联系。"
 je_ffpa_spanian_littoral: "西班尼亚滨海"
 je_ffpa_spanian_littoral_reason: "安达卢西亚、巴伦西亚与穆尔西亚的沿岸产业，要把农业腹地、食品加工与工场接向港口。生产者需要货物按时外运，铁路与港务机关则要协调陆海之间的转运。纳入国家网络以后，#bold 滨海城市与腹地的联系#!仍须通过基础设施和日常管理来维持。\n\n实际纳入工程的州将保有更强的农业、制造业与贸易。"
 je_ffpa_mauretanian_coastal_road: "古毛里塔尼亚滨海道"
 je_ffpa_mauretanian_coastal_road_reason: "君士坦丁、阿尔及尔与里夫之间的沿岸通道，需要让港口及腹地的生产联系保持畅通。地方机关掌握各段事务，运输人员和商人却需要一条能够连续使用的线路。把#bold 铁路、食品工业与行政节点#!接续起来，才能让滨海道服务于沿线居民，而不只是连接地图上的地名。\n\n实际纳入工程的州将保有更强的农业、基础设施、贸易与西北非沿岸迁移联系。"
 je_ffpa_alexandria_sinai_axis: "亚历山大—西奈轴线"
 je_ffpa_alexandria_sinai_axis_reason: "从亚历山大与下埃及通向西奈、马特鲁的联系，跨过港口、陆路转运与不同的行政节点。港务人员关心货物周转，公共机关需要人手，铁路和电力设施则为两者提供支撑。建设#bold 地中海—红海门户#!，需要把这些能力组织成相互衔接的网络。\n\n实际纳入工程的州将保有更强的基础设施、贸易、税收与迁移联系。"
 ffpa_region_via_egnatia: "重修的埃格纳提亚大道"
 ffpa_region_via_egnatia_desc: "统一的铁路与行政标准维持着跨巴尔干基础设施和商业往来。"
 ffpa_region_danube_thrace_corridor: "多瑙河—色雷斯走廊"
 ffpa_region_danube_thrace_corridor_desc: "铁路、河运与协调行政扩展了国家联通和征税能力。"
 ffpa_region_aegean_maritime_network: "爱琴海航运网络"
 ffpa_region_aegean_maritime_network_desc: "协同运作的港口、船厂与航运班次提高海运能力并吸引人口迁入。"
 ffpa_region_southern_italian_harbors: "内海港群"
 ffpa_region_southern_italian_harbors_desc: "一体化的南意大利港口与产业支持制造业和内海商业。"
 ffpa_region_nile_works: "尼罗河工程"
 ffpa_region_nile_works_desc: "电力、交通与河流治理加强尼罗河农业和行政。"
 ffpa_region_ifriqiya_coastal_network: "伊弗里基亚滨海网络"
 ffpa_region_ifriqiya_coastal_network_desc: "采用相容标准的港口、铁路和海关改善滨海基础设施、贸易与人口迁入。"
 ffpa_region_anatolian_trunk_lines: "安纳托利亚干线"
 ffpa_region_anatolian_trunk_lines_desc: "电气化干线铁路支持工业、基础设施与熟练劳动力。"
 ffpa_region_levant_trade_corridor: "黎凡特贸易走廊"
 ffpa_region_levant_trade_corridor_desc: "一体化铁路、港口与关税体系加强黎凡特商业和财政收入。"
 ffpa_region_mesopotamian_waterworks: "美索不达米亚水利工程"
 ffpa_region_mesopotamian_waterworks_desc: "全流域灌溉、电力与交通改善农业和粮食安全。"
 ffpa_region_italian_urban_axis: "意大利城市轴线"
 ffpa_region_italian_urban_axis_desc: "相互对接的城市走廊加强意大利工业、行政与熟练劳动力。"
 ffpa_region_adriatic_arsenals: "亚得里亚军港群"
 ffpa_region_adriatic_arsenals_desc: "统一标准的军港、船厂与铁路港口加强亚得里亚造船业和商业。"
 ffpa_region_western_mediterranean_sea_lanes: "西地中海航路"
 ffpa_region_western_mediterranean_sea_lanes_desc: "协同运作的岛屿港口网络支持航运、贸易与人口迁入。"
 ffpa_region_spanian_littoral: "西班尼亚滨海"
 ffpa_region_spanian_littoral_desc: "一体化港口、铁路、农场与工场加强已纳入统治的西班尼亚诸省。"
 ffpa_region_mauretanian_coastal_road: "古毛里塔尼亚滨海道"
 ffpa_region_mauretanian_coastal_road_desc: "由铁路与港口组成的滨海道连接西北非农业、商业与人口定居。"
 ffpa_region_alexandria_sinai_axis: "亚历山大—西奈轴线"
 ffpa_region_alexandria_sinai_axis_desc: "电气化港口与陆路巩固埃及连接地中海和红海的门户。"

 # 东地中海利益集团意识形态
 ideology_ffpa_anatolian_reconstructionism: "安纳托利亚重建主义"
 ideology_ffpa_anatolian_reconstructionism_desc: "#lore 军队将严整的国家重建、边疆定居和一体化电网视为安纳托利亚重获安全的根基。#!"
 ideology_ffpa_tur_state_developmentalism: "国家开发主义"
 ideology_ffpa_tur_state_developmentalism_desc: "#lore 工业资本应当与有能力的国家合作，在保留私人企业的同时重建交通、电力与制造业。#!"
 ideology_ffpa_anatolian_civic_statism: "安纳托利亚市民国家主义"
 ideology_ffpa_anatolian_civic_statism_desc: "#lore 城市商贩、公务员与小业主支持秩序井然的公民国家、受保护的本土商业、受控移民和公共基础设施。#!"
 ideology_ffpa_provincial_compact: "行省契约主义"
 ideology_ffpa_provincial_compact_desc: "#lore 只要地方权威得到帝国协定的保障，地主与行省显贵便愿意接受现代行政和有限代表制度。#!"
 ideology_ffpa_ottoman_constitutionalism: "奥斯曼立宪主义"
 ideology_ffpa_ottoman_constitutionalism_desc: "#lore 多民族奥斯曼公民身份应由立宪君主制、代议机构、专业行政与公共教育共同维护。#!"
 ideology_ffpa_roman_restorationism: "罗马复归主义"
 ideology_ffpa_roman_restorationism_desc: "#lore 复兴的罗马军队肩负着重新统一并建设旧帝国空间的使命，以共同誓言和现代基础设施联结复归诸省。#!"
 ideology_ffpa_mediterranean_developmentalism: "地中海开发主义"
 ideology_ffpa_mediterranean_developmentalism_desc: "#lore 港口、工业、信贷与一体化电力系统必须把复归的地中海诸省建设成同一张生产网络。#!"
 ideology_ffpa_new_rome_civicism: "新罗马市民主义"
 ideology_ffpa_new_rome_civicism_desc: "#lore 市政官员、商人、职员与小业主把新罗马视为有序公民共同体的中心，并以商业和公共工程联结各地。#!"
 ideology_ffpa_imperial_symphonia: "皇权—教会协和论"
 ideology_ffpa_imperial_symphonia_desc: "#lore 教会与皇权应作为复兴罗马秩序中彼此有别的守护者共同合作，调和公共信仰、教育与帝国权威。#!"
 ideology_ffpa_rhomaic_liberalism: "罗马自由主义"
 ideology_ffpa_rhomaic_liberalism_desc: "#lore 新罗马学社把公民自由、公共辩论与平等法律能力视为现代罗马共同体的根基。#!"
