 je_ffpa_byz_restore_new_rome: "复兴新罗马"
 je_ffpa_byz_restore_new_rome_reason: "让君士坦丁堡从光复的旧都变成现代帝国真正运转的都会。提升港口、铁路、行政、大学和电力设施，并维持极高的市场准入与公共秩序。完成后可为该城永久选择三种发展方向之一。"

 # 首都建设与一次性政治经济事件修正
 ffpa_tur_straits_construction_drive: "海峡建设动员"
 ffpa_tur_straits_construction_drive_desc: "优先把物资、工程师与劳动力投入东色雷斯都会工程。"
 ffpa_tur_straits_world_port: "海峡世界港"
 ffpa_tur_straits_world_port_desc: "博斯普鲁斯被永久建设为国际港口、物流交换地与人口迁入门户。"
 ffpa_tur_straits_imperial_metropolis: "海峡帝国都会"
 ffpa_tur_straits_imperial_metropolis_desc: "复兴的政治首都在博斯普鲁斯集中行政、教育与高素质劳动力。"
 ffpa_byz_new_rome_construction_drive: "重建新罗马"
 ffpa_byz_new_rome_construction_drive_desc: "帝国合同加速都会建设，并吸引工人前往君士坦丁堡。"
 ffpa_byz_new_rome_world_harbor: "罗马世界之港"
 ffpa_byz_new_rome_world_harbor_desc: "君士坦丁堡永久以航运、贸易与人口流动为发展核心。"
 ffpa_byz_new_rome_industrial_metropolis: "新罗马工场"
 ffpa_byz_new_rome_industrial_metropolis_desc: "电力、建设与大规模制造业定义了重建后的帝国都会。"
 ffpa_byz_new_rome_civic_capital: "罗马人的公民首都"
 ffpa_byz_new_rome_civic_capital_desc: "学校、户籍与公共机关使君士坦丁堡成为共同体的行政心脏。"
 ffpa_tur_anatolian_railway_program: "安纳托利亚铁路计划"
 ffpa_tur_anatolian_railway_program_desc: "为期八年的计划优先建设基础设施，但需要额外行政资源。"
 ffpa_tur_anatolian_industry_program: "安纳托利亚工业区"
 ffpa_tur_anatolian_industry_program_desc: "地区产业集群将在八年内获得职业培训与协调投资支持。"
 ffpa_tur_central_tax_register: "中央税籍"
 ffpa_tur_central_tax_register_desc: "统一核税扩大了有效征税能力，却增加官僚负担并激怒地主。"
 ffpa_tur_provincial_tax_bargain: "行省税务妥协"
 ffpa_tur_provincial_tax_bargain_desc: "地方显贵以影响力和行政裁量权换取较温和但稳定的税收改善。"
 ffpa_tur_common_electoral_roll: "统一选民名册"
 ffpa_tur_common_electoral_roll_desc: "统一名册加强公民合法性与改革派的政治参与。"
 ffpa_tur_communal_electoral_colleges: "社群选举团"
 ffpa_tur_communal_electoral_colleges_desc: "宗教与地方社群通过各自的选举团组织代表权。"
 ffpa_tur_appointed_upper_chamber: "钦定上院"
 ffpa_tur_appointed_upper_chamber_desc: "王室用忠诚的钦定议员制衡民选机构。"
 ffpa_byz_uniform_land_register: "统一帝国地籍"
 ffpa_byz_uniform_land_register_desc: "统一地籍标准改善税收，却需要更多行政投入并招致精英抵制。"
 ffpa_byz_provincial_tax_privileges: "行省财政特权"
 ffpa_byz_provincial_tax_privileges_desc: "各省提供稳定税收，同时保留与教会和地主谈判取得的豁免。"
 ffpa_byz_common_civic_roll: "罗马共同公民名册"
 ffpa_byz_common_civic_roll_desc: "全体公民通过统一的帝国名册参加选举。"
 ffpa_byz_provincial_delegations: "行省代表团"
 ffpa_byz_provincial_delegations_desc: "行省与教会代表团调和帝国各地的政治代表权。"
 ffpa_byz_crown_senate: "王冠元老院"
 ffpa_byz_crown_senate_desc: "由君主任命的上院巩固了复兴后的帝国宪制。"
 ffpa_imperial_multilingual_chancery: "多语文官署"
 ffpa_imperial_multilingual_chancery_desc: "翻译公文与多语公务员使帝国行政更容易为各族接触。"
 ffpa_imperial_central_chancery: "中央官署"
 ffpa_imperial_central_chancery_desc: "统一程序加强中央权威，但留给地方身份的空间更少。"
 ffpa_imperial_provincial_representation: "行省代表权"
 ffpa_imperial_provincial_representation_desc: "制度化的行省代表权扩大了帝国机构的合法性。"
 ffpa_imperial_notables_compromise: "显贵妥协"
 ffpa_imperial_notables_compromise_desc: "地方精英以维持秩序换取帝国政府中的正式地位。"
 ffpa_imperial_common_oath: "共同军誓"
 ffpa_imperial_common_oath_desc: "所有团都宣誓遵守同一公民誓言，加强凝聚力与进攻精神。"
 ffpa_imperial_separate_regiments: "行省团制"
 ffpa_imperial_separate_regiments_desc: "行省部队保留地方组织形式，同时服从共同指挥。"

 # 土耳其一次性事件
 ffpa_flavor.10.t: "安纳托利亚工业大会"
 ffpa_flavor.10.d: "随着紧急重建阶段结束，工程师、行省长官和制造商齐聚一堂，决定下一轮国家工程的重点。国营铁路计划可以贯通高原，而工业区能让已有增长条件的城市更快起飞。"
 ffpa_flavor.10.f: "时刻表和工厂账簿，是同一种未来的两幅地图。"
 ffpa_flavor.10.a: "优先建设干线铁路。"
 ffpa_flavor.10.b: "建设地区工业区。"
 ffpa_flavor.11.t: "新国家的税籍"
 ffpa_flavor.11.d: "旧税册残缺、矛盾，又被各地中间人严密维护。统一税籍能为现代国家筹集收入，妥协则能以更低政治代价维持秩序。"
 ffpa_flavor.11.f: "国家首先通过清点各省来认识它们。"
 ffpa_flavor.11.a: "推行统一中央税籍。"
 ffpa_flavor.11.b: "与地方显贵谈判。"
 ffpa_flavor.12.t: "帝国国家的选票"
 ffpa_flavor.12.d: "重建后的首次全国竞选迫使政府明确：谁作为个人公民获得代表，谁通过社群发声，而王室又保留多少制衡权。"
 ffpa_flavor.12.f: "每张选票都在描述负责清点它的国家。"
 ffpa_flavor.12.a: "建立统一选民名册。"
 ffpa_flavor.12.b: "承认社群选举团。"
 ffpa_flavor.12.c: "用王室钦定议员制衡议院。"
 ffpa_flavor.13.t: "官署的语言"
 ffpa_flavor.13.d: "复兴后的行政机关必须决定：臣民能否用自己的语言面对国家，还是所有官署都必须执行统一的帝国程序。"
 ffpa_flavor.13.f: "帝国最常通过表格、印章与教科书说话。"
 ffpa_flavor.13.a: "招募多语公务员。"
 ffpa_flavor.13.b: "一个官署必须执行一种程序。"
 ffpa_flavor.14.t: "行省的席位"
 ffpa_flavor.14.d: "行省代表要求固定席位；既有显贵则提出更安静的交易——以自身影响力换取他们熟悉地区的秩序。"
 ffpa_flavor.14.f: "中央可以通过选票听见地方，也可以通过恩主。"
 ffpa_flavor.14.a: "给予行省制度化代表权。"
 ffpa_flavor.14.b: "与地方显贵达成契约。"
 ffpa_flavor.15.t: "军团的誓言"
 ffpa_flavor.15.d: "军队来自许多行省与信仰。指挥官们争论：每名士兵应宣读同一份公民誓言，还是让行省团保留自己的形式和传统。"
 ffpa_flavor.15.f: "制服一天就能做成一样，忠诚却需要更久。"
 ffpa_flavor.15.a: "一支军队，一份公民誓言。"
 ffpa_flavor.15.b: "在共同指挥下保留行省团。"

 # 拜占庭一次性事件
 ffpa_flavor.20.t: "新罗马宪章"
 ffpa_flavor.20.d: "宏大的都会工程已经完成。如今可以把这座城市确立为罗马世界之港、工业帝国的工场，或多民族共同体的公民首都。"
 ffpa_flavor.20.f: "君士坦丁堡曾作为遗迹、战利品和记忆存续；现在它必须选择如何活下去。"
 ffpa_flavor.20.a: "让它成为罗马世界之港。"
 ffpa_flavor.20.b: "让它成为新罗马工场。"
 ffpa_flavor.20.c: "让它成为罗马人的公民首都。"
 ffpa_flavor.21.t: "帝国地籍"
 ffpa_flavor.21.d: "旧日封地、教会豁免与现代测绘在复兴帝国各地彼此重叠。统一地籍承诺收入和平等程序；谈判取得的行省特权则能换来更平稳的和解。"
 ffpa_flavor.21.f: "档案馆记得每一位统治者，国库却只承认最新的印章。"
 ffpa_flavor.21.a: "颁行统一帝国地籍。"
 ffpa_flavor.21.b: "确认谈判取得的行省特权。"
 ffpa_flavor.22.t: "罗马世界的选票"
 ffpa_flavor.22.d: "首次帝国竞选检验着复兴的政治含义。公民可以进入统一名册，各省可以派出组织化代表团，王室也可以用复兴的元老院制衡民选议院。"
 ffpa_flavor.22.f: "旧名号很容易归来，代议制度却必须亲手建设。"
 ffpa_flavor.22.a: "建立罗马共同公民名册。"
 ffpa_flavor.22.b: "接纳行省代表团。"
 ffpa_flavor.22.c: "复兴王冠元老院。"
 ffpa_flavor.23.t: "帝国官署的语言"
 ffpa_flavor.23.d: "请愿书以希腊语、土耳其语、阿尔巴尼亚语、保加利亚语、塞尔维亚语和亚美尼亚语送达。皇宫必须在多语公务员体系与严格统一的中央官署之间选择。"
 ffpa_flavor.23.f: "政府使用的语言决定了谁能够回答它。"
 ffpa_flavor.23.a: "让官署能够与每个行省交谈。"
 ffpa_flavor.23.b: "维持统一的中央行政语言。"
 ffpa_flavor.24.t: "行省问题"
 ffpa_flavor.24.d: "代表们要求在新秩序中获得长久席位；地主和教士则愿以自己的地方权威作为帝国稳定的根基。"
 ffpa_flavor.24.f: "行省由首都统治，却从来不只由首都统治。"
 ffpa_flavor.24.a: "承认行省代表权。"
 ffpa_flavor.24.b: "与既有显贵妥协。"
 ffpa_flavor.25.t: "罗马人的军队"
 ffpa_flavor.25.d: "复兴的军队不能只是地区部队的集合。共同公民誓言可以创造统一军事身份；行省团则以牺牲一致性换取延续性与地方信任。"
 ffpa_flavor.25.f: "命令必须跨越语言与乡土边界时，帝国才真正受到考验。"
 ffpa_flavor.25.a: "所有团都宣读同一份罗马誓言。"
 ffpa_flavor.25.b: "在帝国指挥下保留行省团。"

 # 帝国地区建设日志与永久地区奖励
 je_group_ffpa_imperial_development: "帝国开发"
 je_ffpa_via_egnatia: "重修埃格纳提亚大道"
 je_ffpa_via_egnatia_reason: "用可靠的铁路、行政、市场准入和公共秩序，把阿尔巴尼亚、马其顿与西色雷斯重新连接到君士坦丁堡。完成后永久改善沿线基础设施与贸易。"
 je_ffpa_danube_thrace_corridor: "多瑙河—色雷斯走廊"
 je_ffpa_danube_thrace_corridor_reason: "把保加利亚、多布罗加与北色雷斯建设成治理有效的铁路—河运走廊。完成后永久改善基础设施与征税能力。"
 je_ffpa_aegean_maritime_network: "爱琴海航运网络"
 je_ffpa_aegean_maritime_network_reason: "以现代港口和阿提卡造船中心连接阿提卡、克里特、爱琴海诸岛与爱奥尼亚群岛。完成后永久加强海上贸易、基础设施与人口迁入。"
 je_ffpa_southern_italian_harbors: "中海港群"
 je_ffpa_southern_italian_harbors_reason: "作为拜占庭，现代化坎帕尼亚、普利亚、卡拉布里亚与西西里的港口、铁路、造船业和食品工业。完成后永久加强南意大利制造业与贸易。"
 je_ffpa_nile_works: "尼罗河工程"
 je_ffpa_nile_works_reason: "沿下埃及、中埃及和上埃及建设铁路、行政、食品工业与电力设施。完成后永久加强农业、基础设施和征税能力。"
 je_ffpa_ifriqiya_coastal_network: "易弗里基叶滨海网络"
 je_ffpa_ifriqiya_coastal_network_reason: "用港口、铁路和公共行政连接突尼斯、的黎波里与利比亚。完成后永久加强滨海贸易、基础设施与人口迁入。"
 je_ffpa_anatolian_trunk_lines: "安纳托利亚干线"
 je_ffpa_anatolian_trunk_lines_reason: "在许达文迪加尔、安卡拉、科尼亚与阿达纳建设电气化工业铁路主轴。完成后永久改善制造业、资质与基础设施。"
 je_ffpa_levant_trade_corridor: "黎凡特贸易走廊"
 je_ffpa_levant_trade_corridor_reason: "用铁路、港口和公共机关连接阿勒颇、叙利亚、黎巴嫩与巴勒斯坦。完成后永久加强贸易、基础设施与税收。"
 je_ffpa_mesopotamian_waterworks: "美索不达米亚水利工程"
 je_ffpa_mesopotamian_waterworks_reason: "作为土耳其，以铁路、电力、食品工业和现代海湾港口恢复摩苏尔、巴格达、代尔祖尔与巴士拉的河流生产体系。完成后永久加强农业、基础设施与粮食安全。"
 je_ffpa_italian_urban_axis: "意大利城市轴线"
 je_ffpa_italian_urban_axis_reason: "作为拜占庭，把皮埃蒙特、伦巴第、艾米利亚、罗马涅、托斯卡纳与拉齐奥连接成电气化工业—行政走廊。完成后永久加强制造业、基础设施、税收与人口资质。"
 je_ffpa_adriatic_arsenals: "亚得里亚军港群"
 je_ffpa_adriatic_arsenals_reason: "作为拜占庭，现代化威尼西亚、伊斯特里亚与达尔马提亚的港口、铁路、电力和造船业。完成后永久加强亚得里亚海造船、基础设施与贸易。"
 je_ffpa_western_mediterranean_sea_lanes: "西地中海航路"
 je_ffpa_western_mediterranean_sea_lanes_reason: "作为拜占庭，用设防商港与海军船坞连接撒丁、科西嘉、马耳他和巴利阿里群岛。完成后永久改善造船、贸易、基础设施与人口迁入。"
 je_ffpa_spanian_littoral: "西班牙滨海诸省"
 je_ffpa_spanian_littoral_reason: "作为拜占庭，以港口、铁路、食品工业和制造业开发安达卢西亚、巴伦西亚与穆尔西亚滨海诸省。完成后永久加强农业、制造业与贸易。"
 je_ffpa_mauretanian_coastal_road: "毛里塔尼亚滨海道"
 je_ffpa_mauretanian_coastal_road_reason: "用港口、铁路、行政机关和食品工业连接君士坦丁、阿尔及尔与里夫。完成后永久加强西北非沿岸的农业、基础设施、贸易与人口迁入。"
 je_ffpa_alexandria_sinai_axis: "亚历山大—西奈轴线"
 je_ffpa_alexandria_sinai_axis_reason: "以亚历山大港务、铁路、电力和公共行政，把下埃及、西奈与马特鲁建设成海陆交通轴。完成后永久加强基础设施、贸易、税收与人口迁入。"
 ffpa_region_via_egnatia: "重修的埃格纳提亚大道"
 ffpa_region_via_egnatia_desc: "现代化跨巴尔干路线永久改善基础设施与商业往来。"
 ffpa_region_danube_thrace_corridor: "多瑙河—色雷斯走廊"
 ffpa_region_danube_thrace_corridor_desc: "铁路、河运与常态行政永久改善地区联通和征税能力。"
 ffpa_region_aegean_maritime_network: "爱琴海航运网络"
 ffpa_region_aegean_maritime_network_desc: "协同港口与航运永久提高贸易能力并吸引人口迁入。"
 ffpa_region_southern_italian_harbors: "中海港群"
 ffpa_region_southern_italian_harbors_desc: "现代化南意大利港口永久支持制造业与地中海商业。"
 ffpa_region_nile_works: "尼罗河工程"
 ffpa_region_nile_works_desc: "电力、交通与河流治理永久加强尼罗河农业和行政。"
 ffpa_region_ifriqiya_coastal_network: "易弗里基叶滨海网络"
 ffpa_region_ifriqiya_coastal_network_desc: "现代港口链永久改善滨海基础设施、贸易与人口迁入。"
 ffpa_region_anatolian_trunk_lines: "安纳托利亚干线"
 ffpa_region_anatolian_trunk_lines_desc: "电气化干线铁路永久支持工业、基础设施与熟练劳动力。"
 ffpa_region_levant_trade_corridor: "黎凡特贸易走廊"
 ffpa_region_levant_trade_corridor_desc: "一体化铁路、港口与关税体系永久加强黎凡特商业和财政收入。"
 ffpa_region_mesopotamian_waterworks: "美索不达米亚水利工程"
 ffpa_region_mesopotamian_waterworks_desc: "现代灌溉、电力与交通永久改善农业和粮食安全。"
 ffpa_region_italian_urban_axis: "意大利城市轴线"
 ffpa_region_italian_urban_axis_desc: "电气化城市走廊永久加强意大利工业、行政与熟练劳动力。"
 ffpa_region_adriatic_arsenals: "亚得里亚军港群"
 ffpa_region_adriatic_arsenals_desc: "现代军港、船厂与铁路港口永久加强亚得里亚海造船和商业。"
 ffpa_region_western_mediterranean_sea_lanes: "西地中海航路"
 ffpa_region_western_mediterranean_sea_lanes_desc: "协同运作的岛屿港口网络永久支持航运、贸易与人口迁入。"
 ffpa_region_spanian_littoral: "西班牙滨海诸省"
 ffpa_region_spanian_littoral_desc: "一体化港口、铁路、农场与工场永久加强复归的西班牙诸省。"
 ffpa_region_mauretanian_coastal_road: "毛里塔尼亚滨海道"
 ffpa_region_mauretanian_coastal_road_desc: "受有效治理的滨海道永久支持西北非农业、商业与人口定居。"
 ffpa_region_alexandria_sinai_axis: "亚历山大—西奈轴线"
 ffpa_region_alexandria_sinai_axis_desc: "电气化港口与陆路永久巩固埃及连接地中海和红海的门户。"

 # 东地中海利益集团意识形态
 ideology_ffpa_anatolian_reconstructionism: "安纳托利亚重建主义"
 ideology_ffpa_anatolian_reconstructionism_desc: "#lore 军队将严整的国家重建、边疆定居和一体化电网视为安纳托利亚重获安全的根基。#!"
 ideology_ffpa_tur_state_developmentalism: "国家开发主义"
 ideology_ffpa_tur_state_developmentalism_desc: "#lore 工业资本应当与有能力的国家合作，在保留私人企业的同时重建交通、电力与制造业。#!"
 ideology_ffpa_anatolian_civic_statism: "安纳托利亚市民国家主义"
 ideology_ffpa_anatolian_civic_statism_desc: "#lore 城市商贩、公务员与小业主支持秩序井然的公民国家、受保护的本土商业、受控移民和公共基础设施。#!"
 ideology_ffpa_provincial_compact: "行省契约主义"
 ideology_ffpa_provincial_compact_desc: "#lore 只要地方权威得到帝国协定的保障，地主与行省显贵便愿意接受现代行政和有限代表制度。#!"
 ideology_ffpa_ottoman_constitutionalism: "奥斯曼立宪主义"
 ideology_ffpa_ottoman_constitutionalism_desc: "#lore 多民族奥斯曼公民身份应由立宪君主制、代议机构、专业行政与公共教育共同维护。#!"
 ideology_ffpa_roman_restorationism: "罗马复归主义"
 ideology_ffpa_roman_restorationism_desc: "#lore 复兴的罗马军队肩负着重新统一并建设旧帝国空间的使命，以共同誓言和现代基础设施联结复归诸省。#!"
 ideology_ffpa_mediterranean_developmentalism: "地中海开发主义"
 ideology_ffpa_mediterranean_developmentalism_desc: "#lore 港口、工业、信贷与一体化电力系统必须把复归的地中海诸省建设成同一张生产网络。#!"
 ideology_ffpa_new_rome_civicism: "新罗马市民主义"
 ideology_ffpa_new_rome_civicism_desc: "#lore 市政官员、商人、职员与小业主把新罗马视为有序公民共同体的中心，并以商业和公共工程联结各地。#!"
 ideology_ffpa_imperial_symphonia: "皇权—教会协和论"
 ideology_ffpa_imperial_symphonia_desc: "#lore 教会与皇权应作为复兴罗马秩序中彼此有别的守护者共同合作，调和公共信仰、教育与帝国权威。#!"
 ideology_ffpa_rhomaic_civic_universalism: "罗马公民普遍主义"
 ideology_ffpa_rhomaic_civic_universalism_desc: "#lore 罗马身份是一种公共忠诚，而非血统或语言的私产；公民权、教育与代表制度必须把复归诸省联结起来。#!"

