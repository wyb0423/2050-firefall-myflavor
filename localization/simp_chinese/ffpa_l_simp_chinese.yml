 je_ffpa_nile_works: "尼罗河工程"
 je_ffpa_nile_works_reason: "协调下埃及、中埃及与上埃及的灌溉、食品加工、电力、铁路和税务行政。实际纳入工程的州将保有更强的农业、基础设施与财政能力。"
 je_ffpa_ifriqiya_coastal_network: "伊弗里基亚滨海网络"
 je_ffpa_ifriqiya_coastal_network_reason: "让突尼斯、的黎波里与利比亚的港口、铁路、海关和公共机关采用相容标准。实际纳入工程的州将保有更强的滨海贸易、基础设施与迁移联系。"
 je_ffpa_anatolian_trunk_lines: "安纳托利亚干线"
 je_ffpa_anatolian_trunk_lines_reason: "为许达文迪加尔、安卡拉、科尼亚与阿达纳的工业铁路主轴统一电气化、时刻表与电力网络，把既有生产中心连为一体。实际纳入工程的州将保有更强的制造业、资质与基础设施。"
 je_ffpa_levant_trade_corridor: "黎凡特贸易走廊"
 je_ffpa_levant_trade_corridor_reason: "把阿勒颇、叙利亚、黎巴嫩与巴勒斯坦的铁路、港口、海关规则和公共机关纳入同一条全国贸易走廊。实际纳入工程的州将保有更强的商业、基础设施与征税能力。"
 je_ffpa_mesopotamian_waterworks: "美索不达米亚水利工程"
 je_ffpa_mesopotamian_waterworks_reason: "在摩苏尔、巴格达、代尔祖尔与巴士拉之间统筹全流域灌溉、电力、食品加工、铁路运输和海湾港口能力。实际纳入工程的州将保有更强的农业、基础设施与粮食安全。"
 je_ffpa_italian_urban_axis: "意大利城市轴线"
 je_ffpa_italian_urban_axis_reason: "把皮埃蒙特、伦巴第、艾米利亚、罗马涅、托斯卡纳与拉齐奥既有的市政、工业、电网、铁路与行政系统相互对接。实际纳入工程的州将保有更强的制造业、基础设施、税收与人口资质。"
 je_ffpa_adriatic_arsenals: "亚得里亚军港群"
 je_ffpa_adriatic_arsenals_reason: "统一威尼西亚、伊斯特里亚与达尔马提亚的海军采购、船厂标准、电力供应和铁路港口。实际纳入工程的州将保有更强的亚得里亚造船业、基础设施与商业。"
 je_ffpa_western_mediterranean_sea_lanes: "西地中海航路"
 je_ffpa_western_mediterranean_sea_lanes_reason: "协调撒丁、科西嘉、马耳他与巴利阿里群岛的设防港口、商船航路、海军船坞和岛屿补给。实际纳入工程的州将保有更强的航运、贸易、基础设施与迁移联系。"
 je_ffpa_spanian_littoral: "西班尼亚滨海"
 je_ffpa_spanian_littoral_reason: "在接管之后，把安达卢西亚、巴伦西亚与穆尔西亚的港口、铁路、食品加工、工场和农业腹地接入同一套网络。实际纳入工程的州将保有更强的农业、制造业与贸易。"
 je_ffpa_mauretanian_coastal_road: "古毛里塔尼亚滨海道"
 je_ffpa_mauretanian_coastal_road_reason: "以相容的铁路、行政与食品工业连接君士坦丁、阿尔及尔和里夫的港口及腹地。实际纳入工程的州将保有更强的农业、基础设施、贸易与西北非沿岸迁移联系。"
 je_ffpa_alexandria_sinai_axis: "亚历山大—西奈轴线"
 je_ffpa_alexandria_sinai_axis_reason: "扩充从亚历山大与下埃及通往西奈、马特鲁的电力、铁路、港务、海关与公共行政能力，协调地中海—红海门户。实际纳入工程的州将保有更强的基础设施、贸易、税收与迁移联系。"
 ffpa_region_via_egnatia: "重修的埃格纳提亚大道"
