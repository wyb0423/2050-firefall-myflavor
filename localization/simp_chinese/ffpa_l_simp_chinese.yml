 # 拜占庭西方整合单次事件
 ffpa_flavor.30.t: "地中海投资大会"
 ffpa_flavor.30.d: "复归诸省的数项大型工程已经竣工，实业家、工程师、银行家与港务官员齐聚新罗马。他们要求国家决定，哪一套制度将永久引导复归地中海的资本。"
 ffpa_flavor.30.review_d: "早先投资大会订立的临时信贷安排已经无法治理成熟的西方经济。旧日代表再次齐聚新罗马，为复归诸省确认一套永久投资体制。"
 ffpa_flavor.30.f: "铁路或许会在边界止步，资本与货物却不会。复归诸省必须成为同一片生产之海的一部分。"
 ffpa_flavor.30.a: "成立新罗马产业信贷总局。"
 ffpa_flavor.30.b: "以海路、铁轨和自由港联结诸省。"
 ffpa_flavor.30.c: "特许行省开发银行同盟。"

 ffpa_flavor.31.t: "西方行省总清丈"
 ffpa_flavor.31.d: "复归诸省保留着多个政权遗留下来的地契、市镇特权和税收惯例。法学家要求统一帝国簿册，市镇领袖维护协商税契，而参谋部则提议对外西方诸省进行军事测绘。"
 ffpa_flavor.31.review_d: "第一次西方清丈只是临时行政措施。随着委员会解散、行省记录再次分歧，帝国必须确认一套永久地籍制度。"
 ffpa_flavor.31.f: "只有产权、义务与公共收入都变得清晰可查，重建才能成为持久的治理。"
 ffpa_flavor.31.a: "一套尺，一本册，一部帝国地籍。"
 ffpa_flavor.31.b: "承认西方自治市的税务协定。"
 ffpa_flavor.31.c: "将外西方诸省交由帝国军事测绘局。"

 ffpa_flavor.32.t: "西方罗马公民权章程"
 ffpa_flavor.32.d: "罗马人共同体如今统治着意大利人、西班牙人、马耳他人、埃及人以及非洲沿岸诸族。元老院争论不休：罗马公民权究竟是普遍身份、城市与行省的契约，还是通过服务帝国取得的权利。"
 ffpa_flavor.32.review_d: "旧公民权章程仍然存在，但它的法律制度已经跟不上复归诸省。元老院重新开会，要把过去的原则落实为永久帝国安排。"
 ffpa_flavor.32.f: "只有当罗马被理解为诸民族共享的公共忠诚，而非某一种语言的私有遗产时，帝国才能长久。"
 ffpa_flavor.32.a: "罗马人之间不应再有行省之别。"
 ffpa_flavor.32.b: "以公民协定联结城市与行省。"
 ffpa_flavor.32.c: "以服务帝国换取公民权。"

 ffpa_flavor.33.t: "西方诸省代表"
 ffpa_flavor.33.d: "随着选举活动展开，复归诸省要求在帝国政治中获得稳定席位。改革派主张统一选民名册，行省领袖维护地域代表团，而保守显贵则要求由上院过滤西方的政治声音。"
 ffpa_flavor.33.review_d: "第一次西方代表制度只是选举妥协，并非长久宪制。诸省代表再次抵达新罗马，要求永久确认他们在帝国政治中的位置。"
 ffpa_flavor.33.f: "代表制度可以把遥远海岸系于新罗马，也可能教会每个行省如何与它讨价还价。"
 ffpa_flavor.33.a: "把所有公民登记在同一部帝国选民册中。"
 ffpa_flavor.33.b: "为西方诸省设置常驻代表团。"
 ffpa_flavor.33.c: "由皇室任命帝国元老院。"
 ffpa_flavor.33.c_republic: "把元老院交给西方名望家。"

 ffpa_western_integration_state_snapshot_tt: "永久行省奖励仅授予[GetPlayer.GetName]目前拥有的合格西方州；以后征服的州不会继承。"
 ffpa_outer_western_integration_state_snapshot_tt: "永久行省奖励仅授予目前拥有、且属于西部海路、西班牙、毛里塔尼亚和亚历山大—西奈工程范围的州；以后征服的州不会继承。"
 ffpa_byz_western_universal_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+75%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_provincial_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+50%地区整合速度，直至完成整合或失去该州。"
 ffpa_byz_western_service_incorporation_tt: "目前拥有或以后取得、且属于西方整合范围的所有未整合州获得+25%地区整合速度，直至完成整合或失去该州。"

 ffpa_byz_mediterranean_industrial_credit: "地中海工业信贷"
 ffpa_byz_mediterranean_industrial_credit_desc: "帝国担保在十年内把信贷引入制造业与熟练劳动力培养，但也增加行政负担。"
 ffpa_byz_mediterranean_port_rail_fund: "帝国港铁基金"
 ffpa_byz_mediterranean_port_rail_fund_desc: "统一基金加快基础设施建设与地中海贸易，同时推高建设计划的物资成本。"
 ffpa_byz_mediterranean_development_banks: "行省开发银行"
 ffpa_byz_mediterranean_development_banks_desc: "行省银行为建设、人口资质和迁徙提供资金，同时需要持续的官僚监督。"
 ffpa_byz_western_uniform_cadastre_state: "西方统一地籍"
 ffpa_byz_western_uniform_cadastre_state_desc: "全面清丈加强复归诸省的税收能力与专业行政。"
 ffpa_byz_western_uniform_cadastre_cost: "帝国清丈委员会"
 ffpa_byz_western_uniform_cadastre_cost_desc: "清丈委员会消耗行政资源，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_provincial_tax_state: "行省税务协定"
 ffpa_byz_western_provincial_tax_state_desc: "获承认的地方税收惯例在不强制统一簿册的情况下改善守法度并鼓励定居。"
 ffpa_byz_western_provincial_tax_compact: "与西方显贵的协定"
 ffpa_byz_western_provincial_tax_compact_desc: "皇室借助行省显贵与教会权威实施治理。"
 ffpa_byz_western_universal_citizenship: "普遍罗马公民权"
 ffpa_byz_western_universal_citizenship_desc: "罗马公民身份直接提高复归西方与非洲诸省主要民族的文化接纳度。"
 ffpa_byz_western_provincial_civic_compact: "西方行省公民协定"
 ffpa_byz_western_provincial_civic_compact_desc: "协商达成的章程提供广泛文化接纳，同时保留行省权威、人口流动与地方晋升渠道。"
 ffpa_byz_western_common_electoral_roll: "帝国统一选民名册"
 ffpa_byz_western_common_electoral_roll_desc: "统一选举权加强公民政治的正统性，同时触动地主特权。"
 ffpa_byz_western_provincial_delegations: "西方行省代表团"
 ffpa_byz_western_provincial_delegations_desc: "地域代表团让复归诸省在帝国政治中获得制度化发言权。"
 ffpa_byz_western_crown_senate: "皇室任命的西方元老院"
 ffpa_byz_western_crown_senate_desc: "由君主任命的西方元老院以自由派信心为代价，加强权威与正统性。"

 ffpa_byz_mediterranean_industrial_credit_v2: "新罗马产业信贷总局"
 ffpa_byz_mediterranean_industrial_credit_v2_desc: "帝国担保永久偏向大型制造业财团和资本家投资，也因此疏远土地精英。"
 ffpa_byz_mediterranean_port_rail_network_state_v2: "地中海港铁特许网"
 ffpa_byz_mediterranean_port_rail_network_state_v2_desc: "长期特许权把本复归行省纳入自由港、铁路和仓储设施组成的永久网络。"
 ffpa_byz_mediterranean_concessions_v2: "地中海商业特许权"
 ffpa_byz_mediterranean_concessions_v2_desc: "帝国让渡一部分直接权威，以换取私人资本建设西方交通网络。"
 ffpa_byz_mediterranean_development_banks_state_v2: "行省开发银行体系"
 ffpa_byz_mediterranean_development_banks_state_v2_desc: "地方银行和城市基金为本复归行省的资质培养、移民和商业机会提供支持。"
 ffpa_byz_mediterranean_banking_compact_v2: "行省开发银行同盟"
 ffpa_byz_mediterranean_banking_compact_v2_desc: "分散的银行同盟扩大了投资来源，也限制了大型全国财团的影响力。"

 ffpa_byz_western_uniform_cadastre_state_v2: "帝国统一地籍"
 ffpa_byz_western_uniform_cadastre_state_v2_desc: "统一的计量、产权记录和专业行政体系永久加强了帝国税基。"
 ffpa_byz_western_uniform_cadastre_burden_v2: "常设清丈委员会"
 ffpa_byz_western_uniform_cadastre_burden_v2_desc: "维护统一簿册持续消耗中央行政能力，并挑战根深蒂固的地主权力。"
 ffpa_byz_western_municipal_tax_compact_state_v2: "西方自治市税契"
 ffpa_byz_western_municipal_tax_compact_state_v2_desc: "得到承认的地方税收惯例改善守法度，也提高本行省对移民的吸引力。"
 ffpa_byz_western_municipal_vetoes_v2: "自治市财政特权"
 ffpa_byz_western_municipal_vetoes_v2_desc: "行省显贵以自身权威支持帝国，但他们的特权会拖慢全国立法。"
 ffpa_byz_western_military_survey_state_v2: "帝国军事测绘"
 ffpa_byz_western_military_survey_state_v2_desc: "军事工程师把道路、税册和补给地图整合为一套边疆基础设施。"
 ffpa_byz_western_military_survey_corps_v2: "西方测绘军团"
 ffpa_byz_western_military_survey_corps_v2_desc: "常设测绘与工程部队改善防御规划，同时增加军事补给开支。"

 ffpa_byz_western_universal_citizenship_v2: "罗马人不分行省"
 ffpa_byz_western_universal_citizenship_v2_desc: "普遍罗马公民身份带来最强的文化接纳与忠诚，同时削弱传统帝国权威。"
 ffpa_byz_western_provincial_civic_compact_v2: "城市与行省公民契约"
 ffpa_byz_western_provincial_civic_compact_v2_desc: "协商公民权承认西方诸族，却也使统一立法更加困难。"
 ffpa_byz_western_provincial_civic_compact_state_v2: "行省公民协定"
 ffpa_byz_western_provincial_civic_compact_state_v2_desc: "得到承认的共同体为迁移、教育和地方晋升提供长久渠道。"
 ffpa_byz_western_service_citizenship_v2: "服役即公民权"
 ffpa_byz_western_service_citizenship_v2_desc: "军事和公共服务打开了一条较窄的公民权道路，以更高物资成本换取经验丰富的部队。"
 ffpa_byz_western_veteran_settlement_state_v2: "退伍军人服役殖民地"
 ffpa_byz_western_veteran_settlement_state_v2_desc: "退伍军人与公共服务人员在本外西方行省获得土地和公民身份。"
 ffpa_byz_western_universal_incorporation_state_v1: "普遍罗马公民整合"
 ffpa_byz_western_universal_incorporation_state_v1_desc: "统一的罗马公民权正在加快本西方行省的法律与行政整合。"
