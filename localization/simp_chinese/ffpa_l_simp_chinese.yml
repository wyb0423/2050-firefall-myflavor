 je_ffpa_danube_thrace_corridor_reason: "协调保加利亚、多布罗加与北色雷斯的河港、铁路枢纽和税务机关，让既有行政体系按同一条走廊运转。实际纳入工程的州将保有更强的基础设施与财政触角。"
 je_ffpa_aegean_maritime_network: "爱琴海航运网络"
