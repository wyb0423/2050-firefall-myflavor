 # 东地中海利益集团意识形态
 ideology_ffpa_anatolian_reconstructionism: "安纳托利亚重建主义"
 ideology_ffpa_anatolian_reconstructionism_desc: "#lore 军队将严整的国家重建、边疆定居和一体化电网视为安纳托利亚重获安全的根基。#!"
 ideology_ffpa_tur_state_developmentalism: "国家开发主义"
 ideology_ffpa_tur_state_developmentalism_desc: "#lore 工业资本应当与有能力的国家合作，在保留私人企业的同时重建交通、电力与制造业。#!"
 ideology_ffpa_anatolian_civic_statism: "安纳托利亚市民国家主义"
 ideology_ffpa_anatolian_civic_statism_desc: "#lore 城市商贩、公务员与小业主支持秩序井然的公民国家、受保护的本土商业、受控移民和公共基础设施。#!"
 ideology_ffpa_provincial_compact: "行省契约主义"
 ideology_ffpa_provincial_compact_desc: "#lore 只要地方权威得到帝国协定的保障，地主与行省显贵便愿意接受现代行政和有限代表制度。#!"
 ideology_ffpa_ottoman_constitutionalism: "奥斯曼立宪主义"
 ideology_ffpa_ottoman_constitutionalism_desc: "#lore 多民族奥斯曼公民身份应由立宪君主制、代议机构、专业行政与公共教育共同维护。#!"
 ideology_ffpa_roman_restorationism: "罗马复归主义"
 ideology_ffpa_roman_restorationism_desc: "#lore 复兴的罗马军队肩负着重新统一并建设旧帝国空间的使命，以共同誓言和现代基础设施联结复归诸省。#!"
 ideology_ffpa_mediterranean_developmentalism: "地中海开发主义"
 ideology_ffpa_mediterranean_developmentalism_desc: "#lore 港口、工业、信贷与一体化电力系统必须把复归的地中海诸省建设成同一张生产网络。#!"
 ideology_ffpa_new_rome_civicism: "新罗马市民主义"
 ideology_ffpa_new_rome_civicism_desc: "#lore 市政官员、商人、职员与小业主把新罗马视为有序公民共同体的中心，并以商业和公共工程联结各地。#!"
 ideology_ffpa_imperial_symphonia: "皇权—教会协和论"
 ideology_ffpa_imperial_symphonia_desc: "#lore 教会与皇权应作为复兴罗马秩序中彼此有别的守护者共同合作，调和公共信仰、教育与帝国权威。#!"
 ideology_ffpa_rhomaic_civic_universalism: "罗马公民普遍主义"
 ideology_ffpa_rhomaic_civic_universalism_desc: "#lore 罗马身份是一种公共忠诚，而非血统或语言的私产；公民权、教育与代表制度必须把复归诸省联结起来。#!"

