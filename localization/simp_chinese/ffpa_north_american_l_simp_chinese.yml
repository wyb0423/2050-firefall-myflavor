 ffpa_usa_flavor.6.t: "再读旧宪章"
 ffpa_usa_flavor.6.d: "旧宪章留下了行政与议事机关相互约束的条文，也留下了停摆的记录。代表们需要决定，行政首脑应独立产生，还是取决于议事机构。\n\n#bold 现行制度#!：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]\n本次只拟定#bold 草案#!，签署前不改法。"
 ffpa_usa_flavor.6.f: "有人把缺失的页码写在封底，提醒抄录者这里还不能算一部完整的法典。"
 ffpa_usa_flavor.7.t: "公民与选票"
 ffpa_usa_flavor.7.d: "旧选举资料已被重新整理。谁能投票、如何确认资格，需要与准备采用的政体一同确定。\n\n#bold 现行制度#!：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]\n本次只拟定#bold 草案#!，签署前不改法。"
 ffpa_usa_flavor.7.f: "空白选票已经誊好，登记簿仍等着会议的决定。"
 ffpa_usa_flavor.8.t: "重建的经济章程"
 ffpa_usa_flavor.8.d: "工坊、农业组织与行政机关提出了不同的投资安排。政府应协调重建、放宽经营，还是先支持农业积累？\n\n#bold 现行制度#!：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]\n本次只拟定#bold 草案#!，签署前不改法。"
 ffpa_usa_flavor.8.f: "草案旁边摆着借据和订单，供代表核对每一条承诺由谁承担。"
 ffpa_usa_flavor.9.t: "宪章签署日"
 ffpa_usa_flavor.9.d: "三个章节已经合并。书记员逐项核对现行法律，等待最后的签字。\n\n#bold 签署前核对#!\n[GetLawGroup('lawgroup_governance_principles').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_governance_principles_name_v1')]#!\n\n[GetLawGroup('lawgroup_distribution_of_power').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_distribution_of_power_name_v1')]#!\n\n[GetLawGroup('lawgroup_economic_system').GetName]\n[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName] → #bold [ROOT.GetCountry.GetCustom('ffpa_usa_charter_economic_system_name_v1')]#!\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_charter_review_v1')]"
 ffpa_usa_flavor.9.f: "签名栏前留着最后一页校对表，列出这一次究竟改变了什么。"
 ffpa_usa_charter_apply_failed_tt: "上次签署未能落实全部所选法律。草案仍保留，尚未收取本次制度换轨代价；可在原期限内通过“整理建国宪章”重新核对并重试。"
 ffpa_usa_conference_next_tt: "记入本次制度安排；下一场会议至少间隔 #v 六个月#!。"
 ffpa_usa_conference_stability_tt: "四项制度安排议定后，合法性至少 #v 40#! 且官僚余额非负，连续保持 #v 十二个月#! 完成。失稳重算，无总期限。"
 ffpa_usa_conference_defer_tt: "保留已定安排。待会议间隔结束，可用日志按钮继续；延期本身没有费用。"
 ffpa_usa_charter_draft_tt: "只记录本组草案，#bold 不立即改法#!；一个月后可继续下一项。\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_sign_hover_tt: "$ffpa_usa_charter_sign_tt$\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_charter_defer_hover_tt: "保留草案，可在原窗口内继续；#yellow 不延长签署期限#!。\n\n$ffpa_usa_charter_window_tt$"
