l_simp_chinese:
 je_ffpa_na_local_recovery_v1: "州界之间"
 je_ffpa_na_local_recovery_v1_reason: "当前工程州：[ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]。方向：[ROOT.GetCountry.GetCustom('ffpa_na_local_route_name_v1')]。\n\n地方已经恢复了一些生计，但账簿上的收成与街市里的货物仍难以连成稳定的往来。农户需要加工和销路，作坊需要工具，运输者需要能够持续交付的货源。选择一处工程州，先让一种生产或集散能力可靠地运转。\n\n开工前可切换工程州；选择方向后固定目标。合格建筑合计至少3级、各自就业率至少60%，工程州市场接入至少80%，连续保持12个月即可完成。没有总期限；失去工程州取消未完成项目。"
 je_ffpa_na_local_recovery_v1_goal: "在选定州连续12个月维持合格生产与市场接入。"
 ffpa_na_local_next_state_button_v1: "考察下一处工程州"
 ffpa_na_local_next_state_button_v1_desc: "当前工程州：[ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]。开工前按人口排序轮换本土候选州，已获专精的州不再入选。"
 ffpa_na_local_choose_button_v1: "议定本地工程"
 ffpa_na_local_choose_button_v1_desc: "在[ROOT.GetCountry.GetCustom('ffpa_na_local_target_name_v1')]选择工程方向。只有具备现有设施或当前建造条件的方向可用。"
 ffpa_na_local_months_bar_v1: "连续达标月份"
 ffpa_na_local_months_bar_v1_desc: "累计12个月完成；条件跌破时归零。"
 ffpa_na_flavor.1.t: "镇公所里的地图"
 ffpa_na_flavor.1.d: "代表们把工程州的账册铺在地图旁边。农户希望处理积存的收成，工匠要求稳定的材料供应，运输者则希望货物能按约抵达。有限的人力需要先集中到一种能够维持下去的事业上。"
 ffpa_na_flavor.1.f: "地图的折痕已经发白，新画的路线仍只到邻近的集镇。"
 ffpa_na_flavor.1.1: "组织农产与加工：粮食农场、牧场、食品厂合计3级；完成后农业与食品业吞吐量永久＋5%。"
 ffpa_na_flavor.1.2: "恢复基础工业：工具、纺织、家具、玻璃、造纸、炼钢合计3级；完成后这些产业吞吐量永久＋5%。"
 ffpa_na_flavor.1.3: "组织交通集散：港口、铁路、城市中心合计3级；完成后基础设施吞吐量永久＋10%。"
 ffpa_na_flavor.1.defer: "先继续考察。"
 ffpa_na_flavor.2.t: "第一批订货"
 ffpa_na_flavor.2.d: "连续半年的生产与往来，使本地工程开始得到稳定的订单。负责公共设施的人希望先改善货运条件，地方生产者则希望把有限的支持投入下一批货物。代表们需要决定这一年的优先安排。"
 ffpa_na_flavor.2.f: "送到镇公所的清单上，开始出现相同的名字和下一次交付的日期。"
 ffpa_na_flavor.2.a: "优先公共设施：工程州基础设施吞吐量＋10%，持续一年。"
 ffpa_na_local_food_v1: "本地农产加工体系"
 ffpa_na_local_industry_v1: "本地工业协作"
 ffpa_na_local_transport_v1: "本地集散网络"
 ffpa_na_local_target_name_present_v1: "[ROOT.GetCountry.MakeScope.Var('ffpa_na_local_target_v1').GetState.GetName]"
 ffpa_na_local_target_name_missing_v1: "待重新选择"
 ffpa_na_local_route_food_name_v1: "农产与加工"
 ffpa_na_local_route_industry_name_v1: "基础工业"
 ffpa_na_local_route_transport_name_v1: "交通集散"
 ffpa_na_local_route_unselected_name_v1: "尚未开工"
 ffpa_na_flavor.2.b: "支持地方生产者：工程州农业与制造业吞吐量＋5%，持续一年。"
 ffpa_na_local_public_orders_v1: "本地公共设施订货"
 ffpa_na_local_producer_orders_v1: "本地生产者订货"
 je_ffpa_na_union_agenda_v1: "一个更大的共同体"
 je_ffpa_na_union_agenda_v1_reason: "关卡两边的账簿仍记录着相近的货物，地方官署却分别征税、检查证件、解释旧地图。商人希望形成共同市场，主张统一的代表要求共同政府；拥有现成税源和权力的人则有自己的保留。政府可以把其中一处近邻领土列为有限议程，但地图上的主张仍须由实际取得的领土支持。\n\n[ROOT.GetCountry.GetCustom('ffpa_na_union_status_text_v1')]\n\n每次登记一处目标的全部现有省份，期限十年。全部取得后结算，和平接收同样有效；战争或已参与的外交博弈中暂停结算。成功后一年可再议，撤回、超时或无法可靠追踪后冷却三年。接收方案给予实际接收州完整五年奖励。"
 je_ffpa_na_union_agenda_v1_goal: "完整取得登记目标，选择共同市场或共同政府接收方案。"
 ffpa_na_union_next_button_v1: "考察下一处近邻"
 ffpa_na_union_next_button_v1_desc: "优先本国已经持有部分领土的同州目标，再轮换相邻本土州。只考察非分权政权的领土；考察本身不授予宣称。"
 ffpa_na_union_propose_button_v1: "提出统一议程"
 ffpa_na_union_propose_button_v1_desc: "召开会议，确认当前目标。接受提案时登记其全部省份、开始十年期限，并在没有已有宣称时添加临时州宣称。"
 ffpa_na_union_withdraw_button_v1: "撤回当前议程"
 ffpa_na_union_withdraw_button_v1_desc: "放弃本轮结算并进入三年冷却，保留已取得领土。战争或外交博弈中先登记撤回，和平后收尾。"
 ffpa_na_union_status_candidate_v1: "当前考察：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_target_v1').GetState.GetName]。可提出议程，也可考察下一处。"
 ffpa_na_union_status_empty_v1: "尚无已选目标。可重新考察近邻；无合格目标时继续本地建设，分权地区仍按原生殖民规则处理。"
 ffpa_na_union_status_active_v1: "目标州区域：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName]。\n议程进行中。已取得登记省份：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_owned_v1').GetValue|0]／[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_total_v1').GetValue|0]。进度按月核对。"
 ffpa_na_union_status_expired_v1: "目标州区域：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName]。\n期限已到，等待战争与已参与的外交博弈结束后结算；不能启动新目标。"
 ffpa_na_union_status_withdraw_v1: "目标州区域：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName]。\n撤回请求已登记，等待和平后清理本轮议程。"
 ffpa_na_union_status_settlement_v1: "目标州区域：[ROOT.GetCountry.MakeScope.Var('ffpa_na_union_region_v1').GetStateRegion.GetName]。\n登记目标已取得，等待选择接收方案；确认时会再次核对所有权。"
 ffpa_na_union_status_cooldown_v1: "处于再议冷却。成功结算后一年、其他收尾后三年，再开放下一轮。"
 ffpa_na_flavor.3.t: "州界上的关卡"
 ffpa_na_flavor.3.d: "代表们带来货运清单与旧地图，要求把选定近邻纳入共同安排。商人首先谈及关卡，地方官员则询问税册、治安与任命权。提出统一议程，是政府对这片领土作出的政治主张；它尚不是两边已经达成的协议。"
 ffpa_na_flavor.3.f: "纸上的边界只需一笔，沿线每一处关卡都有自己的账簿。"
 ffpa_na_flavor.3.a: "将当前目标列入十年统一议程。"
 ffpa_na_flavor.3.b: "暂缓提案，继续本地建设。"
 ffpa_na_flavor.4.t: "新边界的账簿"
 ffpa_na_flavor.4.d: "议程中登记的领土已全部纳入本国。完成接收将给予全国威望＋10%、合法性＋5%，持续五年。新送来的税册与采购清单并不使用同一套格式，负责接收的官员也尚未对下一步取得一致。政府可以先打通共同市场，也可以先统一行政；接收州的原有居民与新纳入的人口都将受到这项安排影响。"
 ffpa_na_flavor.4.f: "地图已经归入同一册，账簿还需要逐页接起来。"
 ffpa_na_flavor.4.1: "接通共同市场：接收州建设效率＋25%、基础设施吞吐量＋20%、制造业吞吐量＋10%，五年。"
 ffpa_na_flavor.4.2: "建立共同政府：接收州税收能力＋25%、整合速度＋50%、动乱影响－25%，五年。"
 ffpa_na_flavor.5.t: "没有兑现的邀请"
 ffpa_na_flavor.5.d: "本轮统一议程已经结束，政府不再按原定安排推进接收。实际取得的土地仍保留在本国，启动前已有的宣称与能够识别的其他来源宣称也不会因这次收尾被撤销。代表们需要等待三年，才能提出下一项正式议程。"
 ffpa_na_flavor.5.f: "会议记录的最后一页留下了未完成的事项，而不是不存在的成果。"
 ffpa_na_flavor.5.a: "记录已有成果，结束本轮议程。"
 ffpa_na_union_dividend_v1: "共同疆界的红利"
 ffpa_na_union_market_v1: "共同市场接收方案"
 ffpa_na_union_government_v1: "共同政府接收方案"
 ai_strategy_ffpa_na_union_v1: "近邻统一议程"
 ai_strategy_ffpa_na_union_v1_desc: "优先争取当前议程登记的近邻领土。"

 je_ffpa_usa_federal_settlement_v1: "重新缔结联邦"
 je_ffpa_usa_federal_settlement_v1_reason: "美国的名字重新出现在公文上，各地的工程账册却仍沿用不同的规矩。地方共同体希望保留执行权，持有旧契据的人要求恢复信用，灾后迁入者则担心登记册把自己的劳动排除在外。政府需要逐项确定出资、产权、代表与监督的安排，使共同建设有一套能够持续执行的规则。\n\n#bold 当前议程#!：[ROOT.GetCountry.GetCustom('ffpa_usa_political_status_v1')]\n相邻会议至少间隔#bold 六个月#!；延期后可用日志按钮继续。四项选择完成后，合法性至少#bold 40#!、官僚余额非负，连续保持#bold 十二个月#!即可完成；失稳重算，无总期限。\n\n#bold 已定安排#!\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_works_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_titles_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_representation_name_v1')]\n[ROOT.GetCountry.GetCustom('ffpa_usa_political_oversight_name_v1')]"
 ffpa_usa_political_months_bar_v1: "制度稳定期"
 ffpa_usa_political_months_bar_v1_cmf_value: "$ffpa_usa_political_months_bar_v1$  [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12"
 ffpa_usa_political_months_bar_v1_cmf_tooltip: "四场选择完成后，合法性至少40且官僚余额非负的月份累计；任一条件不满足归零。当前：[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12。"
 ffpa_usa_political_convene_button_v1: "召集下一场会议"
 ffpa_usa_political_convene_button_v1_desc: "继续尚未解决的议题。距上次结算至少六个月，且没有等待答复的会议时可用；召集不收取费用。"
 ffpa_usa_political_defer_v1: "先让各方带回去讨论。"
 ffpa_usa_political_status_wait_v1: "等待会议答复。"
 ffpa_usa_political_status_cooldown_v1: "上次决定仍在落实；六个月间隔结束后继续。"
 ffpa_usa_political_status_deferred_v1: "会议已延期，可用下方按钮继续。"
 ffpa_usa_political_status_stable_v1: "四项安排已定，正在检验持续执行的条件。"
 ffpa_usa_political_status_ready_v1: "下一项议题可以召开。"
 ffpa_usa_flavor.1.t: "重新使用这个名字"
 ffpa_usa_flavor.1.d: "档案人员把不同版本的旧宪章与地方章程放在同一张桌上。各地都愿意在公文中使用美国的名字，对这个名字允许政府做什么，却有不同理解。工程拨款、产权登记和代表资格需要一项项谈定。"
 ffpa_usa_flavor.1.f: "封面上的鹰已经模糊，页边仍留着几代抄写者校订的笔迹。"
 ffpa_usa_flavor.1.a: "从共同承担的工程开始。"
 ffpa_usa_flavor.2.t: "联邦的工程款"
 ffpa_usa_flavor.2.d: "地方送来的工程清单包括仓库、工坊与运输设施。行政机关希望统一规格和拨款，地方代表则坚持由熟悉道路与劳力的人安排施工；同一笔预算，两种做法需要不同规模的官署。"
 ffpa_usa_flavor.2.f: "测量员把两张比例不同的地图摊平。道路在州界处没有接上。"
 ffpa_usa_flavor.2.1: "由全国机构组织工程。"
 ffpa_usa_flavor.2.2: "由地方共同出资与执行。"
 ffpa_usa_flavor.3.t: "两套产权凭据"
 ffpa_usa_flavor.3.d: "一份旧地契与一册灾后施工记录指向同一处产业。产权申请人认为可核验的旧凭据才能恢复长期信用，现有使用者则要求承认重建和维护所形成的权利。登记机关需要确定普遍适用的先后顺序。"
 ffpa_usa_flavor.3.f: "旧纸有水渍，新账有煤灰；两边都有人愿意作证。"
 ffpa_usa_flavor.3.1: "优先核验并恢复旧凭据。"
 ffpa_usa_flavor.3.2: "以灾后占有和建设事实重订登记。"
 ffpa_usa_flavor.4.t: "谁能坐在会场里"
 ffpa_usa_flavor.4.d: "地方共同体已经送来盖章的代表名单，迁入者的申请却散在不同机关。前者要求承认长期组织工程的资格，后者希望通过个人登记与申诉参加项目事务。会议需要一套便于执行、也能说明排除理由的办法。"
 ffpa_usa_flavor.4.f: "书记员留出了一列空白，等待填写代表资格的依据。"
 ffpa_usa_flavor.4.1: "以登记共同体的代表为基础。"
 ffpa_usa_flavor.4.2: "设立个人登记与申诉渠道。"
 ffpa_usa_flavor.5.t: "拨款与授权"
 ffpa_usa_flavor.5.d: "工程合同的签字页已经备齐，拨款被质疑时由谁复核，仍没有一致意见。常设审议能让每笔授权留下完整依据，行政机关则要求为紧急工程保留限期处置的余地。两种安排都需要写明责任。"
 ffpa_usa_flavor.5.f: "最后一页没有工程数量，只有签名的位置和复核的次序。"
 ffpa_usa_flavor.5.1: "由常设机构逐项审议。"
 ffpa_usa_flavor.5.2: "保留限期应急拨款授权。"
