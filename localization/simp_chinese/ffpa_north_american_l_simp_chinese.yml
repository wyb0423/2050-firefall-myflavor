 ffpa_usa_community_delegates_v1: "共同体代表制度"
 ffpa_usa_personal_register_v1: "个人登记与申诉"
 ffpa_usa_political_works_1_v1: "工程组织：全国组织"
 ffpa_usa_political_works_2_v1: "工程组织：地方执行"
 ffpa_usa_political_works_unset_v1: "工程组织：尚未议定"
 ffpa_usa_political_titles_1_v1: "产权登记：旧凭据优先"
 ffpa_usa_political_titles_2_v1: "产权登记：灾后建设优先"
 ffpa_usa_political_titles_unset_v1: "产权登记：尚未议定"
