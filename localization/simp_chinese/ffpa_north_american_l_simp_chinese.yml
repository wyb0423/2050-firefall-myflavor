 ffpa_usa_flavor.6.t: "再读旧宪章"
 ffpa_usa_flavor.6.d: "幸存档案保存了旧时代行政与议事机关相互约束的条文，也留下了争执与停摆的记录。代表们希望从中找到适合当下的安排：分别确立行政首脑，或让行政机关更直接地取决于议事机构。沿用现制的意见同样被列入草案。\n\n现行：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]。本次只选草案，不立即改法。\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.6.f: "有人把缺失的页码写在封底，提醒抄录者这里还不能算一部完整的法典。"
 ffpa_usa_flavor.7.t: "公民与选票"
 ffpa_usa_flavor.7.d: "旧选举资料中的名单、资格说明与投票规程被分开整理。几种方案对于谁能参加政治、如何确认资格有不同回答；草案必须与准备采用的政体相容，而不能只保留一个熟悉的名称。\n\n现行：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]。本次只选草案，不立即改法。\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.7.f: "空白选票已经誊好，登记簿仍等着会议的决定。"
 ffpa_usa_flavor.8.t: "重建的经济章程"
 ffpa_usa_flavor.8.d: "工坊经营者、地方农业组织与行政机关提出了不同的投资安排。有人要求政府协调重建，有人希望缩小干预，也有人主张先让农业共同体积累资本。经济章程必须能与现有土地、劳动和贸易法律一同执行。\n\n现行：[ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]。本次只选草案，不立即改法。\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.8.f: "草案旁边摆着借据和订单，供代表核对每一条承诺由谁承担。"
 ffpa_usa_flavor.9.t: "宪章签署日"
 ffpa_usa_flavor.9.d: "三个章节已经合并，书记员逐项对照现行法律。签字将使所选条文立即生效；涉及其他法律的矛盾须先解决，正在推进的普通立法也不能被这份文书挤开。\n[GetLawGroup('lawgroup_governance_principles').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_governance_principles_name_v1')]\n[GetLawGroup('lawgroup_distribution_of_power').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_distribution_of_power_name_v1')]\n[GetLawGroup('lawgroup_economic_system').GetName]: [ROOT.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName] → [ROOT.GetCountry.GetCustom('ffpa_usa_charter_economic_system_name_v1')]\n\n[ROOT.GetCountry.GetCustom('ffpa_usa_charter_review_v1')]\n\n$ffpa_usa_charter_sign_tt$\n\n$ffpa_usa_charter_window_tt$"
 ffpa_usa_flavor.9.f: "签名栏前留着最后一页校对表，列出这一次究竟改变了什么。"
