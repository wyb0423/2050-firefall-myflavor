 ffpa_usa_charter_button_v1: "整理建国宪章"
 ffpa_usa_charter_button_v1_desc: "申请或继续一次性的建国法律草案。五年窗口内分别选择治理原则、权力分配和经济体制，再统一确认；草案本身不改法。每次选择后间隔一个月继续，可延期。"
 ffpa_usa_charter_decision_v1: "$ffpa_usa_charter_button_v1$"
 ffpa_usa_charter_decision_v1_desc: "$ffpa_usa_charter_button_v1_desc$"
 ffpa_usa_charter_transition_v1: "制度换轨"
 ffpa_usa_charter_defer_v1: "暂缓，待准备妥当再议。"
 ffpa_usa_charter_keep_v1: "草案保留这一组现行法律。"
 ffpa_usa_charter_keep_all_v1: "维持全部现制，结束此次整理。"
 ffpa_usa_charter_edit_v1: "返回修改草案。"
 ffpa_usa_charter_sign_v1: "签署经校验的完整宪章。"
 ffpa_usa_charter_sign_tt: "只直接落实三组中实际改变的所选法律，豁免八部候选法律的科技门槛，不赠送科技。实际改法时一次施加24个月官僚产出 -5%；没有变更则不激活法律、不收取代价。"
 ffpa_usa_charter_no_enactment_tt: "须先结束当前普通立法；宪章不会取消或覆盖它。"
 ffpa_usa_charter_crownlands_tt: "改用共和制前须先处理直属王室领地关系，避免原生转换将其改为傀儡国。"
 ffpa_usa_charter_company_tt: "独立的特许公司政体不满足共和制的原生结构条件。"
 ffpa_usa_charter_structure_ok_v1: "目前未发现草案涉及的法律结构冲突。"
 ffpa_usa_charter_unchanged_tt: "三组现行法律均保持不变；可以无代价结束。"
 ffpa_usa_charter_ready_tt: "草案可以签署。"
 ffpa_usa_charter_window_tt: "通常须在首次开放后的五年内签署。若完整草案被普通立法阻挡至到期，则冻结草案，待该立法结束后保留一次三个月答复期；不可借此重开申请期。"
 ffpa_usa_charter_grace_tt: "原申请期已结束。当前仅能结算既有完整草案；本次立法结束后的三个月答复期不再延长。"
