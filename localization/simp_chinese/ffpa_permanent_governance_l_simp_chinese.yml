 je_group_ffpa_tur_permanent_governance:0 "无尽的治国之务"
 je_group_ffpa_byz_permanent_governance:0 "罗马人的公共体"

 je_ffpa_tur_imperial_registers_v1:0 "帝国簿册与行省中介"
 je_ffpa_tur_imperial_registers_v1_reason:0 "中央部会要用统一簿册调配税收与人力，行省官员却依靠地方中介，才能知道谁在耕作、谁已迁走。名册上的差异有时来自迟报，有时来自家族不愿让出的征收权；只凭首都的一纸格式，也无法让地方按时办事。\n\n政府必须让#bold 中央标准#!与#bold 行省实际#!相互核验。平衡值35—65是可长期维持的均衡区间；任一极端持续24个月都会造成治理失败。每月变化与两端危机计时分别列在进度和危机说明中。"
 je_ffpa_tur_imperial_registers_v1_status_low_extreme:0 "行省家族与地方中介已经把持簿册，低位极端的#n 失败计时正在推进#!。"
 je_ffpa_tur_imperial_registers_v1_status_local:0 "地方协约主导着帝国簿册。"
 je_ffpa_tur_imperial_registers_v1_status_provincial:0 "行省调解仍强于中央文官体系。"
 je_ffpa_tur_imperial_registers_v1_status_equilibrium:0 "簿册与中介处于#p 稳固均衡#!。"
 je_ffpa_tur_imperial_registers_v1_status_admin:0 "中央文官略占上风，却尚未排挤行省中介。"
 je_ffpa_tur_imperial_registers_v1_status_direct:0 "直接行政正在挤压行省中介。"
 je_ffpa_tur_imperial_registers_v1_status_high_extreme:0 "纸面国家的扩张已经超过地方执行能力，高位极端的#n 失败计时正在推进#!。"

 je_ffpa_tur_bread_and_capital_v1:0 "面包与首都"
 je_ffpa_tur_bread_and_capital_v1_reason:0 "首都的粮商按价格安排进货，运输部门按运力排班，政府却必须考虑下一次供应中断。沿用“帝国粮仓”之名的现代仓站、采购合同与紧急分配体系，只有在货物能够运达时才算可靠的#bold 战略储备#!。\n\n储备可以弥补一时的短缺，也会被持续的异常消耗。储备归零后，#bold 严重危机持续6个月或饥荒持续3个月#!即告失败；恢复正数储备会重置两项计时。日常供给与紧急调用之间，需要不断作出安排。"
 je_ffpa_tur_bread_and_capital_v1_status_secure:0 "#p 首都储备充足#!，能够支持完整的公共供给。"
 je_ffpa_tur_bread_and_capital_v1_status_serviceable:0 "储备尚可使用，但长期中断仍会将其耗尽。"
 je_ffpa_tur_bread_and_capital_v1_status_rationed:0 "储备已经吃紧，供给正在配给，且不再提供常驻收益。"
 je_ffpa_tur_bread_and_capital_v1_status_empty:0 "#n 储备已经归零#!；严重危机或饥荒会开始推进失败计时。"

 je_ffpa_byz_public_polity_v1:0 "罗马人的公共体"
 je_ffpa_byz_public_polity_v1_reason:0 "罗马的名号把不同地方联在一起，维系国家的仍是能够执行的法令、可获得的生活保障，以及居民愿意承认的公共机构。官员要求按统一程序办事，各省居民则关心这些程序能否回应自己的需要。#bold 公共权威、全国福祉与公共认同#!必须彼此支撑。\n\n持续恶化可能使警告转为破裂，已经破裂的承诺需要主动修复。三支柱全部破裂6个月，或两支柱破裂且另一支柱警告12个月，将造成#bold 公共体失败#!。维持一项完好的机关，不能代替另外两项未能兑现的责任。"
 je_ffpa_byz_public_polity_v1_status_intact:0 "公共体的#p 三个支柱均完好无损#!。"
 je_ffpa_byz_public_polity_v1_status_warning:0 "至少一个支柱已经进入警告；继续放任将使其破裂。"
 je_ffpa_byz_public_polity_v1_status_broken:0 "已有一个支柱破裂，需要主动修复。"
 je_ffpa_byz_public_polity_v1_status_crisis:0 "两个或更多支柱已经破裂，#n 公共体正逼近失败#!。"

 je_ffpa_byz_military_households_v1:0 "军役户与权门"
 je_ffpa_byz_military_households_v1_reason:0 "国防、边疆守备与重建工程把服役义务同土地联系起来，形成了新的#bold 军役户#!。军官、承包者和获地家族掌握着名册与地方资源，也由此成长为新的#bold 权门#!。这些从罗马史中寻回的称谓，如今指向的是现代国家必须理清的土地、财税与服役关系。\n\n#bold 权门压力不会自然下降#!，需要日常约束与三阶段改革共同缓解。压力达到100持续6个月，或至少90持续18个月且结算时仍有结构性来源，将导致失败。失败会取消未完工程，但保留已完成改革及已经落实的军制法律。"
 je_ffpa_byz_military_households_v1_status_contained:0 "军役户受到约束，仍在服务帝国的财税—军事秩序。"
 je_ffpa_byz_military_households_v1_status_present:0 "权门影响已经存在，但尚未盘根错节。"
 je_ffpa_byz_military_households_v1_status_entrenched:0 "权门已经在土地、税收与征募体系中扎根。"
 je_ffpa_byz_military_households_v1_status_ascendant:0 "权门势力正在上升，国家逐渐失去直接控制。"
 je_ffpa_byz_military_households_v1_status_dominant:0 "权门已经支配军役户，#n 失败计时正在推进#!。"
 je_ffpa_byz_military_households_v1_status_project:0 "一项制度改革工程正在进行；国家违约会暂停其进度。"

 ffpa_tur_register_balance_bar_v1:0 "簿册—中介平衡"
 ffpa_tur_register_balance_bar_v1_desc:0 "0代表地方把持，100代表纸面集权，35—65是最安全的区间。"
 ffpa_tur_register_balance_bar_v1_second_desc:0 "两个极端区间分别推进各自的24个月失败计时。"
 ffpa_tur_capital_reserve_bar_v1:0 "首都供应储备"
 ffpa_tur_capital_reserve_bar_v1_desc:0 "用于抵御谷物、运输、电力和市场接入异常的缓冲。"
 ffpa_tur_capital_reserve_bar_v1_second_desc:0 "只有储备为0且相应危机仍在持续时，失败计时才会推进。"
 ffpa_byz_public_law_pillar_bar_v1:0 "公共权威"
 ffpa_byz_public_law_pillar_bar_v1_desc:0 "合法性、官僚余量与偿付能力。"
 ffpa_byz_public_welfare_pillar_bar_v1:0 "全国福祉"
 ffpa_byz_public_welfare_pillar_bar_v1_desc:0 "全国生活水平、已整合地区的市场接入与发生饥荒的州占比。"
 ffpa_byz_public_recognition_pillar_bar_v1:0 "公共认同"
 ffpa_byz_public_recognition_pillar_bar_v1_desc:0 "国内和平、政治运动激进度与已整合地区动乱。"
 ffpa_byz_public_pillar_bar_v1_second_desc:0 "0：完好；1：警告；2：破裂；3：修复中。"
 ffpa_byz_dynatoi_pressure_bar_v1:0 "权门压力"
 ffpa_byz_dynatoi_pressure_bar_v1_desc:0 "来自军役户、土地权势与财税特权的结构性压力。"
 ffpa_byz_dynatoi_pressure_bar_v1_second_desc:0 "压力不会自然降低；需要使用控制手段并完成制度改革。"

 ffpa_tur_register_audit_button_v1:0 "核查帝国簿册"
 ffpa_tur_register_audit_button_v1_desc:0 "平衡值向直接行政移动+10。\n\n冷却：#v 12个月#!。"
 ffpa_tur_register_provincial_roll_button_v1:0 "承认行省名册"
 ffpa_tur_register_provincial_roll_button_v1_desc:0 "平衡值向行省调解移动-10。\n\n冷却：#v 12个月#!。"
 ffpa_tur_register_dual_ledgers_button_v1:0 "对勘双重账册"
 ffpa_tur_register_dual_ledgers_button_v1_desc:0 "向50移动最多15点；若已在均衡区间则直接调整为50。\n\n冷却：#v 24个月#!；处于任一极端时可强制提前使用一次，代价翻倍。"
 ffpa_tur_capital_purchase_button_v1:0 "紧急购粮"
 ffpa_tur_capital_purchase_button_v1_desc:0 "增加15储备并重置失败计时。\n\n冷却：#v 6个月#!。"
 ffpa_tur_capital_granary_button_v1:0 "开放帝国粮仓"
 ffpa_tur_capital_granary_button_v1_desc:0 "从现代国家储备中释放15点储备，换取持续2年的福利与死亡率缓解。\n\n冷却：#v 6个月#!。"
 ffpa_tur_capital_ration_button_v1:0 "实施紧急配给"
 ffpa_tur_capital_ration_button_v1_desc:0 "增加25储备并重置失败计时，同时付出权威、生活水平与政治代价。\n\n冷却：#v 12个月#!；严重危机中可额外承担财政代价强制提前使用一次。"
 ffpa_byz_public_new_decree_button_v1:0 "颁布新敕令"
 ffpa_byz_public_new_decree_button_v1_desc:0 "清除公共权威警告并保护6个月，或使破裂的公共权威支柱进入修复。\n\n冷却：#v 6个月#!；破裂时可强制提前使用一次，代价翻倍。只有三个支柱都健康并持续6个月，修复才会完成。"
 ffpa_byz_public_benefaction_button_v1:0 "组织全国施惠"
 ffpa_byz_public_benefaction_button_v1_desc:0 "清除福祉警告并保护6个月，或开始修复破裂的福祉支柱。\n\n冷却：#v 6个月#!；破裂时可强制提前使用一次，代价翻倍。"
 ffpa_byz_public_representation_button_v1:0 "召集各界代表"
 ffpa_byz_public_representation_button_v1_desc:0 "清除公共认同警告并保护6个月，或开始修复破裂的公共认同支柱。\n\n冷却：#v 6个月#!；破裂时可强制提前使用一次，代价翻倍。"
 ffpa_byz_dynatoi_audit_button_v1:0 "核查官署与军籍"
 ffpa_byz_dynatoi_audit_button_v1_desc:0 "降低8点权门压力。\n\n冷却：#v 18个月#!。"
 ffpa_byz_dynatoi_redemption_button_v1:0 "赎回村社义务"
 ffpa_byz_dynatoi_redemption_button_v1_desc:0 "以财政和地主政治代价降低10点权门压力。\n\n冷却：#v 12个月#!，国家违约时不可用。"
 ffpa_byz_dynatoi_allelengyon_button_v1:0 "征收连带税"
 ffpa_byz_dynatoi_allelengyon_button_v1_desc:0 "权门压力不低于70时，以非常连带税降低18点压力。\n\n冷却：#v 24个月#!；压力不低于90时可强制提前使用一次，代价翻倍。"
 ffpa_byz_military_register_reform_button_v1:0 "重编帝国军役户籍"
 ffpa_byz_military_register_reform_button_v1_desc:0 "立即选择落实职业军队或大规模征兵，承担5年转轨代价，并启动一项12个月工程；若选择推迟，此入口会关闭3个月。"
 ffpa_byz_land_tenure_reform_button_v1:0 "清丈田产与军役"
 ffpa_byz_land_tenure_reform_button_v1_desc:0 "启动第二阶段的18个月改革工程；完成后将佃农制或农奴制带来的压力减半，并立即降低20点压力。\n\n国家违约会暂停工程，每次改革后有3年疲劳期。"
 ffpa_byz_supply_veterans_reform_button_v1:0 "设立帝国军需与退伍安置院"
 ffpa_byz_supply_veterans_reform_button_v1_desc:0 "启动最终的24个月改革。完成后降低25点压力，并永久使全国福利金提高10%。\n\n国家违约会暂停工程，且启动时必须拥有正数黄金储备。"

 ffpa_tur_flavor.90.t:0 "行省各有其册"
 ffpa_tur_flavor.90.d:0 "中央名册仍有各省的印章，税吏与征募官却越来越依赖地方家族提供的名单。谁应纳税、谁可免役，往往先由中介决定，官署只能接受已经谈妥的结果。政府必须承担重新取得行政实权的代价。"
 ffpa_tur_flavor.90.f:0 "征募官问起一户未登记的住民，中介没有翻册子：“这家人的事情，先同我谈。”"
 ffpa_tur_flavor.90.a:0 "承担重新取得行省行政实权的代价。"
 ffpa_tur_flavor.91.t:0 "纸上的帝国"
 ffpa_tur_flavor.91.d:0 "各省呈报已经使用相同的表格，实地办事却更加迟缓。地方官员等待中央批复，中央部会又要求补齐地方尚无力提供的记录。统一的手续已经超过执行能力，政府需要为这场纸面集权承担后果。"
 ffpa_tur_flavor.91.f:0 "车站仍在等修理许可，来回传递的申请已经填满三个卷宗。最后一次批注只有一行：请按新式表格重报。"
 ffpa_tur_flavor.91.a:0 "承担恢复地方执行能力的代价。"
 ffpa_tur_flavor.92.t:0 "首都粮仓告罄"
 ffpa_tur_flavor.92.d:0 "首都的战略储备已经耗尽，严重的供应困难仍未解除。采购机关无法再靠调拨存粮维持原有安排，居民对下一批供应的疑虑也开始转向政府本身。这次失败留下的财政与社会代价，将持续到眼前短缺之后。"
 ffpa_tur_flavor.92.f:0 "仓站门口的人群等到交班，负责人却仍给不出下一车粮食抵达的时间。"
 ffpa_tur_flavor.92.a:0 "首都不会忘记这次失败。"

 ffpa_flavor.50.t:0 "公共体的断裂"
 ffpa_flavor.50.d:0 "中央官署尚能维持运转，全国福祉与公共认同的承诺却已经破裂。地方代表带来的不只是新的请求，还有过去迟迟未获回应的事项。政府必须承担失信的后果，并从仍存的公共权威着手修复另外两项支柱。"
 ffpa_flavor.50.f:0 "“这份申请已经获准了。”办事员说。来人把文件收回：“我知道。我来问什么时候能够办成。”"
 ffpa_flavor.50.a:0 "承认后果，着手修复失信的承诺。"
 ffpa_flavor.51.t:0 "重编帝国军役户籍"
 ffpa_flavor.51.d:0 "民兵登记、边疆守备、退伍安置与公共工程义务使用着不同的名册。政府需要先确定职业常备军或大规模征兵的军制，再用一年时间核对人口、土地与军役义务。新的军籍将决定，这些既有责任由谁接续。"
 ffpa_flavor.51.f:0 "招募官拿来的是服役名单，地方官拿来的是土地簿。两人都要求先说明，第三本新册究竟由谁负责。"
 ffpa_flavor.51.a:0 "登记一支职业常备军。"
 ffpa_flavor.51.b:0 "登记全民大规模征兵。"
 ffpa_flavor.51.c:0 "将重编推迟三个月。"
 ffpa_flavor.52.t:0 "权门和议"
 ffpa_flavor.52.d:0 "掌握土地与服役网络的权门，已经成为常规核查无法约束的力量。政府可以承认一份土地权门协约，也可以尝试没收其特权；两种决定都会留下持续数年的财政与政治后果。"
 ffpa_flavor.52.f:0 "代表们同意继续承担公共义务，却要求在每一项义务后面，写明由谁核定、向谁缴付。"
 ffpa_flavor.52.a:0 "承认与大户的协约。"
 ffpa_flavor.52.b:0 "没收其特权，并承受决裂。"

