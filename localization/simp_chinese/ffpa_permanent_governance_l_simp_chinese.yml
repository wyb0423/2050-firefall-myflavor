 je_group_ffpa_byz_permanent_governance:0 "罗马人的公共体"

 je_ffpa_tur_imperial_registers_v1:0 "帝国簿册与行省中介"
 je_ffpa_tur_imperial_registers_v1_reason:0 "重建后的国家同时继承了中央部会的旧档案、规划表格，也继承了行省名册、市政记录，以及中央失灵时由地方中介保存的实际知识。国家既不能删除这些中介，也不能把统一表格等同于真实治理；它必须不断对勘中央能够标准化的记录与行省机构真正能够执行的秩序。\n\n平衡值每月从0点的地方把持向100点的纸面集权移动。官僚余量不为负时+0.25，否则-0.50；合法性不低于60时+0.25，低于40时-0.25，40—59不产生变化；国家违约时-0.50，未违约只避免该项负值；首都市场接入不低于85%时+0.25，否则-0.25。月度总变化限制在-1.00至+0.75，35—65是可长期维持的均衡区间。连续24个月处于0—9或90—100将触发对应失败；每离开该侧极端一个月，其失败计时便倒退3个月。"
 je_ffpa_tur_imperial_registers_v1_status_low_extreme:0 "行省家族与地方中介已经把持簿册，低位极端的失败计时正在推进。"
 je_ffpa_tur_imperial_registers_v1_status_local:0 "地方协约主导着帝国簿册。"
 je_ffpa_tur_imperial_registers_v1_status_provincial:0 "行省调解仍强于中央文官体系。"
 je_ffpa_tur_imperial_registers_v1_status_equilibrium:0 "簿册与中介处于稳固均衡。"
 je_ffpa_tur_imperial_registers_v1_status_admin:0 "中央文官略占上风，却尚未排挤行省中介。"
 je_ffpa_tur_imperial_registers_v1_status_direct:0 "直接行政正在挤压行省中介。"
 je_ffpa_tur_imperial_registers_v1_status_high_extreme:0 "纸面国家的扩张已经超过地方执行能力，高位极端的失败计时正在推进。"

 je_ffpa_tur_bread_and_capital_v1:0 "面包与首都"
 je_ffpa_tur_bread_and_capital_v1_reason:0 "大火后的供应崩溃，使历代重建政府都为首都维持战略粮食、运输与能源储备。“帝国粮仓”只是这套现代储备仓站、采购合同、运输优先权与紧急分配体系沿用的历史称谓。\n\n首都储备每月依据四项供应异常变化：全国市场谷物价格高于基础价25%；首都运输价格高于基础价25%；首都电力价格高于基础价25%；或首都市场接入度低于85%。当异常数为0、1、2、3、4时，储备分别变化+3、+1、-2、-5、-8；首都发生饥荒时额外-10。严重危机指首都饥荒、市场接入度低于60%、谷物高于基础价50%且首都运输或电力也高于50%，或四项异常同时存在。储备为0时，严重危机持续6个月或饥荒持续3个月即告失败；只要储备恢复为正，两项计时都会重置。"
 je_ffpa_tur_bread_and_capital_v1_status_secure:0 "首都储备充足，能够支持完整的公共供给。"
 je_ffpa_tur_bread_and_capital_v1_status_serviceable:0 "储备尚可使用，但长期中断仍会将其耗尽。"
 je_ffpa_tur_bread_and_capital_v1_status_rationed:0 "储备已经吃紧，供给正在配给，且不再提供常驻收益。"
 je_ffpa_tur_bread_and_capital_v1_status_empty:0 "储备已经归零；严重危机或饥荒会开始推进失败计时。"

 je_ffpa_byz_public_polity_v1:0 "罗马人的公共体"
 je_ffpa_byz_public_polity_v1_reason:0 "在一个被大火割裂、又以罗马名号重新拼合的社会里，仅凭国号无法维持公共体。国家机关必须证明自己拥有发布并落实规则的公共权威，已整合各省必须共享基本福祉与市场网络，公民也必须继续承认共同国家，而不只是服从军队或地方权力。\n\n公共权威、全国福祉与公共认同是三个相互独立的支柱。每个支柱的三项检验中若有两项不合格便进入警告，并在这种状态持续12个月后破裂；三项全部不合格则只需6个月便会破裂。公共权威检验合法性不低于55、官僚余量不为负和国家未违约。全国福祉检验平均生活水平不低于每五年只会上调的基准减1、至少80%的已整合州拥有85%市场接入，以及发生饥荒的已整合州不超过5%。公共认同检验无内战或叛乱性政治运动、没有激进度达到65的政治运动，以及动乱不低于25%的已整合州不超过15%。三个支柱全部破裂6个月，或两个支柱破裂且最后一个处于警告12个月，将导致日志失败。"
 je_ffpa_byz_public_polity_v1_status_intact:0 "公共体的三个支柱均完好无损。"
 je_ffpa_byz_public_polity_v1_status_warning:0 "至少一个支柱已经进入警告；继续放任将使其破裂。"
 je_ffpa_byz_public_polity_v1_status_broken:0 "已有一个支柱破裂，需要主动修复。"
 je_ffpa_byz_public_polity_v1_status_crisis:0 "两个或更多支柱已经破裂，公共体正逼近失败。"

 je_ffpa_byz_military_households_v1:0 "军役户与权门"
 je_ffpa_byz_military_households_v1_reason:0 "复归战争把整编民兵、边疆守备、退伍安置、运输测绘与公共工程服役同土地绑定，形成了新的军役户。军官、承包者和获地家族也借此积累财税与征募权；帝国用从罗马史中寻回的“军役户”与“权门”称呼这些现代结构，并不意味着中世纪制度从未中断。\n\n权门压力不会自然下降。改革前，未重编的军役户籍每月+0.25；强势地主+0.50，第三阶段改革后降为+0.25；佃农制+0.50或农奴制+1.00，第二阶段改革后分别降为+0.25或+0.50；农民征召在第一阶段改革前+0.50；税收特权在第三阶段改革前+0.25；统一地籍可抵消0.25。压力在100维持6个月，或压力不低于90且仍有结构性来源持续18个月，将导致失败。已经完成的改革以及已经立即落实的军制法律会在失败后保留，只有未完成的工程会被取消。"
 je_ffpa_byz_military_households_v1_status_contained:0 "军役户受到约束，仍在服务帝国的财税—军事秩序。"
 je_ffpa_byz_military_households_v1_status_present:0 "权门影响已经存在，但尚未盘根错节。"
 je_ffpa_byz_military_households_v1_status_entrenched:0 "权门已经在土地、税收与征募体系中扎根。"
 je_ffpa_byz_military_households_v1_status_ascendant:0 "权门势力正在上升，国家逐渐失去直接控制。"
 je_ffpa_byz_military_households_v1_status_dominant:0 "权门已经支配军役户，失败计时正在推进。"
 je_ffpa_byz_military_households_v1_status_project:0 "一项制度改革工程正在进行；国家违约会暂停其进度。"

 ffpa_tur_register_balance_bar_v1:0 "簿册—中介平衡"
 ffpa_tur_register_balance_bar_v1_desc:0 "0代表地方把持，100代表纸面集权，35—65是最安全的区间。"
 ffpa_tur_register_balance_bar_v1_second_desc:0 "两个极端区间分别推进各自的24个月失败计时。"
 ffpa_tur_capital_reserve_bar_v1:0 "首都供应储备"
 ffpa_tur_capital_reserve_bar_v1_desc:0 "用于抵御谷物、运输、电力和市场接入异常的缓冲。"
 ffpa_tur_capital_reserve_bar_v1_second_desc:0 "只有储备为0且相应危机仍在持续时，失败计时才会推进。"
 ffpa_byz_public_law_pillar_bar_v1:0 "公共权威"
 ffpa_byz_public_law_pillar_bar_v1_desc:0 "合法性、官僚余量与偿付能力。"
 ffpa_byz_public_welfare_pillar_bar_v1:0 "全国福祉"
 ffpa_byz_public_welfare_pillar_bar_v1_desc:0 "全国生活水平、已整合地区的市场接入与发生饥荒的州占比。"
 ffpa_byz_public_recognition_pillar_bar_v1:0 "公共认同"
 ffpa_byz_public_recognition_pillar_bar_v1_desc:0 "国内和平、政治运动激进度与已整合地区动乱。"
 ffpa_byz_public_pillar_bar_v1_second_desc:0 "0：完好；1：警告；2：破裂；3：修复中。"
 ffpa_byz_dynatoi_pressure_bar_v1:0 "权门压力"
 ffpa_byz_dynatoi_pressure_bar_v1_desc:0 "来自军役户、土地权势与财税特权的结构性压力。"
 ffpa_byz_dynatoi_pressure_bar_v1_second_desc:0 "压力不会自然降低；需要使用控制手段并完成制度改革。"

 ffpa_tur_register_audit_button_v1:0 "核查帝国簿册"
 ffpa_tur_register_audit_button_v1_desc:0 "平衡值向直接行政移动+10。冷却12个月。"
 ffpa_tur_register_provincial_roll_button_v1:0 "承认行省名册"
 ffpa_tur_register_provincial_roll_button_v1_desc:0 "平衡值向行省调解移动-10。冷却12个月。"
 ffpa_tur_register_dual_ledgers_button_v1:0 "对勘双重账册"
 ffpa_tur_register_dual_ledgers_button_v1_desc:0 "向50移动最多15点；若已在均衡区间则直接调整为50。冷却24个月；处于任一极端时可强制提前使用一次，代价翻倍。"
 ffpa_tur_capital_purchase_button_v1:0 "紧急购粮"
 ffpa_tur_capital_purchase_button_v1_desc:0 "增加15储备并重置失败计时。冷却6个月。"
 ffpa_tur_capital_granary_button_v1:0 "开放帝国粮仓"
 ffpa_tur_capital_granary_button_v1_desc:0 "从现代国家储备中释放15点储备，换取持续2年的福利与死亡率缓解。冷却6个月。"
 ffpa_tur_capital_ration_button_v1:0 "实施紧急配给"
 ffpa_tur_capital_ration_button_v1_desc:0 "增加25储备并重置失败计时，同时付出权威、生活水平与政治代价。冷却12个月；严重危机中可额外承担财政代价强制提前使用一次。"
 ffpa_byz_public_new_decree_button_v1:0 "颁布新敕令"
 ffpa_byz_public_new_decree_button_v1_desc:0 "清除公共权威警告并保护6个月，或使破裂的公共权威支柱进入修复。冷却6个月；破裂时可强制提前使用一次，代价翻倍。只有三个支柱都健康并持续6个月，修复才会完成。"
 ffpa_byz_public_benefaction_button_v1:0 "组织全国施惠"
 ffpa_byz_public_benefaction_button_v1_desc:0 "清除福祉警告并保护6个月，或开始修复破裂的福祉支柱。冷却6个月；破裂时可强制提前使用一次，代价翻倍。"
 ffpa_byz_public_representation_button_v1:0 "召集各界代表"
 ffpa_byz_public_representation_button_v1_desc:0 "清除公共认同警告并保护6个月，或开始修复破裂的公共认同支柱。冷却6个月；破裂时可强制提前使用一次，代价翻倍。"
 ffpa_byz_dynatoi_audit_button_v1:0 "核查宫廷与军籍"
 ffpa_byz_dynatoi_audit_button_v1_desc:0 "降低8点权门压力。冷却18个月。"
 ffpa_byz_dynatoi_redemption_button_v1:0 "赎回村社义务"
 ffpa_byz_dynatoi_redemption_button_v1_desc:0 "以财政和地主政治代价降低10点权门压力。冷却12个月，国家违约时不可用。"
 ffpa_byz_dynatoi_allelengyon_button_v1:0 "征收连带税"
 ffpa_byz_dynatoi_allelengyon_button_v1_desc:0 "权门压力不低于70时，以非常连带税降低18点压力。冷却24个月；压力不低于90时可强制提前使用一次，代价翻倍。"
 ffpa_byz_military_register_reform_button_v1:0 "重编帝国军役户籍"
 ffpa_byz_military_register_reform_button_v1_desc:0 "立即选择落实职业军队或大规模征兵，承担5年转轨代价，并启动一项12个月工程；若选择推迟，此入口会关闭3个月。"
 ffpa_byz_land_tenure_reform_button_v1:0 "清丈田产与军役"
 ffpa_byz_land_tenure_reform_button_v1_desc:0 "启动第二阶段的18个月改革工程；完成后将佃农制或农奴制带来的压力减半，并立即降低20点压力。国家违约会暂停工程，每次改革后有3年疲劳期。"
 ffpa_byz_supply_veterans_reform_button_v1:0 "设立帝国军需与退伍安置院"
 ffpa_byz_supply_veterans_reform_button_v1_desc:0 "启动最终的24个月改革。完成后降低25点压力，并永久使全国福利金提高10%。国家违约会暂停工程，且启动时必须拥有正数黄金储备。"

 ffpa_tur_flavor.90.t:0 "行省各有其册"
 ffpa_tur_flavor.90.d:0 "帝国簿册已经沦为行省家族既成交易上的一枚印章。税吏、征募官与法官不得不和中央既无法替代、也不能彻底监督的中介谈判。"
 ffpa_tur_flavor.90.f:0 "若簿册只能记下显贵允许它记下的事，它便不是帝国的簿册。"
 ffpa_tur_flavor.90.a:0 "承担重新取得行省行政实权的代价。"
 ffpa_tur_flavor.91.t:0 "纸上的帝国"
 ffpa_tur_flavor.91.d:0 "敕令增长得比官员、道路和行省共识所能承载的速度更快。中央文官把表格统一错当成了治理统一，使行省行政变得僵硬而迟钝。"
 ffpa_tur_flavor.91.f:0 "纸面上每个地区都已服从，现实中却远非如此。"
 ffpa_tur_flavor.91.a:0 "重建从敕令通往实践的链条。"
 ffpa_tur_flavor.92.t:0 "首都粮仓告罄"
 ffpa_tur_flavor.92.d:0 "这套源于大火后共同饥饿记忆的首都战略储备，已经在严重中断中彻底消失。队伍、投机和官方征用把一次供应失败变成了信任危机，其余波将远比眼前的短缺长久。"
 ffpa_tur_flavor.92.f:0 "面包的价格成了衡量国家诺言的尺度。"
 ffpa_tur_flavor.92.a:0 "首都不会忘记这次失败。"

 ffpa_flavor.50.t:0 "公共体的断裂"
 ffpa_flavor.50.d:0 "公共权威、福祉与公共认同不再彼此支撑。官署仍在运转，敕令仍会宣读，但公民越来越面对三项彼此脱节、也无法替彼此担保的公共承诺。"
 ffpa_flavor.50.f:0 "共同体不仅是权力的名称，也是人们相信公共事物能够延续的习惯。"
 ffpa_flavor.50.a:0 "以仍存的公共权威和两项破裂的承诺重新开始。"
 ffpa_flavor.51.t:0 "重编帝国军役户籍"
 ffpa_flavor.51.d:0 "复归战争留下了彼此不兼容的民兵名册、退伍安置、边疆服役授地与公共工程义务。新的帝国军役户籍必须立即规定由谁执兵，随后文官才能用一年时间重新核对人口、土地与军役义务。"
 ffpa_flavor.51.f:0 "首先要决定，这部簿册究竟要统计怎样的军队。"
 ffpa_flavor.51.a:0 "登记一支职业常备军。"
 ffpa_flavor.51.b:0 "登记全民大规模征兵。"
 ffpa_flavor.51.c:0 "将重编推迟三个月。"
 ffpa_flavor.52.t:0 "权门和议"
 ffpa_flavor.52.d:0 "复归服役催生的军役户与新权门，已经成长为常规手段无法约束的权力。宫廷必须承认一份土地权门协约，或尝试没收其特权，并承受持续数年的财政与政治震荡。"
 ffpa_flavor.52.f:0 "问题已不再是大户是否承担公共负担，而是依照谁的条件承担。"
 ffpa_flavor.52.a:0 "承认与大户的协约。"
 ffpa_flavor.52.b:0 "没收其特权，并承受决裂。"

