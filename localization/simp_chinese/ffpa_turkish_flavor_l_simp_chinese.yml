l_simp_chinese:
 je_group_ffpa_turkish_reconstruction: "土耳其重建"

 ffpa_tur_confirm_reconstruction_legacy: "确认重建时代的国家遗产"
 ffpa_tur_confirm_reconstruction_legacy_desc: "旧档案只证明安纳托利亚已经完成重建，却没有留下新国家究竟遵循哪一种建国方案。打开幸存的奠基文件，明确记录这段遗产，而不要根据今天的政体猜测过去。"

 je_ffpa_tur_charter_of_the_porte: "高门宪章"
 je_ffpa_tur_charter_of_the_porte_reason: "奥斯曼共同体已经使共同政治身份成为可能。现在必须决定主权归于何处、各行省如何参与政府，以及幸存的宗教慈善基金应向社群还是国家负责。完成三场宪制辩论，维持君主制、至少#v 60#!合法性和非负官僚余量，在没有叛乱运动的和平状态下，使#v 8#!个重建核心州保持至少#v 75%#!市场准入和低于#v 18%#!动乱。"
 je_ffpa_tur_second_foundation_of_ankara: "安卡拉的第二次建国"
 je_ffpa_tur_second_foundation_of_ankara_reason: "从废墟中建立的共和国不能永远依靠紧急法令。完成关于国民议会、国民教育和文武关系的辩论；维持非君主政体和有效选举权、至少#v 60#!合法性、非负官僚余量、#v 30%#!识字率及和平，并让#v 8#!个重建核心州保持稳定的市场连接。"
 je_ffpa_tur_reconstruction_directorate: "安纳托利亚重建总署"
 je_ffpa_tur_reconstruction_directorate_reason: "测绘员、工程师、教师和供应官坚持，能够运转的档案与基础设施必须先于宪法理论。完成地籍、工业和技术服务三场辩论；维持至少#v 50#!合法性、#v 100#!可用官僚和#v 25%#!识字率，并让#v 6#!个重建核心州拥有至少#v 2#!级铁路与政府行政机构。"
 je_ffpa_tur_black_sea_lifeline: "黑海生命线"
 je_ffpa_tur_black_sea_lifeline_reason: "将卡斯塔莫努和特拉布宗建设为重建安纳托利亚的北方补给线。两州都需要可靠市场准入与稳定；卡斯塔莫努需要#v 2#!级港口和电厂、#v 3#!级铁路，特拉布宗则需要#v 4#!级港口、#v 3#!级铁路与#v 2#!级电厂。"
 je_ffpa_tur_eastern_highlands_survey: "东部高原测绘"
 je_ffpa_tur_eastern_highlands_survey_reason: "埃尔祖鲁姆和卡尔斯的道路、冬季仓站、土地登记与电网必须协同重建。稳定两州、降低荒废度，并建成足以全年治理高原的铁路、电力与行政网络。"
 je_ffpa_tur_cukurova_euphrates_works: "丘库罗瓦—幼发拉底工程"
 je_ffpa_tur_cukurova_euphrates_works_reason: "把阿达纳和迪亚巴克尔的农田与幸存城市接入共同的粮食、电力和运输体系。工程许诺富足，但移民安置与地方行政必须跟上水坝、工厂和铁路的速度。"
 je_ffpa_tur_new_straits_convention: "新海峡公约"
 je_ffpa_tur_new_straits_convention_reason: "两洲之门已经成为首都规模的港口群。在和平且合法性至少#v 60#!时，将东色雷斯建设到#v 95%#!市场准入和较低动乱、荒废度，并拥有#v 8#!级港口与铁路、#v 6#!级政府行政、#v 3#!级海军行政和#v 2#!级海军要塞。届时土耳其可以宣布海峡服务贸易与安全的规则。"

 ffpa_tur_porte_charter_deliberations_v1: "高门制宪辩论"
 ffpa_tur_porte_charter_deliberations_v1_desc: "宫廷、各部、行省代表和社群机构正在谈判一部能够长久维系的奥斯曼宪章。"
 ffpa_tur_republic_foundation_convention_v1: "安卡拉奠基会议"
 ffpa_tur_republic_foundation_convention_v1_desc: "议员与公民团体正在把紧急状态下的共和国转变为稳定的宪政秩序。"
 ffpa_tur_directorate_reconstruction_mobilization_v1: "总署重建动员"
 ffpa_tur_directorate_reconstruction_mobilization_v1_desc: "稀缺的行政人员与物资正被投入重建总署的测绘和网络工程。"
 ffpa_tur_porte_central_charter_v1: "高门中央宪章"
 ffpa_tur_porte_central_charter_v1_desc: "统一的部会与地籍规则将帝国直接系于高门，但行省同意的重要性随之下降。"
 ffpa_tur_porte_vilayet_commonwealth_v1: "行省共同体"
 ffpa_tur_porte_vilayet_commonwealth_v1_desc: "中央通过获得特许的行省议会和经协商形成的社群机构进行治理。"
 ffpa_tur_porte_palace_bureaucracy_v1: "宫廷—官僚秩序"
 ffpa_tur_porte_palace_bureaucracy_v1_desc: "王朝与专业部会分享主权，而民选机构仍处于从属地位。"
 ffpa_tur_republic_assembly_settlement_v1: "国民议会主权"
 ffpa_tur_republic_assembly_settlement_v1_desc: "国民议会被确认为文官权威和共和国合法性的来源。"
 ffpa_tur_republic_developmental_settlement_v1: "发展型共和国"
 ffpa_tur_republic_developmental_settlement_v1_desc: "工业、技术教育与协调行政被视为共和国与社会之间的契约。"
 ffpa_tur_republic_guardian_settlement_v1: "守护型共和国"
 ffpa_tur_republic_guardian_settlement_v1_desc: "军队获得守护国家的宪制职责，秩序因此加强，文官政治的空间却有所收窄。"
 ffpa_tur_directorate_etatist_settlement_v1: "国家主义重建总署"
 ffpa_tur_directorate_etatist_settlement_v1_desc: "国营联合体与技术部会通过全国计划指挥重建经济。"
 ffpa_tur_directorate_mixed_planning_settlement_v1: "混合计划委员会"
 ffpa_tur_directorate_mixed_planning_settlement_v1_desc: "公共规划者、工业企业与市政代表在共同委员会中协商投资。"
 ffpa_tur_directorate_local_compacts_settlement_v1: "地方发展契约"
 ffpa_tur_directorate_local_compacts_settlement_v1_desc: "行省委员会接受全国目标，以换取对土地、水利和执行方式的控制。"
 ffpa_tur_black_sea_lifeline_state_v1: "黑海生命线"
 ffpa_tur_black_sea_lifeline_state_v1_desc: "重建的港口、电厂和铁路仓站使北部海岸在战争与严冬中仍能保持连接。"
 ffpa_tur_eastern_highlands_survey_state_v1: "东部高原测绘"
 ffpa_tur_eastern_highlands_survey_state_v1_desc: "常设测绘机构和全天候基础设施将行政覆盖扩展到东部高原。"
 ffpa_tur_cukurova_euphrates_works_state_v1: "丘库罗瓦—幼发拉底工程"
 ffpa_tur_cukurova_euphrates_works_state_v1_desc: "南方河谷的电力、食品加工、运输和灌溉得到统一协调。"
 ffpa_tur_anatolian_state_combines_v1: "安纳托利亚国营联合体"
 ffpa_tur_anatolian_state_combines_v1_desc: "全国性工业联合体集中分配机器、工程师和建设合同。"
 ffpa_tur_anatolian_village_institutes_v1: "安纳托利亚村庄学院"
 ffpa_tur_anatolian_village_institutes_v1_desc: "应用型乡村学校在服务对象附近培养教师、技术员、医务人员和合作社组织者。"
 ffpa_tur_anatolian_development_banks_v1: "安纳托利亚开发银行"
 ffpa_tur_anatolian_development_banks_v1_desc: "地区银行把公共担保与私人储蓄引向交通和商业。"
 ffpa_tur_straits_open_passage_state_v1: "海峡开放通行"
 ffpa_tur_straits_open_passage_state_v1_desc: "商业通行与人口迁入获得优先地位，博斯普鲁斯成为两海之间的开放交换地。"
 ffpa_tur_straits_balanced_stewardship_state_v1: "海峡监护制度"
 ffpa_tur_straits_balanced_stewardship_state_v1_desc: "商船通行受到保护，同时土耳其保留检查、安全与筑垒权。"
 ffpa_tur_straits_fortified_narrows_state_v1: "要塞化海峡"
 ffpa_tur_straits_fortified_narrows_state_v1_desc: "层叠的海岸工事使博斯普鲁斯易于防守，但军事限制也加重了商业负担。"
 ffpa_tur_settlement_direct_administration_v1: "直属行省行政"
 ffpa_tur_settlement_direct_administration_v1_desc: "统一登记与中央任命的官员扩大了行政触角，同时取代地方协商。"
 ffpa_tur_settlement_representative_compact_v1: "代表性行省契约"
 ffpa_tur_settlement_representative_compact_v1_desc: "行省代表和社群机构以合作换取在政府中的正式发言权。"
 ffpa_tur_settlement_development_authority_v1: "地区开发管理局"
 ffpa_tur_settlement_development_authority_v1_desc: "工程师和投资委员会围绕交通、建设与生产走廊组织地区。"

 ffpa_ig_tur_republican_general_staff: "共和国总参谋部"
 ffpa_ig_tur_ankara_civic_society: "安卡拉公民学社"
 ffpa_ig_tur_national_reconstruction_combines: "国家重建联合体"
 ffpa_ig_tur_national_technical_service_corps: "全国技术服务团"
 ig_trait_ffpa_tur_guardianship_intervention: "守护者干政"
 ig_trait_ffpa_tur_guardianship_intervention_desc: "当军官认定民选政府无力保卫建国秩序时，宪政守护权便会成为横亘在日常立法之前的常设否决。"
 ig_trait_ffpa_tur_civilian_command: "文官指挥链"
 ig_trait_ffpa_tur_civilian_command_desc: "稳定的文官指挥链把军队的职业精神引向严整动员与国土防御，而非政治仲裁。"
 ig_trait_ffpa_tur_republican_public_instruction: "共和国公共教育"
 ig_trait_ffpa_tur_republican_public_instruction_desc: "公民学校与各类学院把教育视为公民身份的实践基础，让更多人能够进入现代专业岗位。"
 ig_trait_ffpa_tur_contractual_obstruction: "承包体系掣肘"
 ig_trait_ffpa_tur_contractual_obstruction_desc: "当重建联合体拒绝合作时，采购争端会耗尽各部的行政能力，私人资本也会停下来等待更有利的条件。"
 ig_trait_ffpa_tur_reconstruction_contracts: "协调重建契约"
 ig_trait_ffpa_tur_reconstruction_contracts_desc: "稳定的公共契约使建筑商、制造企业与运输公司能够在全国网络中协调建设。"
 ig_trait_ffpa_tur_national_technical_service: "全国技术服务"
 ig_trait_ffpa_tur_national_technical_service_desc: "全国技术服务体系把受训的工程师、教师和行政人员派往重建所需之处，将专业人才培养与应用研究连接起来。"

 ffpa_tur_flavor.1.t: "遗失的奠基文件"
 ffpa_tur_flavor.1.d: "档案一致证明，一个土耳其国家从安纳托利亚重建中诞生；然而整整一代奠基法令已经散佚，令它最初遵循的国家方案变得模糊。幸存的宪法、税册与部会印章能够支持三种不同叙述。今天的政府必须明确记录，究竟是哪一种遗产塑造了国家。"
 ffpa_tur_flavor.1.f: "没有建国记忆的国家仍能执行法律，却无法说明这些法律为何值得服从。"
 ffpa_tur_flavor.1.a: "高门与共同体奠定了我们的国家。"
 ffpa_tur_flavor.1.b: "安卡拉共和国奠定了我们的国家。"
 ffpa_tur_flavor.1.c: "重建总署奠定了我们的国家。"

 ffpa_tur_flavor.10.t: "灰烬中的基本法"
 ffpa_tur_flavor.10.d: "第一届制宪委员会在打捞出的法典之间开会；书页记载的机构早已不复存在。改革派认为，共同奥斯曼公民权必须拥有民选议院；宫廷法学家则主张，可以恢复咨询制度，而不让党派再次撕裂国家。"
 ffpa_tur_flavor.10.f: "旧宪法可以逐字抄写，旧社会却无法原样复原。"
 ffpa_tur_flavor.10.a: "议院的权威必须来自公民。"
 ffpa_tur_flavor.10.b: "在王权之下恢复咨询制度。"
 ffpa_tur_flavor.11.t: "行省议会重开"
 ffpa_tur_flavor.11.d: "安卡拉发布命令的速度远快于培养总督的速度。各地代表愿意提供档案、税吏和地方合法性，却都追问新帝国究竟准备与他们共同治理，还是越过他们进行统治。"
 ffpa_tur_flavor.11.f: "中央集权从来不只由中央独自建立。"
 ffpa_tur_flavor.11.a: "任命总督，让一套法律贯穿帝国。"
 ffpa_tur_flavor.11.b: "在每个行省设立特许代表议会。"
 ffpa_tur_flavor.11.c: "承认那些能让命令成为现实的地方显贵。"
 ffpa_tur_flavor.12.t: "宗教基金账簿"
 ffpa_tur_flavor.12.d: "当各部消失时，清真寺、教堂、教团和家族基金维持了食堂、水井、诊所与学校。幸存的受托人如今控制着财政无法忽视的土地和地方忠诚。"
 ffpa_tur_flavor.12.f: "问题并非这些基金是否服务过公众，而是谁有权重新定义公众。"
 ffpa_tur_flavor.12.a: "在公共审计下保护基金自治。"
 ffpa_tur_flavor.12.b: "把服务和财产移交市政机构。"
 ffpa_tur_flavor.12.c: "制定公立—基金混合章程。"
 ffpa_tur_flavor.13.t: "高门宪章"
 ffpa_tur_flavor.13.d: "条文已经历辩论、翻译、修订并送往各行省。复兴的奥斯曼国家现在必须决定，未来的大臣、总督与各社群应当遵守哪一种宪制交易。"
 ffpa_tur_flavor.13.f: "没有宪章能够消灭冲突；持久的宪章只会规定冲突应当在何处进行。"
 ffpa_tur_flavor.13.a: "由中央坦志麦特国家完成这项事业。"
 ffpa_tur_flavor.13.b: "建立协商形成的行省共同体。"
 ffpa_tur_flavor.13.c: "把秩序托付给宫廷及其部会。"

 ffpa_tur_flavor.20.t: "石屋中的国民议会"
 ffpa_tur_flavor.20.d: "最初的议员之所以在安卡拉集会，是因为旧都及其机构已经无法保护国家主权。紧急状态消退后，共和国必须决定国民议会是否继续居于最高地位，还是把更强的授权交给民选总统。"
 ffpa_tur_flavor.20.f: "首都由危难选定，它的制度则将由人们主动选择。"
 ffpa_tur_flavor.20.a: "主权属于国民议会。"
 ffpa_tur_flavor.20.b: "获得直接授权的总统必须有能力行动。"
 ffpa_tur_flavor.21.t: "重议村庄学院"
 ffpa_tur_flavor.21.d: "教师们从旧档案中重新整理出村庄学院方案：让乡村学生在寄宿学校中一边劳动，一边学习农业、医疗、建设和教学。他们主张让这套旧方案适应新的共和国；工业规划者则认为，稀缺的师资应集中于城市技术学院。"
 ffpa_tur_flavor.21.f: "学校既可以复制现有的国家，也可以培养建设尚不存在之国家的人。"
 ffpa_tur_flavor.21.a: "在乡村复兴应用型学院。"
 ffpa_tur_flavor.21.b: "把专业力量集中到城市技术学院。"
 ffpa_tur_flavor.22.t: "总参谋部走进国民议会"
 ffpa_tur_flavor.22.d: "守护重建事业的军官们开始追问：民选制度稳固之后，军队还负有什么职责？文官议员要求建立毫无歧义的指挥链；高级将领则警告，未来某届内阁可能从内部拆毁共和国。"
 ffpa_tur_flavor.22.f: "建立过国家的军队，仍须学会如何归属于这个国家。"
 ffpa_tur_flavor.22.a: "军服必须服从文官政府。"
 ffpa_tur_flavor.22.b: "赋予总参谋部宪制守护职责。"
 ffpa_tur_flavor.23.t: "共和国的第二次奠基"
 ffpa_tur_flavor.23.d: "紧急共和国已经拥有选举、学校、部会和稳定的文武关系。最后的问题是，哪一项成就将定义政治秩序：议会公民权、组织化发展，还是受守护的连续性。"
 ffpa_tur_flavor.23.f: "旧档案记载的共和国熬过了独立战争；大火后建立的共和国必须熬过日常政治。"
 ffpa_tur_flavor.23.a: "让国民议会继续成为共和国的主权中心。"
 ffpa_tur_flavor.23.b: "让发展成为共和国的社会契约。"
 ffpa_tur_flavor.23.c: "让守护者负责维持这项安排。"

 ffpa_tur_flavor.30.t: "无纸可查的全国测绘"
 ffpa_tur_flavor.30.d: "焚毁的登记册与流离的村庄留下一批只标田地、不记主人的地图。测绘队可以强制建立统一地籍，也可以接受市政议会与幸存社群的证词。"
 ffpa_tur_flavor.30.f: "地图上的每条直线都会穿过某个人的记忆。"
 ffpa_tur_flavor.30.a: "按照统一地籍标准重新测绘全国。"
 ffpa_tur_flavor.30.b: "由市政证词重建登记册。"
 ffpa_tur_flavor.31.t: "苏美尔与埃蒂的空厂"
 ffpa_tur_flavor.31.d: "旧磨坊、矿区和企业城镇的外壳上，仍残留着国营企业褪色的标记。工程师提议建立能够重建整条产业链的全国联合体；商人提出混合企业，市政机构则要求资助自己能够维持的小型工坊。"
 ffpa_tur_flavor.31.f: "工厂不仅是机器，也是住房、食物、纪律，以及下个月仍能领到工资的承诺。"
 ffpa_tur_flavor.31.a: "重建全国性国营联合体。"
 ffpa_tur_flavor.31.b: "建立公私混合重建企业。"
 ffpa_tur_flavor.31.c: "资助市政和合作社工坊。"
 ffpa_tur_flavor.32.t: "高原技术服务团"
 ffpa_tur_flavor.32.d: "偏远地区可能要等上数十年才能拥有常驻专家。总署可以派遣由工程师、教师和医务人员组成的流动队伍，也可以建设行省技术局，或在项目成熟时逐项外包专业服务。"
 ffpa_tur_flavor.32.f: "旧共和国曾把教师送进村庄；重建国家必须让整套专业队伍下到地方。"
 ffpa_tur_flavor.32.a: "组织全国流动技术服务团。"
 ffpa_tur_flavor.32.b: "建设常设行省技术局。"
 ffpa_tur_flavor.32.c: "按项目逐项采购专业服务。"
 ffpa_tur_flavor.33.t: "重建总署的授权"
 ffpa_tur_flavor.33.d: "紧急机构如今已经拥有自己的地图、工厂、学校与行政文化。为了防止临时重建在惯性中变成永久统治，总署必须明确谁控制计划，又有谁能够修改计划。"
 ffpa_tur_flavor.33.f: "技术官僚制不是政治的消失，而是通过标准、预算和任命名单进行的政治。"
 ffpa_tur_flavor.33.a: "赋予国营联合体全国重建授权。"
 ffpa_tur_flavor.33.b: "让公共与私人利益共同进入混合计划委员会。"
 ffpa_tur_flavor.33.c: "通过有约束力的地方发展契约进行治理。"

 ffpa_tur_flavor.40.t: "安纳托利亚计划大会"
 ffpa_tur_flavor.40.d: "铁路、高原测绘、河谷工程和黑海生命线已经培养出一代工程师与行省组织者。这些相互竞争的机构不可能同时主导下一阶段发展。"
 ffpa_tur_flavor.40.f: "工程重建了各地，而工程采用的方法将开始塑造整个国家。"
 ffpa_tur_flavor.40.a: "把机器与合同集中到国营联合体。"
 ffpa_tur_flavor.40.b: "让村庄学院与合作社成为全国模式。"
 ffpa_tur_flavor.40.c: "为地区开发银行网络注入资本。"
 ffpa_tur_flavor.41.t: "新海峡公约"
 ffpa_tur_flavor.41.d: "博斯普鲁斯再次承载往来两海的商人、移民与军舰。外国政府要求可预期的通行规则，海军将领要求防御，港务部门则警告每一道限制都有代价。土耳其必须宣布自己将以何种原则守护这扇大门。"
 ffpa_tur_flavor.41.f: "海峡的水面很窄，政治却极其宽广。"
 ffpa_tur_flavor.41.a: "保障开放的商业通行。"
 ffpa_tur_flavor.41.b: "在通行权与主权监护之间取得平衡。"
 ffpa_tur_flavor.41.c: "要塞化海峡，让交通服从安全。"

 ffpa_tur_flavor.50.t: "鲁米利亚治理会议"
 ffpa_tur_flavor.50.d: "鲁米利亚已经处于土耳其行政之下；新铁路和港口如今把它的城市、税务机关与生产网络更紧密地接入安纳托利亚。余下的问题是这套行政每天应当如何运作：谁任命官员、谁代表各省，以及哪一种法律协调这些走廊。建国时选择的国家方案提供了三种答案。"
 ffpa_tur_flavor.50.f: "地图上的线路已经完成，关于线路上应当流动什么的争论才刚刚开始。"
 ffpa_tur_flavor.50.a: "让鲁米利亚官员继续由中央直接任命。"
 ffpa_tur_flavor.50.b: "保障特许行省议会的治理席位。"
 ffpa_tur_flavor.50.c: "以共同奥斯曼公民权协调各港。"
 ffpa_tur_flavor.50.d_option: "划为单一制共和国省份。"
 ffpa_tur_flavor.50.e: "让鲁米利亚代表进入安卡拉的联邦议席。"
 ffpa_tur_flavor.50.f_option: "建立跨省协调区。"
 ffpa_tur_flavor.50.g: "把鲁米利亚划为全国测绘区。"
 ffpa_tur_flavor.50.h: "交给地区技术委员会。"
 ffpa_tur_flavor.50.i: "成立鲁米利亚走廊管理局。"
 ffpa_tur_flavor.51.t: "东方水利与贸易会议"
 ffpa_tur_flavor.51.d: "东方各省已经处于土耳其国家的治理之中，水利与贸易走廊则把幼发拉底河、黎凡特和通往埃及的门户纳入同一套路网。会议必须决定谁控制流域预算、各省如何获得代表，以及哪些机关跨区负责海关、灌溉与公共服务。"
 ffpa_tur_flavor.51.f: "河流无视行省边界，国库和议会却不会。"
 ffpa_tur_flavor.51.a: "由中央任命的行省机关直接管理东方公共服务。"
 ffpa_tur_flavor.51.b: "承认流域议会和商路委员会。"
 ffpa_tur_flavor.51.c: "设立帝国水利与贸易委员会。"
 ffpa_tur_flavor.51.d_option: "任命共和国文官长官。"
 ffpa_tur_flavor.51.e: "选举地区流域议会。"
 ffpa_tur_flavor.51.f_option: "成立幼发拉底—黎凡特开发管理局。"
 ffpa_tur_flavor.51.g: "把东方划为地籍管理区。"
 ffpa_tur_flavor.51.h: "把运营交给地区水务委员会。"
 ffpa_tur_flavor.51.i: "成立一体化东方走廊管理局。"
 ffpa_tur_flavor.52.t: "非洲港口会议"
 ffpa_tur_flavor.52.d: "非洲各港已经属于土耳其行政体系，完成的滨海网络也让它们在经济上彼此接近，却尚未确定它们在全国治理中的位置。码头工人、商人、市政议会、财政官员与军事规划者都要求参与官员任命、海关收入、公共服务与海运投资。"
 ffpa_tur_flavor.52.f: "港口可以面向首都、腹地或海洋；若没有妥协，它无法同时面向三者。"
 ffpa_tur_flavor.52.a: "由中央任命的行省机关管理非洲海岸。"
 ffpa_tur_flavor.52.b: "同港口市政机构缔结契约。"
 ffpa_tur_flavor.52.c: "设立帝国海洋开发署。"
 ffpa_tur_flavor.52.d_option: "以共和国省份治理海岸。"
 ffpa_tur_flavor.52.e: "建立代表性地区契约。"
 ffpa_tur_flavor.52.f_option: "成立地中海港口开发委员会。"
 ffpa_tur_flavor.52.g: "把海岸测绘为全国行政区。"
 ffpa_tur_flavor.52.h: "组成港口与水利地区委员会。"
 ffpa_tur_flavor.52.i: "成立非洲海洋走廊管理局。"

