l_simp_chinese:
 je_group_ffpa_turkish_reconstruction: "土耳其重建"

 ffpa_tur_confirm_reconstruction_legacy: "确认重建时代的国家遗产"
 ffpa_tur_confirm_reconstruction_legacy_desc: "旧档案只证明安纳托利亚已经完成重建，却没有留下新国家究竟遵循哪一种建国方案。打开幸存的奠基文件，明确记录这段遗产，而不要根据今天的政体猜测过去。"

 je_ffpa_tur_charter_of_the_porte: "高门宪章"
 je_ffpa_tur_charter_of_the_porte_reason: "奥斯曼共同体已经使共同政治身份成为可能，却还没有说清#bold 主权归于何处#!。宫廷希望部会的命令通行各省，地方代表要求参与治理；维持过学校与诊所的宗教基金，也不愿只凭一道命令交出自己的职责。高门宪章必须为这些相互依赖的权力划定边界。\n\n完成三场宪制辩论，维持君主制、至少#v 50#![concept_legitimacy]和非负官僚余量，在没有叛乱运动的和平状态下，使#v 6#!个重建核心州保持至少#v 75%#!市场准入和低于#v 18%#!动乱。"
 je_ffpa_tur_second_foundation_of_ankara: "安卡拉的第二次建国"
 je_ffpa_tur_second_foundation_of_ankara_reason: "安卡拉的共和传统为重建提供了一个名号，却不能替新国家回答日常政治中的难题。议会的支持者要求限制紧急授权，教师争论有限的师资应送往乡村还是城市，军官则希望保留对国家方向的发言权。共和国需要让这些争论进入#bold 可以持续运作的制度#!，而非依赖下一道紧急法令。\n\n完成关于国民议会、国民教育和文武关系的辩论；维持非君主政体和有效选举权、至少#v 50#![concept_legitimacy]、非负官僚余量、#v 25%#!识字率及和平，并让#v 6#!个重建核心州保持稳定的市场连接。"
 je_ffpa_tur_reconstruction_directorate: "安纳托利亚重建总署"
 je_ffpa_tur_reconstruction_directorate_reason: "测绘队需要一套通行全国的地籍，地方机构却保存着中央档案里找不到的土地记录。产业重建与技术服务面临相似的难题：统一计划便于调拨人力和物资，执行它的人却分散在各省。重建总署必须确定#bold 中央、地方与企业各自的责任#!；临时授权能够启动工程，却不能替代长久的治理安排。\n\n完成地籍、工业和技术服务三场辩论；维持至少#v 50#![concept_legitimacy]、#v 0#!可用官僚和#v 25%#!识字率，并让#v 4#!个重建核心州拥有至少#v 2#!级铁路与政府行政机构。"
 je_ffpa_tur_black_sea_lifeline: "黑海生命线"
 je_ffpa_tur_black_sea_lifeline_reason: "卡斯塔莫努和特拉布宗的港口面向黑海，腹地的重建却依赖货物继续运入安纳托利亚。港务人员关心卸货，铁路部门关心周转，内陆生产者需要两者接得上。让港口、电力与铁路共同运转，才能把两处海岸枢纽连成可靠的#bold 北方补给线#!。\n\n两州都需要可靠市场准入与稳定；\n卡斯塔莫努需要#v 2#!级港口和电厂、#v 3#!级铁路；\n特拉布宗需要#v 4#!级港口、#v 3#!级铁路与#v 2#!级电厂。"
 je_ffpa_tur_eastern_highlands_survey: "东部高原测绘"
 je_ffpa_tur_eastern_highlands_survey_reason: "埃尔祖鲁姆和卡尔斯的山路、聚落与土地关系，很难仅凭中央保存的旧地图重新掌握。测绘人员需要地方知识，地方机构也需要#bold 能够全年使用的交通与行政网络#!，使登记、运输和公共服务相互接续。铁路、电网与行政机关必须随着同一项工程推进。\n\n稳定两州、降低荒废度，并建成足以全年治理高原的铁路、电力与行政网络。"
 je_ffpa_tur_cukurova_euphrates_works: "丘库罗瓦—幼发拉底工程"
 je_ffpa_tur_cukurova_euphrates_works_reason: "阿达纳和迪亚巴克尔的农田、加工厂与城市需要彼此接续的#bold 粮食、电力和运输体系#!。扩大产出只有在货物能够运出、工厂能够持续开工时才有意义；地方行政还必须跟上人口流动和新生产网络带来的事务。工程的目标，是让农业腹地与城市设施共同运转。"
 je_ffpa_tur_new_straits_convention: "新海峡公约"
 je_ffpa_tur_new_straits_convention_reason: "两洲之门的建设已经扩大了海峡港口的作用，港务机关与海军对其下一步用途却各有主张。前者要求把设施用于货运和旅客往来，后者希望增加防御能力。新的海峡公约要确定#bold 贸易服务与安全设施的建设取向#!，使现有港口网络获得明确的行政安排。\n\n在和平且合法性至少#v 60#!时，将东色雷斯建设到#v 95%#!市场准入和较低动乱、荒废度，并拥有#v 8#!级港口与铁路、#v 6#!级政府行政、#v 3#!级海军行政和#v 2#!级海军要塞。届时土耳其可以确定海峡设施服务#bold 贸易与安全#!的长期方针。"

 ffpa_tur_porte_charter_deliberations_v1: "高门制宪辩论"
 ffpa_tur_porte_charter_deliberations_v1_desc: "宫廷、各部、行省代表和社群机构正在谈判一部能够长久维系的奥斯曼宪章。"
 ffpa_tur_republic_foundation_convention_v1: "安卡拉奠基会议"
 ffpa_tur_republic_foundation_convention_v1_desc: "议员与公民团体正在把紧急状态下的共和国转变为稳定的宪政秩序。"
 ffpa_tur_directorate_reconstruction_mobilization_v1: "总署重建动员"
 ffpa_tur_directorate_reconstruction_mobilization_v1_desc: "稀缺的行政人员与物资正被投入重建总署的测绘和网络工程。"
 ffpa_tur_porte_central_charter_v1: "高门中央宪章"
 ffpa_tur_porte_central_charter_v1_desc: "统一的部会与地籍规则将帝国直接系于高门，但行省同意的重要性随之下降。"
 ffpa_tur_porte_vilayet_commonwealth_v1: "行省共同体"
 ffpa_tur_porte_vilayet_commonwealth_v1_desc: "中央通过获得特许的行省议会和经协商形成的社群机构进行治理。"
 ffpa_tur_porte_palace_bureaucracy_v1: "宫廷—官僚秩序"
 ffpa_tur_porte_palace_bureaucracy_v1_desc: "王朝与专业部会分享主权，而民选机构仍处于从属地位。"
 ffpa_tur_republic_assembly_settlement_v1: "国民议会主权"
 ffpa_tur_republic_assembly_settlement_v1_desc: "国民议会被确认为文官权威和共和国合法性的来源。"
 ffpa_tur_republic_developmental_settlement_v1: "发展型共和国"
 ffpa_tur_republic_developmental_settlement_v1_desc: "工业、技术教育与协调行政被视为共和国与社会之间的契约。"
 ffpa_tur_republic_guardian_settlement_v1: "守护型共和国"
 ffpa_tur_republic_guardian_settlement_v1_desc: "军队获得守护国家的宪制职责，秩序因此加强，文官政治的空间却有所收窄。"
 ffpa_tur_directorate_etatist_settlement_v1: "国家主义重建总署"
 ffpa_tur_directorate_etatist_settlement_v1_desc: "国营联合体与技术部会通过全国计划指挥重建经济。"
 ffpa_tur_directorate_mixed_planning_settlement_v1: "混合计划委员会"
 ffpa_tur_directorate_mixed_planning_settlement_v1_desc: "公共规划者、工业企业与市政代表在共同委员会中协商投资。"
 ffpa_tur_directorate_local_compacts_settlement_v1: "地方发展契约"
 ffpa_tur_directorate_local_compacts_settlement_v1_desc: "行省委员会接受全国目标，以换取对土地、水利和执行方式的控制。"
 ffpa_tur_black_sea_lifeline_state_v1: "黑海生命线"
 ffpa_tur_black_sea_lifeline_state_v1_desc: "重建的港口、电厂和铁路仓站使北部海岸在战争与严冬中仍能保持连接。"
 ffpa_tur_eastern_highlands_survey_state_v1: "东部高原测绘"
 ffpa_tur_eastern_highlands_survey_state_v1_desc: "常设测绘机构和全天候基础设施将行政覆盖扩展到东部高原。"
 ffpa_tur_cukurova_euphrates_works_state_v1: "丘库罗瓦—幼发拉底工程"
 ffpa_tur_cukurova_euphrates_works_state_v1_desc: "南方河谷的电力、食品加工、运输和灌溉得到统一协调。"
 ffpa_tur_anatolian_state_combines_v1: "安纳托利亚国营联合体"
 ffpa_tur_anatolian_state_combines_v1_desc: "全国性工业联合体集中分配机器、工程师和建设合同。"
 ffpa_tur_anatolian_village_institutes_v1: "安纳托利亚村庄学院"
 ffpa_tur_anatolian_village_institutes_v1_desc: "应用型乡村学校在服务对象附近培养教师、技术员、医务人员和合作社组织者。"
 ffpa_tur_anatolian_development_banks_v1: "安纳托利亚开发银行"
 ffpa_tur_anatolian_development_banks_v1_desc: "地区银行把公共担保与私人储蓄引向交通和商业。"
 ffpa_tur_straits_open_passage_state_v1: "海峡开放通行"
 ffpa_tur_straits_open_passage_state_v1_desc: "商业通行与人口迁入获得优先地位，博斯普鲁斯成为两海之间的开放交换地。"
 ffpa_tur_straits_balanced_stewardship_state_v1: "海峡监护制度"
 ffpa_tur_straits_balanced_stewardship_state_v1_desc: "商船通行受到保护，同时土耳其保留检查、安全与筑垒权。"
 ffpa_tur_straits_fortified_narrows_state_v1: "要塞化海峡"
 ffpa_tur_straits_fortified_narrows_state_v1_desc: "层叠的海岸工事使博斯普鲁斯易于防守，但军事限制也加重了商业负担。"
 ffpa_tur_settlement_direct_administration_v1: "直属行省行政"
 ffpa_tur_settlement_direct_administration_v1_desc: "统一登记与中央任命的官员扩大了行政触角，同时取代地方协商。"
 ffpa_tur_settlement_representative_compact_v1: "代表性行省契约"
 ffpa_tur_settlement_representative_compact_v1_desc: "行省代表和社群机构以合作换取在政府中的正式发言权。"
 ffpa_tur_settlement_development_authority_v1: "地区开发管理局"
 ffpa_tur_settlement_development_authority_v1_desc: "工程师和投资委员会围绕交通、建设与生产走廊组织地区。"

 ffpa_ig_tur_republican_general_staff: "共和国总参谋部"
 ffpa_ig_tur_ankara_civic_society: "安卡拉公民学社"
 ffpa_ig_tur_national_reconstruction_combines: "国家重建联合体"
 ffpa_ig_tur_national_technical_service_corps: "全国技术服务团"
 ig_trait_ffpa_tur_guardianship_intervention: "守护者干政"
 ig_trait_ffpa_tur_guardianship_intervention_desc: "当军官认定民选政府无力保卫建国秩序时，宪政守护权便会成为横亘在日常立法之前的常设否决。"
 ig_trait_ffpa_tur_civilian_command: "文官指挥链"
 ig_trait_ffpa_tur_civilian_command_desc: "稳定的文官指挥链把军队的职业精神引向严整动员与国土防御，而非政治仲裁。"
 ig_trait_ffpa_tur_republican_public_instruction: "共和国公共教育"
 ig_trait_ffpa_tur_republican_public_instruction_desc: "公民学校与各类学院把教育视为公民身份的实践基础，让更多人能够进入现代专业岗位。"
 ig_trait_ffpa_tur_contractual_obstruction: "承包体系掣肘"
 ig_trait_ffpa_tur_contractual_obstruction_desc: "当重建联合体拒绝合作时，采购争端会耗尽各部的行政能力，私人资本也会停下来等待更有利的条件。"
 ig_trait_ffpa_tur_reconstruction_contracts: "协调重建契约"
 ig_trait_ffpa_tur_reconstruction_contracts_desc: "稳定的公共契约使建筑商、制造企业与运输公司能够在全国网络中协调建设。"
 ig_trait_ffpa_tur_national_technical_service: "全国技术服务"
 ig_trait_ffpa_tur_national_technical_service_desc: "全国技术服务体系把受训的工程师、教师和行政人员派往重建所需之处，将专业人才培养与应用研究连接起来。"

 ffpa_tur_flavor.1.t: "遗失的奠基文件"
 ffpa_tur_flavor.1.d: "档案一致证明，一个土耳其国家从安纳托利亚重建中诞生；然而整整一代奠基法令已经散佚，令它最初遵循的国家方案变得模糊。幸存的宪法、税册与部会印章能够支持三种不同叙述。今天的政府必须明确记录，究竟是哪一种遗产塑造了国家。"
 ffpa_tur_flavor.1.f: "没有建国记忆的国家仍能执行法律，却无法说明这些法律为何值得服从。"
 ffpa_tur_flavor.1.a: "高门与共同体奠定了我们的国家。"
 ffpa_tur_flavor.1.b: "安卡拉共和国奠定了我们的国家。"
 ffpa_tur_flavor.1.c: "重建总署奠定了我们的国家。"

 ffpa_tur_flavor.10.t: "灰烬中的基本法"
 ffpa_tur_flavor.10.d: "第一届制宪委员会在打捞出的法典之间开会；书页记载的机构早已不复存在。改革派认为，共同奥斯曼公民权必须拥有#bold 民选议院#!；宫廷法学家则主张，可以恢复咨询制度，而不让党派再次撕裂国家。"
 ffpa_tur_flavor.10.f: "委员会保留了旧法典的页码。关于议院权限的那一页，却已被两种笔迹改得几乎无法辨认。"
 ffpa_tur_flavor.10.a: "议院的权威必须来自公民。"
 ffpa_tur_flavor.10.b: "在王权之下恢复咨询制度。"
 ffpa_tur_flavor.11.t: "行省议会重开"
 ffpa_tur_flavor.11.d: "中央部会发布命令的速度远快于培养总督的速度。各地代表愿意提供档案、税吏和地方支持，却都追问自己在新安排中占有什么位置：由中央委任官员，设立特许议会，还是依靠已有地方中介？"
 ffpa_tur_flavor.11.f: "一名代表把任命状翻到背面：“任命谁，自然由诸位讨论。可若没有熟悉各乡的人，他到了地方，先向谁问路？”"
 ffpa_tur_flavor.11.a: "任命总督，让一套法律贯穿帝国。"
 ffpa_tur_flavor.11.b: "在每个行省设立特许代表议会。"
 ffpa_tur_flavor.11.c: "承认那些能让命令成为现实的地方显贵。"
 ffpa_tur_flavor.12.t: "宗教基金账簿"
 ffpa_tur_flavor.12.d: "当各部消失时，清真寺、教堂、教团和家族基金维持了食堂、水井、诊所与学校。幸存的受托人如今控制着财政无法忽视的土地和地方忠诚。"
 ffpa_tur_flavor.12.f: "受托人带来了账簿，也带来了学校与诊所的开支单。财政官员逐页核对，问的始终是同一件事：服务可以继续，账目由谁签字？"
 ffpa_tur_flavor.12.a: "在公共审计下保护基金自治。"
 ffpa_tur_flavor.12.b: "把服务和财产移交市政机构。"
 ffpa_tur_flavor.12.c: "制定公立—基金混合章程。"
 ffpa_tur_flavor.13.t: "高门宪章"
 ffpa_tur_flavor.13.d: "条文已经历辩论、翻译、修订并送往各行省。复兴的奥斯曼国家现在必须决定，未来的大臣、总督与各社群应当遵守哪一种宪制安排。\n\n宪章议定之后，中央簿册与行省记录仍须逐项对勘。谁能够下令只是建国问题的一半，命令如何在地方落实，将成为政府日常的工作。"
 ffpa_tur_flavor.13.f: "没有宪章能够消灭冲突；持久的宪章只会规定冲突应当在何处进行。"
 ffpa_tur_flavor.13.a: "由中央坦志麦特国家完成这项事业。"
 ffpa_tur_flavor.13.b: "建立协商形成的行省共同体。"
 ffpa_tur_flavor.13.c: "把秩序托付给宫廷及其部会。"

 ffpa_tur_flavor.20.t: "石屋中的国民议会"
 ffpa_tur_flavor.20.d: "建国代表重新翻检安卡拉早期国民议会的记录，寻找紧急授权转为日常制度的依据。议会派主张由代表机关掌握政府方向，另一派则希望赋予民选总统更强的行动能力。共和国需要决定这两种授权如何安排。"
 ffpa_tur_flavor.20.f: "关于紧急授权的条文并不长。书记员念到最后，席间有人问：“等紧急状态过去，这一条由谁来划掉？”"
 ffpa_tur_flavor.20.a: "主权属于国民议会。"
 ffpa_tur_flavor.20.b: "获得直接授权的总统必须有能力行动。"
 ffpa_tur_flavor.21.t: "重议村庄学院"
 ffpa_tur_flavor.21.d: "教师们从旧档案中重新整理出村庄学院方案：让乡村学生在寄宿学校中一边劳动，一边学习农业、医疗、建设和教学。他们主张让这套旧方案适应新的共和国；工业规划者则认为，稀缺的师资应集中于城市技术学院。"
 ffpa_tur_flavor.21.f: "学校既可以复制现有的国家，也可以培养建设尚不存在之国家的人。"
 ffpa_tur_flavor.21.a: "在乡村复兴应用型学院。"
 ffpa_tur_flavor.21.b: "把专业力量集中到城市技术学院。"
 ffpa_tur_flavor.22.t: "总参谋部走进国民议会"
 ffpa_tur_flavor.22.d: "围绕拟定的民选制度，参与重建的军官与文官代表仍在争论军队的位置。文官要求建立明确的#bold 指挥链#!；高级将领则主张保留宪制守护职责，声称未来的政府也可能破坏共和国。会议必须决定，是以文官统辖结束争论，还是承认军方的独立政治职责。"
 ffpa_tur_flavor.22.f: "将领把“保卫共和国”写进提案。文官在旁边添了一句：“共和国由谁代表？”两行字之间，留着一大片空白。"
 ffpa_tur_flavor.22.a: "军服必须服从文官政府。"
 ffpa_tur_flavor.22.b: "赋予总参谋部宪制守护职责。"
 ffpa_tur_flavor.23.t: "共和国的第二次奠基"
 ffpa_tur_flavor.23.d: "有关议会、教育和文武关系的辩论已经结束，共和国也达到了支撑这套安排所需的稳定条件。最后的问题是，哪一种政治取向将定义新的秩序：议会公民权、组织化发展，还是受守护的连续性。\n\n奠基文件可以在今天定稿，各省的任命、税册与日常执行却没有终稿。共和国还须让中央标准与地方知识相互校正。"
 ffpa_tur_flavor.23.f: "旧档案记载的共和国熬过了独立战争；大火后建立的共和国必须熬过日常政治。"
 ffpa_tur_flavor.23.a: "让国民议会继续成为共和国的主权中心。"
 ffpa_tur_flavor.23.b: "让发展成为共和国的社会契约。"
 ffpa_tur_flavor.23.c: "让守护者负责维持这项安排。"

 ffpa_tur_flavor.30.t: "同一块田，两份记录"
 ffpa_tur_flavor.30.d: "测绘队提交了#bold 全国统一地籍#!的方案，市政代表同时送来了由地方证词补全的登记册。前者便于各部核验，后者保留了旧档案失散后仍在沿用的安排。总署需要决定，新的登记工作以哪一种依据为准。"
 ffpa_tur_flavor.30.f: "书记员把两份图摊在桌上。一份划出了整齐的界线，另一份在边角写满人名。“这张便于归档，”他指着第一份说，“那些名字，又该记在哪里？”"
 ffpa_tur_flavor.30.a: "以统一地籍标准重新登记。"
 ffpa_tur_flavor.30.b: "以市政证词补全地方记录。"
 ffpa_tur_flavor.31.t: "苏美尔与埃蒂的旧方案"
 ffpa_tur_flavor.31.d: "关于苏美尔与埃蒂的旧企业档案，又被摆上重建会议的桌面。工程师从中看到组织整条产业链的办法，商人主张由公私混合企业分担工作，市政代表则希望支持当地能够维持的小型工坊。总署必须选择支持哪一种产业组织方式。"
 ffpa_tur_flavor.31.f: "工厂不仅是机器，也是住房、食物、纪律，以及下个月仍能领到工资的承诺。"
 ffpa_tur_flavor.31.a: "以全国性国营联合体为重建方向。"
 ffpa_tur_flavor.31.b: "支持公私混合重建企业。"
 ffpa_tur_flavor.31.c: "支持市政和合作社工坊。"
 ffpa_tur_flavor.32.t: "高原技术服务团"
 ffpa_tur_flavor.32.d: "偏远地区可能要等上数十年才能拥有常驻专家。总署可以派遣由工程师、教师和医务人员组成的流动队伍，也可以建设行省技术局，或在项目成熟时逐项外包专业服务。"
 ffpa_tur_flavor.32.f: "地方呈文里，最急迫的请求各不相同：有人要修供水，有人缺教师。负责排班的官员望着同一份人员名单，只能一遍遍重排路线。"
 ffpa_tur_flavor.32.a: "组织全国流动技术服务团。"
 ffpa_tur_flavor.32.b: "建设常设行省技术局。"
 ffpa_tur_flavor.32.c: "按项目逐项采购专业服务。"
 ffpa_tur_flavor.33.t: "重建总署的授权"
 ffpa_tur_flavor.33.d: "地籍、产业组织和技术服务的方案已经议定，总署也建立起支撑日常工作的行政基础。为了防止临时重建在惯性中变成永久统治，它必须明确#bold 谁控制计划#!，又有谁能够修改计划。\n\n授权书签定之后，中央报表仍须接受地方执行的检验。统一标准可以帮助政府看清各省，也可能把它们的实际情形挡在表格之外。"
 ffpa_tur_flavor.33.f: "技术官僚制不是政治的消失，而是通过标准、预算和任命名单进行的政治。"
 ffpa_tur_flavor.33.a: "赋予国营联合体全国重建授权。"
 ffpa_tur_flavor.33.b: "让公共与私人利益共同进入混合计划委员会。"
 ffpa_tur_flavor.33.c: "通过有约束力的地方发展契约进行治理。"

 ffpa_tur_flavor.40.t: "安纳托利亚计划大会"
 ffpa_tur_flavor.40.d: "已经完成的安纳托利亚工程，把工程师、地方组织者和投资者带到了同一张会议桌前。他们对下一阶段提出了不同办法：集中组织产业，扩大乡村教育与合作，或依靠地区金融网络。政府需要从这些建设经验中选定一项全国性的政策重点。"
 ffpa_tur_flavor.40.f: "工程师谈机器与产能，教师谈学生，银行代表谈还款期限。主席原以为大家只是在争论怎样继续建设，听到最后才发现，他们连由谁来建设都没有说定。"
 ffpa_tur_flavor.40.a: "把机器与合同集中到国营联合体。"
 ffpa_tur_flavor.40.b: "让村庄学院与合作社成为全国模式。"
 ffpa_tur_flavor.40.c: "为地区开发银行网络注入资本。"
 ffpa_tur_flavor.41.t: "新海峡公约"
 ffpa_tur_flavor.41.d: "海峡设施的扩建已经完成，港务机关与海军却对今后的用途提出了不同要求。商贸代表希望便利货运和人员往来，军官主张扩大防御设施，行政人员则寻求两者之间的安排。新的公约将确定东色雷斯港口与安全设施的长期方针。"
 ffpa_tur_flavor.41.f: "港口图上，货场、铁路和防御工事挤在狭窄的岸线边。每一位代表都指着同一片土地，说明它为什么应当优先服务自己的职责。"
 ffpa_tur_flavor.41.a: "以开放的商贸服务为海峡建设重点。"
 ffpa_tur_flavor.41.b: "兼顾商贸设施与海防建设。"
 ffpa_tur_flavor.41.c: "让海峡设施优先服务防御。"

 ffpa_tur_flavor.50.t: "鲁米利亚治理会议"
 ffpa_tur_flavor.50.d: "已经完成的地区工程，为政府留下了连接鲁米利亚与安纳托利亚的建设经验。参与过这些工程的官员与地方代表，如今要为现有管理网络议定更长久的办法：#bold 谁任命官员#!，地方机构如何参与，又由谁协调跨省事务。建国方案提供了讨论的框架，具体安排仍待选择。"
 ffpa_tur_flavor.50.f: "工程结束后，协调会仍在召开。地方代表提醒中央派来的官员：“桥可以验收，往后的维修单可不会自己找到该签字的人。”"
 ffpa_tur_flavor.50.a: "让鲁米利亚官员继续由中央直接任命。"
 ffpa_tur_flavor.50.b: "保障特许行省议会的治理席位。"
 ffpa_tur_flavor.50.c: "以共同体名义组织港口与走廊开发。"
 ffpa_tur_flavor.50.d_option: "划为单一制共和国省份。"
 ffpa_tur_flavor.50.e: "保障鲁米利亚地方代表的治理席位。"
 ffpa_tur_flavor.50.f_option: "建立跨省协调区。"
 ffpa_tur_flavor.50.g: "把鲁米利亚划为全国测绘区。"
 ffpa_tur_flavor.50.h: "交给地区技术委员会。"
 ffpa_tur_flavor.50.i: "成立鲁米利亚走廊管理局。"
 ffpa_tur_flavor.51.t: "东方水利与贸易会议"
 ffpa_tur_flavor.51.d: "东方水利与贸易工程留下的经验，被汇集为新一轮治理提案。负责现有网络的机构希望明确#bold 谁协调流域与商路#!，各省如何获得代表，以及哪些事务交由跨区机关处理。中央直接管理、地方协约和开发机构各有支持者，会议需要确定采用哪一种办法。"
 ffpa_tur_flavor.51.f: "一份呈文按河段排列，另一份按行政区排列。书记员必须把同一处设施抄进两个栏目，才让各部门认出自己应负的责任。"
 ffpa_tur_flavor.51.a: "由中央任命的行省机关直接管理东方公共服务。"
 ffpa_tur_flavor.51.b: "承认流域议会和商路委员会。"
 ffpa_tur_flavor.51.c: "设立帝国水利与贸易委员会。"
 ffpa_tur_flavor.51.d_option: "任命共和国文官长官。"
 ffpa_tur_flavor.51.e: "选举地区流域议会。"
 ffpa_tur_flavor.51.f_option: "成立幼发拉底—黎凡特开发管理局。"
 ffpa_tur_flavor.51.g: "把东方划为地籍管理区。"
 ffpa_tur_flavor.51.h: "把运营交给地区水务委员会。"
 ffpa_tur_flavor.51.i: "成立一体化东方走廊管理局。"
 ffpa_tur_flavor.52.t: "非洲港口会议"
 ffpa_tur_flavor.52.d: "非洲海岸已经完成的工程，使港务人员、商人、市政代表与财政官员积累了共同办事的经验，也显露出任命、公共服务和海运投资之间的分歧。会议现在要为现有管理网络确定#bold 更长久的治理安排#!：由中央直接组织，与地方机构缔约，或设立专门的开发机关。"
 ffpa_tur_flavor.52.f: "“船靠岸以后，水和灯总得有人管。”港务代表的话引来市政代表点头。轮到讨论由谁作主、由谁负责时，他们的意见便不再相同。"
 ffpa_tur_flavor.52.a: "由中央任命的行省机关管理非洲海岸。"
 ffpa_tur_flavor.52.b: "同港口市政机构缔结契约。"
 ffpa_tur_flavor.52.c: "设立帝国海洋开发署。"
 ffpa_tur_flavor.52.d_option: "以共和国省份治理海岸。"
 ffpa_tur_flavor.52.e: "建立代表性地区契约。"
 ffpa_tur_flavor.52.f_option: "成立地中海港口开发委员会。"
 ffpa_tur_flavor.52.g: "把海岸测绘为全国行政区。"
 ffpa_tur_flavor.52.h: "组成港口与水利地区委员会。"
 ffpa_tur_flavor.52.i: "成立非洲海洋走廊管理局。"

 # --- 路线限定的边疆收复机制 ---
 je_group_ffpa_turkish_frontier_recovery: "土耳其边疆收复"
 ffpa_tur_convene_frontier_council: "召开边疆委员会"
 ffpa_tur_convene_frontier_council_desc: "审议建国路线所支持的领土授权。同一时间只能有#v 一条前线#!处于进行中或等待战争结束后的结算。"
 ffpa_tur_withdraw_frontier_mandate: "撤回边疆授权"
 ffpa_tur_withdraw_frontier_mandate_desc: "在和平状态下结束当前授权，只清除边疆委员会为#bold 仍在土耳其统治之外#!的州添加的宣称。\n\n等待#v 五年#!后才能再次尝试该前线。"
 ffpa_tur_frontier_council_peace_tt: "土耳其必须处于和平且不是外交博弈的承诺参与者"
 ffpa_tur_frontier_slot_available_tt: "当前没有进行中或等待结算的边疆授权"
 ffpa_tur_frontier_available_tt: "至少有一条受到建国路线支持的前线可供选择"
 je_ffpa_tur_front_western_pact: "西部国民誓约"
 je_ffpa_tur_front_western_pact_reason: "边疆委员会中的国民誓约支持者把西色雷斯视为两岸联系的一部分，军官则强调海峡侧翼的安全。把这些主张变成国家议程，意味着政府须承担持续的外交与行政责任；历史文件本身不能替当地居民决定未来。\n\n边疆委员会已经授权对西色雷斯提出宣称。\n\n在#v 15年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_western_pact_status: "在#v 15年#!授权到期前直接完整拥有西色雷斯。"
 ffpa_tur_frontier_council_western_pact_option: "批准西部国民誓约。"
 ffpa_tur_frontier_council_western_pact_tt: "为西色雷斯中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启15年授权；不会自动完成地区建设。"
 je_ffpa_tur_front_mosul: "摩苏尔问题"
 je_ffpa_tur_front_mosul_reason: "摩苏尔的道路把安纳托利亚与两河地区联系起来。边疆委员会的提案者据此要求将它纳入国家议程，但取得土地与维持通道、处理地方事务是两种不同的负担。有限期的授权迫使政府为自己的主张承担责任。\n\n边疆委员会已经授权对摩苏尔提出宣称。\n\n在#v 15年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_mosul_status: "在#v 15年#!授权到期前直接完整拥有摩苏尔。"
 ffpa_tur_frontier_council_mosul_option: "批准摩苏尔问题。"
 ffpa_tur_frontier_council_mosul_tt: "为摩苏尔中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启15年授权；不会自动完成美索不达米亚水利工程。"
 je_ffpa_tur_front_rumelia: "鲁米利亚前线"
 je_ffpa_tur_front_rumelia_reason: "鲁米利亚的提案者援引旧行省的联系，希望重新组织跨越巴尔干的政治空间。委员会面对的却是多种地方社会与交通走廊；地图上的连续疆域不会自动产生共同的治理。政府必须把广泛的历史主张约束在明确的目标与期限之内。\n\n边疆委员会已经授权对阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_rumelia_status: "在#v 20年#!授权到期前直接完整拥有阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯。"
 ffpa_tur_frontier_council_rumelia_option: "批准鲁米利亚前线。"
 ffpa_tur_frontier_council_rumelia_tt: "为阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放埃格纳提亚大道与多瑙河—色雷斯工程。"
 je_ffpa_tur_front_aegean_cyprus: "爱琴海与塞浦路斯前线"
 je_ffpa_tur_front_aegean_cyprus_reason: "海军与沿海代表把爱琴海群岛及塞浦路斯写进同一份提案，希望以相互联系的港口支撑海上存在。各岛的补给与地方事务仍各有条件，不能仅靠一条海图上的边线维持。委员会因此必须为这项海上议程规定有限的授权。\n\n边疆委员会已经授权对阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_aegean_cyprus_status: "在#v 20年#!授权到期前直接完整拥有阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯。"
 ffpa_tur_frontier_council_aegean_cyprus_option: "批准爱琴海与塞浦路斯前线。"
 ffpa_tur_frontier_council_aegean_cyprus_tt: "为阿提卡、克里特、爱琴群岛、伊奥尼亚群岛和塞浦路斯中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放爱琴海工程。"
 je_ffpa_tur_front_levant: "黎凡特前线"
 je_ffpa_tur_front_levant_reason: "黎凡特的支持者希望把沿海港口、内陆商路与安纳托利亚连成更紧密的网络。沿用旧行省名称，不能抹去城市与腹地各自的利益。政府批准这份领土议程时，也必须面对取得土地以后仍将存在的协调问题。\n\n边疆委员会已经授权对阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_levant_status: "在#v 20年#!授权到期前直接完整拥有阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦。"
 ffpa_tur_frontier_council_levant_option: "批准黎凡特前线。"
 ffpa_tur_frontier_council_levant_tt: "为阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放黎凡特贸易走廊。"
 je_ffpa_tur_front_mesopotamia: "美索不达米亚前线"
 je_ffpa_tur_front_mesopotamia_reason: "两河流域的提案把摩苏尔至巴士拉视为相互联系的交通与生产空间。水流可以越过行政边界，税务、运输和地方权力却仍须分别安排。委员会希望以一项限期授权推进领土主张，而不把未来的治理困难当作已经解决。\n\n边疆委员会已经授权对摩苏尔、巴格达、代尔祖尔和巴士拉提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_mesopotamia_status: "在#v 20年#!授权到期前直接完整拥有摩苏尔、巴格达、代尔祖尔和巴士拉。"
 ffpa_tur_frontier_council_mesopotamia_option: "批准美索不达米亚前线。"
 ffpa_tur_frontier_council_mesopotamia_tt: "为摩苏尔、巴格达、代尔祖尔和巴士拉中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放美索不达米亚水利工程。"
 je_ffpa_tur_front_egypt: "埃及前线"
 je_ffpa_tur_front_egypt_reason: "埃及议程的提案者强调尼罗河与地中海之间的联系，试图把旧档案中的版图解释为今日的国家责任。河谷、三角洲与沙漠通道各有不同的治理条件。委员会可以批准主张，却无法凭一纸授权取得当地社会的认同。\n\n边疆委员会已经授权对下埃及、中埃及、上埃及、西奈和马特鲁提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_egypt_status: "在#v 20年#!授权到期前直接完整拥有下埃及、中埃及、上埃及、西奈和马特鲁。"
 ffpa_tur_frontier_council_egypt_option: "批准埃及前线。"
 ffpa_tur_frontier_council_egypt_tt: "为下埃及、中埃及、上埃及、西奈和马特鲁中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放尼罗河与亚历山大—西奈工程。"
 je_ffpa_tur_front_ifriqiya: "伊弗里基亚前线"
 je_ffpa_tur_front_ifriqiya_reason: "伊弗里基亚议程的支持者希望把北非港口纳入更紧密的海上联系。沿岸航线容易画在同一张图上，港口与腹地之间的关系却不会因此相同。政府若采纳这些历史主张，便须在有限期限内对其结果负责。\n\n边疆委员会已经授权对利比亚、的黎波里和突尼斯提出宣称。\n\n在#v 20年#!内让土耳其#bold 直接完整拥有全部目标州#!。\n\n若期限届满时仍处于战争或已承诺参与外交博弈，结果将推迟到恢复和平后结算。本授权不会自动完成地区建设工程。"
 je_ffpa_tur_front_ifriqiya_status: "在#v 20年#!授权到期前直接完整拥有利比亚、的黎波里和突尼斯。"
 ffpa_tur_frontier_council_ifriqiya_option: "批准伊弗里基亚前线。"
 ffpa_tur_frontier_council_ifriqiya_tt: "为利比亚、的黎波里和突尼斯中尚未纳入土耳其统治的地区添加受来源保护的临时宣称，并开启20年授权。实际取得领土后才可能开放伊弗里基亚沿海网络。"
 ffpa_tur_frontier_council_cancel_option: "暂不发布任何授权。"
 ffpa_tur_flavor.60.t: "边疆委员会召开"
 ffpa_tur_flavor.60.d: "大臣、军官和地方代表依照建国方案，提交了一份有限的边疆议程。有人援引旧档案，有人强调商路与防御；委员会需要决定国家现在应承担哪一项主张。每项授权都会带来宣称与期限，却不能保证外交或战争必然成功。"
 ffpa_tur_flavor.60.f: "档案中的边疆，只有在政府愿意承担守卫成本时才会成为现实。"
 ffpa_tur_flavor.61.t: "西部国民誓约完成"
 ffpa_tur_flavor.61.d: "土耳其现已直接控制西色雷斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.61.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_western_pact_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制西色雷斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.61.f: "国民誓约不再只是档案中的边线，而是海关班表、铁路巡查与对境内居民的日常责任。"
 ffpa_tur_flavor.61.a: "把授权登记为已完成。"
 ffpa_tur_flavor.69.t: "西部国民誓约到期"
 ffpa_tur_flavor.69.d: "授权到期时，土耳其仍未完整控制西色雷斯。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.69.f: "委员会将西色雷斯案卷移入到期的一栏。关于两岸未来的意见仍厚厚一叠，却已不能代替一份有效的授权。"
 ffpa_tur_flavor.69.a: "暂时封存档案。"
 ffpa_tur_flavor.77.t: "西部国民誓约撤回"
 ffpa_tur_flavor.77.d: "政府主动终止了针对西色雷斯的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.77.f: "“暂时不推进，不等于从此不再过问。”大臣这样解释撤回决定。地方代表要他把“暂时”二字说清楚，会议又安静了片刻。"
 ffpa_tur_flavor.77.a: "授权就此撤回。"
 ffpa_tur_flavor.62.t: "摩苏尔问题完成"
 ffpa_tur_flavor.62.d: "土耳其现已直接控制摩苏尔。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.62.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_mosul_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制摩苏尔。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.62.f: "曾经以宣称形式提出的问题，如今变成了预算、任命和维持摩苏尔通道畅通的问题。"
 ffpa_tur_flavor.62.a: "把授权登记为已完成。"
 ffpa_tur_flavor.70.t: "摩苏尔问题到期"
 ffpa_tur_flavor.70.d: "授权到期时，土耳其仍未完整控制摩苏尔。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.70.f: "商旅经过岔路时，关心的是下一站能否找到向导和补给。委员会的授权到期，并不能替任何人省去这段路。"
 ffpa_tur_flavor.70.a: "暂时封存档案。"
 ffpa_tur_flavor.78.t: "摩苏尔问题撤回"
 ffpa_tur_flavor.78.d: "政府主动终止了针对摩苏尔的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.78.f: "摩苏尔案卷的封面多了一行字：“本次授权终止。”余下的道路、商旅与地方事务，仍须依照现实逐项处理。"
 ffpa_tur_flavor.78.a: "授权就此撤回。"
 ffpa_tur_flavor.63.t: "鲁米利亚前线完成"
 ffpa_tur_flavor.63.d: "土耳其现已直接控制阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.63.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_rumelia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.63.f: "横跨众多民族与行省的边疆，易手远比变得可治理更快。"
 ffpa_tur_flavor.63.a: "把授权登记为已完成。"
 ffpa_tur_flavor.71.t: "鲁米利亚前线到期"
 ffpa_tur_flavor.71.d: "授权到期时，土耳其仍未完整控制阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.71.f: "巴尔干地图上，各种颜色与批注依旧交错。书记员合起授权簿时，没有人再把图上的线条称作已经办妥的事务。"
 ffpa_tur_flavor.71.a: "暂时封存档案。"
 ffpa_tur_flavor.79.t: "鲁米利亚前线撤回"
 ffpa_tur_flavor.79.d: "政府主动终止了针对阿尔巴尼亚、马其顿、西色雷斯、保加利亚、多布罗加和北色雷斯的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.79.f: "散会时，有人仍不肯放弃旧行省的名称，有人已开始讨论下一次来回路上的开支。宏大的议程退下去，具体的距离又显露出来。"
 ffpa_tur_flavor.79.a: "授权就此撤回。"
 ffpa_tur_flavor.64.t: "爱琴海与塞浦路斯前线完成"
 ffpa_tur_flavor.64.d: "土耳其现已直接控制阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.64.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_aegean_cyprus_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.64.f: "对群岛的统治，每天都要由渡船、港务机关、驻军和补给表重新证明。"
 ffpa_tur_flavor.64.a: "把授权登记为已完成。"
 ffpa_tur_flavor.72.t: "爱琴海与塞浦路斯前线到期"
 ffpa_tur_flavor.72.d: "授权到期时，土耳其仍未完整控制阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.72.f: "从岸上望去，相邻岛屿仿佛近在眼前。熟悉航程的人却知道，海图上的那一点间距，装着风向、补给与许多次折返。"
 ffpa_tur_flavor.72.a: "暂时封存档案。"
 ffpa_tur_flavor.80.t: "爱琴海与塞浦路斯前线撤回"
 ffpa_tur_flavor.80.d: "政府主动终止了针对阿提卡、克里特、东爱琴群岛、西爱琴群岛、伊奥尼亚群岛和塞浦路斯的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.80.f: "海军代表听完决定，问今后应当怎样解释这次退让。回答他的官员停了一下：“先解释我们能够做到什么。”"
 ffpa_tur_flavor.80.a: "授权就此撤回。"
 ffpa_tur_flavor.65.t: "黎凡特前线完成"
 ffpa_tur_flavor.65.d: "土耳其现已直接控制阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.65.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_levant_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.65.f: "授权结束之处正是行政开始之处：海关、城市议会，以及连接内陆市场与港口的道路。"
 ffpa_tur_flavor.65.a: "把授权登记为已完成。"
 ffpa_tur_flavor.73.t: "黎凡特前线到期"
 ffpa_tur_flavor.73.d: "授权到期时，土耳其仍未完整控制阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.73.f: "代表们离席时，仍在争论应当先看港口还是先看内陆。授权已经到期，他们却还没有为两者找到共同的答案。"
 ffpa_tur_flavor.73.a: "暂时封存档案。"
 ffpa_tur_flavor.81.t: "黎凡特前线撤回"
 ffpa_tur_flavor.81.d: "政府主动终止了针对阿勒颇、叙利亚、黎巴嫩、巴勒斯坦和外约旦的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.81.f: "关于港口和商路的意见被保留下来，要求继续推进领土议程的批示则被划去。两种事务终于不再写在同一行里。"
 ffpa_tur_flavor.81.a: "授权就此撤回。"
 ffpa_tur_flavor.66.t: "美索不达米亚前线完成"
 ffpa_tur_flavor.66.d: "土耳其现已直接控制摩苏尔、巴格达、代尔祖尔和巴士拉。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.66.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_mesopotamia_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制摩苏尔、巴格达、代尔祖尔和巴士拉。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.66.f: "控制河流只是开始；水利、收成与运输如今必须在整个流域内统筹治理。"
 ffpa_tur_flavor.66.a: "把授权登记为已完成。"
 ffpa_tur_flavor.74.t: "美索不达米亚前线到期"
 ffpa_tur_flavor.74.d: "授权到期时，土耳其仍未完整控制摩苏尔、巴格达、代尔祖尔和巴士拉。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.74.f: "卷宗里，河道用一笔就能画到底。授权期限之内的政治，却始终没有像墨水那样顺流而下。"
 ffpa_tur_flavor.74.a: "暂时封存档案。"
 ffpa_tur_flavor.82.t: "美索不达米亚前线撤回"
 ffpa_tur_flavor.82.d: "政府主动终止了针对摩苏尔、巴格达、代尔祖尔和巴士拉的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.82.f: "委员会听过许多关于河流的比喻。撤回授权时，一位委员只留下一句朴素的意见：“上游与下游的事情，终究要一件件谈。”"
 ffpa_tur_flavor.82.a: "授权就此撤回。"
 ffpa_tur_flavor.67.t: "埃及前线完成"
 ffpa_tur_flavor.67.d: "土耳其现已直接控制下埃及、中埃及、上埃及、西奈和马特鲁。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.67.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_egypt_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制下埃及、中埃及、上埃及、西奈和马特鲁。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.67.f: "地图可以把尼罗河涂成一种颜色，粮食、灌溉、城市和三角洲却仍须依照各自条件治理。"
 ffpa_tur_flavor.67.a: "把授权登记为已完成。"
 ffpa_tur_flavor.75.t: "埃及前线到期"
 ffpa_tur_flavor.75.d: "授权到期时，土耳其仍未完整控制下埃及、中埃及、上埃及、西奈和马特鲁。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.75.f: "一位委员说，尼罗河不会因为授权到期而停止流动。另一位答道：“可我们的责任，不能也像河水一样没有尽头。”"
 ffpa_tur_flavor.75.a: "暂时封存档案。"
 ffpa_tur_flavor.83.t: "埃及前线撤回"
 ffpa_tur_flavor.83.d: "政府主动终止了针对下埃及、中埃及、上埃及、西奈和马特鲁的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.83.f: "大臣在撤回文件上签字，旁边摆着那张熟悉的尼罗河地图。地图没有改变，政府对自己能力的判断改变了。"
 ffpa_tur_flavor.83.a: "授权就此撤回。"
 ffpa_tur_flavor.68.t: "伊弗里基亚前线完成"
 ffpa_tur_flavor.68.d: "土耳其现已直接控制利比亚、的黎波里和突尼斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.68.d.named: "随着最后一处目标领土从[ROOT.GetCountry.MakeScope.Var('ffpa_tur_front_ifriqiya_completion_predecessor_v1').GetCountry.GetName]手中转入[ROOT.GetCountry.GetName]统治，土耳其现已直接控制利比亚、的黎波里和突尼斯。该项授权已经完成，临时宣称记录随之结清；新解锁的前线与地区建设仍须分别审议。"
 ffpa_tur_flavor.68.f: "港口可以逐一易手，让它们的腹地服从同一套行政却需要更久。"
 ffpa_tur_flavor.68.a: "把授权登记为已完成。"
 ffpa_tur_flavor.76.t: "伊弗里基亚前线到期"
 ffpa_tur_flavor.76.d: "授权到期时，土耳其仍未完整控制利比亚、的黎波里和突尼斯。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经撤销；五年后可以重新审议该前线。"
 ffpa_tur_flavor.76.f: "北非沿岸的港口名被逐一念过，随后是授权的截止日期。两个清单之间，仍隔着政府没有完成的工作。"
 ffpa_tur_flavor.76.a: "暂时封存档案。"
 ffpa_tur_flavor.84.t: "伊弗里基亚前线撤回"
 ffpa_tur_flavor.84.d: "政府主动终止了针对利比亚、的黎波里和突尼斯的授权。边疆委员会仅为仍在土耳其统治之外的州添加的宣称已经清除，五年后方可重新开启该前线。"
 ffpa_tur_flavor.84.f: "海岸线仍在档案图上延伸，授权却在最后一页结束。下一次审议必须重新说明，政府为何愿意承担这样的距离。"
 ffpa_tur_flavor.84.a: "授权就此撤回。"
